[project]
# THE DISTRIBUTION IS NAMED AFTER THE COMMAND, AND IT WAS NOT FOR THE FIRST FOUR MAJORS.
# It read `edullm-platform` while `[project.scripts]` below installed `edullm`, so uv's
# three verbs disagreed about what this is called. `uv tool list` printed
# `edullm-platform`, which nobody had typed; `uv tool uninstall edullm` answered "`edullm`
# is not installed" to somebody looking at the binary; and `uv tool install edullm` failed
# on the way in. Only the third of those reads as a naming quirk. The other two read as
# wrong answers, and thirty-five people were about to type the command name because it is
# the only name any of them ever sees.
#
# The import package stays `edullm_platform`. A distribution whose name differs from its
# module is ordinary Python packaging, nothing outside this file and
# `edullm_platform.cli.release` reads the distribution name, and renaming the module would
# have touched every file in the tree to fix a thing no researcher can see.
#
# tests/test_cli_install_command.py holds this to `[project.scripts]` so the two cannot
# drift apart again. Anybody installed before the rename holds `edullm-platform` and is not
# upgraded by an install of `edullm`; `uv tool uninstall edullm-platform` once is the whole
# of the fix and it is written beside every install line in the tree.
name = "edullm"
# MOVED BY THE PULL REQUEST THAT EARNS IT, AND `.github/workflows/release-tag.yml` TAGS WHAT
# IT FINDS HERE. It read 0.1.0 from the first commit to the day the CLI shipped, so
# `edullm --version` answered the same thing for an install from today and one from six
# weeks earlier, and a staleness check against a number that never moves checks nothing.
#
# Do not edit it by hand. `uv run python tools/next_version.py --bump <patch|minor|major>`
# moves this line, uv.lock and the pinned install line below together, and a bump that moved
# one of the three would leave the branch red on a file nobody edited. `ci.yml` refuses a
# change to the CLI or to the configuration it reads that declares no new version at all,
# which is what keeps this in step with `releases/latest` without anybody remembering to.
#
# That workflow used to bump this itself and push the result to main. Branch protection
# refuses a push to main, so it failed on seven merges in a row while `releases/latest` went
# on naming a tag from before all of them.
#
# 0.2.0 rather than 0.1.1 because 0.1.0 was never released and nothing was ever installed
# from a tag; the first tag this repository has should not look like the second.
# WHY THIS IS A MINOR RATHER THAN A PATCH. edullm studio --project now names the space, so one person may have several; a bare edullm studio lists them instead of refusing, and --stop with no project stops every app you have running
version = "4.4.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  # THE SECOND DISTRIBUTABLE THIS REPOSITORY PUBLISHES, AND IT IS IN THE DEV GROUP RATHER
  # THAN IN project.dependencies FOR A REASON THAT WOULD BREAK A DEPLOY IF IT MOVED. The two
  # Lambda builders read project.dependencies and resolve each name into a size-limited zip
  # with --only-binary=:all:, so a workspace member listed there is a name no index has and a
  # build that fails at the point of deployment. Nothing in edullm_platform imports it
  # either; the dependency runs the other way, since the client restates the layout that
  # src/edullm_platform/contracts owns.
  #
  # It is here at all so that `uv sync` puts it in the same virtualenv as the suite. The
  # tests under tests/test_client_*.py are what hold the client's restatement of the bucket
  # names, the entity and the prefix shape to the contracts they were copied from, and a test
  # that cannot import the client is a restatement held to nothing.
  #
  # Without extras, deliberately. wandb and boto3 are optional there and stay uninstalled
  # here, which is what makes tests/test_client_telemetry.py's absent-wandb case the real
  # thing rather than a simulation of it.
  "edullm-client",
  "jsonschema",
  "mypy",
  "pytest",
  "pytest-xdist",
  "ruff",
  "types-PyYAML",
]

# The dataset owner's reader, installed only by things that read a corpus. Its own group
# rather than a runtime dependency because the two Lambda builders resolve wheels for
# x86_64-manylinux into a size-limited zip, and a git dependency is not a wheel on an index.
#
# Pinned by commit, and tests/test_reader_dependency_pin.py is where the reasoning lives
# rather than here, because the reason is long and is about a leak: `is_trainable` does not
# exist at v0.2.0, so a tag pin answers a request for training data with held-out shards.
reader = [
  "edullm-data @ git+https://github.com/edu-llm/edullm-data@38bf831a6c3f445e394784018441fd59288b876c",
]

# THE BINARY. One command installs one executable, which is the whole of what a researcher
# needs on day one -- `docs-frank/reference/system-overview.md` counts twelve of the
# fourteen surfaces that reach a researcher as this one command:
#
#   uv tool install --force git+https://github.com/edu-llm/platform@v4.4.0
#
# THAT LINE IS TESTED RATHER THAN PROOFREAD, by tests/test_cli_install_command.py, which
# holds it to the one in `edullm_platform.cli.release`. What used to be written here was
# `uv tool install edullm --from git+https://github.com/edu-llm/platform@<tag>`, and it
# had never been run: back then the distribution was `edullm-platform` while `edullm` was
# only the console script, so uv answered "Package name (`edullm-platform`) provided with
# `--from` does not match install request (`edullm`)". It had already been copied into two
# transcripts by the time anybody typed it, which is why the copy is now a test rather
# than a comment. The names agree now, and the bare URL is still the line: neither name is
# on any index, so `uv tool install edullm` answers "not found in the package registry".
#
# `--force` is also the upgrade, because it is the one line that is right for both installs
# in the field. `uv tool upgrade edullm` follows the git ref the install named: it
# re-resolves the default branch for an install from the bare URL and does upgrade it, and
# it answers `Nothing to upgrade`, with `--reinstall` too, for one pinned at a release tag,
# which is the install every release note hands out. So the obvious command tells some
# researchers they are current when they are not, and it depends on a thing they will not
# remember. It must never appear in a guide except beside that answer.
[project.scripts]
edullm = "edullm_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edullm_platform"]

# THE REVIEWED CONFIGURATION TRAVELS INSIDE THE WHEEL, AND THAT IS WHAT KEEPS THE CLI AND
# THE VALIDATOR FROM DISAGREEING ABOUT WHAT IS VALID. `edullm check` reads the same
# config/*.yaml the compile job reads, rather than a threshold copied into the CLI, which
# would be wrong within a month and wrong silently.
#
# It buys a pinned copy and not agreement with the server, and the difference matters.
# submit-run.yml checks out `github.sha` on the default branch, so the compile job reads
# config/ at main HEAD; admission re-derives every verdict from a named subset zipped into
# its Lambda on a separate cadence. The platform does not run at a tag. What the wheel buys
# is that a config-only change cannot brick an installed CLI -- contracts/base.py sets
# extra="forbid", so a CLI fetching config at runtime would exit 2 on every machine older
# than the merge that added one field. `edullm submit` closes the gap the other way, by
# naming the current release before it spends anybody's approval.
#
# force-include rather than a package directory, because config/ is the control plane and
# has to stay at the repository root where every workflow, tool and test already reads it.
# An editable install applies none of this, which is why
# edullm_platform.cli.configuration also walks up for a config/ directory: that is the path
# a platform checkout and the suite take.
[tool.hatch.build.targets.wheel.force-include]
"config" = "edullm_platform/_config"

# A second package in the same checkout, built and versioned separately. client/ carries its
# own [project] table because one pyproject.toml declares one distribution, and edullm-client
# has to be installable on its own into a research image that must not receive pydantic,
# PyYAML or anything else this project depends on.
#
# A workspace rather than a plain path source, because it is the arrangement that keeps one
# lockfile over both. Two resolutions of the same tree can disagree about a shared
# transitive pin, and the way that surfaces is a client tested here against one version and
# shipped against another.
[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
edullm-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "session_budget: measures what the whole session did, so conftest.py runs it last",
  "slow: starts a subprocess. Opt out with -m 'not slow' on the command line, never here",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/edullm_platform", "tools", "client/src/edullm_client"]
