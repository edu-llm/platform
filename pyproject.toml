[project]
name = "edullm-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "jsonschema",
  "mypy",
  "pytest",
  "pytest-xdist",
  "ruff",
  "types-PyYAML",
]

# The dataset owner's reader, installed only by things that read a corpus. Its own group
# rather than a runtime dependency because the two Lambda builders resolve wheels for
# x86_64-manylinux into a size-limited zip, and a git dependency is not a wheel on an index.
#
# Pinned by commit, and tests/test_reader_dependency_pin.py is where the reasoning lives
# rather than here, because the reason is long and is about a leak: `is_trainable` does not
# exist at v0.2.0, so a tag pin answers a request for training data with held-out shards.
reader = [
  "edullm-data @ git+https://github.com/edu-llm/edullm-data@38bf831a6c3f445e394784018441fd59288b876c",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edullm_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "session_budget: measures what the whole session did, so conftest.py runs it last",
  "slow: starts a subprocess. Opt out with -m 'not slow' on the command line, never here",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/edullm_platform", "tools"]
