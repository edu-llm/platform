[project]
name = "edullm-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  # THE SECOND DISTRIBUTABLE THIS REPOSITORY PUBLISHES, AND IT IS IN THE DEV GROUP RATHER
  # THAN IN project.dependencies FOR A REASON THAT WOULD BREAK A DEPLOY IF IT MOVED. The two
  # Lambda builders read project.dependencies and resolve each name into a size-limited zip
  # with --only-binary=:all:, so a workspace member listed there is a name no index has and a
  # build that fails at the point of deployment. Nothing in edullm_platform imports it
  # either; the dependency runs the other way, since the client restates the layout that
  # src/edullm_platform/contracts owns.
  #
  # It is here at all so that `uv sync` puts it in the same virtualenv as the suite. The
  # tests under tests/test_client_*.py are what hold the client's restatement of the bucket
  # names, the entity and the prefix shape to the contracts they were copied from, and a test
  # that cannot import the client is a restatement held to nothing.
  #
  # Without extras, deliberately. wandb and boto3 are optional there and stay uninstalled
  # here, which is what makes tests/test_client_telemetry.py's absent-wandb case the real
  # thing rather than a simulation of it.
  "edullm-client",
  "jsonschema",
  "mypy",
  "pytest",
  "pytest-xdist",
  "ruff",
  "types-PyYAML",
]

# The dataset owner's reader, installed only by things that read a corpus. Its own group
# rather than a runtime dependency because the two Lambda builders resolve wheels for
# x86_64-manylinux into a size-limited zip, and a git dependency is not a wheel on an index.
#
# Pinned by commit, and tests/test_reader_dependency_pin.py is where the reasoning lives
# rather than here, because the reason is long and is about a leak: `is_trainable` does not
# exist at v0.2.0, so a tag pin answers a request for training data with held-out shards.
reader = [
  "edullm-data @ git+https://github.com/edu-llm/edullm-data@38bf831a6c3f445e394784018441fd59288b876c",
]

# THE BINARY. `uv tool install edullm --from git+https://github.com/edu-llm/platform@<tag>`
# installs one executable, which is the whole of what a researcher needs on day one --
# `docs-frank/reference/system-overview.md` counts twelve of the fourteen surfaces that
# reach a researcher as this one command.
[project.scripts]
edullm = "edullm_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edullm_platform"]

# THE REVIEWED CONFIGURATION TRAVELS INSIDE THE WHEEL, AND THAT IS WHAT KEEPS THE CLI AND
# THE VALIDATOR FROM DISAGREEING ABOUT WHAT IS VALID. `edullm check` reads the same
# config/*.yaml the compile job reads, so an install from a tag refuses exactly what the
# platform at that tag refuses -- where a CLI carrying its own copy of a threshold would be
# wrong within a month and wrong silently.
#
# force-include rather than a package directory, because config/ is the control plane and
# has to stay at the repository root where every workflow, tool and test already reads it.
# An editable install applies none of this, which is why
# edullm_platform.cli.configuration also walks up for a config/ directory: that is the path
# a platform checkout and the suite take.
[tool.hatch.build.targets.wheel.force-include]
"config" = "edullm_platform/_config"

# A second package in the same checkout, built and versioned separately. client/ carries its
# own [project] table because one pyproject.toml declares one distribution, and edullm-client
# has to be installable on its own into a research image that must not receive pydantic,
# PyYAML or anything else this project depends on.
#
# A workspace rather than a plain path source, because it is the arrangement that keeps one
# lockfile over both. Two resolutions of the same tree can disagree about a shared
# transitive pin, and the way that surfaces is a client tested here against one version and
# shipped against another.
[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
edullm-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "session_budget: measures what the whole session did, so conftest.py runs it last",
  "slow: starts a subprocess. Opt out with -m 'not slow' on the command line, never here",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/edullm_platform", "tools", "client/src/edullm_client"]
