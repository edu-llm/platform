# Which shapes place, measured rather than assumed.
#
# WHY THIS IS A FILE AT ALL. Whether EC2 will sell this account a shape is something the
# submission path has to warn about, and until this file there was nowhere to read it: `rg -i
# scarce` over config/ returned nothing, and the scarce shapes were named in prose in
# docs-frank/reference/system-overview.md and nowhere a generator could read. A behaviour
# described in a document and absent from the control plane is one nobody can build.
#
# NOTHING HERE OFFERS A SUBSTITUTE, AND THE ABSENCE IS THE POSITION RATHER THAN AN EMPTY COLUMN.
# This file used to name a replacement wherever it had one, and it had two. #185 re-measured
# every pool, found both pointed at machines this account has never obtained, and withdrew them
# on the rule that survives them: a third of the device memory removed is a changed recipe the
# submitter declares rather than a substitution the platform makes on their behalf. So
# `edullm_platform.placement` names nothing in place of a scarce shape, and
# tests/test_capacity.py::test_no_shape_offers_a_substitute_at_all fails if an entry here starts
# offering one again, so reinstating it is a change to the reader and that test together.
#
# WHY IT IS NOT A FIELD ON THE CATALOG'S PROFILES, WHICH IS WHERE IT BELONGS. ComputeProfile is
# a contract model with extra="forbid", and its structural digest is recorded in
# fixtures/goldens/contract-models.json, so an `availability` field beside `provisioned` is a
# re-record rather than a config edit -- the same reason EXCEPTION_RATE_CEILING_USD_PER_HOUR sits in
# src/edullm_platform/contracts/policy.py instead of in config/policy.yaml, which carries the
# same kind of pointer. When that happens, `places` folds into ComputeProfile and this goes away.
#
# WHAT PLACEMENT IS, AND WHY IT IS A THIRD THING NEXT TO provisioned AND backed. A profile can
# be priced in config/workload-catalog.yaml, provisioned with a compute environment, and backed
# by a queue in config/execution-targets.yaml, and still not run: EC2 has to have the capacity
# to sell. Those first three are facts about this repository and are checkable by reading it.
# This one is a fact about the account's neighbours, and it presents as a job sitting in
# RUNNABLE with no error anywhere, indistinguishable from one that is merely queued.
#
# HOW THE ANSWERS BELOW WERE MEASURED, AND THE METHOD CHANGED ON 2026-08-04. The first version
# of this file said there was no cheap placement probe, "because the measurement is 'did a job
# start' and the instrument costs an instance", and inferred every answer from the account's
# own experience in config/workload-catalog.yaml's comments. There is a cheap probe, and not
# finding it cost this file most of its accuracy. `ec2 create-fleet --type instant` with a
# target capacity of one asks EC2 for a real instance and answers synchronously: instance ids,
# or a per-pool InsufficientInstanceCapacity. An empty pool costs nothing to ask, because
# nothing launches; a pool with something costs one instance for the seconds it takes to call
# terminate-instances. Every answer below was re-measured that way in every subnet each shape's
# instance type is offered in, and the launched instances were terminated immediately.
#
# SIX OF THE SEVENTEEN ANSWERS WERE WRONG, AND THE SHAPE OF THE ERROR IS WORTH MORE THAN THE
# CORRECTIONS. Every one was wrong in the same direction -- a shape recorded as reliable that
# does not place -- because the old method could only see shapes the account had already
# waited on. A shape nobody had submitted to had no experience attached, and "no experience"
# was written down as "reliably": a denylist wearing this file's own clothes, never stated as
# a default, so nobody noticed it was being applied.
#
# THE PROBE ANSWERS A DIFFERENT QUESTION FROM THE ONE A SUBMITTER ASKS, AND ON 2026-08-05 THAT
# COST FIVE ENTRIES THEIR ACCURACY IN THE OPPOSITE DIRECTION. `create-fleet --type instant`
# asks whether one instance is free at this exact second. A Batch compute environment with a
# job queued behind it asks the same pools again every tenth of a second, in every zone the
# instance type is offered in, until one is free or the queue's thirty-minute CANCEL fires.
# Those are different questions and they have different answers. The gpu-8xa100 environment
# logged 5,024 InsufficientInstanceCapacity refusals between 2026-08-02 and 2026-08-05, a
# median of 0.122 seconds apart and spread almost exactly evenly over us-east-1a, 1b, 1c and
# 1d -- and obtained fourteen nodes through them, the most recent while this was being
# written.
#
# SO `places` HAS A THIRD VALUE, BECAUSE NEITHER OF THE TWO IT HAD COULD SAY THAT. `unreliably`
# makes src/edullm_platform/placement.py tell the submitter the shape may not place, which is
# false of a pool that supplied fourteen nodes; `reliably` says nothing at all, which would drop
# the only warning anybody gets about a wait measured in hours. So `after_a_wait` is the answer
# for a pool that does supply under sustained demand and makes you queue for it, and every
# entry carrying it also carries a `wait:` sentence -- the measurement itself, in the words the
# warning puts in front of the submitter, because a generic sentence about waiting is one a
# reader cannot plan against. `edullm_platform.placement.read_capacity` reads exactly these
# three and refuses a fourth.
#
# WHAT THE PROBE FOUND, WHICH IS NOT THE STORY ANYBODY EXPECTED. The P pool is dry, on-demand
# and on spot, in all fourteen type-and-zone combinations, and so is every four-card and
# eight-card G shape except the T4s. What places *at an instant* in this region today is small
# and old: g4dn in all three sizes, and one card of A10G or L4. The G pool is not the safe
# harbour this file once treated it as; the T4 family is, and nothing here pointed at it
# before. Read that qualifier as load-bearing -- five of the shapes this paragraph puts in the
# dry column supply nodes to a queue that keeps asking, and they carry `after_a_wait` below
# rather than the verdict this paragraph on its own would produce.
#
# THE CORRECTION RAN TWICE ON 2026-08-05 AND THE SECOND PASS FOUND TWO MORE OF THE SAME ERROR,
# WHICH IS THE PART WORTH READING. The first pass moved gpu-4xa10g, gpu-4xl40s and gpu-8xa100
# off `unreliably` on the strength of their autoscaling histories. It moved the three shapes
# somebody happened to look at. gpu-8xa10g and gpu-1xl40s were left where they were and both
# were wrong in the same direction: g5.48xlarge supplied six nodes between 2026-08-03 and
# 2026-08-05 and every one of the seven runs queued for it started, with three of those nodes
# alive in us-east-1d while the submission path was still printing "may not place" over the
# shape. g6e.xlarge supplied two nodes on 2026-08-03. Reading the histories one shape at a time
# is how a method that is wrong in one direction stays wrong in it, so every one of the sixteen
# queues was enumerated for this pass rather than the ones under suspicion.
#
# gpu-8xa10g IS ALSO THE ONE PLACE WHERE THE WALL IS NOT CAPACITY AT ALL, AND THE TWO LOOK
# IDENTICAL FROM A QUEUE. Its autoscaling group logged 871 VcpuLimitExceeded refusals against a
# G-bucket limit of 768 vCPUs on 2026-08-05, beside 105 InsufficientInstanceCapacity refusals
# on the same day. A submitter waiting on either sees a job in RUNNABLE and nothing written
# anywhere, but only one of them is EC2 running out: the quota is a support ticket and a person,
# and no amount of queueing resolves it. That is worth knowing before anybody reads this shape's
# wait as scarcity and buys a Capacity Block against it.
#
# `measured_by` SAYS WHICH INSTRUMENT ANSWERED, BECAUSE `places` ALONE CANNOT AND THE
# DIFFERENCE DECIDES WHETHER TO BELIEVE THE ANSWER. Six wrong entries in one direction and then
# two more is not bad luck, it is one instrument being read as though it answered a question it
# does not. So every entry now records the instrument beside the verdict:
#
#   measured_by: queue  -- a Batch job has waited on this shape and the verdict is what the
#     queue saw. It is the instrument a researcher actually meets, and where the two have
#     disagreed it has been right every time.
#   measured_by: probe  -- `create-fleet --type instant` is the only thing that has ever asked,
#     because no job has ever been submitted to this shape's queue.
#
# THE ASYMMETRY IS THE WHOLE VALUE OF THE FIELD. A probe that obtains the machine has proved
# the account can get it, and that answer needs no second opinion. A probe that is refused has
# proved that one pool was busy for one second, which is the answer that has been wrong eight
# times now. So `places: unreliably` with `measured_by: probe` is the weakest claim in this
# file, and `edullm_platform.placement.placement_warning` says so to the submitter rather than
# printing the same sentence it prints over a pool a queue ground against for thirty-seven
# hours and never got.
#
# THREE ENTRIES CARRY THAT WEAKEST CLAIM AND THEY ARE THE ONES TO DOUBT FIRST: gpu-4xl4,
# gpu-8xl4 and gpu-8xl40s. Nothing has ever been submitted to any of their queues. Batch has
# not even created an autoscaling group for their compute environments, which is the cheap way
# to check it -- `aws autoscaling describe-auto-scaling-groups` lists a group for eleven of the
# sixteen and for none of these three. Their verdict is an instant probe and nothing else, and
# on the record above that is not a verdict a researcher should plan around.
#
# HOW THESE NUMBERS STAY TRUE, AND THE HONEST ANSWER IS THAT THEY DO NOT FOR LONG. The three
# entries this pass rewrote were all correct when they were written and all wrong within a day:
# gpu-8xa100's median was 89 minutes and a thirteenth run moved it to 61, and gpu-4xa10g's was
# 11 minutes and ten more nodes moved it to 7. The line that used to stand here said to re-read
# a shape the day its answer is doubted, and that is exactly the method that left gpu-8xa10g
# false for two days, because nobody doubts an entry that is merely stale.
#
# WHAT IS WORTH AUTOMATING IS THE VERDICT AND NOT THE MEDIAN, WHICH IS A SMALLER THING THAN IT
# SOUNDS. No submitter has ever chosen differently between a median of 89 minutes and one of
# 61; what changes a decision is `places`, and every error this file has made has been in that
# column. So the check worth having is a nightly job that reads the sixteen queues, recomputes
# each verdict, and goes red when one disagrees with what is recorded here. It reports and
# writes nothing: a bot editing a reviewed file that is nine tenths comment would need a write
# credential, a pull request path and a surgical substitution to avoid destroying the prose,
# which is three failure points bought to save one edit.
#
# IT IS NOT BUILT, AND THE REASON IS A GRANT RATHER THAN THE CODE. The nightly reader role
# holds no batch:ListJobs and no batch:DescribeJobs; infra/iam/nightly-reader-role.yaml omits
# them deliberately and .github/workflows/nightly.yml says so where the visibility board
# explains why it reads resource tags instead. That stack is applied by hand from a laptop, so
# the job would be red from the night it shipped until somebody applied it, which is the exact
# state that workflow's header records the visibility board spending its first weeks in. The
# recommendation is therefore: add the two grants, then add the job. Until the first half
# happens the second is machinery that reports nothing.
#
# UNKNOWN IS NOT A VALUE, AND THAT IS THE POINT. Every profile in the catalog appears here
# exactly once, so promoting a shape is an edit here as well. A file listing only the scarce
# ones would be a denylist, and the way a denylist fails is that the next shape somebody
# promotes is assumed to place until the first person waits four hours to find out otherwise.
#
# WHAT THE WAIT SENTENCES COUNT, AND IT IS RUNS RATHER THAN JOBS. A `wait:` below counts jobs
# named `run_*`, which are the submissions this platform compiled, and leaves out the ad-hoc
# probes and hand-named diagnostics that share these queues. Those land on nodes a submitted
# run has already warmed up and start in seconds, so counting them would quote a submitter a
# wait nobody submitting a run has had.
schema_version: 1
observed_at: "2026-08-05"
