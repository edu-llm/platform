  #
  # THE p4de.24xlarge ADDITION IS PART OF WHY. The environment lists it beside p4d.24xlarge,
  # which is two more placement pools, and one of the two jobs running when the previous
  # reading was taken was on a p4de in us-east-1d. Under the old reading that addition
  # changed nothing because the verdict could not move; under this one it is one of the
  # things the wait below is measuring.
  #
  # THE FIGURES BELOW ARE THE SECOND SET AND THE FIRST SET WAS A DAY OLD. It read twelve
  # nodes and a median of 89 minutes across twelve runs, which was exact when it was written.
  # A thirteenth run started on 2026-08-05 after 11 minutes and took the median to 61, and two
  # more nodes arrived. Two further runs were still in RUNNABLE as this was written, at 70 and
  # 53 minutes, so the next reading moves again. This is the clearest case in the file for the
  # header's argument that the verdict is worth automating and the median is not: the shape
  # has been `after_a_wait` throughout and no submitter would have chosen differently at 89
  # minutes than at 61.
  - profile: gpu-8xa100
    places: after_a_wait
    measured_by: queue
    wait: >-
      Fourteen nodes arrived between 2026-08-03 and 2026-08-05, and the thirteen runs
      submitted on this shape waited a median of 61 minutes from submission to start, with a
      worst observed case of 12.6 hours. None was ever cancelled for want of capacity.
  # 640 GB has no peer here and the substitute is a protocol rather than a profile. This is
  # the shape the Capacity Block route exists for: prove the work on a smaller node, buy the
  # block for a dated window, size the run to about 70% of it.
  #
  # THE CAPACITY BLOCK ROUTE WAS CHECKED ON 2026-08-04 AND IT IS OPEN, which this note asserted
  # without testing. ec2:PurchaseCapacityBlock and ec2:DescribeCapacityBlockOfferings are both
  # permitted -- InternSandboxBoundary's DenyCostCommitmentPurchases names
  # ec2:CreateCapacityReservation and does not name either of these. The offerings are real and
  # they are not soon: one p5.48xlarge for 24 hours was offered at $996.67 upfront starting
  # 2026-08-29, and one p4d.24xlarge at $283.20 starting 2026-08-15. So the route works and it
  # is a fortnight of lead time, which is the fact to plan against.
  #
  # QUEUE-MEASURED LIKE gpu-1xh100 AND ON MORE EVIDENCE THAN ANY OTHER REFUSAL HERE: 7,654
  # InsufficientInstanceCapacity refusals between 2026-08-03 and 2026-08-04, a median of
  # 0.097 seconds apart, across p5.48xlarge and p5en.48xlarge both, and not one instance.
  - profile: gpu-8xh100
    places: unreliably
    measured_by: queue
