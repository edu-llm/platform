# Which shapes place, measured rather than assumed.
#
# WHY THIS IS A FILE AT ALL. Whether EC2 will sell this account a shape is something the
# submission path has to warn about, and until this file there was nowhere to read it: `rg -i
# scarce` over config/ returned nothing, and the scarce shapes were named in prose in
# docs-frank/reference/system-overview.md and nowhere a generator could read. A behaviour
# described in a document and absent from the control plane is one nobody can build.
#
# NOTHING HERE OFFERS A SUBSTITUTE, AND THE ABSENCE IS THE POSITION RATHER THAN AN EMPTY COLUMN.
# This file used to name a replacement wherever it had one, and it had two. #185 re-measured
# every pool, found both pointed at machines this account has never obtained, and withdrew them
# on the rule that survives them: a third of the device memory removed is a changed recipe the
# submitter declares rather than a substitution the platform makes on their behalf. So
# `edullm_platform.placement` names nothing in place of a scarce shape, and
# tests/test_capacity.py::test_no_shape_offers_a_substitute_at_all fails if an entry here starts
# offering one again, so reinstating it is a change to the reader and that test together.
#
# WHY IT IS NOT A FIELD ON THE CATALOG'S PROFILES, WHICH IS WHERE IT BELONGS. ComputeProfile is
# a contract model with extra="forbid", and its structural digest is recorded in five committed
# proof bundles, so an `availability` field beside `provisioned` is a proof-bundle regeneration
# rather than a config edit -- the same reason EXCEPTION_RATE_CEILING_USD_PER_HOUR sits in
# src/edullm_platform/contracts/policy.py instead of in config/policy.yaml, which carries the
# same kind of pointer. When that happens, `places` folds into ComputeProfile and this goes away.
#
# WHAT PLACEMENT IS, AND WHY IT IS A THIRD THING NEXT TO provisioned AND backed. A profile can
# be priced in config/workload-catalog.yaml, provisioned with a compute environment, and backed
# by a queue in config/execution-targets.yaml, and still not run: EC2 has to have the capacity
# to sell. Those first three are facts about this repository and are checkable by reading it.
# This one is a fact about the account's neighbours, and it presents as a job sitting in
# RUNNABLE with no error anywhere, indistinguishable from one that is merely queued.
#
# HOW THE ANSWERS BELOW WERE MEASURED, AND THE METHOD CHANGED ON 2026-08-04. The first version
# of this file said there was no cheap placement probe, "because the measurement is 'did a job
# start' and the instrument costs an instance", and inferred every answer from the account's
# own experience in config/workload-catalog.yaml's comments. There is a cheap probe, and not
# finding it cost this file most of its accuracy. `ec2 create-fleet --type instant` with a
# target capacity of one asks EC2 for a real instance and answers synchronously: instance ids,
# or a per-pool InsufficientInstanceCapacity. An empty pool costs nothing to ask, because
# nothing launches; a pool with something costs one instance for the seconds it takes to call
# terminate-instances. Every answer below was re-measured that way in every subnet each shape's
# instance type is offered in, and the launched instances were terminated immediately.
#
# SIX OF THE SEVENTEEN ANSWERS WERE WRONG, AND THE SHAPE OF THE ERROR IS WORTH MORE THAN THE
# CORRECTIONS. Every one was wrong in the same direction -- a shape recorded as reliable that
# does not place -- because the old method could only see shapes the account had already
# waited on. A shape nobody had submitted to had no experience attached, and "no experience"
# was written down as "reliably": a denylist wearing this file's own clothes, never stated as
# a default, so nobody noticed it was being applied.
#
# THE PROBE ANSWERS A DIFFERENT QUESTION FROM THE ONE A SUBMITTER ASKS, AND ON 2026-08-05 THAT
# COST THREE ENTRIES THEIR ACCURACY IN THE OPPOSITE DIRECTION. `create-fleet --type instant`
# asks whether one instance is free at this exact second. A Batch compute environment with a
# job queued behind it asks the same pools again every tenth of a second, in every zone the
# instance type is offered in, until one is free or the queue's thirty-minute CANCEL fires.
# Those are different questions and they have different answers. The gpu-8xa100 environment
# logged 4,348 InsufficientInstanceCapacity refusals between 2026-08-02 and 2026-08-05, a
# median of 0.121 seconds apart and spread almost exactly evenly over us-east-1a, 1b, 1c and
# 1d -- and obtained twelve nodes through them, two of which are running jobs as this is
# written.
#
# SO `places` HAS A THIRD VALUE, BECAUSE NEITHER OF THE TWO IT HAD COULD SAY THAT. `unreliably`
# makes src/edullm_platform/placement.py tell the submitter the shape may not place, which is
# false of a pool that supplied twelve nodes; `reliably` says nothing at all, which would drop
# the only warning anybody gets about a wait measured in hours. So `after_a_wait` is the answer
# for a pool that does supply under sustained demand and makes you queue for it, and every
# entry carrying it also carries a `wait:` sentence -- the measurement itself, in the words the
# warning puts in front of the submitter, because a generic sentence about waiting is one a
# reader cannot plan against. `edullm_platform.placement.read_capacity` reads exactly these
# three and refuses a fourth.
#
# WHAT THE PROBE FOUND, WHICH IS NOT THE STORY ANYBODY EXPECTED. The P pool is dry, on-demand
# and on spot, in all fourteen type-and-zone combinations, and so is every four-card and
# eight-card G shape except the T4s. What places *at an instant* in this region today is small
# and old: g4dn in all three sizes, and one card of A10G or L4. The G pool is not the safe
# harbour this file once treated it as; the T4 family is, and nothing here pointed at it
# before. Read that qualifier as load-bearing -- three of the shapes this paragraph puts in the
# dry column supply nodes to a queue that keeps asking, and they carry `after_a_wait` below
# rather than the verdict this paragraph on its own would produce.
#
# Re-read the day a shape's answer is doubted rather than on a schedule; a stale entry here
# costs an unnecessary warning, and a missing one costs an afternoon in RUNNABLE.
#
# UNKNOWN IS NOT A VALUE, AND THAT IS THE POINT. Every profile in the catalog appears here
# exactly once, so promoting a shape is an edit here as well. A file listing only the scarce
# ones would be a denylist, and the way a denylist fails is that the next shape somebody
# promotes is assumed to place until the first person waits four hours to find out otherwise.
schema_version: 1
observed_at: "2026-08-04"
profiles:
  - profile: cpu-32vcpu
    places: reliably
  # THE THREE T4 SHAPES ARE THE ONLY MULTI-CARD MACHINES IN THIS FILE THAT PLACE ON DEMAND,
  # and g4dn.metal below is the only eight-card machine of any kind the account could obtain
  # at an instant on 2026-08-04. All three were measured by launching one and terminating it,
  # not inferred.
  #
  # "ON DEMAND" IS THE CLAUSE THAT MATTERS NOW. Three multi-card shapes below carry
  # `after_a_wait`, so these are no longer the only ones a submitter can get -- they are the
  # only ones a submitter can get without queueing for them. gpu-8xa100 supplies 320 GB
  # against these 128 and takes a median of an hour and a half to do it, which is a trade a
  # person can weigh and could not before.
  #
  # That still makes gpu-8xt4 the shape to know about for work that has to start now, and it
  # was previously the shape nothing pointed at: 8 x T4 is 128 GB of device memory, which is
  # less than the eight-card A10G, L4 and L40S machines this file used to recommend and more
  # than any of those can supply, because none of them place at all.
  - profile: gpu-1xt4
    places: reliably
  - profile: gpu-4xt4
    places: reliably
  - profile: gpu-8xt4
    places: reliably
  - profile: gpu-1xa10g
    places: reliably
  # THE ONE ENTRY WHERE THE ANSWER IS TRUE AND USELESS, AND SAYING SO IS THE POINT. g5.2xlarge
  # is an ordinary G-pool size and EC2 sells it; nothing about capacity is what stops this
  # profile running. It is SageMaker training, which has no Batch queue to place into, and
  # `provisioned: false` in config/workload-catalog.yaml is the field that records that. Two
  # facts, two files, and folding them together here would make "does not place" mean two
  # different things and put a fifth name on a list the submission path describes as four.
  - profile: gpu-1xa10g-sagemaker
    places: reliably
  # THE SUBSTITUTION THIS FILE WAS WRITTEN AROUND, AND IT POINTED AT A SHAPE THAT DOES NOT
  # PLACE. The note here read: "g6.12xlarge is the same four-card 96 GB machine at $4.602
  # against $5.672, drawing on a pool that is not contended the same way, so the offer costs
  # the submitter nothing at all." Every clause of that is still true except the one that
  # mattered. On 2026-08-04 g6.12xlarge returned InsufficientInstanceCapacity in all five
  # zones it is offered in, at the same minute g5.12xlarge did.
  #
  # NO REPLACEMENT OFFER, AND THE ABSENCE IS A DECISION. gpu-4xt4 is the other four-card
  # machine the account can obtain, but it is 4 x 16 GB against 4 x 24 GB. This file already
  # records what happens when a smaller card is offered as "the closest thing available" --
  # see gpu-1xh100 below, where two pieces of work took that offer and it was not close. A
  # third of the device memory removed is a changed recipe, which is the submitter's decision
  # to make and not the platform's to make quietly on their behalf.
  #
  # AND THE OFFER IS UNNECESSARY NOW, BECAUSE THIS SHAPE IS THE CLEANEST CASE OF THE INSTANT
  # PROBE READING A QUEUE AS A WALL. The autoscaling group logged 1,499 refusals at a median
  # of 0.119 seconds apart, which is what the probe caught one instance of on 2026-08-04, and
  # nine g5.12xlarge came out of them between 2026-08-01 and 2026-08-05. Not one job on this
  # queue has failed to start.
  - profile: gpu-4xa10g
    places: after_a_wait
    wait: >-
      Nine nodes arrived between 2026-08-01 and 2026-08-05, every one of the nine runs that
      queued for them started, and they waited a median of 11 minutes from submission to
      start with a worst observed case of 1.5 hours.
  # RECORDED AS RELIABLE AND NEVER MEASURED. g5.48xlarge placed once, on 2026-08-03, which is
  # the whole of the evidence that produced the old answer. It returned
  # InsufficientInstanceCapacity in all five zones on 2026-08-04.
  - profile: gpu-8xa10g
    places: unreliably
  - profile: gpu-1xl4
    places: reliably
  - profile: gpu-4xl4
    places: unreliably
  - profile: gpu-8xl4
    places: unreliably
  # THE WHOLE g6e FAMILY IS DRY TO AN INSTANT PROBE AND ALL THREE SIZES WERE RECORDED AS
  # RELIABLE. That is still the correction that matters most for gpu-8xl40s, which was the
  # substitute this file offered to anybody who could not get an eight-card A100 -- the
  # busiest substitution on the list, sent to a machine that has never been obtained.
  #
  # THE SENTENCE THAT FOLLOWED IT WAS WRONG ABOUT gpu-4xl40s WITHIN A DAY, AND IT WAS WRONG
  # BY READING THE FAILURES AND NOT THE LAUNCHES. It said that shape had "an autoscaling
  # group with no successful launch in its history and thirty failures in the half hour
  # before this was written, with two jobs waiting behind them". The failures were real and
  # there are now 5,277 of them at a median of 0.115 seconds apart, which is the same grind
  # the A100 environment does. Six g6e.12xlarge came out of it, the most recent at 00:07 on
  # 2026-08-05, and the job that had been queued behind it started twenty-one minutes later
  # and is still running.
  #
  # IT IS THE ONLY ONE OF THE THREE `after_a_wait` ENTRIES WHERE ANYBODY HAS GIVEN UP, AND
  # THAT BELONGS IN THE WAIT RATHER THAN IN A DIFFERENT VERDICT. Two runs were cancelled by
  # hand while stuck in RUNNABLE, one of them at a hundred minutes, both with a note from the
  # submitter saying the g6e.12xlarge capacity was not there. A submitter who is told the
  # median, the worst case and that two people stopped waiting can decide for themselves; one
  # told the shape may not place has been told something false and cannot.
  - profile: gpu-1xl40s
    places: unreliably
  - profile: gpu-4xl40s
    places: after_a_wait
    wait: >-
      Six nodes arrived between 2026-08-02 and 2026-08-05, eight of the ten runs that queued
      for them started, and those eight waited a median of 19 minutes from submission to
      start with a worst observed case of 6.4 hours; the other two were cancelled by hand
      while stuck in RUNNABLE, one of them at a hundred minutes.
  - profile: gpu-8xl40s
    places: unreliably
  # NO offer_instead, AND THE ABSENCE IS THE ANSWER RATHER THAN AN OMISSION. What a submitter
  # asking for gpu-1xh100 wants is 80 GB on one device, and nothing else in the catalog holds
  # it: the largest single card here is the 48 GB L40S. This file used to be tempted to name
  # gpu-1xl40s and the catalog records what happened the last time somebody did -- two pieces
  # of work asked for an H100, were offered the L40S as "the closest thing available", and it
  # was not. A 24 GB or 48 GB card is a changed recipe, which is a deviation the researcher
  # has to declare and defend rather than a substitution the platform may make for them.
  - profile: gpu-1xh100
    places: unreliably
  # THE OFFER HERE WAS gpu-8xl40s AND IT IS WITHDRAWN, WHICH LEAVES THIS SHAPE WITH NOTHING.
  # The reasoning was sound and is worth keeping: "384 GB against 320 GB, on the G pool rather
  # than the P pool, and an admin either way at $30.131 against $21.958. So the offer costs
  # money and buys memory and a queue that is actually there." The last clause is the one that
  # stopped being true. g6e.48xlarge returned InsufficientInstanceCapacity in all four zones on
  # 2026-08-04, so the offer bought a second queue to wait in.
  #
  # NOTHING REPLACES IT. 320 GB of device memory across eight cards has no peer that places:
  # the only other eight-card machine available is gpu-8xt4 at 128 GB, which is not the same
  # work. A submitter whose model needs 320 GB is choosing between a Capacity Block and
  # waiting, and both of those are decisions with a person attached rather than a
  # substitution.
  #
  # AND WAITING IS NOW THE MEASURED ANSWER RATHER THAN THE FALLBACK. This entry read
  # `unreliably` and the submission path told every submitter the shape may not place. The
  # autoscaling history says otherwise: twelve nodes between 2026-08-03 and 2026-08-05,
  # obtained through 4,348 InsufficientInstanceCapacity refusals at a median of 0.121 seconds
  # apart, and two of those nodes are running jobs as this is written. Not one job on this
  # queue has ever been cancelled by the thirty-minute CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY
  # time limit -- every run that was left queued got a machine. The instant probe that
  # produced the old answer asked whether one was free at that second, and the answer to that
  # was and is no.
  #
  # THE WAIT BELOW COUNTS SUBMITTED RUNS AND NOT EVERY JOB, WHICH IS THE HARDER NUMBER AND
  # THE RIGHT ONE. Fourteen jobs have started on this queue and the median across all of them
  # is 61 minutes, but two were ad-hoc probes dispatched onto nodes a submitted run had
  # already warmed up -- one of them started in two and a half minutes. Counting those would
  # quote a submitter a wait nobody submitting a run has had.
  #
  # THE p4de.24xlarge ADDITION IS PART OF WHY. The environment now lists it beside
  # p4d.24xlarge, which is two more placement pools, and the node running the older of the
  # two current jobs is a p4de in us-east-1d. Under the old reading that addition changed
  # nothing because the verdict could not move; under this one it is one of the things the
  # wait below is measuring.
  - profile: gpu-8xa100
    places: after_a_wait
    wait: >-
      Twelve nodes arrived between 2026-08-03 and 2026-08-05, and the twelve runs submitted
      on this shape waited a median of 89 minutes from submission to start, with a worst
      observed case of 12.6 hours. None was ever cancelled for want of capacity.
  # 640 GB has no peer here and the substitute is a protocol rather than a profile. This is
  # the shape the Capacity Block route exists for: prove the work on a smaller node, buy the
  # block for a dated window, size the run to about 70% of it.
  #
  # THE CAPACITY BLOCK ROUTE WAS CHECKED ON 2026-08-04 AND IT IS OPEN, which this note asserted
  # without testing. ec2:PurchaseCapacityBlock and ec2:DescribeCapacityBlockOfferings are both
  # permitted -- InternSandboxBoundary's DenyCostCommitmentPurchases names
  # ec2:CreateCapacityReservation and does not name either of these. The offerings are real and
  # they are not soon: one p5.48xlarge for 24 hours was offered at $996.67 upfront starting
  # 2026-08-29, and one p4d.24xlarge at $283.20 starting 2026-08-15. So the route works and it
  # is a fortnight of lead time, which is the fact to plan against.
  - profile: gpu-8xh100
    places: unreliably
