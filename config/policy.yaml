# v2 adds the image-scan gate: the image_scan block below, and the
# image_scan_findings_unreviewed condition in denied_outright. Bumped rather than edited in
# place because a decision record naming only its outcome would otherwise be
# uninterpretable -- a later reader could not tell a v1 approval, taken when no scan was
# consulted, from a v2 one taken when the findings had been read.
#
# v3 adds the automatic approval class: the two automatic_below_ bounds in thresholds
# below, and with them a third route that no person releases. Bumped for the reason v2 was
# -- a decision record naming only its outcome would otherwise be uninterpretable. Under v2
# every accepted run had an approver, so a v3 record reading approval_class: automatic with
# no approver is a different fact from a v2 record that lost one, and the version is what
# tells those apart.
policy_version: v3
# THERE IS A FIFTH BOUND AND IT IS NOT IN THIS FILE.
# classify_request also refuses to call a request routine when the compute profile it names
# costs more than EXCEPTION_RATE_CEILING_USD_PER_HOUR, which is $20/hour and lives in
# src/edullm_platform/contracts/policy.py beside the function. That is what puts gpu-8xa100
# and gpu-8xh100 behind an admin: every bound below is about the size of one request, and a
# one-hour single-attempt run on a p5.48xlarge satisfies all five of them while authorising
# the most expensive instance this account can start.
#
# It belongs here beside the others. It is not here because PolicyThresholds is a contract
# model whose structural digest is recorded in four committed proof bundles, so a fifth field
# is a proof-bundle regeneration rather than a policy edit. The comment above
# EXCEPTION_RATE_CEILING_USD_PER_HOUR carries the reasoning for the number itself.
thresholds:
  routine_maximum_cost_usd: "500"
  # RAISED FROM 12, WHICH WAS ARBITRARY AND IS NOW MEASURABLY WRONG. Twelve was never
  # measured against a real run. Memory-split's eight seed pairs and P7's 192-checkpoint
  # sweep each land between sixteen and twenty hours, so every one of them was an exception
  # under the old ceiling and the exception path was carrying ordinary work. A bound that
  # routes routine work to an admin does not make that work safer, it makes the admin gate
  # the thing people learn to route around.
  #
  # WHAT THIS COSTS IS PAID BY THE COST CEILING RATHER THAN BY THIS ONE, WHICH IS WHY IT IS
  # SAFE TO DOUBLE. classify_request applies both, so a routine run has to satisfy every
  # bound. At olmo-core-train's two attempts, twenty-four hours is $272.26 on gpu-4xa10g and
  # $781.82 on gpu-8xa10g, so the shapes where a doubled runtime is worth a second reader
  # cross routine_maximum_cost_usd on their own. Raising this without raising that is the
  # whole of the change; raising both would be the loosening this is not.
  #
  # The catalog's olmo-core-train entry declares exactly this many hours, and its comment
  # carries the same reasoning beside the bound it sets. The two numbers move together or
  # the longer of them stops being submittable without an admin.
  routine_maximum_runtime_hours: "24"
  routine_maximum_attempts: 2
  routine_maximum_fanout_size: 64
  # NOTHING FEEDS THIS ANY MORE, AND IT IS LEFT HERE RATHER THAN DELETED ON PURPOSE.
  #
  # It bounded `fanout_parallelism`, a submission field that asked how many cells the
  # submitter expected to run at once. Batch's `SubmitJob` accepts `arrayProperties.size`
  # and no concurrency cap, so the number was recorded and never applied, and the field was
  # removed rather than left on a form where a box reads as a control. With no source, no
  # manifest can violate this bound and `classify_request` never reaches it.
  #
  # Deleting it is a separate decision from removing the field, because a threshold is the
  # written form of who may release a run: dropping one silently widens what a team lead
  # can approve without an admin, and that belongs in a `policy_version` bump with the
  # approvers told, not in a change about output prefixes. What actually bounds concurrency
  # today is the compute environment's MaxvCpus divided by what one cell reserves, which is
  # a property of infra/batch-compute-gpu-shapes.yaml rather than of any submission.
  routine_maximum_parallelism: 8
  # THE AUTO-APPROVE BOUNDS. Both must hold, and both are exclusive.
  #
  # A run estimated under five dollars that asks for under an hour is released by nobody.
  # It is still recorded, still carries an intent and a decision record, and still passes
  # every check above. What it does not get is a person, because 47% of submitted jobs fail
  # and almost all of them are the container exiting on a code error -- a mistake whose
  # cheapest discovery is a two-dollar run that starts when it is submitted, not one that
  # waits for a team lead to release it. Waiting was sending researchers to Colab and
  # FarmShare instead of here.
  #
  # AUTHORIZATION IS UNTOUCHED BY THIS AND THAT IS THE POINT. This changes routing only.
  # The submitter must still be on the roster and the repository must still be registered,
  # which is what the original incident actually required. An auto-approved run is still
  # recorded, still carries a decision record, and is still denied outright if the
  # submitter is not on the roster. evaluate_authorization returns
  # automatic_below_approval_thresholds only after the roster, approver-roster and
  # claimed-team checks have all passed; read it there rather than trusting this note.
  #
  # BOTH HALVES, AND EXCLUSIVE ON BOTH. A run that is cheap only because it is short does
  # not auto-approve if it asks for four hours, and a one-hour run costing eight dollars
  # does not either. Five dollars exactly and one hour exactly each go to a lead: unlike
  # every routine_maximum_ bound above, these two are strictly-under comparisons, which is
  # why they are not named maximum. A bound drawn one value too wide here enlarges the set
  # of runs nobody ever looks at.
  #
  # A FAN-OUT NEVER AUTO-APPROVES, WHATEVER IT COSTS. Sixty-four cells at both count
  # ceilings really is $4.57 over 0.05 hours, because the estimate already multiplies by
  # cells. What that total does not say is that sixty-four cells is sixty-four machines
  # running at once. This rule was written to remove a human from a twenty-step smoke test,
  # not from a sweep, and a sweep is exactly the shape where a person should see the total
  # before it starts. The exclusion is on fan-out size in classify_request, not here,
  # because there is no size that would be small enough to write down.
  #
  # EDITING THIS FILE CHANGES NOTHING IN THE ACCOUNT UNTIL THE VALIDATOR IS RE-RELEASED.
  # policy.yaml is one of the seven files tools/build_admission_lambda.py names in
  # ADMISSION_CONFIG and packages into the admission validator's zip, so the deployed rule
  # is whatever was in the zip at release time and not what is on main. It is no longer two
  # releases: the lifecycle recorder reads no configuration and its builder packages none. Phase 4 paid for that once already: a GPU submission was refused with
  # unprovisioned_compute_profile because the deployed zip held a catalog in which the
  # profile was not yet promoted. Follow the release procedure in infra/README.md after
  # this merges, or the runs this was written for keep waiting for a lead.
  automatic_below_cost_usd: "5"
  automatic_below_runtime_hours: "1"
# Which registry-scan severities require a recorded exception before a digest may run.
# Enforced at admission, not at publish: ECR scans after the push, Phase 1 tags are
# immutable, and a publish-time block would leave that commit unpublishable for good.
# See src/edullm_platform/contracts/image_scan.py for the full reasoning and for why a
# bare threshold was rejected.
image_scan:
  blocking_severities:
    - CRITICAL
approval_scope: organization
routine_approver_role: team_lead
exception_approver_roles:
  - platform_admin
denied_outright:
  - unregistered_repository
  - unregistered_dataset
  - unregistered_compute_profile
  - mutable_repository_revision
  - mutable_image_reference
  # A digest whose registry scan carries a severity in image_scan.blocking_severities and
  # which no entry in config/image-exceptions.yaml covers. Denied outright rather than
  # classified as an exception on purpose: the point is that somebody read the findings
  # before the run was submitted, not that an admin waved it through while it waited.
  - image_scan_findings_unreviewed
  # A dataset config/datasets.yaml carries and whose family is not one a run may train on.
  # Distinct from unregistered_dataset, which says nothing registers this identifier; this
  # one says the registry resolves it exactly and it is an input to a corpus rather than a
  # corpus. Trainable families are listed in TRAINABLE_FAMILIES in
  # src/edullm_platform/contracts/dataset_registry.py, with the reasoning for the allowlist.
  #
  # Denied outright rather than routed for approval, because there is no approver for whom
  # this is a judgement call. A tokenizer names no partitions and declares no dtype, so a
  # run handed one memmaps tokenizer.json as uint16 tokens, trains, and produces a loss
  # curve that looks ordinary. An approver reading "train on tokenizer/smollm2-bpe" cannot
  # see that from the request, and the run reports nothing wrong afterwards either.
  - dataset_is_not_a_corpus
