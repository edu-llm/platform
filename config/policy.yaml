# v2 adds the image-scan gate: the image_scan block below, and the
# image_scan_findings_unreviewed condition in denied_outright. Bumped rather than edited in
# place because a decision record naming only its outcome would otherwise be
# uninterpretable -- a later reader could not tell a v1 approval, taken when no scan was
# consulted, from a v2 one taken when the findings had been read.
#
# v3 adds the automatic approval class: the two automatic_below_ bounds in thresholds
# below, and with them a third route that no person releases. Bumped for the reason v2 was
# -- a decision record naming only its outcome would otherwise be uninterpretable. Under v2
# every accepted run had an approver, so a v3 record reading approval_class: automatic with
# no approver is a different fact from a v2 record that lost one, and the version is what
# tells those apart.
#
# v4 moves the image-scan gate out of denied_outright and into the exception class. The
# condition itself is unchanged and classify_request already routes an unreviewed digest to
# the admin gate; what changes is that an admin can now release one. Bumped for the reason
# v2 and v3 were. Under v3 a scan finding was refusable by nobody, so a v4 record reading
# approval_class: exception with an unreviewed digest behind it is a different fact from a
# v3 record, and the version is what tells those apart.
#
# v5 re-cuts who releases what, and it is the largest of the five. No run classifies as an
# exception any more. The five ceilings that sent a run to an admin are gone: four
# routine_maximum_ bounds out of this file and a rate ceiling out of
# src/edullm_platform/contracts/policy.py. What is left is one line at
# automatic_below_cost_usd, with a single cheap cell released by nobody and everything else
# released by a team lead. The image-scan condition moves again, from the exception class
# to the routine one, so a lead releases an unreviewed digest with the findings printed
# beside the request. Bumped for the reason the other three were, and it changes more of
# the reading than they did. A v4 record reading approval_class: exception says an admin
# released a run that crossed a ceiling; under v5 no record can say that, so an exception
# record is a v4-or-earlier fact and a v5 record reading approval_class: routine may be a
# run that would have needed an admin the day before. Comparing approver counts across the
# boundary without reading the version compares two different rulebooks.
policy_version: v5
# ONE BOUND, AND IT IS THE ONLY ONE IN THE TREE. This file used to carry a note saying
# there was a fifth bound that was not in it, because classify_request also refused to call
# a request routine when the compute profile it named cost more than
# EXCEPTION_RATE_CEILING_USD_PER_HOUR, which was $20/hour and lived in
# src/edullm_platform/contracts/policy.py beside the function.
#
# THAT CEILING IS GONE, AND IT WAS REMOVED RATHER THAN RAISED BECAUSE RATE IS THE WRONG
# INSTRUMENT. Two figures out of config/workload-catalog.yaml settle it. An eight-A10G run
# for a full day is $16.288 x 24 = $390.91 and went to a lead. An eight-A100 run for one
# hour is $21.9576 and went to an admin. The cheaper request by a factor of eighteen was
# the one needing the higher approver, because $21.9576 an hour is over $20 an hour and
# $16.288 is not. A rate says what a machine costs per hour and says nothing about how many
# hours anybody asked for, so it cannot rank two requests by what they commit. Worst-case
# total can, it already multiplies rate by hours by attempts by cells, and it is the number
# the approver reads.
#
# WHAT REMOVING IT LETS THROUGH, STATED RATHER THAN DISCOVERED. The largest instance this
# account is priced for is p5.48xlarge at $55.04/hour, so a one-hour single-attempt run on
# it is $55.04 and is now released by nobody. That shape reads provisioned: false today for
# a capacity shortage, so the largest one a submitter can actually pick is g6e.48xlarge at
# $30.1312/hour. Neither is the widest case: the bound is $500 and it is the whole of the
# test, so twenty-four hours of gpu-4xa10g at two attempts, $272.26, is also released by
# nobody, and nine hours of eight H100s at $495.36 would be. The owner has accepted that.
# It is the price of one ceiling instead of two, and the ceiling that is left is the one
# that answers "how much of the account does this commit".
#
# WHAT AN ADMIN IS FOR NOW. Capacity blocks, which are a dated paid purchase of reserved
# accelerators and which nothing in this tree has designed yet. Until that exists,
# exception_approver_roles below names a role that no run reaches. That is deliberate and
# it is not a dead control: it is the machinery a capacity block routes through, and
# ApprovalClass.EXCEPTION carries the reasoning for keeping it.
thresholds:
  # THE FOUR routine_maximum_ BOUNDS THAT STOOD HERE ARE GONE, AND SO IS THE SECOND
  # AUTOMATIC BOUND. All five are recorded here rather than deleted in silence, because
  # dropping a threshold widens what a team lead may approve and the widening is the point
  # of this change rather than a side effect of it.
  #
  #   routine_maximum_cost_usd: "500"        anything over it needed an admin. Nothing does
  #                                          now, and the figure moved intact to the bound
  #                                          below, where it draws the same line between two
  #                                          different pairs of answers.
  #   routine_maximum_runtime_hours: "24"    a twenty-fifth hour needed an admin. The
  #                                          workload profiles in config/workload-catalog.yaml
  #                                          still declare their own runtime ceilings and
  #                                          those are what a submission is bounded by; what
  #                                          is gone is a second ceiling on top that decided
  #                                          who released it. A long run is expensive, and
  #                                          expensive is what the cost bound reads.
  #   routine_maximum_attempts: 2            a third attempt needed an admin. An attempt
  #                                          multiplies the worst case, so the cost bound
  #                                          already sees it, and
  #                                          retry_without_a_checkpoint_contract is what
  #                                          refuses a retry that would restart from nothing.
  #   routine_maximum_fanout_size: 64        a sixty-fifth cell needed an admin. Every
  #                                          fan-out goes to a lead now whatever its size,
  #                                          which is a narrower rule and a stricter one for
  #                                          the small sweeps that used to auto-approve
  #                                          nothing and route nowhere.
  #   routine_maximum_parallelism: 8         nothing fed it. It bounded fanout_parallelism,
  #                                          a submission field removed when Batch turned out
  #                                          to accept arrayProperties.size and no
  #                                          concurrency cap, so no manifest could violate it
  #                                          and classify_request never reached it. Its own
  #                                          comment said deleting it was a separate decision
  #                                          from removing the field and belonged in a
  #                                          policy_version bump with the approvers told.
  #                                          This is that bump.
  #   automatic_below_runtime_hours: "1"     a run had to be under an hour as well as cheap
  #                                          to be released by nobody. Declared runtime is a
  #                                          number the submitter typed, people type the
  #                                          maximum rather than what they need, and the cost
  #                                          bound already carries the hours it multiplies.
  #                                          Two tests where one says the same thing sent a
  #                                          twelve-hour eighty-cent run to a lead.
  #
  # UNDER THIS FIGURE AND IN ONE CELL, NOBODY RELEASES IT. At it exactly, or above it, or in
  # more than one cell, a team lead does. Strictly under, unlike every routine_maximum_
  # bound that used to sit above it, which is why the field is not named a maximum: five
  # hundred dollars exactly goes to a lead. A bound drawn one value too wide here enlarges
  # the set of runs nobody ever looks at, and a bound drawn one value too narrow costs a
  # lead one click.
  #
  # FIVE HUNDRED RATHER THAN THE FIVE IT READ. Five dollars was drawn around a twenty-step
  # smoke test and it made a lead the reader of every ordinary training run, which is what
  # the raise is for. 47% of submitted jobs fail and almost all of them are the container
  # exiting on a code error, a mistake whose cheapest discovery is a run that starts when it
  # is submitted rather than one that waits for somebody.
  #
  # AUTHORIZATION IS UNTOUCHED BY THIS AND THAT IS THE POINT. This is routing. The submitter
  # must still be on the roster and the repository must still be registered, an automatic
  # run still carries an intent and a decision record, and it is still denied outright if
  # the submitter is not on the roster. evaluate_authorization returns
  # automatic_below_approval_thresholds only after the roster and approver-roster checks
  # have both passed; read it there rather than trusting this note.
  #
  # THREE THINGS HOLD A CHEAP SINGLE CELL BACK, AND NONE OF THEM IS A NUMBER IN THIS FILE.
  # A fan-out never auto-approves, whatever it costs, because sixty-four cells is
  # sixty-four machines starting at once and the total does not carry that. A digest whose
  # registry scan findings carry no recorded review never auto-approves, because the whole
  # of what v5 keeps from the old gate is that a person reads the findings first. An input
  # that does not resolve never auto-approves, and is denied outright before anybody is
  # asked. All three are in classify_request rather than here, because none of them has a
  # value that could be written down.
  #
  # EDITING THIS FILE CHANGES NOTHING IN THE ACCOUNT UNTIL THE VALIDATOR IS RE-RELEASED.
  # policy.yaml is one of the seven files tools/build_admission_lambda.py names in
  # ADMISSION_CONFIG and packages into the admission validator's zip, so the deployed rule
  # is whatever was in the zip at release time and not what is on main. It is no longer two
  # releases: the lifecycle recorder reads no configuration and its builder packages none.
  # Phase 4 paid for that once already: a GPU submission was refused with
  # unprovisioned_compute_profile because the deployed zip held a catalog in which the
  # profile was not yet promoted. Follow the release procedure in infra/README.md after
  # this merges, or every run keeps being routed by v4.
  automatic_below_cost_usd: "500"
# Which registry-scan severities require a recorded exception before a digest may run.
# Enforced at admission, not at publish: ECR scans after the push, Phase 1 tags are
# immutable, and a publish-time block would leave that commit unpublishable for good.
# See src/edullm_platform/contracts/image_scan.py for the full reasoning and for why a
# bare threshold was rejected.
image_scan:
  blocking_severities:
    - CRITICAL
approval_scope: organization
routine_approver_role: team_lead
# NO RUN REACHES THIS ROLE UNDER v5. It is here for the capacity blocks that are being
# designed separately, and the model refuses a policy whose routine role satisfies it, so
# the two roles cannot quietly become one. See the note above thresholds.
exception_approver_roles:
  - platform_admin
denied_outright:
  - unregistered_repository
  - unregistered_dataset
  - unregistered_compute_profile
  - mutable_repository_revision
  - mutable_image_reference
  # image_scan_findings_unreviewed CAME OFF THIS LIST IN v4 AND IS A TEAM LEAD'S TO RELEASE
  # IN v5. Two softenings and not a removal. The condition is still derived, the findings
  # are still read from the registry by admission itself, and classify_request still
  # refuses to call an unreviewed digest automatic -- so every one of these still reaches a
  # person. What changed in v4 is that somebody could act on it, and what changes in v5 is
  # which somebody.
  #
  # Denied outright meant refusable by nobody and the exception class meant refusable by
  # two people, and the route is what a wrong answer then cost. The gate has fired twice,
  # both times against the owner self-approving, and config/image-exceptions.yaml holds
  # zero exceptions against sixteen reviewed findings, so the review process this was meant
  # to force does not exist and an admin gate did not bring one into being. The remedy the
  # refusal offers is editing a security file, which is not a thing a first-week researcher
  # can do; docs-frank has the transcript of one trying.
  #
  # The property this was built for survives, and it is the reader rather than the route.
  # Somebody still has to read the findings before the run starts, and the approver context
  # prints them -- which of the four scan verdicts happened, the counts, and the
  # vulnerabilities by name -- because an approval given blind is worse than the gate was.
  # What is dropped is the part that cost the route, which is that the person who could act
  # on what they read was one of two people and was usually the submitter.
  #
  # It stays a legal value of denied_outright in schemas/policy.schema.json and in
  # DeniedOutrightCondition, so a policy that names it is still readable and so is every
  # decision taken under v2 or v3.
  # A dataset config/datasets.yaml carries and whose family is not one a run may train on.
  # Distinct from unregistered_dataset, which says nothing registers this identifier; this
  # one says the registry resolves it exactly and it is an input to a corpus rather than a
  # corpus. Trainable families are listed in TRAINABLE_FAMILIES in
  # src/edullm_platform/contracts/dataset_registry.py, with the reasoning for the allowlist.
  #
  # Denied outright rather than routed for approval, because there is no approver for whom
  # this is a judgement call. A tokenizer names no partitions and declares no dtype, so a
  # run handed one memmaps tokenizer.json as uint16 tokens, trains, and produces a loss
  # curve that looks ordinary. An approver reading "train on tokenizer/smollm2-bpe" cannot
  # see that from the request, and the run reports nothing wrong afterwards either.
  - dataset_is_not_a_corpus
