# v2 adds the image-scan gate: the image_scan block below, and the
# image_scan_findings_unreviewed condition in denied_outright. Bumped rather than edited in
# place because a decision record naming only its outcome would otherwise be
# uninterpretable -- a later reader could not tell a v1 approval, taken when no scan was
# consulted, from a v2 one taken when the findings had been read.
policy_version: v2
# THERE IS A FIFTH BOUND AND IT IS NOT IN THIS FILE.
# classify_request also refuses to call a request routine when the compute profile it names
# costs more than EXCEPTION_RATE_CEILING_USD_PER_HOUR, which is $20/hour and lives in
# src/edullm_platform/contracts/policy.py beside the function. That is what puts gpu-8xa100
# and gpu-8xh100 behind an admin: every bound below is about the size of one request, and a
# one-hour single-attempt run on a p5.48xlarge satisfies all five of them while authorising
# the most expensive instance this account can start.
#
# It belongs here beside the others. It is not here because PolicyThresholds is a contract
# model whose structural digest is recorded in four committed proof bundles, so a fifth field
# is a proof-bundle regeneration rather than a policy edit. The comment above
# EXCEPTION_RATE_CEILING_USD_PER_HOUR carries the reasoning for the number itself.
thresholds:
  routine_maximum_cost_usd: "500"
  # RAISED FROM 12, WHICH WAS ARBITRARY AND IS NOW MEASURABLY WRONG. Twelve was never
  # measured against a real run. Memory-split's eight seed pairs and P7's 192-checkpoint
  # sweep each land between sixteen and twenty hours, so every one of them was an exception
  # under the old ceiling and the exception path was carrying ordinary work. A bound that
  # routes routine work to an admin does not make that work safer, it makes the admin gate
  # the thing people learn to route around.
  #
  # WHAT THIS COSTS IS PAID BY THE COST CEILING RATHER THAN BY THIS ONE, WHICH IS WHY IT IS
  # SAFE TO DOUBLE. classify_request applies both, so a routine run has to satisfy every
  # bound. At olmo-core-train's two attempts, twenty-four hours is $272.26 on gpu-4xa10g and
  # $781.82 on gpu-8xa10g, so the shapes where a doubled runtime is worth a second reader
  # cross routine_maximum_cost_usd on their own. Raising this without raising that is the
  # whole of the change; raising both would be the loosening this is not.
  #
  # The catalog's olmo-core-train entry declares exactly this many hours, and its comment
  # carries the same reasoning beside the bound it sets. The two numbers move together or
  # the longer of them stops being submittable without an admin.
  routine_maximum_runtime_hours: "24"
  routine_maximum_attempts: 2
  routine_maximum_fanout_size: 64
  routine_maximum_parallelism: 8
# Which registry-scan severities require a recorded exception before a digest may run.
# Enforced at admission, not at publish: ECR scans after the push, Phase 1 tags are
# immutable, and a publish-time block would leave that commit unpublishable for good.
# See src/edullm_platform/contracts/image_scan.py for the full reasoning and for why a
# bare threshold was rejected.
image_scan:
  blocking_severities:
    - CRITICAL
approval_scope: organization
routine_approver_role: team_lead
exception_approver_roles:
  - platform_admin
denied_outright:
  - unregistered_repository
  - unregistered_dataset
  - unregistered_compute_profile
  - mutable_repository_revision
  - mutable_image_reference
  # A digest whose registry scan carries a severity in image_scan.blocking_severities and
  # which no entry in config/image-exceptions.yaml covers. Denied outright rather than
  # classified as an exception on purpose: the point is that somebody read the findings
  # before the run was submitted, not that an admin waved it through while it waited.
  - image_scan_findings_unreviewed
