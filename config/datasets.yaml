    manifest_sha256: "f7d678ba40d48403fec9be0db53bc78d991b6b755af72143d0f7476ae7255822"
    tokenizer: null
  # The P7 tutor corpus. Pre-tokenization conversation text, so `tokenizer` is null rather than
  # unknown, 25,329 train rows and 2,401 val over two objects and 21,630,120 bytes.
  #
  # ITS OWN LIMITATIONS BLOCK RECORDS THAT val HOLDS NO PEDAGOGY ROWS AND IS ONLY THE UNUSED
