  # twelve objects and 2,026,897,408 bytes, packed at sequence length 16,384, with each source
  # kept in its own object-key slice.
  #
  # ITS SHARDS ARE uint32 AND THAT IS NOT THE USUAL CASE. Qwen2.5's vocabulary is 151,936 and
  # this corpus's ids reach 151,664, so they could not have been written any narrower. Read at
  # OLMo-core's uint16 default, every four-byte id becomes two two-byte ones, all of them in
  # range for that embedding -- so the symptom is a loss curve rather than an exception.
  # tokens/manifest.json declares the dtype on every entry and the reader takes it from there.
  #
  # Its licence is the honest-unknown case above, and its own limitations block records that
  # ATP/TPTP traces carry most of the token mass, so a single number over the whole corpus is
  # mostly measuring two of its six sources. That is a fact about the corpus which this entry
  # can carry and cannot enforce.
  - reference_id: formal-proof-premises-500m-v2
