# Dataset releases admission will accept.
#
# A submission naming a release that is not listed here is denied outright, under the
# `unregistered_dataset` condition in config/policy.yaml, rather than classified as an
# exception. An unknown dataset is not an expensive request somebody may approve; it is a
# request whose inputs cannot be resolved.
#
# A `releases:` entry carries an identifier and nothing else. Binding each identifier to a
# full DatasetRelease — checksums, S3 VersionIds, schema, lineage, licence, classification
# and access policy — is the dataset-breadth phase's work, not admission's.
#
# `published:` is the other list, and it is thin for the opposite reason. These are corpora
# somebody else built and sealed into s3://edullm-data/, which only that pipeline's validator
# can write to. There is no provenance for this platform to assert about them, so a
# DatasetRelease is the wrong model — see PublishedDatasetReference for the specific
# validators that refuse. What each entry does carry is the four facts a reader needs to open
# the corpus and pin what it opened, plus the tokenizer it was built with.
#
# `none` is the honest answer, and it is listed first because it is the common one. The field
# is required, so until `none` existed every submission had to name a release; every run in
# the lineage therefore records that it read `dolma-2026-07`, and not one of them read
# anything, because no dataset bucket exists yet. A required field offering a single value
# does not record a fact about a run, it invents one, and it invents it into a record that is
# immutable by design and so cannot be corrected afterwards.
#
# `dolma-2026-07` stays listed and is no longer offered, which are separate questions that
# used to be answered together. It is named by every historical intent record and by the
# manifest fixtures, so de-registering it would make those records unresolvable against the
# registry meant to explain them. But nothing was ever bound to it and no run ever read one,
# so a submitter picking it off the form records that their run read something it did not,
# into a record that is immutable by design. `retired: true` keeps admission's answer and
# stops a new run naming it.
#
# THAT SENTENCE USED TO END "AND REMOVES THE MENU ITEM", AND FOR A WHILE THE MENU ITEM WAS
# THE WHOLE MECHANISM. Nothing outside the dropdown join read this flag, so both retired
# names cleared `edullm check` with "no refusals", compiled as routine and were admitted --
# measured on 2026-08-05 by running each of them through all three, rather than read out of
# the code. A dropdown is a GitHub form validation and not an enforcement point, so the only
# thing standing between a retired corpus and an immutable lineage record naming it was a
# list of options. `require_a_dataset_release_that_is_current` in
# src/edullm_platform/submission.py is the enforcement now: refused on the laptop by
# `edullm check` and again in the credential-free compile job, both before the approval gate.
#
# IT IS DELIBERATELY NOT IN config/policy.yaml's denied_outright LIST, AND THAT FUNCTION
# CARRIES THE ARGUMENT IN FULL. The short of it is that file's own test for the list --
# a condition is denied outright when there is no approver for whom it is a judgement call --
# and retirement fails it. "I am reproducing the v2 result and need the corpus that produced
# it" is a statable reason a reader can act on, and a run resuming from a checkpoint written
# against a retired corpus has to go on naming that corpus, because naming a current one to
# get past a refusal writes the false record the rule exists to prevent.
#
# That flag and the tokenizer join described below answer the same question by different
# means, and both are needed. `retired` is a fact about this entry that no computation can
# derive -- there is nothing to look up, because nothing was ever published under the name.
# The join is a fact about a corpus that does exist and whose tokenizer no workload can
# construct, so it changes on its own when OLMo-core grows one.
#
# WHY TWENTY-FOUR ENTRIES AND WHY THIRTEEN OF THEM REACH THE FORM. Every entry here is a
# promise the corpus can be resolved; a dropdown option is the stronger promise that a run
# picking it works. The seven dolma2 corpora carry both, and so do fineweb-edu-1b at v6 on
# smollm2-bpe, formal-proof-premises-500m at v2 on the vendored Qwen2.5 tokenizer, and the
# four fineweb2 corpora on the two gigatoken tokenizers. The other eleven carry only the
# first, and for three separate reasons -- a tokenizer nothing can build or none declared at
# all, a version its owner has superseded, or a family a run must not train on. All three
# gaps are computed rather than listed, so this comment cannot drift out of agreement with
# the file.
#
# NOT EVERY REGISTERED DATASET IS A CORPUS, WHICH IS NEW AND IS THE MOST IMPORTANT LINE HERE.
# This list now carries four tokenizers, a verbatim vendor mirror and three sft conversation
# corpora, because dependents pin them by digest and admission has to be able to resolve what
# a lineage record names. Being registered is not permission to train on one. A tokenizer
# declares no partitions, so the reader hands back every object rather than a trainable split,
# and its group carries no dtype, which a NumpyFSLDatasetConfig turns into OLMo-core's uint16
# default and then memmaps tokenizer.json as if it were tokens. The run trains, the loss
# moves, and nothing anywhere reports a problem.
#
# WHAT REFUSES THAT IS NOW A RULE AND USED TO BE AN ACCIDENT. Until this change `tokenizer`
# was a required non-null field, and a tokenizer declares no tokenizer of its own, so the
# entry simply could not be written. That refused the right thing for no reason, and it
# evaporated the moment the field learned to hold null so the eight entries above could
# exist. The replacement is TRAINABLE_FAMILIES in
# src/edullm_platform/contracts/dataset_registry.py,
# an allowlist of the `dataset_id` families a run may name as its training corpus, holding
# `pretrain` and `sft`. It is enforced at admission, where a manifest naming anything else is
# denied outright under the `dataset_is_not_a_corpus` condition in config/policy.yaml, and
# again in execution.py, which refuses to build the EDULLM_DATASET_ID block at all. The
# dropdown join reads the same allowlist, so the form, the gate and the submission agree by
# construction rather than by three lists being kept in step.
#
# WHY `sft` IS ALLOWED AND `vendor` IS NOT. The P7 tutor work trains on
# sft/pedagogy70-normal30, so forbidding the family would refuse a real training input to buy
# a guarantee that excluding tokenizers already buys. vendor/openai-prm800k is excluded on its
# own evidence rather than on a hunch: its limitations block records that records are kept
# verbatim and that any train-ready representation must be a separately validated derived
# artifact. Naming it as a corpus asks a run to train on the thing that corpus says is not
# trainable yet. An allowlist rather than a denylist because the next family somebody
# publishes should be refused until a person decides it is trainable, and the refusal names
# the file to edit.
#
# pretrain/fineweb-edu-1b is carried at v2 AND v6, the one corpus in this file registered
# twice. Both are published, sealed and frozen, and the registry's job is to carry what
# exists. v6 is the current one and v2 is `retired: true`, which is the same flag and the same
# reason as dolma-2026-07 above: nothing computable tells the two apart. They share a family
# and a tokenizer and pin the same digest, and the bucket does not close the gap either --
# v6 declares `supersedes` of v5 and v2 declares `supersedes` of v1, and v3 through v5 were
# never published, so no chain in the data reaches from one to the other. Un-retiring v2 puts
# two versions of one corpus on the form for a submitter to choose between on reference id
# alone, and tests/test_submission_form_options.py fails rather than letting that happen.
# What the refusal above adds is the case that test could never see: a submission naming v2
# by a route that never touched the form at all.
#
# THE TWO fineweb ENTRIES PIN THE SAME DIGEST AND THAT IS NOT A COPY-PASTE ERROR.
# tokens/manifest.json is byte identical under both prefixes, 1,793 bytes hashing to
# 047d001d, read from both on 2026-08-02. v6 is v2's token group plus a second group named
# `vendor` holding the five upstream fineweb-edu jsonl.gz files those tokens were built from,
# 1,722,787,276 further bytes over five further objects. Only the payload group is pinned
# here, so the two entries agree by construction and a reader comparing them is looking at one
# manifest twice.
#
# tokenizer/qwen25-vendored IS THE ONE TOKENIZER THIS FILE NAMES AND DOES NOT CARRY. It is
# published and sealed, on 2026-08-02, and formal-proof-premises-500m-v2 below names it in its
# `tokenizer` field, but there is no entry of its own for it the way there is for
# tokenizer/dolma2-bpe and tokenizer/smollm2-bpe. Nothing requires one -- the `tokenizer` field
# is a string rather than a reference into this list, and admission resolves the corpus without
# it -- so this is an asymmetry rather than a gap, and registering it would be an addition
# somebody chooses rather than a repair.
#
# Every entry below was confirmed against the account on 2026-08-02, and each digest was read
# from two places written by two different passes, the group's `manifest_sha256` in
# dataset.json and the `manifest_sha256` map in the corpus's own _VALIDATED.json seal. All
# declare `mutability: frozen`, which is what makes a content pin meaningful: the standard
# requires the digest for frozen datasets alone, so a `live` or `append-only` dataset has
# nothing to pin here and cannot be registered.
#
# dolma2-bpe-v1 IS THE ONE ENTRY WHOSE DIGEST DID NOT COME FROM THOSE TWO PLACES, and it is
# called out here rather than left for a reader to notice. Its seal predates the current shape
# and carries `bytes`, `objects`, `validated_at` and nothing else -- no `dataset_sha256` and no
# `manifest_sha256` map at all, where every other seal in the bucket has both. What replaces
# the missing second reading is stronger than it rather than weaker: b37b8954 appears in its
# own dataset.json group and in the `depends_on` block of all seven dolma2 corpora below, each
# written by a different sealing pass on a different day, and all eight agree exactly. Read
# live from the bucket again on 2026-08-05, because frontload-cl-10b joined the seven after
# the reading that said six. The thing that is genuinely not attested is that any validator
# ever recomputed it, which is why this paragraph exists. Re-sealing the tokenizer under the
# current shape is what would remove the asterisk, and that is upstream's change to make.
#
# Their licences differ and several are honestly unknown. lean4-mathlib-bytes declares
# Apache-2.0, openai-prm800k declares MIT, fineweb-edu-1b, math-frontload-100m and
# math-memory-full declare ODC-By-1.0, math-sft-60m declares `mixed`, and the rest declare
# `{basis: unknown, id: null}`. Registering those anyway is correct rather than sloppy: the
# upstream standard prefers an honest unknown to a false MIT. `mixed` is the interesting one,
# because it is a declared answer rather than an absent one and it is still not a licence --
# it says the corpus was assembled from sources under more than one, without naming them, so
# anybody redistributing a model trained on it has a question to answer that this file cannot.
# What all of this means downstream is that a lineage record will name a corpus whose licence
# basis nobody has established, which is a fact about the corpus and not a defect in the
# record.
#
# ELEVEN ARE REGISTERED HERE AND NOT OFFERED ON THE FORM, AND THAT IS DELIBERATE.
# Five are refused by family, above: the four tokenizers and the verbatim vendor mirror.
# math-sft-60m, pedagogy70-normal30 and frontload-cl-chat-sft are in a trainable family and
# declare no tokenizer at all, honestly, because they are pre-tokenization conversation text,
# and `None` is not a key in the TOKENIZERS map, so the same join that answers the question
# above answers this one. lean4-mathlib-bytes and math-memory-full depend on
# `tokenizer/bytes-utf8`, and OLMo-core has no byte tokenizer. TokenizerConfig offers dolma2,
# dolma2_sigdig, gpt_neox_olmo_dolma_v1_5, gpt2 and from_hf, and nothing under
# olmo_core/data/ mentions bytes or utf8, measured on 2026-08-02 against the checkout the
# training image builds from. A run picking either of those two today reaches a container
# that cannot construct a model for the tokens it just resolved and exits 69. The eleventh is
# fineweb-edu-1b at v2, which `retired` now refuses rather than merely unlists.
#
# ONLY SIX OF THE ELEVEN ARE REFUSED BY ANYTHING, AND KNOWING WHICH IS THE POINT OF SPLITTING
# THEM UP LIKE THIS. The five family cases trip `dataset_is_not_a_corpus` and v2 trips
# `retired_dataset_release`. The other five -- the three with no tokenizer and the two on
# bytes-utf8 -- are admitted by every check this platform makes, and what a run picking one
# meets is exit 69 in a container after the GPU has been paid for. They are off the form
# because the dropdown answers "will this work" and they will not, and they stay in the
# refusal `edullm check` prints for an unregistered name, because that sentence answers "what
# may a submission name" and pretending otherwise would claim an enforcement that is not
# there. tests/test_submission_form_options.py derives that set from the same functions the
# compile job and admission use, so it shrinks on its own as those refusals get built.
#
# fineweb-edu-1b AT v6 USED TO BE ON THIS LIST AND IS THE WORKED EXAMPLE OF AN EXCLUSION
# RETIRING ITSELF. It depends on `tokenizer/smollm2-bpe`, which always had an exact OLMo-core
# equivalent -- its own dataset.json names HuggingFaceTB/SmolLM2-135M as its source and
# from_hf reproduces that tokenizer -- so the gap was a line nobody had added rather than a
# feature nobody had. Somebody added it, the join started offering v6 without anybody editing
# this comment, and v2 stayed off because `retired` is a separate answer to a separate
# question.
#
# The tokenizer cases stay registered because this file answers "may a submission name this",
# and the honest answer is yes: they are real sealed corpora, admission can resolve them, and a
# workload that is not an OLMo-core training run could read them tomorrow. The dropdown answers
# the different question of whether it will work. The join between the two lives in
# tests/test_submission_form_options.py and is computed from tools' TOKENIZERS map and
# TRAINABLE_FAMILIES, so adding a tokenizer config makes the option appear without anybody
# editing this comment.
schema_version: 1
releases:
  - release_id: dolma-2026-07
    retired: true
  - release_id: none
published:
