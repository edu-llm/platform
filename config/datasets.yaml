# Dataset releases admission will accept.
#
# A submission naming a release that is not listed here is denied outright, under the
# `unregistered_dataset` condition in config/policy.yaml, rather than classified as an
# exception. An unknown dataset is not an expensive request somebody may approve; it is a
# request whose inputs cannot be resolved.
#
# A `releases:` entry carries an identifier and nothing else. Binding each identifier to a
# full DatasetRelease — checksums, S3 VersionIds, schema, lineage, licence, classification
# and access policy — is the dataset-breadth phase's work, not admission's.
#
# `published:` is the other list, and it is thin for the opposite reason. These are corpora
# somebody else built and sealed into s3://edullm-data/, which only that pipeline's validator
# can write to. There is no provenance for this platform to assert about them, so a
# DatasetRelease is the wrong model — see PublishedDatasetReference for the specific
# validators that refuse. What each entry does carry is the four facts a reader needs to open
# the corpus and pin what it opened, plus the tokenizer it was built with.
#
# `none` is the honest answer, and it is listed first because it is the common one. The field
# is required, so until `none` existed every submission had to name a release; every run in
# the lineage therefore records that it read `dolma-2026-07`, and not one of them read
# anything, because no dataset bucket exists yet. A required field offering a single value
# does not record a fact about a run, it invents one, and it invents it into a record that is
# immutable by design and so cannot be corrected afterwards.
#
# `dolma-2026-07` stays listed and is no longer offered, which are separate questions that
# used to be answered together. It is named by every historical intent record and by the
# manifest fixtures, so de-registering it would make those records unresolvable against the
# registry meant to explain them. But nothing was ever bound to it and no run ever read one,
# so a submitter picking it off the form records that their run read something it did not,
# into a record that is immutable by design. `retired: true` keeps admission's answer and
# removes the menu item.
#
# That flag and the tokenizer join described below answer the same question by different
# means, and both are needed. `retired` is a fact about this entry that no computation can
# derive -- there is nothing to look up, because nothing was ever published under the name.
# The join is a fact about a corpus that does exist and whose tokenizer no workload can
# construct, so it changes on its own when OLMo-core grows one.
#
# WHY TEN ENTRIES AND WHY SIX OF THEM REACH THE FORM. Every entry here is a promise the
# corpus can be resolved; a dropdown option is the stronger promise that a run picking it
# works. The five dolma2 corpora carry both, and so does formal-proof-premises-500m on the
# vendored Qwen2.5 tokenizer. The other four carry only the first, because nothing here can
# build the tokenizer they were tokenized with, and that gap is computed rather than listed.
# See the join at the end of this comment.
#
# pretrain/fineweb-edu-1b is carried at v2 AND v6, the one corpus in this file registered
# twice. Both are published, sealed and frozen, and the registry's job is to carry what
# exists. v6 is the current one.
#
# THE TWO fineweb ENTRIES PIN THE SAME DIGEST AND THAT IS NOT A COPY-PASTE ERROR.
# tokens/manifest.json is byte identical under both prefixes, 1,793 bytes hashing to
# 047d001d, read from both on 2026-08-02. v6 is v2's token group plus a second group named
# `vendor` holding the five upstream fineweb-edu jsonl.gz files those tokens were built from,
# 1,722,787,276 further bytes over five further objects. Only the payload group is pinned
# here, so the two entries agree by construction and a reader comparing them is looking at one
# manifest twice.
#
# WHAT HAPPENS THE DAY tokenizer/smollm2-bpe BECOMES BUILDABLE, WHICH NOBODY HAS DECIDED YET.
# The join offers a corpus once something can build its tokenizer, so adding that entry to the
# TOKENIZERS map offers v2 and v6 together and only v6 should be offered. This file cannot say
# so today. `retired` separates a registered release from an offered one and lives on
# RegisteredDatasetRelease alone, and giving PublishedDatasetReference the same flag moves
# schemas/datasets.schema.json along with both the file digest and the structural digest
# proof/phase-0 records for it. tests/test_submission_form_options.py refuses two versions
# of one dataset id
# at once, so that day costs a red test naming the decision rather than a superseded corpus
# sitting on the form.
#
# THE TOKENIZERS ARE NOT REGISTRABLE, AND NOT BECAUSE THEY ARE UNREADABLE. All four are
# published, sealed and openable -- tokenizer/qwen25-vendored is the newest, sealed on
# 2026-08-02, and it is named below by the corpus it encoded rather than carried as an entry. A tokenizer declares no partitions, so the reader hands back
# every object rather than a trainable split, and its group carries no dtype, which a
# NumpyFSLDatasetConfig turns into OLMo-core's uint16 default and then memmaps tokenizer.json
# as if it were tokens. The run trains and the loss moves. A tokenizer is an input to a
# corpus, named below in each entry's `tokenizer` field, not a corpus a run reads.
#
# WHAT ACTUALLY REFUSES ONE IS THINNER THAN THAT PARAGRAPH READS. No field on
# PublishedDatasetReference marks an entry as a tokenizer. What stops one being written is
# that `tokenizer` is required and has no null, and a tokenizer declares no tokenizer
# dependency of its own, so there is no value to put there. That is a shape that happens to
# refuse rather than a rule about families. The one rule about families is an assertion in
# tests/test_submission_form_options.py that every published entry is a pretrain corpus, and
# the offerability join now carries the same family test, so narrowing that assertion to
# admit an sft or vendor corpus cannot quietly put a tokenizer on the form as well.
#
# THREE PUBLISHED CORPORA BELONG IN THIS LIST AND CANNOT BE WRITTEN INTO IT TODAY.
# sft/pedagogy70-normal30/v1, vendor/openai-prm800k/v1 and tokenizer/smollm2-bpe/v1 are all
# sealed and frozen and none of them declares a tokenizer. The first is pre-tokenization
# conversation text, 25,329 train rows and 2,401 val over two objects, whose own limitations
# block records that val holds no pedagogy rows and is only the unused no_robots remainder.
# The second is a verbatim vendor mirror whose limitations block says a train-ready form must
# be a separately validated derived artifact. The third is a tokenizer. Registering any of
# them needs `tokenizer` to accept an explicit null, which is one line on the model and not a
# small change from here, because it moves schemas/datasets.schema.json, the digest
# proof/phase-0/schema-compatibility.md records for that file, and DatasetRegistry's
# structural digest in the same table.
#
# Every entry below was confirmed against the account on 2026-08-02, and each digest was read
# from two places written by two different passes, the group's `manifest_sha256` in
# dataset.json and the `manifest_sha256` map in the corpus's own _VALIDATED.json seal. All
# declare `mutability: frozen`, which is what makes a content pin meaningful: the standard
# requires the digest for frozen datasets alone, so a `live` or `append-only` dataset has
# nothing to pin here and cannot be registered.
#
# Their licences differ and several are honestly unknown. lean4-mathlib-bytes declares
# Apache-2.0, fineweb-edu-1b, math-memory-full and olmo-150b-dolma2 declare ODC-By-1.0, and
# the rest declare `{basis: unknown, id: null}`. Registering those anyway is correct rather
# than sloppy: the upstream standard prefers an honest unknown to a false MIT. What it means
# downstream is that a lineage record will name a corpus whose licence basis nobody has
# established, which is a fact about the corpus and not a defect in the record.
#
# FOUR ARE REGISTERED HERE AND NOT OFFERED ON THE FORM, AND THAT IS DELIBERATE.
# lean4-mathlib-bytes and math-memory-full depend on `tokenizer/bytes-utf8`, and OLMo-core has
# no byte tokenizer. TokenizerConfig offers dolma2, dolma2_sigdig, gpt_neox_olmo_dolma_v1_5,
# gpt2 and from_hf, and nothing under olmo_core/data/ mentions bytes or utf8, measured on
# 2026-08-02 against the checkout the training image builds from. fineweb-edu-1b v2 and v6
# depend on `tokenizer/smollm2-bpe`, which is the different case and the one that will resolve
# first. It has an exact OLMo-core equivalent, because its own dataset.json names
# HuggingFaceTB/SmolLM2-135M as its source and from_hf reproduces that tokenizer, so the gap
# is a line nobody has added rather than a feature nobody has. A run picking any of the four
# today reaches a container that cannot construct a model for the tokens it just resolved and
# exits 69.
#
# They stay registered because this file answers "may a submission name this", and the honest
# answer is yes: they are real sealed corpora, admission can resolve them, and a workload that
# is not an OLMo-core training run could read them tomorrow. The dropdown answers the
# different question of whether it will work. The join between the two lives in
# tests/test_submission_form_options.py and is computed from tools' TOKENIZERS map, so adding
# a tokenizer config makes the option appear without anybody editing this comment.
schema_version: 1
releases:
  - release_id: dolma-2026-07
    retired: true
  - release_id: none
published:
  - reference_id: fineweb-edu-1b-v2
    uri: "s3://edullm-data/pretrain/fineweb-edu-1b/v2/"
    dataset_id: pretrain/fineweb-edu-1b
    version: v2
    manifest_sha256: "047d001de3d08d443f99f1b12a7c998dc06bdef57a914e26f7feeaf4601be2ca"
    tokenizer: tokenizer/smollm2-bpe
  - reference_id: fineweb-edu-1b-v6
    uri: "s3://edullm-data/pretrain/fineweb-edu-1b/v6/"
    dataset_id: pretrain/fineweb-edu-1b
    version: v6
    manifest_sha256: "047d001de3d08d443f99f1b12a7c998dc06bdef57a914e26f7feeaf4601be2ca"
    tokenizer: tokenizer/smollm2-bpe
  # THE ONE ENTRY HERE THAT IS OFFERED ON A TOKENIZER NOTHING COULD BUILD UNTIL TODAY, which
  # is the case the paragraph above says resolves itself: `tokenizer/qwen25-vendored` names
  # `https://huggingface.co/Qwen/Qwen2.5-0.5B` as its source in its own dataset.json, so the
  # line added to tools' TOKENIZERS map alongside this entry is a fact read out of the bucket
  # rather than a tokenizer invented for it. 494,862,336 train tokens and 11,862,016 val over
  # twelve objects and 2,026,897,408 bytes, packed at sequence length 16,384, with each source
  # kept in its own object-key slice.
  #
  # ITS SHARDS ARE uint32 AND THAT IS NOT THE USUAL CASE. Qwen2.5's vocabulary is 151,936 and
  # this corpus's ids reach 151,664, so they could not have been written any narrower. Read at
  # OLMo-core's uint16 default, every four-byte id becomes two two-byte ones, all of them in
  # range for that embedding -- so the symptom is a loss curve rather than an exception.
  # tokens/manifest.json declares the dtype on every entry and the reader takes it from there.
  #
  # Its licence is the honest-unknown case above, and its own limitations block records that
  # ATP/TPTP traces carry most of the token mass, so a single number over the whole corpus is
  # mostly measuring two of its six sources. That is a fact about the corpus which this entry
  # can carry and cannot enforce.
  - reference_id: formal-proof-premises-500m-v2
