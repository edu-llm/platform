    # Backed by the compute environment infra/batch-compute-gpu.yaml creates and named in
    # config/execution-targets.yaml; the same seam test that refused a second promotion
    # without a target now reads a set of two rather than a set of one.
    #
    # Chosen over gpu-1xt4 because 24 GB of A10G lets a small model train without the
    # gradient-checkpointing gymnastics a T4's 16 GB would force, and those gymnastics would
    # be an artifact of the test rig rather than of the research. Chosen over gpu-4xa10g
    # because four GPUs is a distribution problem wearing a single-node costume.
    #
    # g5.xlarge is offered in every availability zone the network stack has a subnet in,
    # measured with describe-instance-type-offerings on 2026-07-28. That is not general: g6e
    # and p4d are absent from us-east-1f, so promoting an L40S or an A100 later means
    # narrowing the subnet list in the compute template.
    provisioned: true
