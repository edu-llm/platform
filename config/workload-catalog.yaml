    pricing_source: "AWS Price List API get-products AmazonEC2 g4dn.metal us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-08-02"
    # g4dn.metal rather than a g4dn.24xlarge, because there is no such type. The T4 family
