compute_profiles:
  - name: cpu-32vcpu
    instance_type: c7i.8xlarge
    accelerator: cpu
    nodes: 1
    hourly_rate_usd: "1.428"
    pricing_source: "AWS Price List API get-products AmazonEC2 c7i.8xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-24"
    # The one profile Phase 3 promotes, backed by the compute environment
    # infra/batch-compute.yaml creates and named in config/execution-targets.yaml. Promoting
    # a second without deploying an environment for it is a contradiction between two files
    # rather than a flag, and a test refuses it.
    provisioned: true
  # THE NINE PROFILES BELOW THAT NOW SAY provisioned: true WERE PROMOTED TOGETHER, AND THE
  # PROMOTION IS FOUR EDITS PER PROFILE RATHER THAN THIS FLAG.
  #
  # A compute environment, a queue and a job definition in
  # infra/batch-compute-gpu-shapes.yaml; a row in config/execution-targets.yaml; an entry in
  # CONTAINER_SHAPES in src/edullm_platform/execution.py; and this flag. The third is the one
  # that is easy to miss and the one that decides what a submitted job actually reserves: the
  # template registers the shared definition, and the state machine registers a per-run
  # definition from that map, so a profile promoted here and in execution-targets.yaml but
  # absent from the map raises UnshapedComputeProfileError at admission.
  #
  # WHICH ZONES EACH SHAPE IS OFFERED IN, MEASURED WITH describe-instance-type-offerings ON
  # 2026-08-01 AND NOT INFERRED FROM THE FAMILY. Every type below is offered in us-east-1a,
  # 1b, 1c and 1d. g4dn, g5, g6 and p5 add 1f; g6e.12xlarge and p4d.24xlarge do not, so their
  # compute environments list four subnets and the rest list five. A subnet Batch cannot place
  # into produces a job that waits in RUNNABLE forever with no error anywhere, which is why
  # the two four-subnet environments are a measurement rather than a copy of their neighbours.
  #
  # gpu-1xl40s and gpu-1xa10g-sagemaker stay unprovisioned. The first is a single L40S nobody
  # asked for -- the four-GPU g6e is the shape that makes an L40S worth having -- and the
  # second is a SageMaker training instance, which is a different service with a different
  # submission path and no Batch queue to give it.
  - name: gpu-1xt4
    instance_type: g4dn.xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "0.5260"
    pricing_source: "AWS Price List API get-products AmazonEC2 g4dn.xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  - name: gpu-4xt4
    instance_type: g4dn.12xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "3.9120"
    pricing_source: "AWS Price List API get-products AmazonEC2 g4dn.12xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  - name: gpu-1xa10g
