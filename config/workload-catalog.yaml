    pricing_source: "AWS Price List API get-products AmazonEC2 g5.xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    # The first GPU profile promoted, and the only one whose environment, queue and definition
