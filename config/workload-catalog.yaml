workloads:
  # THESE FOUR WERE RENAMED, AND RECORDS WRITTEN BEFORE THE RENAME STILL CARRY THE OLD
  # NAMES. Every one of them ended in "-smoke", which is jargon a researcher reading the
  # submission dropdown has no reason to know and which understates what the entry is for:
  # the CPU and GPU entries are the checks somebody runs first, not throwaways.
  #
  #   olmo-core-cpu-smoke    -> olmo-core-check-cpu
  #   olmo-core-gpu-smoke    -> olmo-core-check-gpu
  #   olmo-core-train-smoke  -> olmo-core-train-4gpu
  #   dolma-tokenize-smoke   -> dolma-tokenize
  #
  # The stored records were deliberately not rewritten. A lineage record states what a run
  # was submitted as, it carries a manifest_sha256 over its own bytes, and editing the name
  # inside one would both falsify the record and break its digest. So an audit of anything
  # submitted before this rename finds a workload_profile that is not in this file, and this
  # table is the answer to why. RunManifest.workload_profile is a plain string with no
  # lookup against this catalog, which is what makes those records still parse.
  #
  # The CPU workload Phase 3 actually runs. It names OLMo-core rather than dolma because
  # OLMo-core is the only repository config/repositories.yaml registers and the only one
  # with a published image; a workload naming an unregistered repository cannot reach Batch
  # however well the rest of the path works.
  - name: olmo-core-check-cpu
    repository: OLMo-core
    compute_profile: cpu-32vcpu
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint: null
  # Retained and still unrunnable: dolma has no registration and no image. Kept because the
  # catalog is a pricing-and-shape document and this entry is the shape a tokenizer job
  # takes, not a claim that one can be submitted today.
  - name: dolma-tokenize
    repository: dolma
    compute_profile: cpu-32vcpu
    maximum_runtime_hours: "2"
    maximum_attempts: 1
    checkpoint: null
  # The GPU workload Phase 4 actually runs, and a sibling of olmo-core-train-4gpu rather
  # than a repointing of it. The four-GPU shape below is a real future target and deleting
  # it would lose its pricing entry, which is what this catalog is for.
  #
  # One entry serves both of the phase's live runs, because a workload profile fixes the
  # compute profile, the bounds and the checkpoint contract while the command arrives with
  # the submission. So the capability run -- which asks the container what devices it can
  # see -- and the training run that follows it are the same profile with different
  # commands, and the second inherits the first's proven placement.
  #
  # checkpoint is null, and that is a claim rather than an omission. A CheckpointContract
  # says the platform requires periodic checkpointing at an interval to a destination; a
  # twenty-step check has no interval to checkpoint on. The checkpoint the training run
  # writes goes under the run's own output prefix, which
  # contracts/results.py::output_prefix derives at submit time. Writing a static prefix here
  # would add a fourth literal answer to "where does a run write", which is the exact defect
  # D5 exists to have closed -- and a static string cannot carry a run id anyway.
  - name: olmo-core-check-gpu
    repository: OLMo-core
    compute_profile: gpu-1xa10g
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint: null
  # The first profile on this platform that is for training rather than for proving the
  # platform works. One A10G, twelve hours, two attempts.
  #
  # TWELVE HOURS IS THE POLICY CEILING AND NOT A ROUND NUMBER. config/policy.yaml sets
  # routine_maximum_runtime_hours to 12, so this is the longest run that still routes to an
  # ordinary lead approval; a thirteenth hour would make every submission an exception and
  # put a second person in the path of every training job. At the A10G's $1.006/hour that is
  # $12.07 an attempt and $24.14 across both, against a routine cost ceiling of $500.
  #
  # TWO ATTEMPTS IS THE POINT OF THE ENTRY, AND IT IS ONLY SAFE BECAUSE OF THREE THINGS THAT
  # ARE NOW TRUE TOGETHER. EDULLM_RUN_ID is in the container environment, so a Batch retry
  # re-runs the same container with the same environment and therefore the same
  # EDULLM_CHECKPOINT_DIR. OLMo-core's Trainer.fit() auto-resumes from its save folder with
  # load_trainer_state and load_optim_state both hard-coded true. And the checkpoint the
  # first attempt left is now readable rather than reported corrupt, which it was until the
  # write path moved to CRC32C. Remove any one of the three and the second attempt silently
  # repeats the first at full price.
  #
  # resume_required: true is still a declaration -- no code branches on the field. What makes
  # it true in practice is the paragraph above, and what makes it checkable is that a run
  # whose save folder was left at OLMo-core's /tmp default writes nothing here at all.
  - name: olmo-core-train-1gpu
    repository: OLMo-core
    compute_profile: gpu-1xa10g
    maximum_runtime_hours: "12"
    maximum_attempts: 2
    checkpoint:
      interval_minutes: 30
      # The root the per-run prefix hangs under, not a path anything writes to; the value the
      # container is handed is output_prefix(team, run_id) + "checkpoints/". Same string as
      # the four-GPU entry below, and for the same reason recorded there.
      destination_prefix: "s3://sbsandbox-intern-edullm-outputs/teams/"
      resume_required: true
  - name: olmo-core-train-4gpu
    repository: OLMo-core
    compute_profile: gpu-4xa10g
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint:
      interval_minutes: 30
      # Repointed from s3://sbsandbox-intern-edullm-checkpoints/runs/, which named a bucket
      # that has never existed. Phase 4 settled the question that entry was guessing at:
      # checkpoints live under the outputs bucket, beneath the same teams/{team}/runs/{run_id}/
      # prefix as everything else a run writes, so one grant in the workload role covers a
      # run's whole output and there is no second bucket to create, scope and retain.
      #
      # This value is the root the derived per-run prefix hangs under, not the path anything
      # writes to. The path is output_prefix(team, run_id) + "checkpoints/".
      destination_prefix: "s3://sbsandbox-intern-edullm-outputs/teams/"
      resume_required: false
