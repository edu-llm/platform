    pricing_source: "AWS Price List API get-products AmazonEC2 g5.12xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-24"
    provisioned: true
  - name: gpu-8xa10g
    instance_type: g5.48xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "16.2880"
    pricing_source: "AWS Price List API get-products AmazonEC2 g5.48xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-08-01"
    # The eight-GPU shape that does not draw on the P quota, which is what makes it worth
    # having next to gpu-8xa100 at $21.9576. Eight A10G is 192 GB of device memory against the
