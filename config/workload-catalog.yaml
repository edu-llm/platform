compute_profiles:
  - name: cpu-32vcpu
    instance_type: c7i.8xlarge
    accelerator: cpu
    nodes: 1
    hourly_rate_usd: "1.428"
    pricing_source: "AWS Price List API get-products AmazonEC2 c7i.8xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-24"
    # The one profile Phase 3 promotes, backed by the compute environment
    # infra/batch-compute.yaml creates and named in config/execution-targets.yaml. Promoting
    # a second without deploying an environment for it is a contradiction between two files
    # rather than a flag, and a test refuses it.
    provisioned: true
  # THE THIRTEEN PROFILES BELOW THAT NOW SAY provisioned: true WERE PROMOTED IN THREE ROUNDS,
  # AND EACH PROMOTION IS FOUR EDITS PER PROFILE RATHER THAN THIS FLAG.
  #
  # It read fifteen until 2026-08-04, when gpu-1xh100 and gpu-8xh100 went the other way for
  # the first time. A demotion is the same four edits and is not a rarer event than a
  # promotion, only a newer one; the long note above gpu-1xh100 is where the reason lives.
  #
  # A compute environment, a queue and a job definition in
  # infra/batch-compute-gpu-shapes.yaml; a row in config/execution-targets.yaml; an entry in
  # CONTAINER_SHAPES in src/edullm_platform/execution.py; and this flag. The third is the one
  # that is easy to miss and the one that decides what a submitted job actually reserves: the
  # template registers the shared definition, and the state machine registers a per-run
  # definition from that map, so a profile promoted here and in execution-targets.yaml but
  # absent from the map raises UnshapedComputeProfileError at admission.
  #
  # WHICH ZONES EACH SHAPE IS OFFERED IN, MEASURED WITH describe-instance-type-offerings ON
  # 2026-08-01 AND NOT INFERRED FROM THE FAMILY. Every type below is offered in us-east-1a,
  # 1b, 1c and 1d. g4dn, g5, g6 and p5 add 1f; g6e.12xlarge and p4d.24xlarge do not, so their
  # compute environments list four subnets and the rest list five. A subnet Batch cannot place
  # into produces a job that waits in RUNNABLE forever with no error anywhere, which is why
  # the two four-subnet environments are a measurement rather than a copy of their neighbours.
  #
  # THE FOUR TYPES PROMOTED ON 2026-08-02 WERE MEASURED THE SAME WAY, AT availability-zone
  # granularity, AND TWO OF THEM PART FROM THEIR NEIGHBOURS. g4dn.metal and g6.48xlarge are
  # offered in us-east-1a, 1b, 1c, 1d and 1f, so their environments list five subnets.
  # g6e.48xlarge and g6e.xlarge are offered in 1a, 1b, 1c and 1d only, so theirs list four.
  # Nine environments now list five and four list four. gpu-1xl40s is the one a copy would
  # have got wrong, because g6.xlarge sits beside it at the same size and is offered in 1f.
  #
  # gpu-1xl40s IS NOW PROVISIONED, AND THE SENTENCE THAT STOOD HERE SAID IT WAS "a single
  # L40S nobody asked for". Two pieces of work have since asked for it and neither can use
  # anything smaller. grpo-tutor runs vLLM on one card on a single node, which its own README
  # states. The P7 tutor recipe annotates per_device_batch: 8 as fitting about 44 GB with
  # gradient checkpointing, which no 24 GB card holds. P7's alternative was per_device_batch
  # 2 with grad_accum 16, which holds the effective batch at 32 but moves the micro-batch
  # boundaries and therefore the dropout draw, so it is a deviation somebody has to declare
  # and defend rather than a free substitution.
  #
  # THAT ENTRY ALSO SAID 48 GB WAS "the largest single card EC2 sells", WHICH WAS WRONG AND
  # IS THE REASON gpu-1xh100 EXISTS FURTHER DOWN. p5.4xlarge is one H100 80 GB. Both work
  # named above asked for an H100 specifically and were offered the L40S as the closest thing
  # available; it was not the closest thing available. gpu-1xl40s stays anyway, because it is
  # $1.861 against $6.88 and draws on the G pool rather than the P pool, so it cannot be
  # starved by an eight-card H100 job. What changed is that it is a choice rather than the
  # only option.
  #
  # gpu-1xa10g-sagemaker stays unprovisioned. It is a SageMaker training instance, which is a
  # different service with a different submission path and no Batch queue to give it. It was
  # the only unprovisioned entry until the two H100 shapes joined it, and the two reasons are
  # not the same one: this shape has nothing built for it, and those two have everything built
  # for them and no instance to run it on.
  - name: gpu-1xt4
    instance_type: g4dn.xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "0.5260"
    pricing_source: "AWS Price List API get-products AmazonEC2 g4dn.xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  - name: gpu-4xt4
    instance_type: g4dn.12xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "3.9120"
    pricing_source: "AWS Price List API get-products AmazonEC2 g4dn.12xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  - name: gpu-8xt4
