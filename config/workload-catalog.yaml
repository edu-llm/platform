    pricing_source: "AWS Price List API get-products AmazonEC2 g6.xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  - name: gpu-4xl4
    instance_type: g6.12xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "4.6016"
    pricing_source: "AWS Price List API get-products AmazonEC2 g6.12xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  - name: gpu-8xl4
    instance_type: g6.48xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "13.3504"
    pricing_source: "AWS Price List API get-products AmazonEC2 g6.48xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-08-02"
    # The same machine as gpu-8xa10g on every axis a job can ask for, at a lower price. Both
    # are 192 vCPU, 768 GiB of host memory, eight devices and 192 GB of device memory, and
    # this one is $13.350 against $16.288. That makes it the cheaper of the two whenever a
    # job is bound by device memory, and it is the same relation gpu-4xl4 already has to
    # gpu-4xa10g one row up.
    provisioned: true
  - name: gpu-1xl40s
    instance_type: g6e.xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "1.8610"
    pricing_source: "AWS Price List API get-products AmazonEC2 g6e.xlarge us-east-1 Linux/Shared/NA/Used"
    # Re-read on 2026-08-02 while provisioning the shape and unchanged, so the date the rate
    # was first observed is the date that stands.
    pricing_observed_at: "2026-07-25"
    provisioned: true
  - name: gpu-4xl40s
    instance_type: g6e.12xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "10.4926"
    pricing_source: "AWS Price List API get-products AmazonEC2 g6e.12xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  # gpu-8xl40s IS THE THIRD PROVISIONED PROFILE THAT NEEDS AN ADMIN, AND THE TWO BELOW IT ARE
  # THE OTHERS. See the note above gpu-8xa100 for what the rate does at the gate.
  #
  # It earns its place on the gap it fills rather than on the grid being symmetric. Eight
  # L40S is 384 GB of device memory, more than the 320 GB of the eight-A100 node and short of
  # the 640 GB of the eight-H100, and nothing else in this file occupies that range. A model
  # that does not fit in the 192 GB of the eight-A10G and eight-L4 nodes has had to reach for
  # a p4d and its admin approval and its separate quota pool; this reaches past what a p4d
  # holds and does it without the P pool. It is also the only
  # G-pool shape whose rate crosses the ceiling, at $30.131 against gpu-8xa10g's $16.288.
  - name: gpu-8xl40s
    instance_type: g6e.48xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "30.1312"
    pricing_source: "AWS Price List API get-products AmazonEC2 g6e.48xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-08-02"
    provisioned: true
  # TWO OF THE THREE BELOW ARE ABOVE THE RATE CEILING AND ONLY gpu-8xa100 IS STILL OFFERABLE.
  # This read "the two below are provisioned and still need an admin", which described
  # gpu-8xa100 and gpu-8xh100 when they were the last two entries. gpu-1xh100 was added
  # between them at $6.88, under the ceiling rather than over it, and both H100 shapes are now
  # unprovisioned. What the sentence was really about is the rate rule, which is unchanged:
  # gpu-8xa100 and gpu-8xh100 carry an hourly_rate_usd
  # above EXCEPTION_RATE_CEILING_USD_PER_HOUR in
  # src/edullm_platform/contracts/policy.py, so classify_request returns EXCEPTION for any
  # request naming them whatever its total cost and runtime are. That file records why the
  # gate is a rate rather than a list of these two names, and config/policy.yaml points at it.
  #
  # So hourly_rate_usd here is no longer only a cost estimate. It is read by the gate, and
  # editing one of these numbers downward past $20 would move a shape from admin approval to
  # team-lead approval with nothing else changing.
  #
  # A100 HAS NO ONE-CARD OR FOUR-CARD FORM ON EC2. H100 HAS A ONE-CARD FORM AND THIS FILE
  # SAID IT DID NOT.
  #
  # The sentence that stood here read "neither of these two cards has a one-card or four-card
  # form on EC2" and sent anybody who wanted a single 80 GB card to gpu-1xl40s at 48 GB. It
  # was measured on the two P types this account was already using and never rechecked
  # against the p5 family's own size list. describe-instance-types on 2026-08-02 reports
  # three p5 types in us-east-1: p5.4xlarge at one H100, p5.48xlarge at eight, and
  # p5en.48xlarge at eight H200. So gpu-1xh100 below is real, and gpu-4xh100 still is not.
  #
  # A100 is unaffected and the original claim holds for it. p4d.24xlarge is eight devices
  # with nothing smaller in the family, so gpu-1xa100 and gpu-4xa100 cannot be built. The
  # substitute for one A100 is gpu-1xh100, a newer card at the same 80 GB and a third of the
  # per-device rate.
  #
  # gpu-1xh100 IS THE ONLY P SHAPE THAT DOES NOT NEED AN ADMIN, at $6.88 against the $20
  # ceiling. That is the point of it rather than a side effect: three pieces of work asked
  # for one H100 by name and each was choosing between an eight-card node at $55.04 needing
  # an admin every time, or a 48 GB card and a changed recipe.
  #
  # BOTH H100 SHAPES WENT BACK TO provisioned: false ON 2026-08-04, AND THE INFRASTRUCTURE
  # THEY NAME IS STILL DEPLOYED AND STILL HEALTHY. That combination is new here and is the
  # reason this paragraph is long. Every other unprovisioned entry in this file is a shape
  # nothing was ever built for. These two have a compute environment, a queue and a job
  # definition, all VALID, and EC2 will not sell the account an instance to put under them.
  #
  # WHAT WAS MEASURED. p5.48xlarge: 6,815 launch attempts over nine hours, every one
  # InsufficientInstanceCapacity, across all five zones the environment could reach at the
  # time. p5.4xlarge: 2,530 the same way. A fresh probe on 2026-08-04 failed a hundred more
  # in nine minutes. Cost Explorer for 2026-06-01 to 2026-08-05 reports p4d.24xlarge at 22.3
  # instance-hours and $218, and p5.48xlarge and p5.4xlarge at zero hours and zero dollars.
  # Not "scarce": the account has never once held either instance type.
  #
  # WHY THE FLAG RATHER THAN LEAVING THEM OFFERABLE. A shape that cannot be placed produces a
  # job that waits in RUNNABLE with no error a submitter can see, and the safety net that was
  # supposed to end that wait cannot fire. Each queue carries a 1800 second cancel under
  # CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY, but Batch matches those rules on the job's
  # statusReason and leaves it null for this failure -- the capacity error exists only in the
  # autoscaling group's activity history, which no job field reflects. Read directly off a
  # RUNNABLE p5 job on 2026-08-04: status RUNNABLE, statusReason null, past the threshold,
  # not cancelled. The three reason values Batch accepts were tested against UpdateJobQueue
  # one at a time and there is no catch-all; every other candidate returns "Invalid job
  # reason". So the wait is unbounded, and the only place left to refuse it is the form.
  #
  # WHAT TAKES THEM BACK. One p5 of either size actually launching in this account. The
  # infrastructure is unchanged and untouched by this edit, so the promotion is this flag,
  # the execution target in config/execution-targets.yaml, the dropdown in
  # .github/workflows/submit-run.yml and the two lists in the tests that enumerate them --
  # the same four edits their first promotion made, in reverse.
  #
  # WHERE TO SEND SOMEBODY MEANWHILE. gpu-8xa100 is eight 80 GB cards, is the shape that
  # demonstrably runs, and is the substitution to offer anybody who was reaching for
  # gpu-8xh100. For one card, gpu-1xl40s is 48 GB and draws on the G pool.
  - name: gpu-1xh100
    instance_type: p5.4xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "6.8800"
    pricing_source: "AWS Price List API get-products AmazonEC2 p5.4xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-08-02"
    provisioned: false
  - name: gpu-8xa100
    instance_type: p4d.24xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "21.9576"
    pricing_source: "AWS Price List API get-products AmazonEC2 p4d.24xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: true
  # Unprovisioned for the reason written out above gpu-1xh100, which is one shortage and not
  # two: both shapes are p5, and the pool that will not sell a p5.48xlarge is the pool that
  # will not sell a p5.4xlarge.
  - name: gpu-8xh100
    instance_type: p5.48xlarge
    accelerator: gpu
    nodes: 1
    hourly_rate_usd: "55.0400"
    pricing_source: "AWS Price List API get-products AmazonEC2 p5.48xlarge us-east-1 Linux/Shared/NA/Used"
    pricing_observed_at: "2026-07-25"
    provisioned: false
workloads:
  # THESE NINE WERE RENAMED, IN TWO WAVES, AND RECORDS WRITTEN BEFORE EITHER WAVE STILL
  # CARRY THE OLD NAMES.
  #
  # The first four ended in "-smoke", which is jargon a researcher reading the submission
  # dropdown has no reason to know and which understates what the entry is for: the CPU and
  # GPU entries are the checks somebody runs first, not throwaways.
  #
  # The five below them lost a machine out of their names, because the entries stopped
  # naming a machine. An entry declared a compute_profile, the submission form's own
  # compute_profile overrode it whatever it said, and nothing refused a disagreement
  # between the two, so the name promised a placement the form was already outranking. Two
  # entries that differed only in that field were therefore one policy written twice, and
  # each such pair collapsed into the entry it always was.
  #
  #   olmo-core-cpu-smoke    -> olmo-core-check-cpu
  #   olmo-core-gpu-smoke    -> olmo-core-check-gpu
  #   olmo-core-train-smoke  -> olmo-core-train-4gpu
  #   dolma-tokenize-smoke   -> dolma-tokenize
  #   olmo-core-check-cpu    -> olmo-core-check
  #   olmo-core-check-gpu    -> olmo-core-check
  #   olmo-core-train-1gpu   -> olmo-core-train
  #   olmo-core-train-4gpu   -> olmo-core-train
  #   olmo-eval-check-cpu    -> olmo-eval-check
  #
  # Read the table right to left to resolve a stored name, and follow it twice where it
  # chains: a record naming olmo-core-train-smoke was renamed to olmo-core-train-4gpu and
  # is olmo-core-train now.
  #
  # The stored records were deliberately not rewritten, in either wave. A lineage record
  # states what a run was submitted as, it carries a manifest_sha256 over its own bytes,
  # and editing the name inside one would both falsify the record and break its digest. So
  # an audit of anything submitted before a rename finds a workload_profile that is not in
  # this file, and this table is the answer to why. RunManifest.workload_profile is a plain
  # string with no lookup against this catalog, which is what makes those records still
  # parse.
  #
  # A record from before the second wave also carries a compute_profile of its own, and
  # that field is unaffected and still resolves here. What a collapsed record loses is
  # nothing: the machine it ran on was always the manifest's answer rather than the
  # workload's, which is the defect the collapse closed.
  #
  # The CPU check Phase 3 actually runs, and the entry a first submission picks. It names
  # OLMo-core rather than dolma because OLMo-core is the only repository
  # config/repositories.yaml registers and the only one with a published image; a workload
  # naming an unregistered repository cannot reach Batch however well the rest of the path
  # works.
  #
  # ONE ENTRY WHERE THERE WERE TWO, AND THE PAIR WAS NEVER TWO POLICIES. olmo-core-check-cpu
  # and olmo-core-check-gpu declared the same hour, the same single attempt and the same
  # absent checkpoint contract, and differed only in a compute_profile the form overrode.
  # Whether a check runs on a CPU or on a GPU is now the compute_profile field on the
  # submission, which is where the question was already being answered.
  #
  # checkpoint is null, and that is a claim rather than an omission. A CheckpointContract
  # says the platform requires periodic checkpointing at an interval to a destination; a
  # twenty-step check has no interval to checkpoint on. Writing a static prefix here would
  # add a fourth literal answer to "where does a run write", which is the exact defect D5
  # exists to have closed -- and a static string cannot carry a run id anyway.
  - name: olmo-core-check
    repository: OLMo-core
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint: null
  # The entry that makes edullm-data's registration mean something. It was registered, had an
  # ECR repository and had publisher-role scope, and none of that let anyone submit anything,
  # because a repository with no workload profile can be selected and then has nothing to run.
  #
  # `edullm-data-validate` is a declared console script in that repository and a tested
  # main(), not a name invented here. It reads a published corpus and checks each shard
  # against the bounds its family declares, which is CPU work over S3 with no accelerator to
  # ask for. It kept its name through the collapse because the name never carried one.
  #
  # THAT IT WANTS NO ACCELERATOR IS ADVICE THIS FILE CANNOT ENFORCE, AND SAYING SO IS THE
  # HONEST VERSION OF THE cpu-32vcpu THIS ENTRY USED TO DECLARE. That declaration was
  # overridden by the form on every submission, so it refused nothing; what it did was read
  # as a promise that a validator could not be started on a p5.48xlarge. It can, it always
  # could, and the only thing standing between a submitter and that mistake is the hourly
  # rate on the approver's summary.
  #
  # PICK cpu-32vcpu, AND THE REASON IS AN IAM GRANT RATHER THAN THE PRICE. Only the CPU
  # workload role, sbsandbox-intern-edullm-batch-workload, can read edullm-landing --
  # where the candidate shards this program checks arrive. Every GPU target in
  # config/execution-targets.yaml runs as sbsandbox-intern-edullm-batch-gpu-workload, which
  # reads the sealed edullm-data and not the landing zone, so a validator sent to a GPU
  # queue starts, pulls its image and fails with AccessDenied on its first read at between
  # $0.53 and $55.04 an hour. infra/iam/batch-gpu-roles.yaml records why that asymmetry is
  # kept rather than widened away.
  #
  # THIS LINE USED TO BE A TRAP AND THE TRAP WAS THE OTHER WAY ROUND, WHICH IS WORTH
  # KNOWING BEFORE TRUSTING IT AGAIN. It said "Pick cpu-32vcpu" while cpu-32vcpu was
  # precisely the profile that could not read either bucket: the CPU workload role held
  # s3:PutObject and s3:ListBucket on the outputs bucket and no s3:GetObject anywhere, so
  # this entry was admitted, approved, placed and then denied. The grant that closed it is
  # the `read-the-dataset-airlock` inline policy in infra/iam/batch-roles.yaml, and it
  # needs a deploy of sbsandbox-intern-edullm-batch-iam from a laptop before this sentence
  # is true of the account rather than only of the templates.
  #
  # One hour and one attempt. The validator is a read: it writes a report and holds no state
  # worth resuming, so a lost machine costs the read again rather than the work, and
  # checkpoint is null because there is no interval to checkpoint on.
  - name: edullm-data-validate
    repository: edullm-data
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint: null
  # The Evaluation group's first submittable entry, and deliberately the check rather than the
  # eval. olmo-core-check is the precedent: prove the path before spending a GPU on it.
  #
  # WHAT THIS RUNS AND WHAT IT DOES NOT. olmo_eval registers a `mock` provider alongside vllm,
  # hf, olmo_core, vllm_server and litellm, so `-o provider.kind=mock` exercises the harness,
  # the task loading and the result writing without a model. That is the whole of what the
  # published image can do today, because .edullm/Dockerfile leaves torch and vllm out: they
  # are a default group in that repository, a torch built against its CUDA base adds several
  # gigabytes, and which backend an eval needs is a decision for the group running it.
  #
  # THE "-cpu" CAME OFF THE NAME AND THE SENTENCE IT WAS SHORTHAND FOR IS STILL TRUE. There
  # is no eval entry here that a GPU would help, and there will not be one until the image
  # carries a backend, which is one line in that repository's Dockerfile and a rebuild. The
  # GPU shapes are provisioned and waiting. What the suffix implied and could not deliver is
  # that picking this entry kept a submitter off them; the form has always been able to put
  # a mock-provider eval on a p5.48xlarge, and removing the suffix stops the name claiming
  # otherwise.
  - name: olmo-eval-check
    repository: olmo-eval-full
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint: null
  # Retained and still unrunnable: dolma has no registration and no image. Kept because the
  # catalog is a policy document and this entry is the contract a tokenizer job runs under,
  # not a claim that one can be submitted today. Two hours rather than one because
  # tokenizing a corpus is the longest thing here that is not training.
  - name: dolma-tokenize
    repository: dolma
    maximum_runtime_hours: "2"
    maximum_attempts: 1
    checkpoint: null
  # The only entry here that is for training rather than for proving the platform works,
  # and the collapse of olmo-core-train-1gpu and olmo-core-train-4gpu, which carried
  # identical bounds and identical checkpoint contracts and differed in one field the form
  # overrode. Everything either of them promised about a machine is now the compute_profile
  # on the submission, which is a required field and the first real choice a submitter
  # makes. How many devices the run gets is priced on the approver's summary before it is
  # released.
  #
  # TWENTY-FOUR HOURS IS THE POLICY CEILING AND NOT A ROUND NUMBER. config/policy.yaml sets
  # routine_maximum_runtime_hours to 24, so this is the longest run that still routes to an
  # ordinary lead approval; a twenty-fifth hour would make every submission an exception and
  # put a second person in the path of every training job.
  #
  # IT WAS TWELVE AND THE TWELVE WAS MEASURABLY WRONG, WHICH IS WHY BOTH NUMBERS MOVED
  # TOGETHER. Memory-split's eight seed pairs and P7's 192-checkpoint sweep each land
  # between sixteen and twenty hours, so under the old ceiling every one of them was an
  # exception and the exception path was carrying ordinary work. Twelve was never measured
  # against anything; twenty-four covers both of those and leaves the cost ceiling as the
  # bound that actually bites.
  #
  # WHAT THE LONGER CEILING COSTS, PER SHAPE, AGAINST A ROUTINE COST CEILING OF $500. Two
  # attempts at twenty-four hours is $48.29 on gpu-1xa10g and $272.26 on gpu-4xa10g, both
  # routine. It is $781.82 on gpu-8xa10g, which is an exception on cost where the same
  # submission at twelve hours was routine at $390.91. That is the raise working rather than
  # a regression: the eight-GPU shapes are where a doubled runtime is worth a second reader,
  # and the cost ceiling is the bound that says so.
  #
  # TWO ATTEMPTS IS THE POINT OF THE ENTRY, AND IT IS ONLY SAFE BECAUSE OF THREE THINGS THAT
  # ARE NOW TRUE TOGETHER. EDULLM_RUN_ID is in the container environment, so a Batch retry
  # re-runs the same container with the same environment and therefore the same
  # EDULLM_CHECKPOINT_DIR. OLMo-core's Trainer.fit() auto-resumes from its save folder with
  # load_trainer_state and load_optim_state both hard-coded true. And the checkpoint the
  # first attempt left is now readable rather than reported corrupt, which it was until the
  # write path moved to CRC32C. Remove any one of the three and the second attempt silently
  # repeats the first at full price.
  #
  # resume_required: true is still a declaration -- no code branches on the field. What makes
  # it true in practice is the paragraph above, and what makes it checkable is that a run
  # whose save folder was left at OLMo-core's /tmp default writes nothing here at all.
  #
  # A MULTI-GPU MACHINE NEEDS A RANK PER DEVICE, WHICH IS THE SUBMITTED COMMAND AND NOT THIS
  # ENTRY. .edullm/train_on_corpus.py already handles being one rank of several: it
  # initialises the process group, shards the model with FSDP and writes one checkpoint
  # shard per rank. What it does not do is start the other processes. Nothing on this side
  # does either, since the command arrives with the submission and is exec'd as typed, so a
  # four-GPU run needs
  #
  #   python -m torch.distributed.run --nproc-per-node=4 --standalone \
  #     .edullm/train_on_corpus.py <run_id> --steps <n>
  #
  # Proven on 2026-08-01: twenty steps on gpu-4xa10g, four ranks reported by the process
  # group, a step-20 checkpoint written with shards __0_* through __3_*, loss 11.62 to 7.48.
  #
  # A run that omitted it used to train on one device, bill for four, and succeed. That is
  # now refused while the submission compiles, by
  # edullm_platform.launchers.require_a_process_for_every_device, which reads the device
  # count out of CONTAINER_SHAPES against the compute profile the manifest resolved to.
  # That is why one entry can serve every shape: the rule is derived from the machine the
  # submission names rather than from anything declared here, so it covered the four-GPU
  # entry before the collapse and covers a submitter picking gpu-8xh100 after it. Nothing
  # here is what enforces it, and this paragraph is here because the rule is about a command
  # rather than about a catalog entry, which is not where a reader of this file would think
  # to look for it.
  - name: olmo-core-train
    repository: OLMo-core
    maximum_runtime_hours: "24"
    maximum_attempts: 2
    checkpoint:
      interval_minutes: 30
      # Repointed from s3://sbsandbox-intern-edullm-checkpoints/runs/, which named a bucket
      # that has never existed. Phase 4 settled the question that entry was guessing at:
      # checkpoints live under the outputs bucket, beneath the same teams/{team}/runs/{run_id}/
      # prefix as everything else a run writes, so one grant in the workload role covers a
      # run's whole output and there is no second bucket to create, scope and retain.
      #
      # This value is the root the derived per-run prefix hangs under, not the path anything
      # writes to. The path is output_prefix(team, run_id) + "checkpoints/".
      destination_prefix: "s3://sbsandbox-intern-edullm-outputs/teams/"
      resume_required: true
  # edullm-alt-cl: the math front-load / anneal experiment. A registration with no workload
  # is a dropdown that cannot be submitted for, so these two presets are what make the
  # repository usable rather than merely named. Same shape as olmo-core-check / olmo-core-train:
  # bounds and checkpoint live here; the machine is the form's compute_profile field.
  #
  # The check is a dry-run of the treatment arm -- plan JSON only, no fit -- so pick
  # cpu-32vcpu. Training matches OLMo-core's 24h / 2-attempt ceiling; pick gpu-1xa10g /
  # gpu-4xa10g / gpu-8xa10g (or gpu-8xa100 with admin approval) to match the command's
  # --nproc-per-node.
  - name: edullm-alt-cl-check
    repository: edullm-alt-cl
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint: null
  - name: edullm-alt-cl-train
    repository: edullm-alt-cl
    maximum_runtime_hours: "24"
    maximum_attempts: 2
    checkpoint:
      interval_minutes: 30
      destination_prefix: "s3://sbsandbox-intern-edullm-outputs/teams/"
      resume_required: true
  # open-instruct-scored-rewards-check: the first workload profile for
  # open-instruct-scored-rewards, written with the registration because a repository
  # with no entry here reaches no dropdown and no run can name it. GRPO with a
  # hidden-state reward model, which OLMo-core cannot run: the trainer is
  # open-instruct's grpo_fast.py and the reward is a Ridge head on a frozen
  # OLMo-2-7B-Instruct's activations, loaded as a reward plugin inside the vLLM actor.
  # The image also differs in kind rather than in degree -- it carries vLLM, DeepSpeed
  # and a pip-installed nvcc, which no registered image does.
  #
  # The bounds are this tool's defaults and not a measurement: one hour, one attempt and
  # no checkpoint contract is the shape of every repository's first entry, and it is
  # right for a check and wrong for anything that trains. The machine is the submission
  # form's compute_profile field and is deliberately not named here.
  - name: open-instruct-scored-rewards-check
    repository: open-instruct-scored-rewards
    maximum_runtime_hours: "1"
    maximum_attempts: 1
    checkpoint: null
  # The entry the repository was actually registered for. The check above proves the image
  # starts; this is the GRPO run, and without it the registration would offer a researcher
  # a dropdown whose only option is a one-hour smoke test of somebody else's work.
  #
  # TWENTY-FOUR HOURS FOR THE SAME REASON olmo-core-train CARRIES IT: it is
  # routine_maximum_runtime_hours in config/policy.yaml, so this is the longest run that
  # still routes to a lead rather than making every submission an exception. It is a
  # ceiling and not an estimate -- nobody has run this workload here yet, and the first
  # submission is the measurement.
  #
  # TWO ATTEMPTS, AND THE THING THAT MAKES IT SAFE IS A REFUSAL RATHER THAN A PROMISE.
  # grpo_fast.py resumes on its own when --checkpoint_state_dir holds state: it reads
  # optimization_steps_done and continues from the step after, which the repository
  # observed on a preemptable partition when a run was taken and requeued. What that
  # depends on is the submitted command passing the directory, and the repository's
  # scripts/train.sh disables checkpointing entirely when its CKPT_ROOT is unset -- which
  # is the default. So a retry under this entry is worth having only because
  # require_a_save_folder_a_retry_can_find refuses a submission naming this profile whose
  # command does not expand $EDULLM_CHECKPOINT_DIR. The command has to read
  #
  #   CKPT_ROOT="$EDULLM_CHECKPOINT_DIR"
  #
  # and the refusal is what keeps the second attempt from silently repeating the first at
  # full price.
  #
  # interval_minutes IS THE ONE FIELD HERE THAT DOES NOT DESCRIBE THIS WORKLOAD. Thirty
  # matches its two neighbours, and this trainer checkpoints on a step count rather than a
  # clock -- --checkpoint_state_freq is in optimizer steps. Nothing reads the field to
  # enforce an interval, so the mismatch costs nothing today, and saying so is cheaper than
  # a reader inferring that thirty minutes was measured against a GRPO step time nobody has
  # measured.
  - name: open-instruct-scored-rewards-train
    repository: open-instruct-scored-rewards
    maximum_runtime_hours: "24"
    maximum_attempts: 2
    checkpoint:
      interval_minutes: 30
      destination_prefix: "s3://sbsandbox-intern-edullm-outputs/teams/"
      resume_required: true
