# Which compute profiles are actually backed by infrastructure, and by what.
#
# Separate from config/workload-catalog.yaml on purpose. That file is a pricing-and-shape
# document: it answers "what would this cost" and is read by the compile step, the approver
# context and cost estimation, none of which should acquire an opinion about queues. This
# file answers "is there anywhere to run it", which is an infrastructure fact and changes
# when infrastructure changes.
#
# The two must agree. A profile marked provisioned in the catalog with no entry here, or an
# entry here for a profile the catalog does not call provisioned, is a contradiction between
# two files and is caught by
# tests/test_phase3_execution.py::test_every_provisioned_profile_is_backed_and_every_target_names_a_provisioned_one
# -- a config-to-config comparison, so it lives beside the resolver rather than with the
# CloudFormation tests. Whether the queue this file names is the one the templates create
# is a different seam, checked in tests/test_phase3_infrastructure.py.
#
# Names rather than ARNs, so no account id lands in reviewed configuration. The ARNs are
# assembled at resolution time; see contracts/execution.py.
schema_version: 1
targets:
  - compute_profile: cpu-32vcpu
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-cpu
    job_definition: sbsandbox-intern-edullm-cpu-run
    execution_role: sbsandbox-intern-edullm-batch-execution
    workload_role: sbsandbox-intern-edullm-batch-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-cpu
  # Every field differs from the CPU target above, including the two roles, and that is the
  # point rather than an accident of naming. infra/iam/batch-gpu-roles.yaml explains why the
  # GPU path has its own trio: only its execution role reads the W&B secret, and only its
  # workload role may read an object back, because only a training job resumes from a
  # checkpoint it wrote.
  #
  # Adding this row and setting provisioned: true on gpu-1xa10g are two halves of one change.
  # Either alone is a contradiction between two files, which
  # tests/test_phase3_execution.py::test_every_provisioned_profile_is_backed_and_every_target_names_a_provisioned_one
  # refuses. Whether the queue named here is the queue the templates create is a different
  # seam, checked in tests/test_phase3_infrastructure.py.
  - compute_profile: gpu-1xa10g
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu
    job_definition: sbsandbox-intern-edullm-gpu-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  # THE TWELVE ROWS BELOW SHARE THE GPU ROLE TRIO AND THE GPU LOG GROUP WITH THE ROW ABOVE,
  # AND THAT IS A DECISION RATHER THAN A SHORTCUT.
  #
  # Thirteen until 2026-08-04, when the two H100 rows were withdrawn. The note where they
  # stood says why, and none of the argument below is affected: the shared trio is about what
  # a GPU job reads rather than about how many shapes there are.
  #
  # The isolation the CPU and GPU rows have from each other is real: their execution roles
  # read different secrets, their workload roles reach different objects, and each execution
  # role is scoped to one log group, so merging those two groups would let either principal
  # write into the record of the other's jobs. None of that separates one GPU shape from
  # another. They run the same image, resume from the same output prefix, read the same W&B
  # secret and are approved by the same people; a role per shape would be fourteen copies of
  # one policy, and fourteen log groups would need fourteen grants on the role that exists.
  #
  # What follows from sharing is that infra/batch-compute-gpu-shapes.yaml creates no log
  # group. It names /aws/batch/sbsandbox-intern-edullm-gpu, which infra/batch-compute-gpu.yaml
  # creates, and CloudFormation knows nothing about that dependency because the awslogs driver
  # takes a string. Deleting the gpu stack would leave these twelve definitions logging
  # nowhere.
  #
  # The rows are in the same order the template declares the resources, grouped by card and
  # then by device count, so a reader comparing the two files reads them down together. That
  # is the only thing the order carries; nothing resolves by position.
  - compute_profile: gpu-1xt4
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-1xt4
    job_definition: sbsandbox-intern-edullm-gpu-1xt4-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-4xt4
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-4xt4
    job_definition: sbsandbox-intern-edullm-gpu-4xt4-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-8xt4
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-8xt4
    job_definition: sbsandbox-intern-edullm-gpu-8xt4-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-4xa10g
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-4xa10g
    job_definition: sbsandbox-intern-edullm-gpu-4xa10g-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-8xa10g
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-8xa10g
    job_definition: sbsandbox-intern-edullm-gpu-8xa10g-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-1xl4
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-1xl4
    job_definition: sbsandbox-intern-edullm-gpu-1xl4-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-4xl4
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-4xl4
    job_definition: sbsandbox-intern-edullm-gpu-4xl4-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-8xl4
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-8xl4
    job_definition: sbsandbox-intern-edullm-gpu-8xl4-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-1xl40s
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-1xl40s
    job_definition: sbsandbox-intern-edullm-gpu-1xl40s-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-4xl40s
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-4xl40s
    job_definition: sbsandbox-intern-edullm-gpu-4xl40s-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  - compute_profile: gpu-8xl40s
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-8xl40s
    job_definition: sbsandbox-intern-edullm-gpu-8xl40s-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
  # gpu-1xh100 AND gpu-8xh100 HAD ROWS HERE UNTIL 2026-08-04 AND THE QUEUES THEY NAMED ARE
  # STILL DEPLOYED, STILL ENABLED AND STILL VALID. Nothing was torn down; the rows were
  # withdrawn because EC2 will not sell this account a p5 of either size, so a submission
  # routed to either queue reaches a compute environment that can never place it.
  #
  # This file answers "is there anywhere to run it", and for these two the honest answer
  # stopped being yes while every name in the row stayed correct. That is a case the header
  # above did not anticipate: a row can be accurate about the infrastructure and still be a
  # promise the platform cannot keep. config/workload-catalog.yaml carries the measurement
  # and what would bring them back.
  #
  # sbsandbox-intern-edullm-gpu-1xh100 and sbsandbox-intern-edullm-gpu-8xh100 are the queues,
  # and their -run job definitions are unchanged. Restoring these two rows and flipping the
  # catalog flag is the whole of the re-promotion; no template edit is involved.
  - compute_profile: gpu-8xa100
    region: us-east-1
    job_queue: sbsandbox-intern-edullm-gpu-8xa100
    job_definition: sbsandbox-intern-edullm-gpu-8xa100-run
    execution_role: sbsandbox-intern-edullm-batch-gpu-execution
    workload_role: sbsandbox-intern-edullm-batch-gpu-workload
    log_group: /aws/batch/sbsandbox-intern-edullm-gpu
