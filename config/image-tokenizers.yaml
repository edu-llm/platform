# What each published training image can actually build a tokenizer config for.
#
# THIS FILE IS A MEASUREMENT AND NOT A LIST. Every entry names the commit it was read at and
# what read it, and nothing here is a decision anybody made -- it is what somebody found when
# they looked. `src/edullm_platform/contracts/image_tokenizers.py` carries the argument for
# why the runnability verdict has to read this rather than the platform's own tokenizer map;
# the short of it is that `src/edullm_platform/tokenizers.py` says what this platform knows
# how to express and this says what an image knows how to build, and on 2026-08-07 those two
# disagreed by two entries. `edullm data` marked three corpora runnable on the strength of
# the first, `run_019fdd88-3ac4` was admitted on one of them, allocated a GPU and exited 69.
#
# WRITTEN BY `tools/probe_image_tokenizers.py` AND NOT BY HAND. Editing an entry here by hand
# is asserting something about somebody else's image, which is the failure this replaces.
# `tests/test_image_tokenizers.py` holds every entry to the registry and to the platform's
# map, in both directions, so a record that has stopped being true of either goes red.
#
# A REPOSITORY WITH NO ENTRY CARRIES NOTHING, AND THAT IS THE SAFE DIRECTION RATHER THAN AN
# OVERSIGHT. Five of the six registered repositories have no entry because none of them
# resolves a corpus by tokenizer at all: `EDULLM_DATASET_TOKENIZER` is read by
# `OLMo-core/.edullm/train_on_corpus.py` and by nothing else in any of the other five, read
# on 2026-08-07. If one of them grows a corpus trainer, the corpora it could train read as
# `exits_69` here until somebody records it -- which under-promises rather than over-promises,
# and the sentence `edullm data` prints names the images that were asked, so the gap is
# visible to the person it affects rather than only to whoever maintains this.
schema_version: 1
images:
  # READ FROM SOURCE AND NOT FROM THE IMAGE, WHICH IS THE WEAKER OF THE TWO AND SAYS SO.
  # `tools/probe_image_tokenizers.py --image-reference ...` takes the strong reading and
  # needs a Docker daemon and a registry login, so it runs on a build runner or on a
  # maintainer's laptop with a session. This one was taken with `--repository-root` against
  # the checkout at OLMO_CORE_CHECKOUT on 2026-08-07, at the commit named below, which is
  # the commit `origin/main` pointed at and the commit the three resume runs of 2026-08-06
  # were built from.
  #
  # What the weaker reading cannot rule out is a build that did not put this file in the
  # image: a COPY that misses it, an entrypoint pinning an older checkout, or a cache hit
  # reusing the layer. Re-taking it as an `image_probe` costs one `docker pull` and is the
  # thing to do next; it is recorded honestly in the meantime rather than dressed up.
  - repository: OLMo-core
    commit_sha: 08df5aa0142465c80b4ea48e84faa46117275d61
    read_by: source_at_commit
    read_from: .edullm/train_on_corpus.py
    read_at: 2026-08-07T21:00:00Z
    # THREE, AND THE PLATFORM'S MAP HOLDS FIVE. `tokenizer/smollm2-bpe` and
    # `tokenizer/qwen25-vendored` are the two it holds and this does not, and both are in
    # `TOKENIZERS` legitimately -- each names an exact OLMo-core equivalent that was called
    # for real before the line was written. What never happened is the other half of the
    # ordering that module's docstring insists on: the matching lines have not landed in
    # OLMo-core, so every image refuses them.
    tokenizers:
      - tokenizer/dolma2-bpe
      - tokenizer/gigatoken-bpe
      - tokenizer/gigatoken-superbpe
