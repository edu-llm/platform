# What may run despite carrying findings at a severity policy blocks on, in two forms.
#
# THE UNIT OF REVIEW IS THE VULNERABILITY, AND IT DID NOT USED TO BE. This file held two
# entries, each naming one image digest, and that shape had a consequence nobody wanted: an
# image is refused unless somebody has written its digest here, every build produces a new
# digest, and so every iteration needed a reviewed pull request from an admin before it
# could run. That is the friction this platform removed from choosing an image, arriving one
# step to the left -- and it made the check "an image built today, with no hand-written
# exception, is accepted" unpassable by construction.
#
# What a reviewer actually did when writing those two entries was read four CVEs and decide
# they were acceptable. They did not bless an image; they could not, because the findings
# they were reading belong to the base every image shares. So the record says that now, once,
# and keeps saying it across rebuilds.
#
# This is not a loosening. A finding nobody has reviewed still refuses the run, which is the
# thing the per-digest form could not express: it could not tell a finding inherited from the
# base from one the project introduced, so it treated both as reviewed the moment anybody
# signed the image. Reviewing the vulnerability separates them.
#
# WHAT IT COSTS, AND IT IS ON THE README'S PILOT LIMITATIONS PAGE. A newly disclosed critical
# in a base package blocks every submission from the next scan until somebody reviews it.
# That is the correct behaviour and it is not a quiet one: the refusal names the identifier
# and the package.
#
# Adding an entry of either kind is not routine. The question it answers is "may this run",
# and the reason has a length floor in the contract because "approved" is not a reason.
schema_version: 1

# One image, accepted whole. The stronger and rarer statement: it covers a scan that never
# completed and an image the registry cannot scan at all, because it is a person saying they
# looked rather than a claim about a finding.
#
# EMPTY ON PURPOSE, AND THAT IS A RESULT RATHER THAN AN OMISSION. The two entries that were
# here covered the only two images the platform had published, and both are now covered by
# the reviews below -- the four criticals in each are the same four, enumerated from the
# registry rather than assumed. Removing them is what demonstrates the new mechanism carries
# the existing images, instead of leaving them held up by both and never finding out.
exceptions: []

# One vulnerability, read and accepted, covering every image that carries it.
#
# TWO BASES NOW, AND THE LIST IS IN TWO PARTS BECAUSE OF IT. The first four are Debian's,
# from python:3.12-slim, which OLMo-core and edullm-data build on. The twelve after them are
# Ubuntu 24.04's, from nvidia/cuda:12.8.1-runtime-ubuntu24.04, which olmo-eval-full builds
# on because an evaluation backend needs CUDA userspace libraries matching the host driver
# and a Dockerfile cannot install those. Different distributions at different versions, so
# they are different findings and are reviewed separately rather than as one list that
# happens to be longer.
#
# None is fixable from this repository, and that is a measurement rather than a position:
# the registry reports no fixed_in_version for any of the sixteen, so upgrading the package
# inside the Dockerfile would install the same version. Nor is there a patched base to move
# to; both digests are what their registries serve today.
#
# THE RESIDUAL, STATED WHERE IT APPLIES. This registry is on BASIC scanning, which reads the
# operating system package database and does not look at Python distributions at all. The
# training image installs torch, the project and its dependencies, boto3 and wandb -- about
# three gigabytes of Python that no finding below refers to, because nothing scanned it. The
# reviews here are reviews of what was looked at. Enhanced scanning is what would cover the
# rest and is not enabled.
#
# The residual is larger for the CUDA image than for the other two and worth saying so. That
# image is 2.5 GB, most of it CUDA libraries that arrive as files in the base rather than as
# packages in the database, so BASIC scanning has even less of it in view. Nothing below is a
# statement about libcudart, cuBLAS or cuDNN.
reviewed_vulnerabilities:
  - vulnerability_id: CVE-2026-57433
    package_name: perl
    reason: >-
      Debian perl 5.40.1-6, inherited from the digest-pinned python:3.12-slim base that both
      registered repositories build from. CVSS 9.8, and unreachable from this platform's
      workloads: the entrypoint is a Python training program and invokes no perl at any
      point, directly or through a subprocess. Unfixable from this repository -- the package
      comes from the base, and no patched base has been published upstream. Reviewed against
      the findings the registry reported for both published images, which carry the same
      four criticals and no others.
    recorded_by: philote-dev
    recorded_at: "2026-07-30T17:20:00.000000Z"
  - vulnerability_id: CVE-2026-12087
    package_name: perl
    reason: >-
      Debian perl 5.40.1-6, inherited from the digest-pinned base, reviewed together with
      CVE-2026-57433 and CVE-2026-13221 because all three are the same package at the same
      version and the reachability question is one question. No perl runs in any workload
      this platform submits, and the package cannot be upgraded from here.
    recorded_by: philote-dev
    recorded_at: "2026-07-30T17:20:00.000000Z"
  - vulnerability_id: CVE-2026-13221
    package_name: perl
    reason: >-
      Debian perl 5.40.1-6, inherited from the digest-pinned base, reviewed together with
      CVE-2026-57433 and CVE-2026-12087 for the reason recorded against those two: one
      package, one version, one reachability question, and no perl on any path a workload
      takes.
    recorded_by: philote-dev
    recorded_at: "2026-07-30T17:20:00.000000Z"
  - vulnerability_id: CVE-2026-5450
    package_name: glibc
    reason: >-
      Debian glibc 2.41-12+deb13u3, inherited from the digest-pinned base. Unlike the perl
      findings this one is in a library every process links, so it is accepted on
      unfixability rather than on unreachability: it comes from the base, no patched base
      exists upstream, and the alternative is to publish no images at all.       Worth revisiting
      the day Docker Hub republishes python:3.12-slim -- that is a re-pin of one digest in
      config/repositories.yaml and a rebuild, and it is the only action that would retire
      this entry rather than renew it.
    recorded_by: philote-dev
    recorded_at: "2026-07-30T17:20:00.000000Z"

  # THE UBUNTU 24.04 FINDINGS, FROM THE CUDA BASE, ENUMERATED FROM THE REGISTRY RATHER THAN
  # ASSUMED. describeImageScanFindings on
  # sha256:2e79cc82f71db61f385067a803330435c816c1e36c689430d4314d314143af7f, the first image
  # olmo-eval-full published, reported 13 critical findings covering six CVEs. Twelve entries
  # rather than thirteen, and six CVEs rather than twelve: ECR reports a finding per source
  # package and per binary package, so openssl and libssl3t64 are the same CVE named twice,
  # and CVE-2026-5450 arrives as glibc, libc6 and libc-bin. The glibc one is already reviewed
  # above against the Debian base, and a review matches on the package name as well as the
  # identifier, so the two Ubuntu binary package names still need their own entries.
  #
  # None of the six has a fixed_in_version in the registry's own report. That is the fact
  # that makes "unfixable" checkable here: apt in the Dockerfile would install the version
  # that is already installed.
  - vulnerability_id: CVE-2026-31789
    package_name: openssl
    reason: >-
      Ubuntu openssl 3.0.13-0ubuntu3.5, inherited from the digest-pinned
      nvidia/cuda:12.8.1-runtime-ubuntu24.04 base that olmo-eval-full builds from. Accepted
      on unfixability rather than on unreachability, because this one is reachable: an
      evaluation run reads corpora from S3 and may call a model endpoint, and both are TLS
      through a library that links libssl. The registry reports no fixed version, and Ubuntu
      has published no patched 24.04 openssl, so the alternatives are to run this or to run
      no evaluation image at all. Retired by a re-pin of the base digest in
      config/repositories.yaml once NVIDIA republishes on a patched Ubuntu, and by nothing
      else.
    recorded_by: philote-dev
    recorded_at: "2026-08-01T18:27:41.000000Z"
