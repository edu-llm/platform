# WHICH RESEARCH GROUPS EXIST, WHICH GITHUB TEAM EACH ONE IS, AND WHY NOBODY IS LISTED IN
# ONE OF THEM.
#
# Until this block existed the platform had no notion of a team that anything could check.
# The `team` box on the submission form was free text, its own help text said a typo delays
# nothing, and the two GitHub teams in this organization were `team-leads` and
# `team-members`, neither of which is a research group. So a run's team was a label, the
# cost view grouped by whatever people had typed, and nothing could say whether a claimed
# group was a real one. The list below is now closed and the form is a dropdown over it, so
# a name that is not here can no longer be submitted at all.
#
# Three team_ids below are names this platform's own records already use, and they are the
# three this file does not touch. `platform` is on 36 lineage records, `memory-split` on 22
# and `data-prep` on 1, counted in the store on 2026-08-01, and those are also the only
# three prefixes that exist under sbsandbox-intern-edullm-outputs/teams/. The GitHub team of
# the same name was created to match, and github_team_slug is the join between the two.
#
# THREE WERE RENAMED, AND RECORDS WRITTEN BEFORE THE RENAME STILL CARRY THE OLD NAMES.
#
#   tokenizer   -> input-core
#   modeling    -> pre-training
#   curriculum  -> post-training
#
# The stored records were deliberately not rewritten, which is the same decision
# config/workload-catalog.yaml's own rename table records for the four workload profiles it
# renamed, and it is made here for the same reason. A lineage record states what a run was
# submitted as, it carries a manifest_sha256 over its own bytes, and editing the team inside
# one would both falsify the record and break its digest. So an audit of anything submitted
# before this rename finds a team that is not in this file, and this table is the answer to
# why. RunManifest.team is a plain string with no lookup against these bindings, which is
# what makes those records still parse.
#
# WHAT THAT COSTS, IN FULL. Three Phase 5 records declare `tokenizer` and stay readable
# under that name. All three wrote no output, so `teams/tokenizer/` is a prefix nothing owns
# and there is nothing in S3 to move. `modeling` and `curriculum` are on no record in the
# store at all; they are on four committed manifest fixtures and two authorization fixtures,
# which keep the old names for the same reason the records do. Those six files' canonical
# bytes are digest-pinned by proof/phase-0/serialization-goldens.json, so editing one breaks
# a recorded digest and the fix is a proof-bundle regeneration rather than a fixture edit.
# tests/test_research_teams.py names the three retired ids and holds that list to exactly
# three.
#
# Nothing new can arrive under any of the three old names: the form's team field is a
# dropdown over the ids below, and tests/test_submission_form_options.py holds it to them.
#
# The other three were left alone deliberately, and leaving them is what makes the paragraph
# above a table rather than a migration. Renaming `platform` or `memory-split` would strand
# 58 records and two live S3 prefixes for no gain a reader of a cost report would notice.
#
# TWO GROUPS ARE DECLARED BEFORE ANY RUN NAMES THEM, which is the opposite direction from
# every other entry here. `eval-inference` is the six people on the AdaptiveEvals branch of
# olmo-eval-full. `scratch` is for work nobody intends to keep and that should not be costed
# against a research group; it is `scratch` rather than `sandbox` because the AWS account is
# `sbsandbox` and every resource in it is `sbsandbox-intern-edullm-*`, so the second word
# would mean two things in one sentence.
#
# `evaluation` IS A THIRD OLD NAME AND IS NOT IN THE TABLE ABOVE, because nothing was
# renamed. Two lineage records declare it, it was never a declared group, and it is not
# `eval-inference` under an earlier spelling -- the group below is being written down ahead
# of its first submission rather than after it. An audit finds `evaluation` on those two
# records and finds no group by that name, and this paragraph is the whole of the answer.
#
# MEMBER_LOGINS IS EMPTY EVERYWHERE AND THAT IS THE HONEST ANSWER RATHER THAN AN UNFINISHED
# ONE. Nothing in this repository, in the organization, or in any run record says which
# group a person belongs to. It is the one fact this file has never held. Guessing it would
# be worse than leaving it out for the reason the wandb_username comment above gives at
# length: a person filed under the wrong group is indistinguishable from one filed
# correctly, and the reader placed to notice is the person whose work was attributed
# elsewhere. Recording it is a decision for each group's lead, one line per person, and
# tools/report_onboarding_readiness.py reports whose is missing.
#
# WHAT AN EMPTY MEMBER LIST DOES AND DOES NOT COST. A claimed team is compared against a
# submitter whose own membership is recorded, and somebody with no recorded group has
# nothing to compare against: their decision record carries team_verified false, which is
# what that flag has always meant. So groups can be filled in one at a time as their leads
# confirm them, and each person's claim starts being checked the moment theirs is written
# down.
#
# NOTHING HERE CAN REFUSE A RUN ANY MORE, AND FILLING IT IN IS SAFE FOR THAT REASON.
# evaluate_authorization used to deny a mis-claimed team from inside AWS, past the approval
# gate, so the only thing a wrong entry here could buy was a lead's signature spent on a
# refusal. It denied four researchers that way before it was removed. The comparison now
# happens where it is free -- the form's `team` dropdown and `edullm check` -- and inside
# AWS it only sets team_verified.
#
# LEAD_LOGINS CARRIES ONLY WHAT IS EVIDENCED. Two are: the comment at the top of this file
# records that VS-code-cloud leads the Memory group, and every run ever submitted under
# `platform` is Frank's. The other six groups have no lead recorded anywhere, and the
# temptation to read one off the approver of their runs has to be resisted, because
# approval_scope is organization and any lead may release any group's run. pianomaster99
# released all three of the runs that claimed `tokenizer` and that is evidence about the
# gate, not about who leads input-core. A group with no lead recorded routes to nobody in
# particular, which the approver context already states in those words, and no run is
# delayed by it.
# EVERY MEMBER IS ALSO IN scratch, AND LEAVING THAT OUT WOULD HAVE BROKEN EVERY FIRST RUN.
#
# evaluate_authorization reads `membership_is_knowable = bool(teams_for_member(submitter))`.
# The comparison is per submitter, so the moment a person's membership is recorded anywhere,
# every team they claim is checked against their own roster entry, and `edullm check` refuses
# a claim they are not in with submitter_not_in_claimed_team before anything is dispatched.
#
# guides/the-platform.md tells every new person to use `scratch` for their first run, in
# those words, because it is the bin for work nobody intends to keep and costs no research
# group anything. So recording assignments without also recording everybody in scratch would
# have refused the documented first run for all thirty-five people on the day the roster
# landed -- a refusal naming a team they were told to pick.
#
# scratch therefore carries the whole roster and no lead. It is a bin, not a group: nobody
# leads it, its runs are costed against nobody, and every member may claim it.
#
# ASSIGNMENTS COME FROM THE ARCHITECTURE TEAMS SHEET, confirmed 2026-08-01. Six research
# groups, and seven people sit on two of them, which the sheet marks and this file records
# by listing them in both. Nothing here is inferred from who committed where.
#
# The seven, counted off member_logins below on 2026-08-04 and excluding scratch, which
# carries everybody: Avaneesh-Ramesh-07, GMatherne, NotAnAlgorithm, William-2357,
# alphaxia2100, nzhao721 and sidvenkatayogi. Counting lead_logins as well as member_logins
# adds VS-code-cloud, alsy7009, ericrcwu001 and philote-dev, for eleven -- a second number
# that is true of a second question, so the question is stated here rather than left to be
# re-derived. This paragraph said three until 2026-08-04; three was never right for either
# question and matched no list in this file.
#
# PRESTON LOATS WAS THE ONE NAME THIS FILE COULD NOT HOLD, AND NOW IT CAN. He is named under
# Input/Core on the sheet and owns the Co-LMLM seed annotations, and the roster is keyed on a
# GitHub login he had never supplied. `prestonloats` arrived on 2026-08-01 and he was invited
# to the organization with his team assignment in the same edit that recorded him below.
#
# His invitation was pending when this paragraph was written and is no longer. He is a member
# of the edu-llm organization as of 2026-08-04 and orgs/edu-llm/invitations is empty, so the
# GitHub half is closed: the manual workflow's Run button is shown to him. The reason the
# pending state was worth writing down still holds for the next person -- the roster is this
# platform's own record and admission reads it, so submissions are authorized from the moment
# this file names somebody, while the Run button waits on an accepted invitation, and
# tools/report_onboarding_readiness.py is where that gap shows up.
