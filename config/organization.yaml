# WHO LEADS A RESEARCH GROUP. THIS LIST IS NOT THE WHOLE OF WHO MAY RELEASE A ROUTINE RUN,
# AND READING IT AS THOUGH IT WERE IS THE MISTAKE THAT COST A DAY ON 2026-08-05.
# holds_routine_approver_role is `is_admin(login) or is_team_lead(login)`, so the approvers
# are `admins` above and this list together. policy.yaml sets approval_scope to
# organization, so every one of them can release any team's routine submission. A name that
# has left is therefore a live approval authority, and an approver who is absent cannot
# release their own group's work.
#
# THIS LIST IS EXACTLY THE UNION OF team_bindings' lead_logins, AND A TEST HOLDS IT THERE.
# tests/test_inventory.py fails a name here who leads no group, and fails a group naming a
# lead who is not here. So a name is added to this list by giving somebody a group to lead,
# and not by wanting them to be able to approve. Somebody who should approve without leading
# a group goes in `admins`, which is where BritishAmericqn already is.
#
# VS-code-cloud replaced syz2026 as the Memory group's lead. Both halves of that mattered:
# a Memory submission routed to its own lead was refused because the lead was not on this
# list, and someone who leads no group could release anyone's routine run because they
# still were. syz2026 stays in members below -- leaving the organization is a separate fact
# from ceasing to lead a group, and this file has not been told the first one.
#
# The GitHub `team-leads` team gates the run-approval-lead environment and is what actually
# stops a job. It is not in this repository and does not follow this edit; changing it is an
# owner action in the organization settings. can_admins_bypass is false on that environment,
# so membership of the team is the whole of what opens it. Being an admin here does not.
#
# WHAT THAT TEAM MUST CONTAIN IS `admins` PLUS THIS LIST, NOT THIS LIST. Nine logins, not
# eight. An admin who is not on the team is somebody admission accepts as a routine approver
# and the lead gate will never ask, and a login on the team who is in neither list opens the
# gate and is then refused by admission with approver_lacks_lead_or_admin_role, which spends
# an approval on a no.
#
# Both went wrong at once for two days ending 2026-07-30, when this list dropped syz2026 for
# VS-code-cloud and the GitHub team was not told.
#
# DO NOT RE-CHECK THIS BY HAND AND DO NOT RECORD THE RESULT HERE. That is what the two
# comments this replaces did, on 2026-07-30 and again on 2026-08-04, and both were false
# before anybody read them: BritishAmericqn was added to the GitHub team some time after
# 2026-07-31 and neither hand-check saw it. A date in a comment records that somebody looked
# once. It cannot say the answer is still true, and it is cited later as though it could.
#
# What checks it is fixtures/evidence/phase-2/github/lead-team.sanitized.json, a committed
# capture of the team compared against `admins` plus this list in both directions by
# tests/test_phase2_github_evidence.py. The capture expires after thirty days and then
# refuses to load, which turns the suite red until somebody re-captures. That expiry is the
# only thing that forces the question to be asked again, and thirty days is how long the
# ninth member went unnoticed. Re-capture with:
#
#   uv run python tools/capture_phase2_evidence.py --target lead-team \
#     --output-dir docs-frank/working/phase-2-evidence
#
# then copy the file into fixtures/evidence/phase-2/github/ and read the diff.
#
# A scheduled check would be better and cannot be had. Reading orgs/edu-llm/teams/team-leads/
# members needs the Members organization permission, the Actions GITHUB_TOKEN has no
# organization permissions at all, and a stored PAT would be a repository secret that
# test_the_repository_holds_no_secret_a_branch_could_read forbids by name. The audit log
# would date a change and answers 404 on this organization's free plan.
