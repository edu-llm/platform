      wandb_entity: eduLLM
# WHOSE NAME GOES ON A RUN IN WEIGHTS AND BIASES, AND WHY MOST OF THESE ARE BLANK.
#
# The platform logs with a team service account rather than with any person's key, so every
# run would otherwise appear authored by the platform itself. W&B's remedy is WANDB_USERNAME,
# which names a human author -- and it works only when that account belongs to the service
# account's parent team. When it does not, W&B does not complain: the run simply logs as the
# service account, which is indistinguishable from having sent no attribution at all.
#
# That silence is why a wandb_username here is only ever a login read out of the eduLLM
# team's own member list and matched to this file on display_name. A plausible-looking guess
# buys nothing and costs the one thing this mapping exists to provide, because a run
# attributed to the wrong person looks exactly like a correctly attributed one and the only
# reader placed to notice is the person who did not run it. The contract refuses two members
# claiming one account for the same reason.
#
# Absent here means the run logs unattributed, which is a whole run that works. The compile
# job says so in the approver context before a lead is asked to release it, so the gap is
# something a person sees rather than something they find afterwards in W&B.
#
# THE ONE THAT MATTERS AND IS BLANK. aryanjverma submitted both of the runs Phase 5 rests on
# and has no account in the eduLLM team, so nothing here can attribute him. Adding him to the
# W&B team is an owner action in W&B and does not follow this file.
#
# Re-derived by matching display_name against the team roster:
#
#   {entity(name:"eduLLM"){members{username name accountType}}}
