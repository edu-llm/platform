# WHOSE NAME GOES ON A RUN IN WEIGHTS AND BIASES, AND WHY FIVE OF THESE ARE BLANK.
#
# The platform logs with a team service account rather than with any person's key, so every
# run would otherwise appear authored by the platform itself. W&B's remedy is WANDB_USERNAME,
# which names a human author -- and it works only when that account belongs to the service
# account's parent team. When it does not, W&B does not complain: the run simply logs as the
# service account, which is indistinguishable from having sent no attribution at all.
#
# That silence is why a wandb_username here is only ever a login read out of the eduLLM
# team's own member list and matched to this file on display_name. A plausible-looking guess
# buys nothing and costs the one thing this mapping exists to provide, because a run
# attributed to the wrong person looks exactly like a correctly attributed one and the only
# reader placed to notice is the person who did not run it. The contract refuses two members
# claiming one account for the same reason.
#
# Absent here means the run logs unattributed, which is a whole run that works. The compile
# job says so in the approver context before a lead is asked to release it, so the gap is
# something a person sees rather than something they find afterwards in W&B.
#
# THE ONE THAT MATTERED IS NO LONGER BLANK. aryanjverma submitted both of the runs Phase 5
# rests on and this file recorded that he had no account in the eduLLM team, which had stopped
# being true: the entity holds `aryan-jaden-verma` under `Aryan Verma`, an exact match on the
# display name, and it is recorded below. Nothing was done in W&B to make that so, which is
# the point worth keeping: the gap was in this file rather than in the team.
#
# FIVE PEOPLE HAVE NO W&B ACCOUNT AT ALL, and a blank is the only true answer for them. The
# entity holds 31 members as of 2026-08-04, one of which is the platform's own service
# account, so 30 human accounts against 35 roster entries. Benjamin Royston, Arthur Xu, Iris
# Cai, Yuen Kai Chow and Adarsh Rajesh are the five the member list does not contain under
# any spelling.
#
# Two names moved on 2026-08-04 and both were re-checked rather than assumed. `preston-loats`
# now exists under the display name `Preston Loats`, an equality rather than a near-match, so
# the blank this file carried for him is filled in below. `eve-alpha` exists under the display
# name `eve`, which is a first-name prefix of `Eve Feng` and is exactly the kind of match this
# comment refuses on its own -- so it was left blank until the owner confirmed it, which he did
# later the same day. It is recorded below with that confirmation named beside it, the same
# treatment zsophiaaa, meric233 and ericrcwu001 already have, so that the next reader does not
# re-open a question the prefix rule would otherwise re-raise every time.
#
# Adding somebody to the W&B team is an owner action in W&B and does not follow this file, so
# their runs log as the service account until that happens. All 30 human accounts are now
# claimed by exactly one roster entry, and no account is claimed twice.
#
# NOTHING HERE IS READ OFF WHO RAN WHAT, and the member list is the only source. A run through
# the shared cluster carries whichever key was on the node, so `eric-gpu-access-smoke` was
# requested by ericrcwu001 and is logged under `amy-lin-alpha-ai`. Reading an attribution back
# out of a run would therefore record the node's key as the author.
#
# Re-derived by matching display_name against the team roster, on 2026-08-01:
