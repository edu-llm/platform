      # SAME SHAPE AS THE MISMATCH: THE BUDGET LINE TRAVELS ON THE ACTIVITY PAGE. The audit runs
      # `tools/report_activity.py`, which imports `spend_section` out of `tools/report_spend.py`
      # and prints the day's figure. `no workflow calls it` was reading the absence of a job
