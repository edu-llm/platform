      # THE MISMATCH GOES LIVE THROUGH THE ACTIVITY PAGE RATHER THAN THROUGH A JOB OF ITS OWN,
      # WHICH IS WHY `no workflow runs it` READ FALSE FOR A THING THAT RUNS EVERY MORNING. The
      # audit's `activity-history` job runs `tools/report_activity.py`, and that module imports
      # `edullm_platform.mismatch` and prints the mismatch arm on the page. The grep names the
      # import line rather than the word, because the word appears in four comments in that file
      # and a rule that a comment can satisfy is a rule that cannot fail.
      - id: mismatch-list
        name: The mismatch list, and the denominator it prints
        designed: {reached: overview draws it}
        planned: {task: the-instruments/3}
