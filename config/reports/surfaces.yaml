        name: Deployed IAM matching the tree
        designed: {not_applicable: an operational property}
        planned: {not_applicable: predates the plans}
        built: {exists: tools/verify_deployed_stacks.py}
        # NAMES THE JOB THAT RUNS IT RATHER THAN THE FILE THE JOB IS IN. A bare `on_main` over
        # `audit.yml` was true of every job in that workflow at once, so this cell and
        # `visibility-board`'s were mutually implied and deleting either job would have moved
