        under_test: {tests: [tests/test_registered_dockerfiles.py]}

      # THE EXEMPTION CANNOT BE WRITTEN WHERE PEOPLE KEEP LOOKING FOR IT. `NotPrincipal` is
      # only valid in a resource policy or a service control policy, and a permission boundary
      # is neither, so its absence here is not an oversight somebody can correct in place. An
      # exemption would have to be a condition on `aws:PrincipalArn`, and read on 2026-08-06
      # the statement `DenyCostCommitmentPurchases` carries no condition at all over ten
      # purchase actions on `Resource: "*"`. The owner's own role carries this boundary, so as
      # deployed the deny binds him too and the name of this row overstates what is there.
      - id: commitment-deny
        name: Commitment purchases denied, with one exemption
        designed: {reached: overview draws it}
        planned: {not_applicable: another owner's policy}
        built: {not_applicable: another owner's policy}
        deployed: {reached: the deny is in the boundary}
        under_test: {not_reached: "the deny is unconditional, so nobody is exempt"}

      # THIS ONE IS STILL UNKNOWN AND THE REASON IS SHARPER THAN A MISSING GRANT. Every
      # `organizations` call from here returns AccessDenied, and adding a grant would not
