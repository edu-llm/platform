# Every surface the platform is supposed to have, and how a command answers what stage it is at.
#
# WHY THIS FILE EXISTS. A per-component stage table is the one view of this work that shows a
# thing moving, and the previous one died the way hand-maintained tables die: it went stale, an
# agent rewrote it, and the rewrite silently lost rows. This file is the half of that table a
# machine cannot work out on its own, which is what each row *is* and where to look for it. The
# stage itself is not written here. `tools/scoreboard.py --stages` runs the lookups and prints
# what it found, and a lookup it cannot run prints as not read rather than as a stage.
#
# THE FIVE STAGES, AND WHAT EACH ONE HONESTLY MEANS.
#
#   designed   a paragraph in the end-state overview describes this surface. That document is
#              not in this repository, so this column is a person's answer with the `checked`
#              date below carried beside it. It is the only column that is manual everywhere.
#   planned    a task in a plan builds it. Derived when `--plans-dir` is passed, from the task
#              id named here. Without that argument the column reads not read.
#   built      the module, template, workflow or config exists in the tree.
#   deployed   it is live: a stack the account holds in a status that means a template was
#              applied, a GitHub environment, a release, a bucket, or a file on the default
#              branch for the things that go live by merging. Needs AWS or `gh` for most rows.
#   proven     something that can fail asserts it, or a real artifact demonstrates it. A row
#              with no such thing says so. `proven` is never inferred from `built`.
#
# HOW TO WRITE A STAGE. Each stage takes one of these. Every key is a lookup except the last
# four, which are a person speaking and are printed with a `*` so a reader can tell.
#
#   {exists: <path>}            or a list of paths, all of which must exist in the tree
#   {on_main: <path>}           the path is on the default branch, which is what "live" means
#                               for a workflow, a skill or an issue template
#   {grep: [<path>, <regex>]}   the file contains the pattern
#   {absent: [<dir>, <regex>]}  the pattern appears nowhere under the directory
#   {tests: [<path>, ...]}      each test file exists and pytest collects it today
#   {evidence: <path>}          a committed capture of something that actually ran
#   {stack: <name>}             CloudFormation holds it in a status meaning a template applied
#   {bucket: <name>}            the bucket exists
#   {environment: <name>}       the GitHub environment exists
#   {release: true}             this repository has published a release
#   {task: <plan-stem>/<id>}    a plan carries that task
#   {not_applicable: <short reason>}       the stage does not apply, and why in a few words
#   {reached: <short reason>}       a person checked and it holds
#   {not_reached: <short reason>}        a person checked and it does not
#   {unknown: <what settles it>} nobody can currently answer, and what would
#
# A lookup may carry `or:` holding one of the last four. It records what somebody last believed
# about a row whose lookup needs a credential most runs do not have. IT IS NOT AN ANSWER AND IT
# IS NOT COUNTED. Until 2026-08-06 it was substituted for the lookup whenever the lookup could
# not run, so a throttled or unauthenticated run promoted twelve opinions into the `deployed`
# tally and reported no unread rows where it had read nothing at all. Now the cell reads
# `not read` either way and the standing answer travels in the note, because a board that
# answers from memory under load reads best exactly when it knows least.
#
# ADDING A ROW. Put it in the slice that owns it, give it a lookup rather than an answer, and
# if you cannot give it a lookup say so in the stage itself. A row nobody can move is still
# worth carrying, because a row that has read `no` for a fortnight is the file doing its job.

schema_version: 1

#: When a person last worked through the columns no command can answer. Every `*` on the board
#: carries this date. Move it only after actually re-reading them.
checked: "2026-08-05"

