      # agent was briefed to write a Dockerfile over one that had existed for a day.
      #
      # THE DEFECT WAS THE SHAPE RATHER THAN THE WORDING. Every other cell in this file is a
      # rule something evaluates; these two were prose, and prose about a tree this repository
      # does not own has no mechanism that can ever falsify it. So they are rules now, and
      # `under_test` points at the check rather than at a state: the daily
      # `registered-dockerfiles` job re-asks whether this registration still describes the
      # repository it names, which is the strongest thing anything here can hold about another
      # repository and is deliberately weaker than "an image exists". Whether one does is an
      # ECR question needing an AWS credential no pull-request path holds, and it is not
      # restated here in words, because a word is what went stale.
      - id: register-open-instruct
