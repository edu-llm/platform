        deployed: {grep: [tools/report_activity.py, "from report_spend import"]}
        under_test: {tests: [tests/test_spend.py]}

      # THIS ROW READ `yes` TWICE FOR A SURFACE THAT DOES NOT EXIST, WHICH IS THE FALSE NEGATIVE
      # INVERTED AND IS WORSE. `built` pointed at `notifications/messages.py` and `under test` at
      # `tests/test_notification_messages.py`, and both of those are the run-ended post, which
      # is a different surface with its own row under "Owned by no slice". That file holds
      # `render_run_ended` and nothing else. The plan that specifies this row names
      # `src/edullm_platform/morning_message.py` and `tests/test_morning_message.py`, and
