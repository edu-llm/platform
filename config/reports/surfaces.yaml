      # `nothing collects` ON ALL THREE STAGES WAS THE LARGEST SINGLE FALSEHOOD ON THIS BOARD.
      # `tools/read_substrate.py` is the collector this row names -- its own first line is
      # "Every account read the instruments need, in one place, degrading one source at a
