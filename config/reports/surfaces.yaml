      # BOTH STAGES READ `?` UNTIL 2026-08-06 AND THE ANSWER WAS ONE READABLE CALL AWAY. The
      # question was sent to `aws organizations list-policies-for-target`, which this account
      # cannot make, and nobody tried the boundary. `InternSandboxBoundary` v5 carries a
      # statement `RegionLockExceptGlobalServices`: a Deny over `NotAction` of sixteen global
      # services, conditioned on `aws:RequestedRegion` not being one of us-east-1 or us-east-2.
      # Every principal in this account carries that boundary, so that is the lock as far as
      # anything here is bound by it.
      #
      # READ THE SECOND REGION IN THAT LIST BEFORE TRUSTING AN EMPTY LISTING. us-east-2 is
      # permitted, so a call sent there is answered rather than refused, and it answers with
      # nothing because every stack is in us-east-1. That is the whole of the 30 of 55 reading
      # on the morning of 2026-08-06. A denied region would have been caught in a second.
      #
      # WHAT IS STILL UNSEEN is whether a service control policy above this says the same
      # thing. It would not change what any principal here may do, and `proven` stays no until
      # somebody in the payer account can look.
      - id: region-lock
