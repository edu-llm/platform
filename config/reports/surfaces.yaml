# Every surface the platform is supposed to have, and how a command answers what stage it is at.
#
# WHY THIS FILE EXISTS. A per-component stage table is the one view of this work that shows a
# thing moving, and the previous one died the way hand-maintained tables die: it went stale, an
# agent rewrote it, and the rewrite silently lost rows. This file is the half of that table a
# machine cannot work out on its own, which is what each row *is* and where to look for it. The
# stage itself is not written here. `tools/scoreboard.py --stages` runs the lookups and prints
# what it found, and a lookup it cannot run prints as not read rather than as a stage.
#
# THE FIVE STAGES, AND WHAT EACH ONE HONESTLY MEANS.
#
#   designed   a paragraph in the end-state overview describes this surface. That document is
#              not in this repository, so this column is a person's answer with the `checked`
#              date below carried beside it. It is the only column that is manual everywhere.
#   planned    a task in a plan builds it. Derived when `--plans-dir` is passed, from the task
#              id named here. Without that argument the column reads not read.
#   built      the module, template, workflow or config exists in the tree.
#   deployed   it is live: a stack the account holds in a status that means a template was
#              applied, a GitHub environment, a release, a bucket, or a file on the default
#              branch for the things that go live by merging. Needs AWS or `gh` for most rows.
#   under_test something that can fail asserts it, or a real artifact demonstrates it. A row
#              with no such thing says so. Never inferred from `built`.
#
#              THIS COLUMN WAS CALLED `proven` UNTIL 2026-08-06 AND THE RENAME IS THE POINT.
#              Where the cell is a `tests:` lookup, and it is on fifty-one of the ninety-six
#              rows, what is read is that the file exists, imports, and yielded at least one
#              test to the collector. Collection is not execution, so that reading is
#              compatible with every test in the file failing, and with every test in it being
#              skipped. `proven` claimed something a board reading files and cloud APIs cannot
#              establish at any budget. Do not rename it back, and do not write a `reached:`
#              here meaning "I am confident" -- a person's answer belongs in this column only
#              where a real artifact is being pointed at, which is why the ten that carry one
#              name a run id, a count or a refusal that happened.
#
#              What would make it stronger, what is deliberately not being attempted, and why,
#              is written in `_tests` in `src/edullm_platform/stages.py`. Read that before
#              proposing either.
#
# HOW TO WRITE A STAGE. Each stage takes one of these. Every key is a lookup except the last
# four, which are a person speaking and are printed with a `*` so a reader can tell.
#
#   {exists: <path>}            or a list of paths, all of which must exist in the tree
#   {on_main: <path>}           the path is on the default branch, which is what "live" means
#                               for a workflow, a skill or an issue template
#   {grep: [<path>, <regex>]}   the file contains the pattern
#   {grep_on_main: [<path>, <regex>]}
#                               the copy of the file on the default branch contains the pattern.
#                               Use this rather than `on_main` wherever a row is a feature inside
#                               a file another row owns: `on_main` answers yes as soon as the file
#                               is there and goes on saying yes when the feature is taken out of
#                               it. Costs one `git show` per path named, so `on_main` stays the
#                               rule for a row that is the whole file.
#   {absent: [<dir>, <regex>]}  the pattern appears nowhere under the directory
#   {tests: [<path>, ...]}      each test file exists and pytest collects it today
#   {evidence: <path>}          a committed capture of something that actually ran
#   {stack: <name>}             CloudFormation holds it in a status meaning a template applied
#   {bucket: <name>}            the bucket exists
#   {environment: <name>}       the GitHub environment exists
#   {release: true}             this repository has published a release
#   {task: <plan-stem>/<id>}    a plan carries that task
#   {not_applicable: <short reason>}       the stage does not apply, and why in a few words
#   {reached: <short reason>}       a person checked and it holds
#   {not_reached: <short reason>}        a person checked and it does not
#   {unknown: <what settles it>} nobody can currently answer, and what would
#
# A lookup may carry `or:` holding one of the last four. It records what somebody last believed
# about a row whose lookup needs a credential most runs do not have. IT IS NOT AN ANSWER AND IT
# IS NOT COUNTED. Until 2026-08-06 it was substituted for the lookup whenever the lookup could
# not run, so a throttled or unauthenticated run promoted twelve opinions into the `deployed`
# tally and reported no unread rows where it had read nothing at all. Now the cell reads
# `not read` either way and the standing answer travels in the note, because a board that
# answers from memory under load reads best exactly when it knows least.
#
# ADDING A ROW. Put it in the slice that owns it, give it a lookup rather than an answer, and
# if you cannot give it a lookup say so in the stage itself. A row nobody can move is still
# worth carrying, because a row that has read `no` for a fortnight is the file doing its job.

schema_version: 1

#: When a person last worked through the columns no command can answer. Every `*` on the board
#: carries this date. Move it only after actually re-reading them.
checked: "2026-08-05"

# EVERY PLACE ONE ROW'S CELL CANNOT BE RED WHILE ANOTHER ROW'S IS GREEN, WRITTEN DOWN BECAUSE A
# TEST WILL NOT LET IT GO UNDECLARED.
#
# WHAT WENT WRONG THAT THIS PREVENTS. `morning-message` read `yes` on `built` and on `under test` for
# a surface that has never been written. Its two cells named
# `src/edullm_platform/notifications/messages.py` and `tests/test_notification_messages.py`, and
# both of those belong to the run-ended feed post -- a different surface, with its own row, under
# "Owned by no slice". One built thing was counted twice and an unbuilt one was reported as built
# and under test, for as long as anybody had been reading this board. `tests/test_stages.py` already
# refused a manifest naming a path that does not exist, and that guard cannot catch this, because
# every path named was real. It was the wrong row's paths, and nothing looked at that. A person
# reading the file found it.
#
# THE INVARIANT: NO CELL MAY BE IMPLIED BY ANOTHER ROW'S CELL AT THE SAME STAGE. If row A's
# reading is guaranteed true whenever row B's is, then A can never be red while B is green, and A
# is resting on B's artifact rather than on its own. That is exactly what `morning-message` was
# doing in both directions -- `exists: messages.py` is implied by the run-ended post's
# `grep: [messages.py, "def render_run_ended"]`, and `tests: [test_notification_messages.py]` is
# implied by that row's larger test set.
#
# THE FIRST VERSION OF THE TEST ASKED FOR EQUALITY AND THE MUTATION KILLED IT. Restoring
# `morning-message` to what it read before the fix left the test green, because neither of its
# cells was character-for-character identical to the run-ended post's -- one was weaker by a
# pattern and the other by a set. Implication is the relation that matters and equality is only
# its special case. Worth knowing before somebody simplifies this back.
#
# WHY IMPLICATION AND NOT SHARING. Nineteen paths in this file are named by more than one row and
# almost all of that is honest, so the line cannot be at the path. `capacity-yaml` asserting that
# `capacity.yaml` exists is implied by `control-plane` asserting that all nine config files do,
# and that is fine: `capacity-yaml` is checking its own file and earns its green whether or not
# the roll-up above it passes. Nothing is wrong with being implied; what the test does is force
# somebody to say which kind of implication this is. Every entry below is a case where the answer
# is "the same fact, honestly, and here is why". `morning-message` was the case where the answer
# would have had to be "because I pointed at another surface's files", which nobody would write.
#
# WHY A DECLARATION RATHER THAN A LENIENT TEST. Five of these are one test file proving two
# surfaces, which is normal and which a plan task explicitly asked for in one case. A test that
# quietly exempted every `tests:` overlap would be simpler and would hide a real limit on what
# this board knows. Written down it is a limit somebody can read and argue with; exempted in code
# it is a leniency nobody sees. The block ratchets both ways -- an undeclared implication is red,
# and so is an entry whose implication has stopped existing -- so a fix has to delete its entry.
#
# WHAT IS OUT OF SCOPE, AND SAID HERE RATHER THAN LEFT TO BE INFERRED FROM THE TEST. Only
# `built`, `deployed` and `under test` are checked. `designed` is a person's answer in every row by
# construction and `planned` is a claim about a plan, where two surfaces built by one task is the
# ordinary case. `release: true` is not checked either: it names nothing, is one global fact about
# the repository, and is shared by six rows because CLI features go live by being released. That
# is the deployment model, not a collision, and an entry listing those six would churn without
# telling anybody anything.
shared_readings:
  - stage: built
    rows:
      - control-plane
      - approval-tiers
      - capacity-yaml
      - datasets-yaml
      - image-exceptions
      - nine-approvers
      - priced-profiles
      - repository-pipeline
    why: >
      `control-plane` is a roll-up: its `built` is the conjunction of the nine configuration
      files, seven of which have a row of their own. Each of those seven checks its own file and
      is red the moment that file goes, so none of them is resting on the roll-up. What is true is
      the reverse -- the roll-up can never be green while any of them is red -- and that is the
      arithmetic of a conjunction rather than a borrowed reading.
  - stage: built
    rows: [identity-table, preview-role-excluded]
    why: >
      The exclusion is a field inside the identity table, so `bindings.py` existing is the weaker
      claim and it belongs to the table's own row. The two are told apart by the grep for
      `Excluded`, which goes red if the exclusion is removed while the file stays.
  - stage: built
    rows: [submission-manifest, input-roles]
    why: >
      Same shape: the input roles are a field of the submission manifest, and `manifest.py`
      existing is the manifest's own claim rather than the field's. The field's row greps for what
      it adds.
  - stage: built
    rows: [submission-workflow, approver-name]
    why: >
      The approver's name is a feature inside the submission workflow, so the workflow file
      existing is the workflow's claim. `approver-name` greps it for `approv`, which is what tells
      the two apart in the tree.
  - stage: built
    rows: [repository-pipeline, register-open-instruct]
    why: >
      `config/repositories.yaml` existing is the pipeline's claim; registering one particular
      codebase in it is a grep for that codebase's id, which goes red if the entry is removed.
  # TWO ENTRIES USED TO SIT HERE AND THEY ARE GONE BECAUSE THE THING THEY EXCUSED IS FIXED.
  # `approver-name` against `submission-workflow`, and `deployed-iam-matches` against
  # `visibility-board`, were the only two entries in this block that named a cost instead of
  # excusing one: all four cells were a bare `on_main` over a file another row owns, so each pair
  # was mutually implied and neither cell could go red on its own. The cost was live in the worst
  # possible file -- revert the lines in `submit-run.yml` that read the approver's login, push,
  # and `approver-name` went on reading deployed, in the file the admission role pins its trust
  # to. `grep_on_main` is the rule that closes it, all four cells now name what they are actually
  # about, no implication remains between them, and the entries had to go rather than be reworded,
  # because `test_a_shared_reading_declaration_that_stopped_being_true_is_deleted` refuses an
  # entry whose implication has stopped existing.
  - stage: deployed
    rows: [delivery, run-ended-post]
    why: >
      One template deploys both: the topic and subscription that address an event, and the Lambda
      that renders the line an ended run posts. They deploy together or not at all, so one stack
      reading is the truth about both. Their `built` cells are a module and a grep for
      `def render_run_ended`, which do tell them apart.
  - stage: deployed
    rows: [eval-metrics, lifecycle-path]
    why: >
      Same shape. The EventBridge rule, the queue and the recorder are one template, and the
      recorder is what writes eval metrics into a result manifest, so there is no state in which
      one of these is deployed and the other is not.
  - stage: deployed
    rows: [instance-allow-list, researcher-role]
    why: >
      The allow-list is a condition inside the researcher role's policy, so it deploys when the
      role does and cannot deploy separately. Worth a second look if the allow-list ever moves
      out of the role, because the shared reading would stop being true and this entry would go.
  - stage: deployed
    rows: [nine-approvers, roster-agreement]
    why: >
      Both rows are about one GitHub environment from two sides -- who the approvers are, and
      whether the roster and the team agree about them -- so the environment existing is the same
      fact for each. What each row adds is in its `built` and `under test`, which differ in both.
  - stage: under_test
    rows: [identity-table, preview-role-excluded]
    why: >
      One test file covering both, by instruction rather than by accident: the plan task that
      built the preview-role exclusion said to append to the identity table's existing test file.
      Splitting a test file so a board can tell two rows apart would be the measurement deforming
      the thing measured, which is worse than the limit it removes.
  - stage: under_test
    rows: [estimate-and-bound, priced-profiles]
    why: >
      The priced catalogue and the arithmetic performed over it are tested together because
      neither is meaningful alone -- a bound is computed from a profile's price, and a profile with
      no bound is not submittable. `estimate-and-bound` reads `no` on `built` regardless, so this
      shared cell is not currently holding a row green on its own.
  - stage: under_test
    rows: [registration-skill, skills-three-hosts]
    why: >
      The agent layer is two skills and the three host files that carry them, and the test that
      proves either proves it by reading the same set of files. Two test files here would
      duplicate the fixtures rather than assert anything new.
  - stage: under_test
    rows: [datasets-yaml, model-family]
    why: >
      `tests/test_published_dataset_reference.py` asserts the reference every published dataset
      carries, and a model family is identified by the dataset it was trained on, so the same
      assertions cover both. `datasets-yaml` names a second file beside it, which is what keeps
      the implication one-way.

slices:
  - name: The spine
    surfaces:
      - id: submission-workflow
        name: The submission workflow, and the credential it holds
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: .github/workflows/submit-run.yml}
        # THE CREDENTIAL IS HALF THIS ROW'S NAME, SO IT IS WHAT THE DEPLOYED CELL LOOKS FOR. A
        # bare `on_main` over this file answered yes for the file's presence, which the row above
        # `built` already says, and it left this cell and `approver-name`'s mutually implied so
        # neither could go red alone. `role-to-assume:` is the credential, appears twice, and both
        # are the functional lines that hand a job its role -- no comment can satisfy it.
        deployed: {grep_on_main: [.github/workflows/submit-run.yml, "role-to-assume:"]}
        under_test: {tests: [tests/test_phase2_submit_run_workflow.py]}

      - id: submission-manifest
        name: A submission is three decisions, and the manifest that records them
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: src/edullm_platform/contracts/manifest.py}
        deployed: {not_applicable: a contract model}
        under_test: {tests: [tests/test_manifest.py]}

      - id: approval-tiers
        name: Approval tiers and routing
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: config/policy.yaml}
        deployed:
          {stack: sbsandbox-intern-edullm-phase2-admission, or: {reached: policy v5 released in 270}}
        under_test: {tests: [tests/test_policy.py]}

      - id: nine-approvers
        name: The approvers, and the gate they hold
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: config/organization.yaml}
        deployed: {environment: run-approval-lead}
        under_test: {tests: [tests/test_phase5_run_evidence.py]}

      - id: approver-name
        name: The approver's name, asserted and carried
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {grep: [.github/workflows/submit-run.yml, "approv"]}
        # THE REGRESSION THIS CLOSES WAS LIVE AND IT WAS IN THE WORST FILE TO HAVE ONE IN. This
        # cell was `on_main: .github/workflows/submit-run.yml`, which is true whenever that file is
        # on the branch. Revert the lines that read the approver's login, push, and the row went on
        # reading deployed -- in the file `InternSandboxBoundary` pins the admission role's trust
        # to. It was also mutually implied by `submission-workflow`'s identical cell, so neither
        # could go red on its own.
        #
        # THE PATTERN IS THE jq THAT READS THE APPROVER RATHER THAN THE WORD `approv`. The word
        # appears in nine comments in this workflow and `built` uses it, which is loose enough that
        # a comment satisfies it; that is a separate weakness and it is named in the pull request
        # rather than fixed here. `select(.state == "approved")` occurs once, on the line that
        # actually pulls the approving login out of the approvals API, and there is no way to
        # delete the assertion and keep the pattern.
        deployed:
          {grep_on_main: [.github/workflows/submit-run.yml, "select\\(\\.state == \"approved\"\\)"]}
        under_test: {tests: [tests/test_authorization.py, tests/test_phase2_admission.py]}

      - id: platform-tier
        name: The platform tier, a container on Batch on a digest-pinned image
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: infra/batch-compute.yaml}
        deployed: {stack: sbsandbox-intern-edullm-phase3-batch, or: {reached: queue ran a job}}
        under_test: {tests: [tests/test_phase3_infrastructure.py]}

      - id: priced-profiles
        name: The priced profiles, and what is actually submittable
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: config/execution-targets.yaml}
        deployed: {not_applicable: a priced catalogue}
        under_test: {tests: [tests/test_compute_profiles.py]}

      - id: landing
        name: LANDING, and the fourteen-day expiry on it
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {not_applicable: another repository}
        deployed: {bucket: edullm-landing, or: {reached: holds 125 GB expiring 2026-08-13}}
        under_test: {reached: 47 validation sentinels written by the airlock}

      - id: sealed
        name: SEALED, and the delete latch over it
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {not_applicable: another repository}
        deployed: {bucket: edullm-data, or: {reached: eight datasets sealed}}
        under_test: {reached: the latch refused a delete}

      - id: airlock
        name: The airlock validator, and _VALIDATED.json
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {not_applicable: another repository}
        deployed: {reached: it runs on upload}
        under_test: {reached: sentinels exist for every sealed set}

      - id: datasets-yaml
        name: datasets.yaml, the act that makes a corpus real
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: config/datasets.yaml}
        deployed: {not_applicable: a config file}
        under_test: {tests: [tests/test_published_dataset_reference.py, tests/test_dataset.py]}

      - id: outputs
        name: OUTPUTS, one prefix per run
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: infra/outputs-bucket.yaml}
        deployed: {stack: sbsandbox-intern-edullm-phase3-outputs, or: {reached: runs wrote into it}}
        under_test: {reached: the probe's outputs are under it}

      - id: lineage
        name: The lineage store
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: infra/lineage-bucket.yaml}
        deployed: {stack: sbsandbox-intern-edullm-phase2-lineage, or: {reached: manifests are in it}}
        under_test: {reached: every admitted run left a manifest}

      - id: lifecycle-path
        name: The lifecycle path, EventBridge to SQS to the recorder
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built: {exists: infra/batch-events.yaml}
        deployed: {stack: sbsandbox-intern-edullm-phase3-events, or: {reached: the recorder is live}}
        under_test: {tests: [tests/test_deployed_lambdas.py]}

      # IT READ `eight` AND CHECKED EIGHT UNTIL 2026-08-06, WHICH IS THE ROLL-UP QUIETLY
      # COVERING LESS THAN ITS NAME. `config/accelerators.yaml` landed in #351, the overview
      # names nine control-plane files now, and this row went on asserting the other eight --
      # so the one file a reader would most expect a new roll-up to catch was the one outside
      # it. The count in the name is the count in the list, and both move together or this is
      # a row that says nine and checks eight.
      - id: control-plane
        name: The nine configuration files as the control plane
        designed: {reached: overview draws it}
        planned: {not_applicable: predates the plans}
        built:
          exists:
            - config/accelerators.yaml
            - config/capacity.yaml
            - config/datasets.yaml
            - config/execution-targets.yaml
            - config/image-exceptions.yaml
            - config/organization.yaml
            - config/policy.yaml
            - config/repositories.yaml
            - config/workload-catalog.yaml
        deployed: {not_applicable: config files}
        under_test: {tests: [tests/test_config.py]}

      # THIS ROW READ `Nothing anywhere may stop a run for cost` AND PROVED IT, WHICH IS THE
      # worst shape a row in this file can take. Its `proven` lookup was
      # `{absent: [infra, "AlarmActions|budgets:"]}`: green exactly while no cost control
      # existed, and red the day somebody built one. So the board reported a gap as a
      # property, and the one reader who most needed to see it -- the owner, on the morning
      # of thirty-five onboardings -- was shown a tick.
      #
      # What made it a finding rather than a decision is what the absence was measured
      # against. The sixteen enabled Batch compute environments are all on-demand EC2, so the
      # catalogue's rates are the rates, and the profiles a submission may actually name
      # total $685.35 an hour saturated against a $5,000 monthly limit. 7.3 hours. Read
      # 2026-08-06 and unchanged since.
      #
      # IT IS SPLIT IN TWO BECAUSE TWO DIFFERENT THINGS WERE FOLDED INTO ONE SENTENCE. One
      # of them is a real property that is still true and is still wanted, and it is the row
      # below. The other was a hole, and it is this one.
      - id: unattended-spend-bound
        name: A bound on what a day commits with nobody asked
        designed: {reached: overview draws it}
        planned: {not_reached: built against a red team reading rather than a plan}
        built: {exists: src/edullm_platform/daily_ceiling.py}
        # THE GREP READS THE VALUE AND NOT THE FILE, AND THAT IS THE WHOLE OF THE LOOKUP.
        # automatic_daily_ceiling_usd is optional, and a policy carrying no value for it
        # classifies exactly as v5 did. So `on_main: config/policy.yaml` would go green on a
        # platform where the mechanism was switched off, which is precisely the reading the
        # row this replaced was giving.
        deployed: {grep: [config/policy.yaml, "^  automatic_daily_ceiling_usd:"]}
        under_test: {tests: [tests/test_daily_ceiling.py, tests/test_compile_submission_cli.py]}

      # THE HALF OF THE OLD ROW THAT WAS TRUE AND IS KEPT ON PURPOSE. Nothing in this account
      # kills a container, drains a queue or detaches a policy because of money, and nothing
      # here should: a training run stopped at hour six to protect a forecast destroys more
      # than it saves. The bound above cannot reach a running job -- it is consulted once, in
      # a job with no AWS credential, before a gate is chosen -- and this row is what would
      # notice if something acquired that reach.
      #
      # It is still an absence and it is still proven by one, so it carries the same weakness
      # every absence-proof does: it goes red when somebody builds the thing. That is correct
      # here and was not correct above, and the difference is which way round the desirable
      # state sits. Red on this row means a budget action or an alarm action now exists in
      # infra/ and somebody has to say whether it may stop a job.
      #
      # THE PATTERN CARRIED DOWN FROM THE OLD ROW AND IS WORTH KEEPING THE HISTORY OF. It used
      # to be `AlarmActions|budgets:`, which was a proxy: when it was written every alarm in the
      # account had an empty `AlarmActions`, so "no alarm does anything" stood in for "nothing
      # reacts to a metric". Then #303 gave the alarms an SNS topic to fire into, because six
      # correct alarms firing into nothing is worse than no alarms, and the row went red for it
      # -- on the strength of the bare word `AlarmActions`, which the old pattern also matched
      # inside the comments explaining that history. An alarm that posts to a topic tells
      # somebody. It does not stop a run, and this row is about stopping runs.
      #
      # WHAT THE PATTERN NAMES NOW IS THE THING ITSELF RATHER THAN A PROXY FOR IT. A CloudWatch
      # alarm stops or terminates through an `arn:aws:automate:<region>:ec2:stop` action, and a
      # budget that acts is `AWS::Budgets::` or a `budgets:` grant. Those three are what a cost
      # stop is actually spelled as, and none of them is in `infra/`. Checked both ways when it
      # was changed: nothing matches today, and a planted `arn:aws:automate:us-east-1:ec2:
      # terminate` under an `AlarmActions` list matches, so this can still go red.
      - id: nothing-kills-a-running-job
        name: Nothing may stop a job that is already running, for cost
        designed: {reached: overview draws it}
        planned: {not_applicable: "a property, not a build"}
        built: {not_applicable: an absence}
        deployed: {not_applicable: an absence}
        under_test:
          {absent: [infra, "AWS::Budgets::|budgets:|arn:aws:automate:[a-z0-9-]+:(?:ec2|batch):(?:stop|terminate)"]}

      - id: checkpoints-bucket
        name: edullm-checkpoints, the pile older than the platform
        designed: {reached: overview draws it}
