      # unbuilt surface built and under test. Correcting it took two off the board, which is the
      # direction this correction had to go.
      #
      # BOTH CELLS ARE A HAND-WRITTEN `no` AND NOT A LOOKUP AT THE TWO FILES THAT ARE OWED,
      # BECAUSE `tests/test_stages.py` FORBIDS THE MANIFEST NAMING A PATH THAT DOES NOT EXIST.
      # That rule is right and it costs this: a path that has been renamed and a path that has
      # never been written both read `no`, and only one of them is news, so the manifest may
      # only name what is there. The two file names live in the reasons instead, where the next
      # person to build this reads them.
      - id: morning-message
        name: The morning message
        designed: {reached: overview draws it}
        planned: {task: the-instruments/10}
        built: {not_reached: "morning_message.py is unwritten; messages.py is the run-ended post"}
        deployed: {not_reached: the audit runs several jobs and none is a message}
        under_test: {not_reached: "test_morning_message.py is unwritten; the neighbouring test proves the run-ended post"}

