        under_test: {tests: [tests/test_visibility_board.py]}

      # `no workflow runs the reader` WAS WRITTEN BEFORE THE AUDIT GREW THE JOB THAT RUNS IT AND
      # NOTHING MADE IT FALSE AGAIN. `.github/workflows/audit.yml` carries `substrate-capture`,
      # which runs `tools/read_substrate.py --write` on a schedule, and `substrate-history`,
      # which keeps each reading on the `machine/substrate` branch so the readings can be
      # diffed. This row is the model and `collector` below is the reader, so they are given
      # different greps on purpose: two rows resolving off one path cannot tell a reader which
      # of the two moved, which is the mistake the run-ended post and the morning message were
      # already making in this file.
      - id: per-run-substrate
        name: The per-run substrate
