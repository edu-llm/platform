        built: {exists: src/edullm_platform/notifications/delivery.py}
        deployed:
          {stack: sbsandbox-intern-edullm-notifications, or: {not_reached: the deployer lacks the grants}}
        under_test: {not_reached: nothing has been delivered to a person}

