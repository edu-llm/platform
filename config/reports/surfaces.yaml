  # READ THIS BEFORE READING `0 of 3` OFF THE ROLLUP, BECAUSE THE SLICE NAME AND THE ROWS UNDER
  # IT ARE NOT THE SAME CLAIM. Every row here was written against one specific probe: the
  # MixLaw 370M validation re-run, eight ranks on `gpu-8xa100`, compared against the prior art
  # in `edullm-checkpoints`. That probe has not been dispatched and each `no` below is correct
  # for it.
  #
  # WHAT WAS WRONG WAS EVERY REASON, AND THE REASONS ARE WHAT A PERSON READS. Three cells said
  # `nothing has been dispatched` and `the probe has not run` on the morning of 2026-08-06,
  # some hours after a probe ran three times and succeeded three times. A reader taking the
  # slice at face value concluded that no probe had happened at all, which is the opposite of
  # the truth and is the more expensive mistake of the two: it invites somebody to spend a
  # night re-establishing a thing that is already established. The rows now say which probe has
  # not run, and `probe-a10g` below carries the one that did, so the slice cannot be read as
  # "nothing happened here" again.
  - name: The probe
    surfaces:
      - id: probe-rerun
        name: The re-run itself, eight ranks
        designed: {not_applicable: a probe}
        planned: {task: the-spine-and-the-probe/P4}
        built: {not_reached: "four ranks ran on 2026-08-06; eight on gpu-8xa100 is undispatched"}
        deployed: {not_applicable: a dispatch}
        under_test: {not_reached: "no run has placed eight ranks, which is where all nine known timeouts happened"}

      # THE ONE ROW HERE WHOSE `no` IS A DESIGN FINDING RATHER THAN AN UNDONE TASK.
      # `RETRY_ONLY_WHAT_A_RETRY_FIXES` is three rules in order -- retry on `Host EC2*`, exit on
      # `OutOfMemoryError*`, exit on every exit code -- and Batch stops at the first match, so
      # nothing a test can induce produces a second attempt. Established twice, by reading and
      # against `run_019fcf0f`, which carried `attempts: 2` and got one. The constant was
      # deliberately not edited to make the probe pass. So this surface is unexercisable as
      # specified rather than merely unexercised, and the open question is what the claim should
      # be narrowed to.
      - id: resume-across-attempts
        name: Resume across two attempts
        designed: {reached: overview draws it}
        planned: {task: the-spine-and-the-probe/P5}
        built: {not_reached: "the retry rule matches host faults only, so one attempt is all it gets"}
        deployed: {not_applicable: a dispatch}
        under_test: {not_reached: "no test can induce a second attempt, so the claim cannot be exercised as written"}

      - id: prior-art
