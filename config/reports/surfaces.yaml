      # `it waits on the collector` WAS TRUE AND THEN THE COLLECTOR LANDED. #305 put
      # `src/edullm_platform/activity.py` in the tree, `tools/report_activity.py` renders the
      # day, and the audit's `activity-history` job writes it to the `machine/activity` branch
      # every morning. The deployed grep names the tool the job invokes rather than the branch,
