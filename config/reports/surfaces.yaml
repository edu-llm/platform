        planned: {task: the-spine-and-the-probe/P7}
        built: {not_reached: "the comparison run it scores has not been dispatched"}
        deployed: {not_applicable: a verdict}
        under_test: {not_reached: "no score exists at step 125 to set beside the prior art's 2.6683"}

      # THE PROBE THAT ACTUALLY RAN, WHICH HAD NO ROW ANYWHERE UNTIL NOW. Three dispatches on
      # 2026-08-06, all exit 0: a 190M OLMo-core model trained 200 steps on one A10G against a
      # sealed corpus and printed a loss curve falling from 5.0568 bits per byte to 2.0491; one
      # attention block was timed across four sequence lengths on a T4; and the same recipe ran
      # on four ranks and came out of `post_train` with its `max_steps` checkpoint written.
      # Every checkpoint landed and the three runs cost $0.63 by the platform's own accounting.
      #
      # `built` IS `n/a` RATHER THAN A YES, AND NOT TO FLATTER THE COLUMN. The program is
      # `.edullm/train_on_corpus.py` in `edu-llm/OLMo-core`, which this tree does not hold, so
      # there is nothing here for a lookup to find -- the same reason `landing`, `sealed` and
      # `airlock` carry `another repository`. `under test` is a person's answer for the reason
      # `synthetic-t4` is: a run id and a measured figure are what happened, and this manifest
      # has no rule that can ask the lineage store. It is marked `*` and it should stay marked
      # until one exists.
      - id: probe-a10g
        name: The probe that ran, on A10G, at one rank and four
        designed: {not_applicable: a probe}
        planned: {not_reached: "run in place of P4 when the eight-rank shape was not available"}
        built: {not_applicable: the program is in another repository}
        deployed: {not_applicable: a dispatch}
        under_test: {reached: "run_019fd5d8 200 steps, bpb 5.0568 to 2.0491; run_019fd5e1 four ranks, exit 0"}

