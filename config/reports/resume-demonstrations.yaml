    observed: >-
      A separate submission with its own run id and its own empty $EDULLM_CHECKPOINT_DIR,
      pointed at run_019fdd8f-ad71-70f6-bc19-e091cf3b22a7's checkpoint prefix with the
      OLMo-core config override trainer.load_path=. It loaded step 420 and its first logged
      step was 421, not 1.

      What makes this a demonstration of resume rather than of a weight load is that its
      loss is bit-identical to the source run's at every overlapping step -- 3.7617 at 421,
      3.7363 at 422, 3.8190 at 425, 3.9139 at 430, 3.8013 at 500, 3.7301 at 509 -- over
      eighty-eight steps. A restored optimizer with an unrestored data loader diverges on
      the first step, not the ninetieth, so the batch order came back too. The learning rate
      matched CosWithWarmup(warmup=100, t_max=700) analytically at every step: 0.000501 at
      step 421, where a schedule that had restarted would still have been in warmup at
      0.00021.

      The source run is the other half of the same measurement: it trained, took SIGKILL at
      360 seconds mid-run, started again against its own prefix inside the same container,
      and produced one continuous curve from step 1 to 509 across the kill.

      Both runs ended by outrunning their runtime bound rather than by finishing, which is
      why reached_step is 659 and not 700. That bounds what was watched and does not qualify
      it -- 239 steps past the load is not a checkpoint being read, it is a run continuing.
