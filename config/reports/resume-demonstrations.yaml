# Repositories that have been watched resuming, and the runs that were watched.
#
# WHAT AN ENTRY IS AND WHAT IT IS NOT. It is not a claim that a trainer resumes. It is a
# citation of a run in which a second process reported starting from a step above zero and
# went on past it, with the two numbers written down so that a reviewer of the pull request
# adding the entry can open the run and read the same ones. Nothing here may be written from
# reading a codebase. `src/edullm_platform/contracts/resume_evidence.py` carries the argument
# for why that distinction is the whole point.
#
# WHAT IT BUYS. `require_a_demonstrated_resume_for_retries` refuses a submission asking for
# more than one attempt against a repository with no entry. Before this file existed, the two
# checks between a submission and a second attempt were whether the workload profile declared
# a checkpoint contract and whether the command expanded $EDULLM_CHECKPOINT_DIR -- and both
# of those pass for `edullm-p1` and for `open-instruct-scored-rewards`, which were measured on
# 2026-08-06 restarting from step 0. A pair of checks that cannot fail.
#
# HOW TO ADD ONE, WHICH IS ONE SUBMISSION AND NOT AN ARGUMENT. Submit a short training run
# whose command runs the trainer twice against the same $EDULLM_CHECKPOINT_DIR, killing the
# first partway; read the resuming process's own report of the step it loaded and the step it
# reached. `docs/` carries no recipe for this on purpose -- the command belongs in the
# research repository's own `.edullm/` directory, where the trainer's flags are, and
# `OLMo-core@.edullm/run-resume-proof.yaml` is the worked example.
#
# AN ENTRY IS NEVER DELETED BECAUSE IT GOT OLD. `commit_sha` is what a reader judges staleness
# by, and `resume_note` prints it beside the date on the approver's page. An entry is deleted
# when the run it cites is found not to say what it says.
