    reason: >-
      A --dry-run on olmo-core-train-1gpu, submitted while proving the submission path end to
      end. The command was `python .edullm/train_on_corpus.py "$EDULLM_RUN_ID" --dry-run`,
      which resolves the corpus, prints the config and exits before a trainer is built, so
      the run wrote nothing anywhere and there is no checkpoint to recover from any machine.
      The prefix cannot be filled in retrospectively and the run cannot be repeated into the
      same run id. Submission now refuses this command outright, because the profile declares
      a checkpoint contract and the command never expands $EDULLM_CHECKPOINT_DIR; a
      deliberate throwaway of the same shape has to carry EDULLM_CHECKPOINT_CHECK=waived,
      which puts the intent on the run instead of leaving it to be read off an empty prefix
      weeks later.
