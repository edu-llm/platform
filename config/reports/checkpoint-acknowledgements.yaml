# Runs whose empty or unloadable checkpoint prefix has been read, adjudicated and cannot be
# repaired. `tools/find_runs_that_saved_nothing.py` still inspects them, still lists them and
# still prints what is there; the only thing an entry changes is whether the nightly job goes
# red on it.
#
# THIS EXISTS BECAUSE A PERMANENTLY RED JOB REPORTS NOTHING. The run below is finished, its
# prefix is empty, and no action available to anybody changes either fact. Left alone it holds
# `runs that promised a checkpoint have one` red for ever, and the next real finding in that
# job then arrives at a job that was already red.
#
# It is a per-run list rather than a date cutoff, which was the obvious alternative and the
# wrong shape: "ignore runs before 2026-08-02" is one line, and it covers every run submitted
# before that date including ones nobody has looked at, and it goes on covering them as the
# reasons are forgotten. A run that is not named here is judged exactly as it was, so a new
# offender turns the job red the following morning.
#
# `reason` has a length floor in the contract for the reason `config/image-exceptions.yaml`
# carries one: "known issue" is not an adjudication, and the value of the entry is that a
# later reader can tell whether the prefix was understood or waved through. Say what the run
# was, why the prefix is empty, and why nothing can be done about it.
#
# An entry that stops covering a finding is reported by the tool as covering nothing and
# should be deleted. A list that only grows stops describing anything.
#
# Not read by either Lambda. This file is under `config/reports/` rather than in `config/`
# because `tools/build_admission_lambda.py` used to copy `config/*.yaml` into both zips,
# and acknowledging a run should not cost a rebuild, an upload and two release records.
# Each builder now names the files its own handler reads, so a file in `config/` that
# neither reads costs nothing either -- but the subdirectory still says what this is, and
# `tests/test_lambda_package_closure.py` is now what keeps an unread file out of a zip.
