# enforce manifest-to-catalog conformance because any run over the 12-hour policy ceiling
# necessarily exceeds these smoke profiles. This divergence is intentional.
maximum_runtime_hours: "13"
maximum_attempts: 1
checkpoint:
  interval_minutes: 30
  destination_prefix: s3://edullm-checkpoints/runs/
  resume_required: false
