# What is actually deployed as the lifecycle recorder, recorded beside the template that
# names it.
#
# THIS FILE EXISTS BECAUSE THE FUNCTION WAS FOUND RUNNING BYTES NOBODY COULD ACCOUNT FOR.
# On 2026-07-31 the deployed function's CodeSha256 was compared against a zip built from
# this tree and against one built from the tree as it stood before that day's work. It
# matched neither. Something in the recorder's package had moved at some point since its
# last release and nothing had noticed, because unlike the admission validator this
# function had no release record and no digest comparison -- the two halves of the control
# that Phase 4 paid a live run to learn it needed.
#
# WHY THE VALIDATOR'S LESSON APPLIES HERE TOO, AND WHY IT IS QUIETER. Both functions are
# entry points into the same `edullm_platform` package and both are packaged by the same
# builder, so a change to a shared contract moves both digests. The validator's failure
# mode is loud: a submission is refused with a reason that is correct for the deployed
# bytes and wrong about the account. The recorder's is silent. It writes the lineage --
# `binding/`, `events/`, `attempt/` and `result/` -- so a recorder running code this tree
# does not describe produces records that look exactly like correct ones, and the first
# reader to notice is somebody reading a projection months later that does not join.
#
# That silence is the argument for the tripwire rather than against it. The lineage is
# immutable by design, so a record written wrong cannot be corrected afterwards; the only
# place to catch it is before the bytes are deployed.
#
# WHAT NOW DEPENDS ON THIS BEING RIGHT. Two things read what this function writes and
# neither existed when it was last released. `tools/report_run_costs.py` derives per-run,
# per-team and per-submitter spend from the `started_at` and `ended_at` on `attempt/`
# records, which is the platform's whole answer to cost attribution now that activating
# AWS cost allocation tags has turned out to be impossible from a linked account. And the
# queue-wait detector reads the same event stream to notice a job that is not starting.
# Both rest on a function whose deployed code was, until this file was written,
# unaccounted for.
#
# The build is deterministic, so a rebuild that changed nothing produces the same digest
# and needs no edit here. Releasing means running the procedure in infra/README.md and
# updating both fields below in the same commit as the change that caused them to move.
#
# The two zips are built separately and are not interchangeable. Each function's package
# carries only the modules its own entry point reaches, so the recorder's fifteen modules
# are a subset of the validator's twenty-eight and the digests differ even when neither
# handler changed. Uploading one under the other's key deploys the wrong code under the
# right name, which is the failure `tools/build_lifecycle_lambda.py` exists as a second
# command to prevent.
#
# THIS RELEASE WAS CAUSED BY A CHANGE THIS FUNCTION DOES NOT USE, WHICH IS THE INTERESTING
# CASE. `DatasetRegistry.is_registered` was widened to answer over published corpora as well
# as releases, so that two newly registered datasets could be offered on the submission form
# without admission denying them after a lead approved. That is entirely admission's concern.
# But the recorder imports `contracts/dataset_registry.py` -- it is one of the fifteen -- so
# the method body changing moved these bytes too.
#
# `infra/README.md` already warns that one edit to `config/` is two releases, because both
# builders copy `config/*.yaml`. This is the same shape arriving through a different door: a
# shared module rather than a shared config directory. The general rule the two cases point
# at is that the packaged unit is the `src/edullm_platform` tree, so "did this reach the other
# function" is a question about every module either entry point imports, and the honest way to
# answer it is to run both builders and compare both digests rather than to reason about it.
#
# THIS RELEASE IS THE SHARED-CONFIG CASE AGAIN AND CHANGES NOTHING THIS FUNCTION DOES. Three
# research groups were renamed and two added in config/organization.yaml, which both builders
# copy, so these bytes moved. The recorder reads no roster: it projects Batch events into
# lineage and never looks a team up. So the release is owed for the packaged bytes rather than
# for any behaviour, which is exactly the position the paragraph above describes and the reason
# the tripwire compares bytes instead of trying to judge which ones matter.
#
# THIS RELEASE IS THE SHARED-CONFIG CASE AGAIN, AND THIS TIME FOR A COMMENT. The paragraph
# on olmo-core-train-4gpu in config/workload-catalog.yaml was rewritten to record that a
# multi-GPU command starting one process is now refused while the submission compiles. Both
# builders copy config/*.yaml, so these bytes moved for a comment in a file this function
# never reads, describing a check that runs in a module this zip does not carry. Nothing the
# recorder does before and after this release is different, and the honest reading of the
# moved digest is still the only one worth having: the deployed zip was not the zip this
# tree builds.
#
# Cut from main together with the validator's, from c9a785d, because one config edit is two
# releases and the workflow that can upload only runs on main.
#
# AND AGAIN, FROM dccfa06. Twelve reviews were added to config/image-exceptions.yaml for the
# CUDA base olmo-eval-full builds on. The recorder does not read that file and does not
# consult the image gate at all; it owes this release because the builder copies
# config/*.yaml into whatever zip it builds. Same shared-config case as every entry above.
#
# AND AGAIN, FROM 83318b3. #167 changed the image-scan gate in
# src/edullm_platform/contracts/image_scan.py, which this zip carries because the recorder
# imports the contracts package, and src/edullm_platform/admission.py, which it does not.
# Neither reaches anything the recorder does: it projects Batch events into lineage and
# never evaluates an image scan. Released because the packaged bytes moved, which is the
# only claim the tripwire makes.
