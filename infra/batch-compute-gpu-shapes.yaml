  # -------------------------------------------------------------------------------------
  # gpu-4xa10g, four A10G on g5.12xlarge, $5.672/hour
  # -------------------------------------------------------------------------------------
  Gpu4xA10gComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: sbsandbox-intern-edullm-gpu-4xa10g
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
