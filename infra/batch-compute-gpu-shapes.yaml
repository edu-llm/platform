  # -------------------------------------------------------------------------------------
  # THE ONLY LAUNCH TEMPLATE IN THIS ACCOUNT, AND IT SERVES EXACTLY THE TWO EIGHT-DEVICE P
  # SHAPES BELOW.
  #
  # Every compute environment in this file and in infra/batch-compute-gpu.yaml was created
  # without one -- describe-compute-environments returned launchTemplate: None for all
  # sixteen on 2026-08-04 -- so nothing in this repository ever stated what disk a GPU job
  # gets, and the answer was whatever the AMI happened to carry.
  #
  # WHAT THAT ANSWER IS. Ec2Configuration names ECS_AL2023_NVIDIA and nothing else, so Batch
  # resolves the ECS-optimized AL2023 GPU AMI and takes that image's own block device mapping
  # unchanged. Read on 2026-08-04 from ami-011db5ae81cc0f370,
  # al2023-ami-ecs-gpu-hvm-2023.0.20260727-kernel-6.1-x86_64-ebs: a single 30 GiB gp3 volume
  # on /dev/xvda at 125 MB/s. After the operating system and the ~4.4 GB compressed training
  # image there is roughly 13 GiB free.
  #
  # WHAT ASKED FOR MORE THAN THAT, AND COULD NEVER HAVE FITTED. A run staged
  # train-*.u32le.bin to local disk under /tmp inside the container. 9,989,799,834 tokens at
  # four bytes each is 39,959,199,336 bytes, which is 37.2 GiB against 13 GiB free, and it
  # died in stage_input with OSError: [Errno 28] No space left on device. A clean instance
  # would not have saved it: the dataset is larger than the entire 30 GiB root volume before
  # anything else is written to it, so this shape could not run that job at all.
  #
  # 500 GiB IS THE DATASET WITH ROOM TO WORK IN RATHER THAN THE DATASET ROUNDED UP. A
  # trainer that stages 37.2 GiB also writes checkpoints beside it, and a second job landing
  # on the same instance stages its own copy. 500 GiB is thirteen times the corpus, which
  # buys all of that and stops this being re-argued the first time a slightly larger corpus
  # arrives.
  #
  # THE PRICE OF BEING WRONG IN THIS DIRECTION IS NOTHING, AND THAT IS THE WHOLE ARGUMENT.
  # gp3 in us-east-1 is $0.08/GB-month, so 500 GiB is $40/month -- $1.31 over a 24-hour run
  # on a 730-hour month -- and the throughput below adds $0.16 more, for $1.48 a day. The
  # p4d.24xlarge under it is $21.9576/hour, which is $527 over the same 24 hours. The volume
  # is a third of one percent of the run it protects, and MinvCpus is 0 on both environments
  # so an idle environment pays neither.
  #
  # 250 MB/s BECAUSE THE BASELINE MAKES THE STAGE THE SLOWEST PART OF A SHORT JOB. gp3 gives
  # 125 MB/s free and charges $0.040 per MB/s-month above it. 39,959,199,336 bytes at
  # 125 MB/s is 5 minutes 20 seconds of a job doing nothing but copying; at 250 MB/s it is
  # 2 minutes 40 seconds. Neither instance is the constraint -- describe-instance-types
  # reports 2,375 MB/s of EBS baseline throughput on p4d.24xlarge and 10,000 MB/s on
  # p5.48xlarge -- so the volume is what was slow. IOPS is left at the gp3 default of 3,000,
  # which is well inside the 0.25 MB/s-per-IOPS ceiling that 250 MB/s has to fit under.
  #
  # Encrypted IS DELIBERATELY ABSENT RATHER THAN false. The account has
  # EbsEncryptionByDefault off, this AMI's snapshot is unencrypted, and both live Batch
  # instances read on 2026-08-04 carry unencrypted roots -- so an omitted flag produces
  # exactly what the account already does. Writing false would produce the same volume today
  # and refuse to launch at all on the day somebody turns account-wide default encryption on,
  # which is a failure mode bought for no present benefit.
  #
  # /dev/xvda IS THE AMI'S OWN ROOT DEVICE AND WAS READ RATHER THAN ASSUMED. describe-images
  # on ami-011db5ae81cc0f370 reports RootDeviceName /dev/xvda and exactly one mapping, on
  # /dev/xvda; describe-instances agrees on both live hosts. This is the field that fails
  # quietly when it is wrong: a device name the AMI does not use is not an error, it is a
  # second empty 500 GiB volume attached beside an untouched 30 GiB root, and the job dies
  # with the same ENOSPC while the console shows the disk was bought.
  #
  # THE USER DATA IS MIME MULTIPART BECAUSE BATCH REQUIRES IT, NOT AS A STYLE. AWS Batch
  # merges its own user data with whatever the launch template carries, and its
  # documentation states that user data in a launch template must be in MIME multi-part
  # archive format for that merge to happen. A bare shell script is not rejected; it is
  # discarded, and the instance boots with the agent defaults while everything below looks
  # applied. The boundary declaration, the blank line before each boundary and the blank
  # line after each Content-Type are all load-bearing parts of that format.
  #
  # cloud-init runs this before the agent reads its configuration. The ECS-optimized AMI
  # looks for /etc/ecs/ecs.config when the container agent starts, and user data is how AWS
  # documents writing that file at launch, so appending to it here is the supported ordering
  # rather than a race this file is winning by luck.
  #
  # WHY THE AGENT SETTINGS ARE HERE AT ALL, WHICH IS A SECOND FAILURE AND NOT THE SAME ONE.
  # Three jobs landed on one container instance in succession. The first ran 2m35s before
  # ENOSPC; the second and third died in six seconds each, on the first one's leftover
  # partial download. ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION defaults to three hours, so a
  # stopped container's writable layer -- and the half-staged corpus inside it -- is kept
  # for three hours while the next job is placed on the same host. A larger volume alone
  # would have made that slower rather than absent.
  #
  # EVERY VALUE BELOW IS FROM THE AGENT'S OWN CONFIGURATION REFERENCE, INCLUDING THE ONES
  # THAT CONSTRAIN IT. ECS_IMAGE_CLEANUP_INTERVAL cannot go below 10 minutes and is 15 here
  # against a default of 30. ECS_IMAGE_MINIMUM_CLEANUP_AGE is 30 minutes against a default
  # of one hour. ECS_NUM_IMAGES_DELETE_PER_CYCLE is 25 against a default of 5, whose minimum
  # is 1 and which has no documented maximum: at roughly 12 GiB per unpacked training image
  # a backlog of 25 is 300 GiB, so one cycle can clear a full volume rather than nibbling at
  # it five images at a time. ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION is 15 minutes against a
  # default of three hours, and it is the one that matters most: the reference states that
  # image cleanup cannot delete an image while any container still references it, so the
  # task cleanup duration gates the three image settings rather than sitting beside them.
  #
  # ECS_CLUSTER and ECS_INSTANCE_ATTRIBUTES are absent and must stay absent. Batch writes
  # both itself and names them as reserved; setting either from here is documented to break
  # scheduling and scaling. ECS_DISK_FREE_SPACE_THRESHOLD is also absent, for a plainer
  # reason -- it is not an ECS agent variable. It appears in no part of the configuration
  # reference, and a line naming it would sit in /etc/ecs/ecs.config being ignored while
  # reading like a guard.
  #
  # IMAGE ACCUMULATION WAS NOT WHAT HAPPENED HERE. All three jobs pulled one identical
  # digest, so nothing about the image settings would have saved any of them. They are
  # tightened in the same change because the defaults are loose and this is the file where
  # that is now stated; the honest claim is that they are prophylactic and the volume and
  # the task cleanup duration are the fix.
  #
  # THE INSTANCE STORE IS THE RIGHT LONG-TERM HOME FOR A STAGED CORPUS AND IS DELIBERATELY
  # NOT TOUCHED HERE. p4d.24xlarge carries eight 1,000 GB NVMe disks -- 8 TB, sitting unused
  # while a job runs out of room on a 30 GiB EBS root -- and p5.48xlarge carries eight of
  # 3,800 GB, 30.4 TB. It is free, it is local, and it is faster than any EBS volume this
  # account would pay for. It is also per-shape work that this change is not: eight disks
  # need a RAID device assembled and mounted before the agent starts, the two shapes below
  # differ in disk size, and the twelve G-family environments differ again -- g4dn and g5
  # have one NVMe disk each, g6e has one, and c7i in the CPU stack has none at all, so a
  # user-data script written for eight disks is a boot failure on most of the estate. This
  # 500 GiB volume is the interim fix that unblocks the corpus today; mounting the instance
  # store is the follow-up that makes it free.
  #
  # ONE TEMPLATE FOR BOTH SHAPES RATHER THAN ONE EACH. They have the same problem, the same
  # root device and the same corpus to stage, and two copies of the block below would be two
  # places for a future size change to be applied to one of. The fourteen other environments
  # are deliberately left without a launch template: this change was scoped to the two that
  # were idle, and gpu and gpu-4xl40s had live work on them when it was written.
  #
  # THE VERSION IS Fn::GetAtt AND NOT $Latest, AND THAT IS WHAT MAKES AN EDIT TAKE EFFECT.
  # Batch resolves $Latest and $Default once, when the compute environment is created or
  # updated, and its documentation is explicit that a later change to the template is not
  # picked up until something calls UpdateComputeEnvironment. A concrete version number is a
  # property of the compute environment, so editing the block below changes the two
  # environments in the same deploy rather than leaving them on the version they were born
  # with while this file describes another one.
  # -------------------------------------------------------------------------------------
  PFamilyLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: sbsandbox-intern-edullm-batch-gpu-p-family
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 500
              VolumeType: gp3
              Throughput: 250
              DeleteOnTermination: true
        UserData:
          Fn::Base64: |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BOUNDARY=="

            --==BOUNDARY==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            cat <<'ECSCONFIG' >> /etc/ecs/ecs.config
            ECS_ENGINE_TASK_CLEANUP_WAIT_DURATION=15m
            ECS_IMAGE_CLEANUP_INTERVAL=15m
            ECS_IMAGE_MINIMUM_CLEANUP_AGE=30m
            ECS_NUM_IMAGES_DELETE_PER_CYCLE=25
            ECSCONFIG

            --==BOUNDARY==--

  # -------------------------------------------------------------------------------------
  # gpu-8xa100, eight A100 on p4d.24xlarge, $21.958/hour. Draws on the P quota, and needs an
  # admin per submission because that rate is above policy's exception ceiling. FOUR SUBNETS:
  # p4d.24xlarge is not offered in us-east-1f.
  #
# A100 HAS NO ONE-CARD OR FOUR-CARD FORM ON EC2 AND H100 HAS A ONE-CARD FORM, WHICH IS WHY
# THIS FAMILY HAS ONE ENVIRONMENT AND THE ONE BELOW NOW HAS TWO. p4d.24xlarge is an
# eight-device instance with nothing smaller to name in InstanceTypes, so a gpu-1xa100 or
# gpu-4xa100 cannot be built here at all. Somebody who ran a single A100 elsewhere wants
# gpu-1xh100, which is a newer card at the same 80 GB.
#
# THE SENTENCE THAT STOOD HERE SAID H100 HAD NO ONE-CARD FORM EITHER AND SENT THAT READER TO
# gpu-1xl40s, "48 GB against 80 GB and the largest single card this account can start". That
# was measured on the p4d and p5 families as the account then used them and was never
# rechecked against the p5 family's own size list. p5.4xlarge is one H100 80 GB on 16 vCPU
# and 256 GiB, offered in all six us-east-1 zones, and describe-instance-types reports it
# beside p5.48xlarge. There is still no four-card form: the p5 family in this region is
# p5.4xlarge, p5.48xlarge and p5en.48xlarge and nothing between them.
  # -------------------------------------------------------------------------------------
  Gpu8xA100ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: sbsandbox-intern-edullm-gpu-8xa100
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 360
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        # Eight p4d.24xlarge, which is the whole P quota and was one until 2026-08-03. The
        # header records why a ceiling is the wrong place to hold spend down, and why this
        # shape kept the old number for a day after the same argument had already moved its
        # sibling.
        MaxvCpus: 768
        # TWO INSTANCE TYPES, REVERSING THE PHASE-3 DECISION FOR THE TWO ENVIRONMENTS THE
        # REASONING NO LONGER COVERS. infra/batch-compute-gpu.yaml argues at length for one
        # type per environment and that argument still holds everywhere it was made: it rests
        # on "capacity is not short", which was true of the G pool and has never been true of
        # this one.
        #
        # On 2026-08-04 this environment's autoscaling group failed every launch it attempted
        # in all four zones it can reach, thousands of times, having placed twice that
        # morning. BEST_FIT_PROGRESSIVE is named above and with one instance type there is
        # nothing to progress to -- the strategy degrades to retrying the same
        # p4d.24xlarge request against the same four exhausted pools until the queue's
        # thirty-minute CANCEL fires.
        #
        # WHY p4de.24xlarge IS SUBSTITUTABLE AND NOT MERELY SIMILAR. Every number the
        # placement depends on is identical: 96 vCPU and 1,179,648 MiB advertised, so the
        # 31/32 host ceiling that src/edullm_platform/execution.py measured for p4d --
        # 1,142,784 MiB against the profile's 1,118,208 -- is the same number here, and a
        # container sized for one fits the other with the same 24,576 MiB to spare. That is
        # the property the memory comment in execution.py warns is silent when it fails, and
        # it is checked rather than assumed. The device differs upward: eight A100 80 GB
        # against eight A100 40 GB, 640 GB of device memory against 320. No workload sized
        # for gpu-8xa100 can fail to fit on the alternate.
        #
        # WHAT IT COSTS, WHICH IS REAL AND IS BOUNDED. $27.4471/hour against $21.9576, so a
        # run that lands on the alternate bills 25% above the estimate in its approved record
        # -- exactly the divergence infra/batch-compute-gpu.yaml refuses to accept on the G
        # side. Three things make it acceptable here and not there. BEST_FIT_PROGRESSIVE
        # prefers the cheapest type that fits, so p4d is tried first and p4de is reached only
        # on its failure. The substitution cannot move a request into a weaker approval class
        # the way a g5.xlarge-to-g5.2xlarge swap would: this rested on both rates being above
        # EXCEPTION_RATE_CEILING_USD_PER_HOUR, which no longer exists, and it now rests on the
        # fact that the class is decided from the profile the submission named and the
        # substitution happens inside Batch, where nothing reclassifies anything. Note that
        # gpu-8xa100-80gb prices the same machine as an admin-gated block-backed shape; that
        # is a different profile and this fallback does not put a request onto it. And the
        # comparison the divergence spoils is
        # Phase 5's estimate against actual, which is a comparison between a run that
        # happened and a record; the status quo is no run at all.
        #
        # p4de IS OFFERED IN us-east-1c AND us-east-1d ONLY, both already imported below, so
        # this adds two placement pools without touching the subnet list. p4d's own four
        # zones are all present already, which is why no subnet moves in this change.
        InstanceTypes:
          - p4d.24xlarge
          - p4de.24xlarge
        InstanceRole:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/sbsandbox-intern-edullm-batch-gpu-instance
        # FOUR SUBNETS, AND THIS IS THE WHOLE OF p4d's ZONE COVERAGE RATHER THAN A SUBSET.
        # describe-instance-type-offerings on 2026-08-04 reports p4d.24xlarge in us-east-1a,
        # 1b, 1c and 1d and nowhere else, and p4de.24xlarge in 1c and 1d. So unlike the p5
        # environments before PR #175 there is no missing zone to add here: the shortage this
        # environment is in is not one this account is making worse by omission.
        #
        # The "you can currently get p4d.24xlarge capacity by ... choosing us-east-1a,
        # us-east-1c, us-east-1d" text in the EC2 error is boilerplate that lists every zone
        # except the one asked for, and the group's own log disproves it: at 20:48:34 on
        # 2026-08-04 all four zones failed within two seconds of each other, each naming the
        # other three as available. Do not read it as intelligence about where capacity is.
        Subnets:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1a
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1b
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1c
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1d
        SecurityGroupIds:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-security-group-id
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        # 500 GiB of gp3 instead of the AMI's 30, and an ECS agent that clears a stopped
        # container after fifteen minutes instead of three hours. The block above
        # PFamilyLaunchTemplate records the corpus that did not fit and the three jobs that
        # inherited each other's leftovers.
        LaunchTemplate:
          LaunchTemplateId:
            Ref: PFamilyLaunchTemplate
          Version:
            Fn::GetAtt: PFamilyLaunchTemplate.LatestVersionNumber
        UpdateToLatestImageVersion: true
        Tags:
          Name: sbsandbox-intern-edullm-batch-gpu-8xa100
          Project: edullm

  Gpu8xA100JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: sbsandbox-intern-edullm-gpu-8xa100
      State: ENABLED
      Priority: 1
      JobStateTimeLimitActions:
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT
          State: RUNNABLE
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment:
            Ref: Gpu8xA100ComputeEnvironment

  Gpu8xA100JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: sbsandbox-intern-edullm-gpu-8xa100-run
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 3600
      ContainerProperties:
        Image:
          Fn::Sub: ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sbsandbox-intern-edullm-olmo-core@sha256:50e2488ab3c77e859a8fe3e6d4a06d7d54f5c852bc7c5dd201fb9db53bff455b
        ExecutionRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-execution
        JobRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-workload
        ResourceRequirements:
          - Type: VCPU
            Value: "96"
          - Type: MEMORY
            Value: "1118208"
          - Type: GPU
            Value: "8"
        Secrets:
          - Name: WANDB_API_KEY
            ValueFrom:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-fnwEVp
        Command:
          - python
          - -c
          - 'print("sbsandbox-intern-edullm-gpu-8xa100-run: no command override was supplied")'
        Environment:
          - Name: EDULLM_OUTPUT_BUCKET
            Value: sbsandbox-intern-edullm-outputs
          - Name: EDULLM_OUTPUT_PREFIX
            Value: s3://sbsandbox-intern-edullm-outputs/no-submission-supplied-a-prefix/
        LinuxParameters:
          SharedMemorySize: 279552
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: /aws/batch/sbsandbox-intern-edullm-gpu
            awslogs-stream-prefix: gpu-8xa100-run
            awslogs-region:
              Ref: AWS::Region
        Privileged: false

  # -------------------------------------------------------------------------------------
  # gpu-8xh100, eight H100 on p5.48xlarge, $55.04/hour. The most expensive thing this
  # account can start, and one eight-hour run is $440. Needs an admin per submission.
  # -------------------------------------------------------------------------------------
  Gpu8xH100ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: sbsandbox-intern-edullm-gpu-8xh100
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 360
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        # Four p5.48xlarge, which is the whole P quota and was one until 2026-08-02. The
        # header records why a ceiling is the wrong place to hold spend down and what the old
        # 192 did to a job that asked for more than it.
        MaxvCpus: 768
        # TWO INSTANCE TYPES, FOR THE REASON GIVEN AT LENGTH ABOVE Gpu8xA100ComputeEnvironment
        # AND WITH A SHARPER RECORD BEHIND IT. That environment placed twice on the morning of
        # 2026-08-04 before going dry. This one has never placed at all: 6,815 consecutive
        # InsufficientInstanceCapacity failures across all six zones, and the autoscaling group
        # has no successful launch in its history.
        #
        # p5en.48xlarge IS THE ONLY ALTERNATE THIS REGION OFFERS AND IT IS AN EXACT FIT.
        # 192 vCPU and 2,097,152 MiB, identical to p5.48xlarge, so the 31/32 ceiling
        # src/edullm_platform/execution.py measured -- 2,031,616 MiB against the profile's
        # 1,982,464 -- is unchanged and the container fits with the same 49,152 MiB spare.
        # Eight H200 141 GB against eight H100 80 GB, so device memory goes up, not down.
        #
        # p5e.48xlarge WAS EVALUATED AND IS NOT OFFERED HERE. It is the obvious third name and
        # describe-instance-type-offerings on 2026-08-04 returns nothing for it in any
        # us-east-1 zone, so listing it would be a type Batch could never launch. p6-b200
        # is offered, in us-east-1d alone, and is deliberately absent: it is a Blackwell card
        # and the training image's CUDA build is pinned against a driver read off an A10G and
        # never confirmed on a p5, which the image comment in infra/batch-compute-gpu.yaml
        # already flags. Adding an unproven architecture to a scarcity fallback would trade a
        # job that does not start for a job that starts and fails on a device nobody has run.
        #
        # $63.296/hour against $55.04, 15% above the estimate, reached only after p5 fails
        # because BEST_FIT_PROGRESSIVE prefers the cheaper type. Both are far above the
        # exception ceiling, so no approval class moves.
        InstanceTypes:
          - p5.48xlarge
          - p5en.48xlarge
        InstanceRole:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/sbsandbox-intern-edullm-batch-gpu-instance
        # SIX SUBNETS. Only this environment and gpu-1xh100 get six, because only p5 can use
        # the sixth.
        #
        # THE SECOND INSTANCE TYPE IS OFFERED IN TWO OF THESE SIX AND THAT IS CORRECT RATHER
        # THAN AN OVERSIGHT. p5en.48xlarge is sold in us-east-1b and us-east-1d only. The
        # prohibition the tests carry -- an environment must not import a zone its instance
        # type cannot be placed in -- was written when every environment had one type, and
        # with one type it is exactly right, because the environment then has no zone it can
        # place in at all and the job waits with no error. With two types the union is what
        # matters: p5.48xlarge covers all six, p5en covers two of them, and every zone here
        # remains placeable by at least one listed type. tests/test_phase3_infrastructure.py
        # now states it that way, against a measured per-type zone map rather than a single
        # set of names.
        #
        # p5.48xlarge is offered in us-east-1a, 1b, 1c, 1d, 1e and 1f -- every zone in the
        # region. Read against describe-instance-type-offerings on 2026-08-03, alongside every
        # other shape this repository backs: c7i.8xlarge, g4dn and g5 and g6 stop at five, the
        # g6e family and p4d.24xlarge at four, and p5.4xlarge and p5.48xlarge are the only two
        # offered in us-east-1e. infra/batch-network.yaml did not declare a 1e subnet at all
        # until that day, for the good reason that no shape could use one.
        #
        # WHY IT IS WORTH A TEMPLATE CHANGE RATHER THAN A NOTE. On 2026-08-03 a job at this
        # environment's exact shape sat in RUNNABLE while the autoscaling group behind it
        # failed a launch in every one of the five zones it could reach, each with
        # "InsufficientInstanceCapacity - We currently do not have sufficient p5.48xlarge
        # capacity in the Availability Zone you requested". Five of six zones, retried for
        # thirty minutes, nothing placed. A sixth zone does not make p5 capacity appear, and
        # this change should not be read as a fix for a shortage -- but it is the only part of
        # that shortage that was ours, and it is the zone with the least competition precisely
        # because almost nothing else is offered there.
        #
        # DO NOT COPY THIS LIST ONTO ANOTHER ENVIRONMENT. Every other compute environment in
        # this file must keep the subnet list its own instance type is offered in. A subnet
        # Batch will consider and can never place into produces a job that waits in RUNNABLE
        # with no error anywhere, which infra/batch-network.yaml argues at length and which is
        # a worse failure than the narrow pool this widens.
        Subnets:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1a
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1b
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1c
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1d
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1e
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1f
        SecurityGroupIds:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-security-group-id
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        # The same launch template gpu-8xa100 uses, and for the same two reasons. p5.48xlarge
        # has 30.4 TB of instance store rather than the p4d's 8 TB, so it stands to gain more
        # from the follow-up that mounts it, and exactly as much from the 500 GiB root today.
        LaunchTemplate:
          LaunchTemplateId:
            Ref: PFamilyLaunchTemplate
          Version:
            Fn::GetAtt: PFamilyLaunchTemplate.LatestVersionNumber
        UpdateToLatestImageVersion: true
        Tags:
          Name: sbsandbox-intern-edullm-batch-gpu-8xh100
          Project: edullm

  Gpu8xH100JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: sbsandbox-intern-edullm-gpu-8xh100
      State: ENABLED
      Priority: 1
      JobStateTimeLimitActions:
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT
          State: RUNNABLE
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment:
            Ref: Gpu8xH100ComputeEnvironment

  Gpu8xH100JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: sbsandbox-intern-edullm-gpu-8xh100-run
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 3600
      ContainerProperties:
        Image:
          Fn::Sub: ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sbsandbox-intern-edullm-olmo-core@sha256:50e2488ab3c77e859a8fe3e6d4a06d7d54f5c852bc7c5dd201fb9db53bff455b
        ExecutionRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-execution
        JobRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-workload
        ResourceRequirements:
          - Type: VCPU
            Value: "192"
          - Type: MEMORY
            Value: "1982464"
          - Type: GPU
            Value: "8"
        Secrets:
          - Name: WANDB_API_KEY
            ValueFrom:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-fnwEVp
        Command:
          - python
          - -c
          - 'print("sbsandbox-intern-edullm-gpu-8xh100-run: no command override was supplied")'
        Environment:
          - Name: EDULLM_OUTPUT_BUCKET
            Value: sbsandbox-intern-edullm-outputs
          - Name: EDULLM_OUTPUT_PREFIX
            Value: s3://sbsandbox-intern-edullm-outputs/no-submission-supplied-a-prefix/
        LinuxParameters:
          SharedMemorySize: 495616
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: /aws/batch/sbsandbox-intern-edullm-gpu
            awslogs-stream-prefix: gpu-8xh100-run
            awslogs-region:
              Ref: AWS::Region
        Privileged: false

  # -------------------------------------------------------------------------------------
  # gpu-1xh100, one H100 80 GB on p5.4xlarge, $6.88/hour. SIX SUBNETS, and this comment used
  # to say five and say why: "p5.4xlarge is offered in all six us-east-1 zones and this VPC
  # has a subnet in five of them, so the list is short of the offering rather than of the
  # family." That was an accurate description of a gap, and infra/batch-network.yaml now
  # declares the sixth subnet, so the gap is closed rather than described. p5.4xlarge and
  # p5.48xlarge are the only shapes in this file offered in us-east-1e; every other list here
  # is short of nothing and must stay as it is.
  #
  # THE ONLY 80 GB SINGLE CARD HERE, AND THE ONE SHAPE THREE PIECES OF WORK ASKED FOR BY NAME.
  # grpo-tutor's README says one H100 with vLLM. The P7 tutor recipe annotates
  # per_device_batch: 8 as about 44 GB with gradient checkpointing. Sophia runs vLLM 0.11.2 on
  # one H100, single node. All three were being routed to gpu-1xl40s, which is 48 GB and fits
  # the P7 recipe with nothing to spare and does not fit a KV cache sized for an 80 GB card.
  #
  # IT IS AN EIGHTH OF THE COST OF THE ONLY OTHER H100 HERE, WHICH IS MOST OF WHY IT MATTERS.
  # This paragraph read "it is under the admin ceiling and gpu-8xh100 is not", because
  # $6.88/hour was below EXCEPTION_RATE_CEILING_USD_PER_HOUR and $55.04 was above it. Policy v5
  # withdrew that ceiling, so both are released by the submitter's own team lead and the
  # distinction the heading drew no longer exists. What survives is the money: the only H100 on
  # this platform until now was the $55.04/hour eight-card node, which bills eight devices to a
  # job that uses one, so a researcher who wanted one card was choosing between paying 8x and
  # taking a smaller card and changing their recipe.
  #
  # gpu-1xl40s STAYS. It is the cheaper card at $1.861 against $6.88, it draws on the G pool
  # rather than the P pool so it cannot be starved by an eight-card H100 job, and 48 GB is
  # enough for plenty of what asked for it. What changes is that reaching for it is no longer
  # forced on somebody whose recipe wants 80 GB.
  # -------------------------------------------------------------------------------------
  Gpu1xH100ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: sbsandbox-intern-edullm-gpu-1xh100
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 360
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        # Twenty-four concurrent p5.4xlarge at 16 vCPU each, which is the header's rule for
        # a single-GPU shape applied unchanged, and 128 -- eight of them -- until the rule
        # itself was tripled on 2026-08-03. It is half the P quota, so twenty-four of these
        # and two p5.48xlarge can run at once without the pool refusing either.
        MaxvCpus: 384
        InstanceTypes:
          - p5.4xlarge
        InstanceRole:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/sbsandbox-intern-edullm-batch-gpu-instance
        # Six, for the reason the header of this section gives. Worth more here than on the
        # eight-card environment rather than less: p5.4xlarge draws on the same scarce P pool,
        # and on 2026-08-03 that pool would not sell a single p5.48xlarge in any of the five
        # zones this VPC could reach, across 6,815 launch attempts over nine hours.
        Subnets:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1a
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1b
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1c
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1d
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1e
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1f
        SecurityGroupIds:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-security-group-id
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        UpdateToLatestImageVersion: true
        Tags:
          Name: sbsandbox-intern-edullm-batch-gpu-1xh100
          Project: edullm

  Gpu1xH100JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: sbsandbox-intern-edullm-gpu-1xh100
      State: ENABLED
      Priority: 1
      JobStateTimeLimitActions:
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT
          State: RUNNABLE
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment:
            Ref: Gpu1xH100ComputeEnvironment

  Gpu1xH100JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: sbsandbox-intern-edullm-gpu-1xh100-run
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 3600
      ContainerProperties:
        Image:
          Fn::Sub: ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sbsandbox-intern-edullm-olmo-core@sha256:50e2488ab3c77e859a8fe3e6d4a06d7d54f5c852bc7c5dd201fb9db53bff455b
        ExecutionRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-execution
        JobRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-workload
        ResourceRequirements:
          - Type: VCPU
            Value: "16"
          # 253952 is the 31/32 a p5.4xlarge registers of its advertised 262144, measured the
          # same way the p4d and the p5.48xlarge were, less 4096 for the ECS agent and the
          # host. This read 258048 until it was corrected, which is the advertised figure less
          # the allowance and 4096 over the ceiling, so every job submitted here would have
          # been refused statically with MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT and the
          # queue would simply never have scaled. See the reserve table in
          # src/edullm_platform/execution.py, which has to carry the same number.
          - Type: MEMORY
            Value: "249856"
          - Type: GPU
            Value: "1"
        Secrets:
          - Name: WANDB_API_KEY
            ValueFrom:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-fnwEVp
        Command:
          - python
          - -c
          - 'print("sbsandbox-intern-edullm-gpu-1xh100-run: no command override was supplied")'
        Environment:
