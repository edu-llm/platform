AWSTemplateFormatVersion: "2010-09-09"
Description: Fourteen GPU compute environments, their job queues and their digest-pinned job definitions, beside the single-A10G stack, and the launch template the two eight-device P shapes boot from.

# The thirteen GPU shapes this account can run, added alongside infra/batch-compute-gpu.yaml
# rather than into it. That file's single environment had jobs running when these were
# written, and a template edit can interrupt a running job, so the one shape researchers were
# already using keeps its own stack and its own rollback.
#
# Nine were added together and four followed on 2026-08-02, which is why the arithmetic below
# is written out again rather than adjusted. gpu-8xt4, gpu-8xl4 and gpu-8xl40s fill the
# eight-device row of the grid config/workload-catalog.yaml keeps, and gpu-1xl40s is a shape
# that was priced and left unprovisioned until two pieces of work needed it. That file
# records who asked and why nothing smaller serves them.
#
# Everything argued in infra/batch-compute-gpu.yaml holds here and is not repeated: why
# ECS_AL2023_NVIDIA is the line the whole thing turns on, why each environment lists exactly
# one instance type, why a GPU entry in ResourceRequirements is what makes ECS attach a
# device at all, why Privileged is false, why the image is pinned by digest, why /dev/shm has
# to be set, and why a queue names one compute environment. Read that file first.
#
# THIS STACK CREATES NO LOG GROUP. All thirteen definitions write to
# /aws/batch/sbsandbox-intern-edullm-gpu, which infra/batch-compute-gpu.yaml creates and which
# the GPU execution role is scoped to. config/execution-targets.yaml records why one group and
# one role trio serve every GPU shape. The awslogs driver takes a group as a string, so
# CloudFormation sees no dependency between the two stacks: deleting the other one leaves
# these definitions logging nowhere, with nothing failing to say so.
#
# THE MaxvCpus SPLIT, AND WHY THE SUM IS NOW ABOVE BOTH QUOTAS ON PURPOSE.
#
# Every environment has its own ceiling and Batch enforces none of them against each other,
# so the sum is what this stack permits and the account quota is what the account can start.
# Both quotas were read with service-quotas get-service-quota on 2026-08-01 and again on
# 2026-08-02, unchanged between the two. L-DB2E81BA, "Running On-Demand G and VT instances",
# is 768 vCPU and covers g4dn, g5, g6 and g6e. L-417A185B, "Running On-Demand P instances",
# is 768 vCPU and covers p4d and p5. They are separate pools, so the P shapes below cannot
# starve the G shapes however busy they are.
#
# The rule the G pool follows is twenty-four concurrent jobs on a single-GPU shape, six on a
# four-GPU shape, three on an eight-GPU shape. Concurrency is worth most where a job is cheap
# and a researcher is iterating, and worth least where one job already occupies a whole large
# host, so the three terms keep the 8:2:1 ratio they were first written in.
#
# EVERY G CEILING AND gpu-1xh100 WERE TRIPLED ON 2026-08-03, WHICH IS THAT RATIO KEPT AND ITS
# SCALE MOVED. The rule read eight, two and one until then, and one is what a four-GPU or
# eight-GPU shape gave the second researcher to arrive: nothing, until the first finished.
# That is the same failure the two paragraphs beginning gpu-8xh100 MOVED FROM 192 TO 768
# describe on the P side, and the argument there is not repeated per shape here. A ceiling
# below the work refuses nothing at submission. Batch parks the job in RUNNABLE under
# MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE, which is a state the submitter cannot
# read from outside and which only the 1800 second cancel on each queue ends, so what a low
# number produces is a wait with no stated cause rather than a refusal anybody can act on.
# Spend is decided at the approval gate, where a person reads the rate of the shape that was
# priced; a ceiling is not where to buy it.
#
# THE P POOL DOES NOT FOLLOW THE LAST CLAUSE AT ALL, AND SAYING SO HERE IS CHEAPER THAN
# LEAVING THE TABLE BELOW TO CONTRADICT IT. Both eight-GPU P shapes are ceilinged at the
# whole P quota rather than at three instances, so gpu-8xh100 admits four concurrent jobs and
# gpu-8xa100 eight: on those two the quota runs out before the rule does. gpu-1xh100 takes
# the single-GPU term unchanged at twenty-four.
#
# EVERY CEILING BELOW IS A WHOLE NUMBER OF INSTANCES, WHICH IS A CONSTRAINT AND NOT A
# TIDINESS. Batch cannot place a job into a remainder smaller than one container, so a
# ceiling that is not a multiple of the instance type's vCPU count buys nothing with the
# remainder, and on an eight-GPU shape the remainder is most of a host: 500 on g5.48xlarge is
# two instances and 116 vCPU that can never hold anything. Each number below was computed
# from the vCPU count describe-instance-types reports for its type rather than by multiplying
# the old ceiling and accepting what came out.
#
#   G and VT pool                                          vCPU     concurrent jobs
#     gpu-1xa10g   g5.xlarge      other stack                384          96
#     gpu-1xt4     g4dn.xlarge                                96          24
#     gpu-1xl4     g6.xlarge                                  96          24
#     gpu-1xl40s   g6e.xlarge                                 96          24
#     gpu-4xt4     g4dn.12xlarge                             288           6
#     gpu-4xa10g   g5.12xlarge                               288           6
#     gpu-4xl4     g6.12xlarge                               288           6
#     gpu-4xl40s   g6e.12xlarge                              144           3
#     gpu-8xt4     g4dn.metal                                288           3
#     gpu-8xa10g   g5.48xlarge                               576           3
#     gpu-8xl4     g6.48xlarge                               576           3
#     gpu-8xl40s   g6e.48xlarge                              576           3
#                                                           ----
#                                                           3696  of 768
#
#   P pool
#     gpu-1xh100   p5.4xlarge                                384          24
#     gpu-8xa100   p4d.24xlarge                              768           8
#     gpu-8xh100   p5.48xlarge                               768           4
#                                                           ----
#                                                           1920  of 768
#
# THE G SUM WAS 720 OF 768 WITH 48 SPARE, THEN 1232, AND IS NOW 3696, WHICH IS ARITHMETIC AND
# NOT A DECISION TO SPEND MORE. An eight-device environment cannot place even one job unless
# its ceiling is the whole instance, so gpu-8xl4 and gpu-8xl40s needed 192 each and gpu-8xt4
# needed 96 before anything ran at all. One job each across all twelve G environments is 1004
# vCPU, so the discipline of keeping the sum under the quota stopped being available the
# moment three eight-device G shapes existed, and 1232 was already 464 above the quota before
# anything here was tripled. Holding to it would have meant taking concurrency away from
# shapes researchers already use, to buy a number that was never what bound.
#
# WHAT BINDS IS THE QUOTA AND NOT THE SUM. A quota is regional and account-wide and is not
# this stack's to spend, so anything else in this account that is a G or VT instance draws on
# the same 768, and a saturated pool refuses new instances rather than queueing them. A job
# Batch cannot place waits in RUNNABLE, and every queue below cancels a RUNNABLE job after
# 1800 seconds under CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY, which is the reason AWS
# documents for a launch EC2 refused. Whether a vCPU quota refusal is reported under that
# reason rather than under none of the three these queues name has not been measured here, so
# an exhausted pool is the first thing to check when a G job sits and nothing says why.
#
# SO WHAT TRIPLING THE G CEILINGS BUYS IS WHICH ENVIRONMENT MAY CLAIM THE SHARED POOL, AND
# NOT A LARGER POOL. This is the honest description of the change and it belongs beside the
# table rather than in a commit message. The G pool cannot exceed 768 vCPU however these
# twelve environments are configured, so the account can start exactly what it could start
# before: four g5.48xlarge, or a hundred and ninety-two g6.xlarge, or some mixture summing to
# 768. What changed is that a ceiling no longer refuses a job while the quota it draws on
# sits unclaimed -- gpu-8xa10g's own 192 refused its second job with 576 vCPU of G quota
# free, and gpu-4xl40s's 48 refused its second with 720 free. The cost of that is that the
# twelve environments now contend for the pool rather than being pre-divided by this file,
# and pre-division was never a fair split anyway: it reserved nothing for anybody, because a
# ceiling caps everybody together, and it went unused whenever the shape it was holding
# capacity for was idle.
#
# gpu-4xl40s WAS THE ONE DEVIATION FROM THE RULE, THE REASON WAS PRICE, AND THE PRICE HAS NOT
# CHANGED. g6e.12xlarge is $10.493/hour, twice any other four-GPU G shape, so its second and
# third concurrent jobs are the most expensive thing in this pool and three at once is
# $31.48/hour. It sat at 48, one instance, on that reasoning while the rule said two. It is
# 144 rather than the 288 the other three four-GPU shapes carry because the deviation is kept
# as the ratio it always was -- half of them -- rather than as a number frozen in place while
# everything around it moved. Each of those three jobs is still priced and released one at a
# time at $10.493, which is where the deviation is actually paid for.
#
# gpu-1xl40s does not take the same deviation even though g6e.xlarge is $1.861/hour and more
# than twice any other single-GPU G shape, because twenty-four of them is $44.66/hour and
# that is still under what three gpu-8xa10g jobs cost. gpu-1xa10g's ceiling is set in
# infra/batch-compute-gpu.yaml and was tripled there on the same day and for this reason.
#
# gpu-8xh100 MOVED FROM 192 TO 768, AND THE OLD NUMBER WAS A SPEND CONTROL WEARING A CAPACITY
# SETTING'S CLOTHES. 192 is one p5.48xlarge and the P quota is four of them, so the ceiling
# permitted a quarter of what the account can start. It is the wrong lever twice over. Spend
# is decided at the approval gate, where a person reads the figure before anything starts.
# This used to add that anything above EXCEPTION_RATE_CEILING_USD_PER_HOUR in
# src/edullm_platform/contracts/policy.py needed an admin whatever the total and that both P
# shapes were above it; policy v5 withdrew that ceiling, so the person reading the figure for
# either of these is a team lead. It is still a person and it is still not this field. And a
# ceiling below the work
# refuses nothing at submission, because Batch parks the job in RUNNABLE under
# MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE, which is a state a submitter cannot read
# from outside and which the 1800 second cancel on each queue is the only thing that ends.
# Four concurrent p5.48xlarge is $220/hour, against an account that spent $3,965 in the whole
# of July, and that figure is now the approval gate's to refuse rather than this field's.
#
# gpu-8xa100 MOVED FROM 96 TO 768 ON 2026-08-03, AND THAT IS THE PARAGRAPH ABOVE FINISHING
# ITS SWEEP RATHER THAN A SECOND POSITION. Every clause of it was already true of this shape.
# A team lead reads the figure before anything starts -- this said an admin did, because
# p4d.24xlarge was above EXCEPTION_RATE_CEILING_USD_PER_HOUR, and that constant is gone. A
# ceiling of one instance refused nothing at submission, because
# Batch parks the second job in RUNNABLE under
# MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE, which the submitter cannot read and
# which only the 1800 second cancel ends. 96 survived because that change was scoped to the
# shape somebody was looking at, and two researchers serialized against what it left behind.
# Eight p4d.24xlarge is 768 vCPU at $21.9576/hour, so $175.66/hour saturated, and MinvCpus is
# 0 so an idle environment bills none of it. L-417A185B is 768 vCPU, so the ceiling now
# equals what the account can start instead of claiming an eighth of it.
#
# THE P SUM MOVED FROM 992 TO 1664 AND IS NOW 1920 OF 768, THE LAST STEP BEING gpu-1xh100
# GOING 128 TO 384 WITH THE G SHAPES. IT IS THE ARITHMETIC THE G POOL ALREADY DOES ABOVE AND
# NOT A DECISION TO SPEND MORE. Each ceiling is what its shape may take when it is
# the only one running, and no combination of them is a budget anybody draws down; the quota
# is what refuses an instance. Holding the P sum under 768 would mean deciding in advance
# which of the three P shapes may use the pool, and this field cannot make that decision:
# it caps everybody together, as the next paragraph says, and reserves nothing for anybody.
#
# WHAT A CEILING DOES NOT DO. It caps everybody together and nobody individually, so one
# person submitting twenty-four jobs on a single-GPU shape still starves the others; it just
# takes longer, and tripling the number lengthened the queue one person can occupy alone by
# the same factor. Batch fair-share queues are the control for that and are a separate
# decision.
#
# SUBNETS ARE MEASURED PER INSTANCE TYPE AND ARE NOT A PROPERTY OF THE FAMILY.
# describe-instance-type-offerings on 2026-08-01 reports g4dn.xlarge, g4dn.12xlarge,
# g5.12xlarge, g5.48xlarge, g6.xlarge, g6.12xlarge and p5.48xlarge in us-east-1a, 1b, 1c, 1d
# and 1f, and g6e.12xlarge and p4d.24xlarge in 1a, 1b, 1c and 1d only. p5.48xlarge and
# p5.4xlarge are also offered in us-east-1e, and that zone had no subnet to offer them until
# 2026-08-03. It has one now, those two environments import it, and they are the only two
# that may -- the block above each of their Subnets lists says why, and
# infra/batch-network.yaml argues it at length.
#
# The four types added on 2026-08-02 were measured the same way on that date. g4dn.metal and
# g6.48xlarge are offered in 1a, 1b, 1c, 1d and 1f. g6e.48xlarge and g6e.xlarge are offered
# in 1a, 1b, 1c and 1d only. So eight environments list five subnets, four list four, and the
# two p5 shapes list six.
#
# gpu-1xl40s is the one a copy would have got wrong, and it is the shape two teams are
# waiting on. g6.xlarge and g6e.xlarge are the same size, sit next to each other in every
# table in this repository, and differ in exactly this, so a subnet list taken from the
# neighbour rather than from the measurement would have put a fifth zone on the one
# environment least able to afford a silent wait.
#
# A --dry-run is not evidence for this and must never be used as one. In this account it
# returns DryRunOperation for g6e.12xlarge in us-east-1f, a zone that does not offer it,
# because it answers "is this principal permitted" and not "can this succeed". A subnet Batch
# cannot place into produces a job that waits in RUNNABLE forever with no error anywhere.
#
# JobExecutionTimeoutMinutes IS 360 HERE AND 60 IN THE OTHER STACK, AND 360 IS BATCH'S
# MAXIMUM. The bound has to exceed the longest job a template edit could interrupt.
# config/policy.yaml caps a routine run at twenty-four hours and olmo-core-train now asks for
# twenty-four, so even the maximum is a quarter of what would be needed. It was half of what
# was needed while both numbers were twelve, and raising the ceiling widened the gap rather
# than opening it. A deploy during the last eighteen hours of a training run still stops
# waiting and kills it. Disabling the queue and waiting is the procedure for a template edit
# while a long run is in flight; this field cannot substitute for it.
#
# TWO OF THESE FOURTEEN ENVIRONMENTS NOW CARRY A LAUNCH TEMPLATE AND TWELVE DO NOT, WHICH
# IS A SCOPE AND NOT AN OVERSIGHT. gpu-8xa100 and gpu-8xh100 boot from
# PFamilyLaunchTemplate: a 500 GiB root volume in place of the AMI's 30, and an ECS agent
# told to clear a stopped container after fifteen minutes rather than three hours. The long
# comment above that resource records the 37.2 GiB corpus that did not fit, the three jobs
# that inherited each other's leftovers, and why the 8 TB of instance store sitting unused
# on a p4d is the right answer and a later one. Every other environment here keeps the AMI
# default, because the change was made while those two were idle and gpu and gpu-4xl40s
# were not.
#
# EVERY QUEUE NAME BELOW APPEARS IN THREE OTHER PLACES WITH NOTHING CONNECTING THEM:
# config/execution-targets.yaml, the event pattern in infra/batch-events.yaml, and the
# batch:SubmitJob scope of the admission states role in
# infra/iam/admission-service-roles.yaml. Rename one here alone and submissions keep
# succeeding while the rule matches nothing, so jobs run to completion and no lifecycle event,
# attempt or result record is ever written. tests/test_phase3_infrastructure.py compares all
# four files across every queue.

Resources:
  # -------------------------------------------------------------------------------------
  # gpu-1xt4, one T4 on g4dn.xlarge, $0.526/hour
  # -------------------------------------------------------------------------------------
  Gpu1xT4ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: sbsandbox-intern-edullm-gpu-1xt4
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 360
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 96
        InstanceTypes:
          - g4dn.xlarge
        InstanceRole:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/sbsandbox-intern-edullm-batch-gpu-instance
        Subnets:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1a
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1b
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1c
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1d
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1f
        SecurityGroupIds:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-security-group-id
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        UpdateToLatestImageVersion: true
        Tags:
          Name: sbsandbox-intern-edullm-batch-gpu-1xt4
          Project: edullm

  Gpu1xT4JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: sbsandbox-intern-edullm-gpu-1xt4
      State: ENABLED
      Priority: 1
      JobStateTimeLimitActions:
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT
          State: RUNNABLE
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment:
            Ref: Gpu1xT4ComputeEnvironment

  Gpu1xT4JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: sbsandbox-intern-edullm-gpu-1xt4-run
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 3600
      ContainerProperties:
        Image:
          Fn::Sub: ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sbsandbox-intern-edullm-olmo-core@sha256:50e2488ab3c77e859a8fe3e6d4a06d7d54f5c852bc7c5dd201fb9db53bff455b
        ExecutionRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-execution
        JobRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-workload
        ResourceRequirements:
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "15360"
          - Type: GPU
            Value: "1"
        Secrets:
          - Name: WANDB_API_KEY
            ValueFrom:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-fnwEVp
        Command:
          - python
          - -c
          - 'print("sbsandbox-intern-edullm-gpu-1xt4-run: no command override was supplied")'
        Environment:
          - Name: EDULLM_OUTPUT_BUCKET
            Value: sbsandbox-intern-edullm-outputs
          - Name: EDULLM_OUTPUT_PREFIX
            Value: s3://sbsandbox-intern-edullm-outputs/no-submission-supplied-a-prefix/
        LinuxParameters:
          SharedMemorySize: 4096
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: /aws/batch/sbsandbox-intern-edullm-gpu
            awslogs-stream-prefix: gpu-1xt4-run
            awslogs-region:
              Ref: AWS::Region
        Privileged: false

  # -------------------------------------------------------------------------------------
  # gpu-4xt4, four T4 on g4dn.12xlarge, $3.912/hour
  # -------------------------------------------------------------------------------------
  Gpu4xT4ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: sbsandbox-intern-edullm-gpu-4xt4
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 360
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 288
        InstanceTypes:
          - g4dn.12xlarge
        InstanceRole:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/sbsandbox-intern-edullm-batch-gpu-instance
        Subnets:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1a
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1b
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1c
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1d
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-subnet-us-east-1f
        SecurityGroupIds:
          - Fn::ImportValue: sbsandbox-intern-edullm-batch-security-group-id
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        UpdateToLatestImageVersion: true
        Tags:
          Name: sbsandbox-intern-edullm-batch-gpu-4xt4
          Project: edullm

  Gpu4xT4JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: sbsandbox-intern-edullm-gpu-4xt4
      State: ENABLED
      Priority: 1
      JobStateTimeLimitActions:
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: CAPACITY:INSUFFICIENT_INSTANCE_CAPACITY
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:COMPUTE_ENVIRONMENT_MAX_RESOURCE
          State: RUNNABLE
        - Action: CANCEL
          MaxTimeSeconds: 1800
          Reason: MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT
          State: RUNNABLE
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment:
            Ref: Gpu4xT4ComputeEnvironment

  Gpu4xT4JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: sbsandbox-intern-edullm-gpu-4xt4-run
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 3600
      ContainerProperties:
        Image:
          Fn::Sub: ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sbsandbox-intern-edullm-olmo-core@sha256:50e2488ab3c77e859a8fe3e6d4a06d7d54f5c852bc7c5dd201fb9db53bff455b
        ExecutionRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-execution
        JobRoleArn:
          Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-workload
        ResourceRequirements:
          - Type: VCPU
            Value: "48"
          - Type: MEMORY
            Value: "184320"
          - Type: GPU
            Value: "4"
        Secrets:
          - Name: WANDB_API_KEY
            ValueFrom:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-fnwEVp
        Command:
          - python
          - -c
          - 'print("sbsandbox-intern-edullm-gpu-4xt4-run: no command override was supplied")'
        Environment:
          - Name: EDULLM_OUTPUT_BUCKET
            Value: sbsandbox-intern-edullm-outputs
          - Name: EDULLM_OUTPUT_PREFIX
            Value: s3://sbsandbox-intern-edullm-outputs/no-submission-supplied-a-prefix/
        LinuxParameters:
          SharedMemorySize: 49152
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: /aws/batch/sbsandbox-intern-edullm-gpu
            awslogs-stream-prefix: gpu-4xt4-run
            awslogs-region:
              Ref: AWS::Region
        Privileged: false

  # -------------------------------------------------------------------------------------
  # gpu-8xt4, eight T4 on g4dn.metal, $7.824/hour. The T4 family has no 24xlarge, so eight
  # devices means the bare-metal host and its whole 96 vCPU, which is why this environment's
  # ceiling is 288 rather than the 576 the other two eight-device G shapes carry. Both are
  # three instances; the host is half the size.
  # -------------------------------------------------------------------------------------
  Gpu8xT4ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: sbsandbox-intern-edullm-gpu-8xt4
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 360
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        MaxvCpus: 288
        InstanceTypes:
          - g4dn.metal
        InstanceRole:
