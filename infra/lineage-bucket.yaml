AWSTemplateFormatVersion: "2010-09-09"
Description: Write-once lineage store for admission intents, decisions and conflicts.

Resources:
  LineageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: sbsandbox-intern-edullm-lineage
      VersioningConfiguration:
        Status: Enabled
      # Object Lock is two switches with different reversibility, and conflating them
      # would cost a bucket. Turning the lock on is creation-only: there is no update
      # path, enabling it on an existing bucket needs a support request, and a stack
      # recreated without this property yields a permanently mutable bucket fixable only
      # under a new name. The default retention rule is not like that — it can be added,
      # changed and removed on a live bucket at any time. Measured against this account
      # on 2026-07-27 rather than read off the documentation: a bucket was created locked
      # with no rule, a GOVERNANCE/30 rule was added to it, the rule was removed again, an
      # object written under no rule reported ObjectLockMode null, and that version was
      # permanently deleted. Object Lock also requires versioning, which is why the two
      # are set together above.
      #
      # So the lock is on and no rule is set. Records are deletable today, deliberately:
      # this store is being filled with the test submissions that build the phase, and
      # holding those for thirty days in a shared sandbox buys nothing. Deletable is not
      # the same as overwritable — the bucket policy below refuses any write that does not
      # carry If-None-Match, so first-write-wins holds regardless of retention.
      #
      # Adding the rule later is a stack update, not a new bucket. When these records
      # start carrying real approvals, add:
      #
      #   ObjectLockConfiguration:
      #     ObjectLockEnabled: Enabled
      #     Rule:
      #       DefaultRetention:
      #         Mode: GOVERNANCE
      #         Days: 30
      #
      # GOVERNANCE rather than COMPLIANCE when that day comes: GOVERNANCE is overridable
      # by a principal holding s3:BypassGovernanceRetention, COMPLIANCE by nobody at all
      # including the account root, and an unrecoverable mistake in a shared sandbox is
      # worse than a recoverable one.
      ObjectLockEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  LineageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: LineageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Every write to this bucket must be conditional. A caller that omits
          # If-None-Match is refused; a caller that sends `If-None-Match: *` is refused by
          # S3 itself, with 412, if the key already exists. Together those two make first
          # write wins a property of the bucket rather than a habit of its callers.
          #
          # This is a Deny and not an Allow-with-condition on purpose. An Allow can be
          # widened by any other Allow that reaches the same object -- an identity policy,
          # a future statement here, a session policy -- and the unconditional write then
          # succeeds through the other grant. An explicit Deny cannot be escaped by adding
          # permissions anywhere, so the invariant survives changes made by people who
          # have not read this file.
          #
          # The cost is real and accepted: CopyObject into this bucket cannot carry
          # If-None-Match, so it is refused outright. Nothing may be copied, re-uploaded,
          # or moved here; a lineage record is written once by the state machine at the
          # moment the fact it records became true, or it is not written at all. Anything
          # that needs to reshape these records writes the result somewhere else.
          - Sid: DenyWritesThatAreNotConditional
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/*
            Condition:
              "Null":
                s3:if-none-match: "true"

Outputs:
  BucketName:
    Value:
      Ref: LineageBucket
  BucketArn:
    Value:
      Fn::GetAtt:
        - LineageBucket
        - Arn
