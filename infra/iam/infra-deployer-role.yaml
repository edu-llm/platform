AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions role that deploys the CloudFormation stacks this repository owns.

Resources:
  InfraDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-infra-deployer
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      # Pinned to main on purpose. This role only deploys bootstrap stacks, and the stack
      # that creates it is applied from a laptop, so no branch ever needs to reach AWS
      # through it. A branch wildcard here would hand every feature branch the ability to
      # rewrite the account's ECR stacks.
      #
      # job_workflow_ref is a list because three workflow files deploy through this role,
      # one per phase. An array under a single StringEquals key is an OR across its
      # elements, so any of those files' jobs is accepted and nothing else is; a StringLike
      # over .github/workflows/* would have accepted any workflow anyone adds. Each entry
      # names a file that must keep its exact path: renaming one revokes its deployments
      # silently, and the run fails at AssumeRole with nothing pointing at the rename.
      #
      # The sub value carries owner and repository ids because this organization issues
      # immutable subject claims. Verified against the live repository settings:
      # `gh api repos/edu-llm/platform/actions/oidc/customization/sub` reports
      # sub_claim_prefix repo:edu-llm@306859726/platform@1311508598. A repository still on
      # legacy subjects would need repo:edu-llm/platform here instead, and would fail to
      # assume this role until the value is corrected.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:job_workflow_ref:
                  - edu-llm/platform/.github/workflows/deploy-phase1-ecr.yml@refs/heads/main
                  - edu-llm/platform/.github/workflows/deploy-phase2-admission.yml@refs/heads/main
                  - edu-llm/platform/.github/workflows/deploy-phase3-batch.yml@refs/heads/main
                token.actions.githubusercontent.com:repository_owner_id: "306859726"
                token.actions.githubusercontent.com:repository_id: "1311508598"
              StringLike:
                token.actions.githubusercontent.com:sub: repo:edu-llm@306859726/platform@1311508598:ref:refs/heads/main
      # Inline rather than a customer managed policy. InternSandboxBoundary denies
      # iam:CreatePolicyVersion on every policy, so a managed policy could be created once
      # and never amended; the first permission change would fail the stack update. Inline
      # policies go through iam:PutRolePolicy, which the boundary permits on this name.
      Policies:
        - PolicyName: deploy-phase1-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                # The wildcard starts after the edullm segment on purpose. This is a
                # shared account: sbsandbox-intern- alone is every intern's prefix, so
                # sbsandbox-intern-* would grant DeleteStack over their stacks too.
                # Everything this repository deploys is named sbsandbox-intern-edullm-*,
                # so nothing is gained by widening it back.
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-*/*
              # cloudformation:ValidateTemplate is the only action here that the
              # CloudFormation service authorization reference lists with no resource type
              # at all, so "*" is the narrowest grant that exists for it. Every other
              # action, GetTemplateSummary included, accepts a stack ARN and is scoped
              # above: `aws cloudformation deploy` only ever calls it with a StackName.
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              # CloudFormation acts as this role while it reconciles the ECR stack, so the
              # role needs the repository lifecycle itself. ecr:PutLifecyclePolicy is what
              # the retired shared role was missing.
              #
              # Deliberately absent: ecr:SetRepositoryPolicy, ecr:GetRepositoryPolicy and
              # ecr:DeleteRepositoryPolicy. A repository policy is the one ECR grant that
              # changes who may pull or push an image, and no committed template sets one.
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:PutLifecyclePolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:ListTagsForResource
                # Narrowed after the edullm segment for the same reason as the stack scope.
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-*
        # A second inline policy rather than more statements in the first. Inline policies
        # are unioned, so the effective permissions are identical either way, and keeping
        # them apart means deploy-phase1-stacks still says exactly what it said when it
        # was reviewed: a Phase 2 edit cannot quietly change the Phase 1 scope, and
        # `aws iam list-role-policies` shows the phase boundary. It also keeps the policy
        # names honest -- deploy-phase1-stacks would be a lie once it deployed Phase 2.
        - PolicyName: deploy-phase2-admission-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The only unscoped grant Phase 2 adds, and it sits beside the scoped
              # log-group statement below rather than inside the Phase 1 policy: the
              # CloudWatch Logs service authorization reference lists logs:DescribeLogGroups
              # with an empty resource-types column, so "*" is the narrowest grant that
              # exists for it. It was first written into the log-group-scoped statement
              # below, which reads as the careful choice and is the wrong one -- the deploy
              # failed with "Unable to retrieve Arn attribute for AWS::Logs::LogGroup, with
              # error message Access denied for operation 'logs:DescribeLogGroups'", which
              # names the action and gives no hint that the scope is what refused it.
              #
              # Widening is bounded by what the action can do: DescribeLogGroups lists
              # group names, ARNs, retention and sizes. It reads no log content, and
              # logs:GetLogEvents and logs:FilterLogEvents are absent from this role
              # entirely, so this cannot become a way to read anybody's logs.
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              # The read half of this list is not a list of things the templates use. The
              # AWS::S3::Bucket resource handler reads every configuration surface a
              # bucket has on each Read -- CORS, replication, analytics, website and the
              # rest -- whether or not the template sets them, and an AccessDenied on any
              # one of them fails the stack update rather than being skipped. The write
              # half is only what infra/lineage-bucket.yaml, infra/artifacts-bucket.yaml
              # and infra/outputs-bucket.yaml actually set, so adding a new bucket property
              # fails the deploy until this is amended, which is the direction that fails
              # closed.
              #
              # s3:PutLifecycleConfiguration is the third time that direction has been paid
              # for, and the shape is identical each time: the read was granted and the
              # matching write was not. Phase 1 lost a stack to ecr:PutLifecyclePolicy
              # while holding ecr:GetLifecyclePolicy, Phase 2 to logs:DescribeLogGroups,
              # and Phase 3's first deploy to this one -- s3:GetLifecycleConfiguration sits
              # in the read half below and reads as though the lifecycle were covered.
              # infra/outputs-bucket.yaml is the first bucket here to carry a
              # LifecycleConfiguration, and the denial arrived after CreateBucket had
              # already succeeded, so DeletionPolicy: Retain left the bucket behind.
              #
              # s3:DeleteBucketLifecycle is deliberately absent. It is what the handler
              # calls when a LifecycleConfiguration is removed from a template, and no
              # committed template has one to remove, so leaving it out means deleting that
              # block is a deploy failure naming the action -- the same fail-closed
              # direction the rest of the write half is chosen on.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketVersioning
                  - s3:PutBucketObjectLockConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketTagging
                  - s3:PutBucketPolicy
                  - s3:PutLifecycleConfiguration
                  - s3:DeleteBucketPolicy
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:GetBucketObjectLockConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketTagging
                  - s3:GetBucketPolicy
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketLogging
                  - s3:GetBucketNotification
                  - s3:GetBucketCORS
                  - s3:GetBucketWebsite
                  - s3:GetAccelerateConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:GetAnalyticsConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetMetricsConfiguration
                  - s3:GetIntelligentTieringConfiguration
                # Narrowed after the edullm segment for the same reason as the stack
                # scope above: sbsandbox-intern- alone is every intern's prefix.
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-*
              # Objects in the artifacts bucket only, not in every bucket carrying our
              # prefix. CloudFormation needs to read the packaged zip to create the
              # function, and the release procedure needs to upload it. Neither reason
              # reaches the lineage bucket, and the deployer holding PutObject or
              # DeleteObject over a write-once lineage store would undo the property that
              # store exists to have -- Object Lock would refuse the delete, but a role
              # that has to be stopped by Object Lock should not have been granted it.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:AbortMultipartUpload
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-artifacts/*
              # One action, on one bucket, learned from a failed deploy rather than from
              # reading the Lambda documentation. AWS::Lambda::Function with a Code block
              # naming an S3ObjectVersion makes Lambda fetch the object as the deploying
              # principal, and that fetch needs s3:ListBucketVersions on the *bucket* as
              # well as s3:GetObjectVersion on the object. Nothing in the template says
              # so; the deploy failed with an explicit AccessDenied naming the action and
              # the bucket, and the stack rolled back with the function uncreated.
              #
              # Kept out of the bucket statement above, whose resource is every bucket
              # carrying our prefix. Only the artifacts bucket holds a deployment zip, and
              # a deployer able to enumerate the versions of every lineage record is a
              # wider grant than the reason for granting it.
              - Effect: Allow
                Action: s3:ListBucketVersions
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-artifacts
              # Deliberately absent: states:StartExecution and states:StopExecution. This
              # role builds the admission state machine and never runs one; starting an
              # execution is the submission role's single permission, and keeping the two
              # apart is what stops a deploy credential from admitting a run.
              - Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:DeleteStateMachine
                  - states:UpdateStateMachine
                  - states:DescribeStateMachine
                  - states:TagResource
                  - states:UntagResource
                  - states:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:sbsandbox-intern-edullm-*
              # Deliberately absent: lambda:InvokeFunction, lambda:AddPermission and
              # lambda:RemovePermission. The deployer creates the validator but may
              # neither run it nor change who may run it.
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:ListVersionsByFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-*
              # Deliberately absent: logs:PutLogEvents and logs:DeleteLogStream. The
              # deployer creates the group the admission executions are recorded into and
              # must not be able to write into that record or remove part of it.
              #
              # The scope is the vendedlogs path, so this cannot reach the Lambda's own
              # /aws/lambda/ group either. A trailing wildcard is unnecessary: an IAM
              # wildcard matches ':' too, so log-group:/aws/vendedlogs/states/
              # sbsandbox-intern-edullm-* already covers the ':*' ARN form.
              #
              # logs:DescribeLogGroups is NOT in this list, and it was, and that is what
              # broke the second deploy. It is granted unscoped below for the reason
              # recorded there.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/sbsandbox-intern-edullm-*
              # This is the one grant here that meaningfully widens the deployer, so it is
              # the one worth arguing about. CloudFormation acts as this role, and both
              # states:CreateStateMachine and lambda:CreateFunction take a roleArn, which
              # the calling principal must hold iam:PassRole for. Without it the admission
              # stack cannot be created at all.
              #
              # The two role ARNs are written out in full and must stay that way. A prefix
              # -- sbsandbox-intern-edullm-* -- would let this role pass any role that
              # ever gets that name, including one created later with permissions nobody
              # weighed against a deploy credential; passing a role is how a principal
              # lends its own limits away. Naming both roles means adding a third is a
              # visible edit to this file rather than something a new role name inherits.
              #
              # The blast radius is bounded on the other side as well: each of these two
              # roles is trusted only by the single AWS service named in its own trust
              # policy, so passing one anywhere else yields a role that cannot be assumed.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-admission-states
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-admission-lambda
        # A third inline policy, for the reason the second one is separate from the first:
        # the phase boundary stays visible in `aws iam list-role-policies`, and a Phase 3
        # edit cannot quietly change what Phase 1 or Phase 2 was reviewed with. The three
        # are unioned by IAM, so the effective permissions are the same either way and the
        # only thing separation costs is a longer file.
        #
        # Nothing here lets this role run anything. batch:SubmitJob, batch:TerminateJob and
        # batch:CancelJob are all absent, deliberately, and that is the whole separation
        # this phase rests on: the deployer builds the queue and the admission state
        # machine is the only principal in the account that may put work on it. The same
        # argument already keeps states:StartExecution off this role.
        #
        # iam:CreateServiceLinkedRole is absent too, per D5. Batch creates
        # AWSServiceRoleForBatch on the first CreateComputeEnvironment if the caller holds
        # it, which would put a role-creation call into a pipeline -- the thing the first
        # paragraph of infra/README.md exists to prevent. A person runs one command
        # instead; the command is in that file.
        #
        # ec2:RunInstances is absent. This role creates a compute environment and Batch's
        # own service-linked role launches the instances, so a deployer that could launch
        # one directly would be a compute path outside admission.
        #
        # eks:DescribeCluster is absent, and it is the one absence a reader is most likely
        # to mistake for an oversight, because it sits in the Create, Update and Delete
        # lists of the AWS::Batch::ComputeEnvironment handler. It is reachable only through
        # an EksConfiguration, and infra/batch-compute.yaml sets Type: EC2 and no EKS
        # configuration at all. It measured scopable on 2026-07-27, so if Phase 4 ever
        # needs it the grant is a cluster ARN rather than a wildcard -- which is the reason
        # to record the measurement here rather than only the refusal.
        - PolicyName: deploy-phase3-batch-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # MEASURED, CONTROL-VERIFIED, AND NOT TO BE SCOPED. Every action in this
              # statement is listed in its service authorization reference with no resource
              # type, so "*" is the narrowest grant that exists for it and an ARN-scoped
              # grant denies it outright.
              #
              # The measurement, on 2026-07-27 against this account: grant the action on
              # exactly one ARN in a custom policy, then iam:SimulateCustomPolicy that
              # action with --resource-arns naming the same ARN. Resource-level support
              # means the grant matches and the answer is `allowed`; no resource type means
              # IAM evaluates against `*`, the grant never matches, and the answer is
              # `implicitDeny`. Two controls ran on every invocation and both behaved:
              # cloudformation:ValidateTemplate returned implicitDeny (known to have no
              # resource type, from a live Phase 1 deploy failure) and
              # cloudformation:DescribeStacks returned allowed (known scopable, and scoped
              # in the Phase 1 policy above).
              #
              # It is a separate statement for the reason Phase 2 learned expensively with
              # logs:DescribeLogGroups. Written into a scoped statement, an action like this
              # reads as the careful choice and is the wrong one, and the deploy fails with
              # a message naming the action and no hint that the scope is what refused it.
              # Everything else Phase 3 needs is scopable and is scoped below, including
              # batch:SubmitJob -- which this role does not hold for a different reason.
              - Effect: Allow
                Action:
                  - batch:DescribeComputeEnvironments
                  - batch:DescribeJobDefinitions
                  - batch:DescribeJobQueues
                  - batch:DescribeJobs
                  - batch:ListJobs
                  - events:ListRules
                Resource: "*"
              # The second unscoped statement, and it is unscoped for a different reason
              # that is worth keeping apart from the one above. EC2's Describe actions are
              # account-wide by design -- they enumerate, they do not address, and the EC2
              # service authorization reference lists none of them with a resource type.
              # The first ten rest on that documented model, and the CloudFormation
              # resource handlers for VPC, Subnet, RouteTable, InternetGateway and
              # SecurityGroup call them on every Read.
              #
              # The five added on 2026-07-27 were measured rather than assumed, with the
              # same probe and the same two controls as the statement above:
              # ec2:DescribeInstances, ec2:DescribeLaunchTemplateVersions,
              # ec2:DescribeNetworkInterfaces, ec2:DescribeVpcEncryptionControls and
              # ec2:DescribeVpnGateways each answered implicitDeny when granted on one ARN
              # and simulated against that same ARN, while cloudformation:ValidateTemplate
              # answered implicitDeny and cloudformation:DescribeStacks answered allowed on
              # every invocation.
              #
              # None of the five is inferable from the templates, which is the whole reason
              # they were missing, so which handler calls each one is recorded here:
              #   - DescribeVpnGateways: AWS::EC2::VPCGatewayAttachment's Read, and its
              #     Create, Update and Delete too -- on the attachment that names an
              #     internet gateway and no VPN gateway at all;
              #   - DescribeVpcEncryptionControls: AWS::EC2::VPC's Read, a configuration
              #     surface no template here sets;
              #   - DescribeNetworkInterfaces: AWS::EC2::Route's Create, which resolves a
              #     target that may be an ENI even when ours is a gateway;
              #   - DescribeInstances: AWS::EC2::SecurityGroup's Delete, so this one is
              #     needed on the rollback path rather than on the create path. That is the
              #     path that stranded the Phase 1 ECR stack, and a rollback that cannot
              #     finish leaves a DELETE_FAILED stack holding the name;
              #   - DescribeLaunchTemplateVersions: AWS::Batch::ComputeEnvironment's
              #     Create, Update and Delete, whether or not a launch template is named.
              #
              # Read-only, and that bounds it: this statement reveals the shape of the
              # shared account's networking and changes none of it. The actions that change
              # networking are below, and their scope is the problem recorded there.
              - Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInstances
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeTags
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeVpcEncryptionControls
                  - ec2:DescribeVpcs
                  - ec2:DescribeVpnGateways
                Resource: "*"
              # THE WIDEST GRANT IN THIS FILE, and the one to argue about rather than skim.
              #
              # An EC2 network resource is addressed by an ID the service assigns at
              # creation -- vpc-08fdb401..., subnet-0a1b... -- and IAM has no name to scope
              # on, so `vpc/*` is the narrowest ARN that can be written. That means this
              # role can delete any VPC, subnet, route table, internet gateway or security
              # group in a shared account that currently holds six VPCs belonging to other
              # interns. Nothing about the sbsandbox-intern-edullm- convention helps here,
              # because the convention lives in a tag and a Name, not in the ARN.
              #
              # What actually bounds it, in the order it bites:
              #   - this role is assumable only by three named workflow files on main, and
              #     each of those deploys only the templates committed in this repository;
              #   - CloudFormation is what makes the calls, against a template a reviewer
              #     read, so a delete happens only where a committed template says so;
              #   - CloudTrail records every one of these calls against this role name.
              #
              # What does not bound it, and should: a condition on
              # aws:RequestTag/aws:ResourceTag, so that the delete and modify verbs reach
              # only resources this project created. That is the correct narrowing and it
              # is deliberately not written here, because create-time tagging has ordering
              # rules this repository has not measured and a condition that is subtly wrong
              # produces a deploy that fails in the middle with half a network. It is the
              # first thing Phase 4 should measure, before it adds a second subnet list.
              #
              # Four of these were added on 2026-07-27, each because a property one of the
              # templates sets is what calls it -- the same test the S3 write half above is
              # chosen by:
              #   - ModifyVpcTenancy for InstanceTenancy, which batch-network.yaml pins to
              #     default;
              #   - ReplaceRoute for the default route's DestinationCidrBlock and
              #     GatewayId, which is how a change to either is applied in place rather
              #     than by recreating the route;
              #   - ReplaceRouteTableAssociation, which is in the *Create* handler of
              #     AWS::EC2::SubnetRouteTableAssociation and not only in its update path,
              #     because a subnet already carrying an association is replaced rather
              #     than associated twice;
              #   - UpdateSecurityGroupRuleDescriptionsEgress for the Description on each
              #     of the two egress rules.
              #
              # The three ingress verbs are absent and must stay absent.
              # ec2:AuthorizeSecurityGroupIngress, ec2:RevokeSecurityGroupIngress and
              # ec2:UpdateSecurityGroupRuleDescriptionsIngress all appear in the
              # AWS::EC2::SecurityGroup handler's lists and none of them is reachable,
              # because batch-network.yaml declares no SecurityGroupIngress at all and
              # says why. Granting them against a rule this repository has decided never to
              # write would hand a deploy credential the ability to open a port on any
              # security group in a shared account.
              #
              # Absent for the same "no property sets it" reason, each measured as scopable
              # so that adding one later is an ARN rather than a wildcard:
              # ec2:CreateVpcEncryptionControl, ec2:AttachVpnGateway, ec2:DetachVpnGateway,
              # ec2:AssociateSubnetCidrBlock and ec2:DisassociateSubnetCidrBlock.
              #
              # ec2:RunInstances is absent from this list and must stay absent.
              - Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:CreateInternetGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVpc
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                  - ec2:ModifyVpcTenancy
                  - ec2:ReplaceRoute
                  - ec2:ReplaceRouteTableAssociation
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:UpdateSecurityGroupRuleDescriptionsEgress
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
              - Effect: Allow
                Action:
                  - batch:CreateComputeEnvironment
                  - batch:DeleteComputeEnvironment
                  - batch:UpdateComputeEnvironment
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:compute-environment/sbsandbox-intern-edullm-*
              # CreateJobQueue and UpdateJobQueue authorize against the compute environments
              # the queue names as well as against the queue itself, so both ARNs are here
              # and DeleteJobQueue is split out below. This was measured rather than read:
              # the Service Authorization Reference lists the resource types an action
              # accepts without saying that a single call is authorized against more than
              # one of them, and the deploy that found it failed with
              #
              #   not authorized to perform: batch:CreateJobQueue on resource:
              #   arn:aws:batch:us-east-1:<account>:compute-environment/sbsandbox-intern-edullm-cpu
              #
              # naming the compute environment on an action that reads as being about the
              # queue. Both take computeEnvironmentOrder, which is the property being
              # authorized; a scope covering only the queue denies the create outright.
              - Effect: Allow
                Action:
                  - batch:CreateJobQueue
                  - batch:UpdateJobQueue
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:compute-environment/sbsandbox-intern-edullm-*
              # Delete takes the queue and nothing else -- there is no compute environment in
              # the request to authorize against -- so it keeps the narrower scope rather
              # than inheriting the pair above.
              - Effect: Allow
                Action:
                  - batch:DeleteJobQueue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-*
              # RegisterJobDefinition mints a revision and the revision is part of the ARN,
              # so the scope carries the :* the queue and compute-environment scopes do not
              # need. Without it the first deploy registers revision 1 and the second is
              # denied, which reads as a permissions change nobody made.
              - Effect: Allow
                Action:
                  - batch:DeregisterJobDefinition
                  - batch:RegisterJobDefinition
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-*
              # One statement for the three tag verbs across all three Batch resource types,
              # rather than the same three actions repeated in each scope above. Batch uses
              # one set of tagging actions for every resource it owns, so splitting them by
              # resource type would mean tagging a queue was denied by a policy that looks
              # as though it covers tagging.
              - Effect: Allow
                Action:
                  - batch:ListTagsForResource
                  - batch:TagResource
                  - batch:UntagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:compute-environment/sbsandbox-intern-edullm-*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-*
              # events:ListRules is not here. It has no resource type and is granted
              # unscoped above; everything else the rule lifecycle needs does take a rule
              # ARN, and a rule ARN on the default event bus is rule/<name>.
              - Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:ListTagsForResource
                  - events:ListTargetsByRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/sbsandbox-intern-edullm-*
              # The Batch job log group, on the /aws/batch/ path, which is a different tree
              # from the /aws/vendedlogs/states/ path the Phase 2 policy scopes. Neither
              # statement reaches the other's groups, so a Phase 3 deploy cannot touch the
              # admission execution record and a Phase 2 deploy cannot touch the job logs.
              #
              # Deliberately absent, as in Phase 2: logs:PutLogEvents and
              # logs:DeleteLogStream. The deployer creates the group a job's output is
              # written into and must not be able to write into it or remove part of it.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DeleteRetentionPolicy
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/sbsandbox-intern-edullm-*
              - Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListTagsForResource
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:sbsandbox-intern-edullm-*
              # The queue half of D6. EventBridge delivers to SQS and an event source
              # mapping attaches the recorder, which is what lets this role stay without
              # lambda:AddPermission -- the grant the Phase 2 policy excludes with the
              # comment "the deployer creates the validator but may neither run it nor
              # change who may run it". That decision is not reversed here; it is routed
              # around, and the routing buys real retry and dead-letter semantics as well.
              #
              # An SQS ARN has no path segment, so the queue and its dead-letter queue are
              # both covered by the one prefix. sqs:SendMessage, sqs:ReceiveMessage,
              # sqs:DeleteMessage and sqs:PurgeQueue are absent: the deployer builds the
              # queue, and reading or draining it is the recorder's business and the
              # operator's.
              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueueTags
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:sbsandbox-intern-edullm-*
              # The other half of D6, and both ARNs are here because one of them was
              # measured the hard way. This statement previously carried the function ARN
              # alone, on the reasoning that a mapping is identified by a UUID that does
              # not exist until it is created, so there could be nothing to match on. That
              # reasoning is intuitive and it is wrong: Lambda authorizes the create
              # against the mapping ARN pattern, and the deploy that found it failed with
              #
              #   not authorized to perform: lambda:CreateEventSourceMapping on resource:
              #   arn:aws:lambda:us-east-1:<account>:event-source-mapping:*
              #
              # naming the very ARN the absent UUID was the argument against. The function
              # ARN stays because the call authorizes against both -- the same shape as
              # batch:CreateJobQueue above, which authorizes against the compute
              # environment it names as well as against the queue.
              #
              # `event-source-mapping:*` is the narrowest ARN that exists, for the reason
              # the old comment gave: there is no name for IAM to match on. Granting three
              # write verbs on every mapping in a shared account is not acceptable on that
              # basis alone, so the scope is closed with a condition instead of an ARN.
              #
              # lambda:FunctionArn is documented for exactly this: "Event source mappings
              # are always associated with a function. You can also use the
              # lambda:FunctionArn condition to restrict actions by associated function."
              # So the reachable set is mappings whose function is ours, which is the same
              # set the function ARN below describes -- the pair says "these mappings, on
              # these functions" rather than "any mapping".
              #
              # If Lambda ever stops populating that key for a create, this statement stops
              # matching and the deploy fails naming the action. That is the direction to
              # fail in, and it is why the condition is preferred over widening.
              #
              # These four manage which queue a function reads. They do not decide who may
              # invoke a function; lambda:AddPermission, which does, stays absent.
              - Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-*
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*
                Condition:
                  ArnLike:
                    lambda:FunctionArn:
                      Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-*
              # The fifth event-source-mapping grant, in a statement of its own because it
              # is the one that does NOT authorize against the function ARN. The
              # AWS::Lambda::EventSourceMapping Read handler lists the mapping's tags, and
              # lambda:ListTags authorizes against whatever ARN it is handed -- here the
              # mapping's, not the function's -- so the Phase 2 grant of the same action on
              # the function prefix does not cover this call. Folding it into the statement
              # above would produce exactly the Phase 2 failure again: an action granted,
              # on a scope that cannot match, denied with a message naming the action.
              #
              # A mapping is addressed by a UUID Lambda assigns at creation, so there is no
              # name for IAM to match on and `event-source-mapping:*` is the narrowest ARN
              # that can be written. That is the EC2 problem arriving in a second service,
              # and it is bounded far better here: this is read-only and it reads tag keys
              # and values on event source mappings, which is not a capability anybody
              # would notice being without.
              - Effect: Allow
                Action: lambda:ListTags
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*
              # Seven whole role ARNs, and they must stay whole. A prefix --
              # sbsandbox-intern-edullm-* -- would let this role pass any role that ever
              # takes such a name, including one created in a later phase with permissions
              # nobody weighed against a deploy credential; passing a role is how a
              # principal lends its own limits away. Naming each one means an eighth is a
              # visible edit to this file rather than something a new role name inherits.
              #
              # THE PHASE 4 EDIT IS WHAT THAT SENTENCE WAS FOR. This list said four when it
              # was written, and it predicted "one created in Phase 4". The three that
              # arrived are the GPU trio in infra/iam/batch-gpu-roles.yaml, and they are
              # here because a reader weighed them, not because their names matched.
              #
              # Which call needs which:
              #   - batch:CreateComputeEnvironment passes an instance role, through the
              #     instance profile that wraps it. The profile is not itself passed --
              #     iam:PassRole authorizes on the role inside it;
              #   - batch:RegisterJobDefinition passes an execution role and a workload
              #     role, which is where a container's two identities are fixed. There are
              #     two job definitions, so there are two of each;
              #   - lambda:CreateFunction passes the lifecycle recorder's role. That verb
              #     is granted by the Phase 2 policy above and is not repeated here.
              #
              # The blast radius is bounded on the other side too: each of these seven is
              # trusted only by the single AWS service its own trust policy names, so
              # passing one anywhere else yields a role that cannot be assumed.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-execution
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-workload
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-instance
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-execution
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-workload
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-instance
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-lifecycle-lambda

Outputs:
  RoleName:
    Value:
      Ref: InfraDeployerRole
  RoleArn:
    Value:
      Fn::GetAtt:
        - InfraDeployerRole
        - Arn
