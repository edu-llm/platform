AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions role that deploys the CloudFormation stacks this repository owns.

Resources:
  InfraDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-infra-deployer
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      # Pinned to main on purpose. This role only deploys bootstrap stacks, and the stack
      # that creates it is applied from a laptop, so no branch ever needs to reach AWS
      # through it. A branch wildcard here would hand every feature branch the ability to
      # rewrite the account's ECR stacks.
      #
      # job_workflow_ref is a list because two workflow files deploy through this role,
      # one per phase. An array under a single StringEquals key is an OR across its
      # elements, so either file's job is accepted and nothing else is; a StringLike over
      # .github/workflows/* would have accepted any workflow anyone adds. Each entry names
      # a file that must keep its exact path: renaming one revokes its deployments
      # silently, and the run fails at AssumeRole with nothing pointing at the rename.
      #
      # The sub value carries owner and repository ids because this organization issues
      # immutable subject claims. Verified against the live repository settings:
      # `gh api repos/edu-llm/platform/actions/oidc/customization/sub` reports
      # sub_claim_prefix repo:edu-llm@306859726/platform@1311508598. A repository still on
      # legacy subjects would need repo:edu-llm/platform here instead, and would fail to
      # assume this role until the value is corrected.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:job_workflow_ref:
                  - edu-llm/platform/.github/workflows/deploy-phase1-ecr.yml@refs/heads/main
                  - edu-llm/platform/.github/workflows/deploy-phase2-admission.yml@refs/heads/main
                token.actions.githubusercontent.com:repository_owner_id: "306859726"
                token.actions.githubusercontent.com:repository_id: "1311508598"
              StringLike:
                token.actions.githubusercontent.com:sub: repo:edu-llm@306859726/platform@1311508598:ref:refs/heads/main
      # Inline rather than a customer managed policy. InternSandboxBoundary denies
      # iam:CreatePolicyVersion on every policy, so a managed policy could be created once
      # and never amended; the first permission change would fail the stack update. Inline
      # policies go through iam:PutRolePolicy, which the boundary permits on this name.
      Policies:
        - PolicyName: deploy-phase1-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                # The wildcard starts after the edullm segment on purpose. This is a
                # shared account: sbsandbox-intern- alone is every intern's prefix, so
                # sbsandbox-intern-* would grant DeleteStack over their stacks too.
                # Everything this repository deploys is named sbsandbox-intern-edullm-*,
                # so nothing is gained by widening it back.
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-*/*
              # cloudformation:ValidateTemplate is the only action here that the
              # CloudFormation service authorization reference lists with no resource type
              # at all, so "*" is the narrowest grant that exists for it. Every other
              # action, GetTemplateSummary included, accepts a stack ARN and is scoped
              # above: `aws cloudformation deploy` only ever calls it with a StackName.
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              # CloudFormation acts as this role while it reconciles the ECR stack, so the
              # role needs the repository lifecycle itself. ecr:PutLifecyclePolicy is what
              # the retired shared role was missing.
              #
              # Deliberately absent: ecr:SetRepositoryPolicy, ecr:GetRepositoryPolicy and
              # ecr:DeleteRepositoryPolicy. A repository policy is the one ECR grant that
              # changes who may pull or push an image, and no committed template sets one.
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:PutLifecyclePolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:ListTagsForResource
                # Narrowed after the edullm segment for the same reason as the stack scope.
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-*
        # A second inline policy rather than more statements in the first. Inline policies
        # are unioned, so the effective permissions are identical either way, and keeping
        # them apart means deploy-phase1-stacks still says exactly what it said when it
        # was reviewed: a Phase 2 edit cannot quietly change the Phase 1 scope, and
        # `aws iam list-role-policies` shows the phase boundary. It also keeps the policy
        # names honest -- deploy-phase1-stacks would be a lie once it deployed Phase 2.
        - PolicyName: deploy-phase2-admission-stacks
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The read half of this list is not a list of things the templates use. The
              # AWS::S3::Bucket resource handler reads every configuration surface a
              # bucket has on each Read -- CORS, replication, analytics, website and the
              # rest -- whether or not the template sets them, and an AccessDenied on any
              # one of them fails the stack update rather than being skipped. The write
              # half is only what infra/lineage-bucket.yaml and infra/artifacts-bucket.yaml
              # actually set, so adding a new bucket property fails the deploy until this
              # is amended, which is the direction that fails closed.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketVersioning
                  - s3:PutBucketObjectLockConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketTagging
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:GetBucketObjectLockConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketTagging
                  - s3:GetBucketPolicy
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketLogging
                  - s3:GetBucketNotification
                  - s3:GetBucketCORS
                  - s3:GetBucketWebsite
                  - s3:GetAccelerateConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetReplicationConfiguration
                  - s3:GetAnalyticsConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetMetricsConfiguration
                  - s3:GetIntelligentTieringConfiguration
                # Narrowed after the edullm segment for the same reason as the stack
                # scope above: sbsandbox-intern- alone is every intern's prefix.
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-*
              # Objects in the artifacts bucket only, not in every bucket carrying our
              # prefix. CloudFormation needs to read the packaged zip to create the
              # function, and the release procedure needs to upload it. Neither reason
              # reaches the lineage bucket, and the deployer holding PutObject or
              # DeleteObject over a write-once lineage store would undo the property that
              # store exists to have -- Object Lock would refuse the delete, but a role
              # that has to be stopped by Object Lock should not have been granted it.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:AbortMultipartUpload
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-artifacts/*
              # One action, on one bucket, learned from a failed deploy rather than from
              # reading the Lambda documentation. AWS::Lambda::Function with a Code block
              # naming an S3ObjectVersion makes Lambda fetch the object as the deploying
              # principal, and that fetch needs s3:ListBucketVersions on the *bucket* as
              # well as s3:GetObjectVersion on the object. Nothing in the template says
              # so; the deploy failed with an explicit AccessDenied naming the action and
              # the bucket, and the stack rolled back with the function uncreated.
              #
              # Kept out of the bucket statement above, whose resource is every bucket
              # carrying our prefix. Only the artifacts bucket holds a deployment zip, and
              # a deployer able to enumerate the versions of every lineage record is a
              # wider grant than the reason for granting it.
              - Effect: Allow
                Action: s3:ListBucketVersions
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-artifacts
              # Deliberately absent: states:StartExecution and states:StopExecution. This
              # role builds the admission state machine and never runs one; starting an
              # execution is the submission role's single permission, and keeping the two
              # apart is what stops a deploy credential from admitting a run.
              - Effect: Allow
                Action:
                  - states:CreateStateMachine
                  - states:DeleteStateMachine
                  - states:UpdateStateMachine
                  - states:DescribeStateMachine
                  - states:TagResource
                  - states:UntagResource
                  - states:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:sbsandbox-intern-edullm-*
              # Deliberately absent: lambda:InvokeFunction, lambda:AddPermission and
              # lambda:RemovePermission. The deployer creates the validator but may
              # neither run it nor change who may run it.
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:ListVersionsByFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-*
              # Deliberately absent: logs:PutLogEvents and logs:DeleteLogStream. The
              # deployer creates the group the admission executions are recorded into and
              # must not be able to write into that record or remove part of it.
              #
              # The scope is the vendedlogs path, so this cannot reach the Lambda's own
              # /aws/lambda/ group either. A trailing wildcard is unnecessary: an IAM
              # wildcard matches ':' too, so log-group:/aws/vendedlogs/states/
              # sbsandbox-intern-edullm-* already covers the ':*' ARN form.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vendedlogs/states/sbsandbox-intern-edullm-*
              # This is the one grant here that meaningfully widens the deployer, so it is
              # the one worth arguing about. CloudFormation acts as this role, and both
              # states:CreateStateMachine and lambda:CreateFunction take a roleArn, which
              # the calling principal must hold iam:PassRole for. Without it the admission
              # stack cannot be created at all.
              #
              # The two role ARNs are written out in full and must stay that way. A prefix
              # -- sbsandbox-intern-edullm-* -- would let this role pass any role that
              # ever gets that name, including one created later with permissions nobody
              # weighed against a deploy credential; passing a role is how a principal
              # lends its own limits away. Naming both roles means adding a third is a
              # visible edit to this file rather than something a new role name inherits.
              #
              # The blast radius is bounded on the other side as well: each of these two
              # roles is trusted only by the single AWS service named in its own trust
              # policy, so passing one anywhere else yields a role that cannot be assumed.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-admission-states
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-admission-lambda

Outputs:
  RoleName:
    Value:
      Ref: InfraDeployerRole
  RoleArn:
    Value:
      Fn::GetAtt:
        - InfraDeployerRole
        - Arn
