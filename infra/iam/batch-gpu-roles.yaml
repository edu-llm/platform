AWSTemplateFormatVersion: "2010-09-09"
Description: The three roles a Batch GPU job runs under, and the instance profile the GPU container hosts assume.

# A SECOND TRIO RATHER THAN A WIDENING OF THE FIRST, AND THAT IS THE DECISION TO ARGUE WITH.
#
# The obvious change was to widen the three roles in infra/iam/batch-roles.yaml: add the GPU
# log group to the execution role, add AWSBatch-...-gpu-* to the instance role, narrow the
# workload role's team prefix. One file, three edits, no duplication.
#
# It was not taken, for two reasons that both hold on their own.
#
# The first is evidential. fixtures/evidence/phase-3/roles/ pins the deployed shape of all
# three of those roles as captured on 2026-07-27, and Phase 3's proof bundle rests on them
# matching their templates. Editing them makes four committed captures wrong, forces a
# re-capture and a golden re-record, and rewrites prose in a bundle that was finished. The
# GPU path gaining its own roles leaves every Phase 3 statement true.
#
# The second is that these roles genuinely differ, so the duplication is thinner than it
# looks. Only this execution role reads a secret. Only this workload role may read an object
# back out of the OUTPUTS bucket, because only a training job resumes from a checkpoint it
# wrote. Only this instance role joins the GPU cluster. Widening the CPU trio would have
# handed each of those capabilities to a CPU job that has no use for any of them, which is
# the same argument that made three roles out of one in the first place.
#
# THAT SENTENCE SAID "may read an object back" WITHOUT NAMING A BUCKET, AND THE MISSING WORD
# WAS LOAD-BEARING. Read as a claim about s3:GetObject generally it is now false: the CPU
# workload role holds a read on the dataset airlock, added because
# config/workload-catalog.yaml offers a workload whose whole job is reading shards and which
# could not read them. What remains true, and is what this paragraph was always about, is
# the outputs bucket. See the dataset-library statement below for what the two roles now
# share and the two buckets they deliberately do not: edullm-landing, which only the
# validator reads and which is CPU work, and edullm-olmo-370m-ckpts, which only a fine-tune
# reads and which is not.
#
# What is shared, deliberately: the ECR repository, because there is one image; and the
# outputs bucket, because there is one place results go.
#
# THE OUTPUT SCOPE, AND WHY IT IS THE WIDE ONE. Both workload roles permit teams/*/runs/*.
# This paragraph said the opposite, and the reversal is worth reading rather than skipping:
# the GPU role was written narrow so that a cross-team isolation check had something honest
# to run against, and that check has since been found to encode no requirement. The groups
# sharing this account are one team building one model. Isolation was a control sized
# against a threat nobody can name, so the narrow grant was shaped by a test rather than by
# a need. The full argument, and what narrowing it again would strand, is at the statement
# it applies to.

Resources:
  # ------------------------------------------------------------------------------------
  # Execution role: what ECS uses to start the GPU task
  # ------------------------------------------------------------------------------------
  BatchGpuExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-batch-gpu-execution
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Inline rather than a customer managed policy. InternSandboxBoundary denies
      # iam:CreatePolicyVersion on every policy, so a managed policy could be created once
      # and never amended; the first permission change would fail the stack update.
      Policies:
        - PolicyName: pull-the-image-open-the-log-stream-and-read-one-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ecr:GetAuthorizationToken has no resource type: it mints a registry-wide
              # token and there is no ARN to attach it to, so "*" is the narrowest grant
              # that exists for it. In its own statement so nobody has to guess which of
              # the four actions earned the wildcard.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # The same repositories the CPU execution role names, and it has to be the same
              # list. A submission picks its compute profile, and a GPU profile sends the job
              # to this stack's queue, so a repository readable on the CPU side and not here
              # is a repository whose runs work until somebody chooses a GPU.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-core
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-data
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-eval-full
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-alt-cl
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-open-instruct-scored-rewards
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-p1
              # The GPU log group and only the GPU log group. Not
              # /aws/batch/sbsandbox-intern-edullm-* -- a prefix here would let a GPU task
              # write into the record of what a CPU job printed, and the two log groups
              # exist to be readable as separate accounts of separate work.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/sbsandbox-intern-edullm-gpu:*
              # THE WILDCARD ON THIS ARN IS LOAD-BEARING AND IS NOT A PREFIX GRANT.
              #
              # Secrets Manager appends a random six-character suffix to every secret ARN --
              # here -fnwEVp. The suffix is not predictable and is not stable across a
              # delete-and-recreate, so a grant written against the exact ARN works until
              # somebody recreates the secret and then fails as an access denial that reads
              # like a policy error. The trailing -* matches that suffix and nothing else:
              # the name it follows is complete, so this cannot reach a second secret unless
              # somebody creates one whose name begins with this one.
              #
              # Deliberately absent: secretsmanager:PutSecretValue, UpdateSecret and
              # DeleteSecret. This identity reads a credential in order to inject it and has
              # no business changing it, by the same reasoning that keeps
              # batch:UntagResource off the admission states role. The value is set from a
              # laptop and from nowhere else.
              #
              # Deliberately absent: secretsmanager:ListSecrets. It has no resource type, so
              # granting it would be an account-wide enumeration of sixteen other teams'
              # secret names to save a call this role never needs to make.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-*

  # ------------------------------------------------------------------------------------
  # Workload role: what the training command itself runs as
  # ------------------------------------------------------------------------------------
  BatchGpuWorkloadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-batch-gpu-workload
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-and-resume-one-teams-outputs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # teams/*/runs/*, MATCHING THE CPU WORKLOAD ROLE. WIDENED DELIBERATELY, AND
              # THE ARGUMENT IT REPLACES IS BELOW BECAUSE A REVERSAL SHOULD BE LEGIBLE.
              #
              # This role read `teams/platform/runs/*`, and the reasoning was: the CPU
              # workload role takes the wildcard as Phase 3's answer to open decision 2, this
              # role does not inherit it, `platform` is the only team that has ever run
              # anything, so for today this is not an approximation of isolation but
              # isolation itself -- a GPU job cannot write under another team's prefix
              # because there is one team and this role names it.
              #
              # Every sentence of that is still true and the conclusion no longer is. The
              # narrowing was chosen to make a cross-team isolation criterion honestly
              # closeable, and that criterion has since been found to encode no requirement:
              # the groups sharing this account are one team building one model, and nobody
              # can name a harm that follows from one reading another's outputs. A grant
              # shaped to satisfy a check rather than a requirement is the anomaly once the
              # check turns out to be measuring nothing, and the CPU role's wildcard is the
              # norm rather than the debt.
              #
              # What the narrow scope would cost now is concrete rather than theoretical. A
              # run declaring any team other than `platform` writes its checkpoint to a
              # prefix this role cannot reach, and Batch has no per-job role override at
              # submit time -- so under the narrow scope a second team needs a second role
              # and a second job definition, structure built for a boundary nobody wants.
              # The pilot is about to have researchers claiming teams of their own.
              #
              # NOT REVERSIBLE, AND THAT IS THE POINT TO READ BEFORE NARROWING IT AGAIN.
              # Narrowing strands every checkpoint already written under another team's
              # prefix: the run that wrote it could no longer read it back, so a resume
              # fails on its own output. Phase 4 criterion 7 is rewritten to match this
              # decision rather than kept as a proof of the property this removes.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs/teams/*/runs/*
              # s3:GetObject, which the CPU workload role does not have and should not.
              #
              # A training job reads back what it wrote: the checkpoint commit protocol
              # checks for its own success marker, and a resumed run loads the checkpoint
              # that marker vouches for. Both are reads of this run's own output under the
              # prefix above, which is why the resource is the same ARN rather than a wider
              # one. It cannot reach the dataset bucket, the artifacts bucket, or the
              # lineage store.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs/teams/*/runs/*
              # Listing is a bucket-level action, so it cannot be scoped by an object ARN;
              # the prefix condition is what keeps it from enumerating another team's
              # output. Granted because a trainer that cannot tell whether a checkpoint step
              # already exists writes it again.
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs
                Condition:
                  StringLike:
                    s3:prefix: teams/*/runs/*
              # READ ON THE SEALED DATASET LIBRARY, WHICH IS THE LAST THING BETWEEN A
              # TRAINING RUN AND REAL DATA.
              #
              # edullm-data is the dataset owner's airlock: a producer writes to
              # edullm-landing, a validator promotes into edullm-data, and nothing else can
              # write there. It holds nine sealed corpora, including a dolma2-tokenized
              # pretraining set of 157,467,202,883 tokens. Until this statement, no training
              # role on this platform could read a byte of it, and every GPU run trained on
              # synthetic tokens or on data streamed from the public internet.
              #
              # THIS NEEDED NOBODY'S PERMISSION, WHICH IS WORTH RECORDING BECAUSE IT WAS
              # BELIEVED TO. The read path was carried for some time as blocked on a
              # coordinated window with the pipeline's operator. Reading the live bucket
              # policy on 2026-08-01 settled it: edullm-data denies s3:PutObject,
              # s3:PutObjectTagging, s3:AbortMultipartUpload, s3:DeleteObject and
              # s3:DeleteObjectVersion, and denies nothing else. There is no Deny on reads,
              # so a read grant is entirely a statement about our own role in our own
              # template. The operator's cutover -- moving his validator off the shared CPU
              # workload role onto an identity of its own -- is a real and separate piece of
              # work about write access, and it gates no researcher.
              #
              # Read-only and asymmetric on purpose. The bucket's own policy would refuse a
              # write from this role anyway; granting only GetObject means the refusal is
              # also true one layer earlier, where it can be read off a role diff rather
              # than inferred from a bucket policy in someone else's stack.
              #
              # THE CPU WORKLOAD ROLE NOW HOLDS THIS SAME PAIR, AND THE PERIOD WHEN IT DID
              # NOT WAS AN ACCIDENT RATHER THAN A DECISION. This statement said "which the
              # CPU workload role does not have and should not" of the outputs-bucket read
              # above it, and nothing said anything about this one -- so the split on the
              # sealed library read as intentional and was not. It was a fact about dates:
              # this grant arrived in Phase 4 because a training run reads a corpus, and the
              # CPU role was left without it because the only CPU workload in the catalog at
              # the time read nothing. Neither half is about CPU versus GPU, and the
              # submission form's compute_profile is what actually decides placement, so the
              # split was a grant that depended on a dropdown. Closed in
              # infra/iam/batch-roles.yaml, where the argument is written out in full.
              #
              # WHAT IS STILL ASYMMETRIC, DELIBERATELY: edullm-landing. That is the candidate
              # side of the airlock, nothing in config/datasets.yaml lives there, and the
              # only workload that reads it is the validator -- which is CPU work. So this
              # role is not widened to match, and the consequence is named where a submitter
              # meets it rather than left here: a validator placed on a GPU profile fails on
              # its first read, and config/workload-catalog.yaml and guides/edullm-data.md
              # both say so.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::edullm-data/*
              # Unconditioned, unlike the outputs listing above, and the difference is the
              # point. The outputs bucket is partitioned by team and the prefix condition is
              # what stops one team enumerating another's runs. The dataset library is a
              # published catalogue every team is meant to read; a prefix condition here
              # would only stop a trainer discovering which corpora exist, which is the one
              # thing it needs to do before reading one.
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::edullm-data
              # READ ON ONE BUCKET OF PRETRAINED WEIGHTS, WHICH IS A NAMED EXCEPTION AND NOT
              # A SECOND LIBRARY. WITHDRAW IT WHEN THE PROPER ROUTE EXISTS.
              #
              # This is a base-checkpoint read for fine-tuning. A fine-tune starts from
              # weights somebody else trained, and the two things this role could read were
              # its own run's prefix under the outputs bucket and the sealed corpora in
              # edullm-data. A checkpoint that predates the run is neither, so every arm of
              # a fine-tuning sweep died with AccessDenied on its first read -- before a
              # step, after the queue wait, after the approval and after the machine was
              # allocated. Five single-GPU arms on the latent-cot-superposition-amy branch
              # of OLMo-core are the worked case; all five load
              # s3://edullm-olmo-370m-ckpts/olmo3-370m/run-10b-equal/step12716/.
              #
              # THE PROPER ROUTE IS A SEALED ENTRY AND IT DOES NOT EXIST YET, WHICH IS THE
              # WHOLE REASON THIS STATEMENT IS HERE RATHER THAN NOWHERE. A checkpoint a run
              # may start from ought to arrive the way a corpus does: written to
              # edullm-landing, promoted into edullm-data by the validator, registered, and
              # then readable through the grant two statements up with no template change at
              # all. The `model/` family has no sealed entry, nothing promotes weights
              # through that airlock, and the promotion path for anything that is not a
              # corpus was never built. So the alternative to this statement is not a
              # narrower grant; it is telling a researcher that fine-tuning is unavailable
              # until somebody builds a pipeline.
              #
              # WITHDRAW THIS WHEN THAT ENTRY LANDS. A sealed `model/` entry makes the read
              # above cover these weights, at which point this pair is a second way to reach
              # bytes that already have a first one, and the second way is the one nobody is
              # holding to a licence, a digest or a retirement date. Deleting both
              # statements is then the change, and tests/test_workload_dataset_reach.py
              # names olmo-core-train against this bucket so the withdrawal is a visible
              # edit rather than a grant nobody revisits.
              #
              # UNLIKE edullm-data, THIS BUCKET MAY NOT BE OURS, AND WHOEVER APPLIES THIS
              # STACK HAS TO CHECK. Every other bucket named in this file is either
              # sbsandbox-intern-* -- this account's own naming -- or edullm-data, whose
              # policy was read on 2026-08-01 and is known to deny nothing on the read path.
              # edullm-olmo-370m-ckpts is neither, and it appears nowhere else in this
              # repository, so nothing here records which account owns it. If it is in the
              # same account, this identity grant is the whole of what is needed. If it
              # belongs to another account, a cross-account read takes the bucket owner's
              # policy as well, and this statement alone leaves the run failing in exactly
              # the way it fails today -- with AccessDenied on the first read and a role
              # diff that says the grant is present. That is the worse of the two outcomes,
              # because the template then looks like the answer. Confirm the owner before
              # concluding the deploy fixed anything.
              #
              # Scoped to the whole bucket rather than to the one step directory the sweep
              # names. A prefix grant would have to be edited for the next base checkpoint,
              # and an exception that is edited per run stops being read; the bucket is a
              # single-purpose store of published checkpoints, so it is the honest unit.
              # Read-only, and asymmetric for the same reason the library grant is: a
              # training container has no business writing into weights it starts from, and
              # withholding the write means the refusal can be read off a role diff rather
              # than inferred from somebody else's bucket policy.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::edullm-olmo-370m-ckpts/*
              # Both halves or neither, and the listing is not the optional one. A
              # distributed checkpoint is a directory -- shards per rank, a metadata object,
              # a config -- and a loader handed a step prefix walks it before it opens
              # anything, so a role that could GetObject a key it already knew and could not
              # enumerate would fail at a call that looks unrelated to the checkpoint it was
              # loading. Unconditioned, for the reason the dataset library's listing is:
              # this is a published store with no team dimension, and a prefix condition
              # would only stop a trainer discovering the step directories it may read.
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::edullm-olmo-370m-ckpts
              # s3:DeleteObject UNDER checkpoints/, WHICH THIS FILE REFUSED UNTIL A RUN
              # PROVED THE REFUSAL COSTS THE RUN. THE OLD ARGUMENT IS BELOW IN FULL BECAUSE
              # IT IS HALF RIGHT AND THE HALF THAT IS WRONG IS NARROW.
              #
              # It read: a trainer configured to overwrite its save folder is the usual
              # reason to want it; every run writes under its own run id, so there is never
              # a previous run's object in the way; the per-run segment of the prefix is
              # what makes delete unnecessary; a role that needed delete would be a signal
              # that two runs are sharing a prefix, and that is the condition to fail on
              # rather than to permit.
              #
              # Every clause of that is about two runs, and the case it does not cover is
              # one run twice. A run's own retry is in its own way. On
              # run_019fbe1f-b84f-703a-8eb8-2b4504232948 the host was lost at step 100
              # immediately after checkpoints/step100/train/rank0.pt was written, leaving
              # that one object, 15,317 bytes, and no shard. Attempt 2 resumed from step50
              # correctly -- find_checkpoints skips a directory the loader would refuse --
              # trained back to step 100, and died in Checkpointer._prepare_dir with
              # FileExistsError on a directory that is not empty. Same run id, same prefix,
              # no second run anywhere. With maximum_attempts 2 that is the end of the run,
              # and it is deterministic: every attempt reaches the same step and dies there.
              #
              # WHAT THIS IS AND IS NOT A NEW REACH OVER. The role already holds s3:PutObject
              # on teams/*/runs/*, so it can already replace another team's checkpoint object
              # by writing the same key. This bucket is also versioned and this role is not
              # granted s3:DeleteObjectVersion, so a delete here writes a delete marker and
              # leaves every version in place. Neither of these two grants can destroy bytes,
              # and the delete is the narrower of the two: teams/*/runs/*/checkpoints/*
              # rather than teams/*/runs/*.
              #
              # WHAT STOPS IT BEING A PRUNE, WHICH IS THE ROUTINE DELETE OF A FINISHED
              # CHECKPOINT AND IS STILL REFUSED. See the Deny below.
              - Effect: Allow
                Action: s3:DeleteObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs/teams/*/runs/*/checkpoints/*
              # THE ONE KEY THE DELETE ABOVE MAY NOT TOUCH, AND IT IS THE ONE THAT DECIDES
              # WHETHER A DIRECTORY IS A CHECKPOINT.
              #
              # .metadata.json is written last, by the done callback after every shard has
              # landed, and Checkpointer.dir_is_checkpoint requires it. So a torn directory
              # never holds one -- its presence is what makes the write finished -- and a
              # repair that clears only directories the loader refuses never needs to
              # delete it.
              #
              # A prune does. CheckpointerCallback._remove_checkpoint removes
              # .metadata.json first, deliberately, to invalidate the checkpoint before
              # clearing the rest, and it catches only FileNotFoundError; a denial becomes
              # OLMoNetworkError and reaches Trainer.fit. So max_checkpoints left at its
              # default of 3 still stops the run on the fourth save rather than quietly
              # deleting the first, which is the behaviour guides/olmo-core.md documents and
              # which the delete above would otherwise have removed.
              #
              # An explicit Deny rather than a narrower Allow because IAM resource matching
              # has no negation: there is no Allow that covers every key under a step
              # directory except one of them.
              - Effect: Deny
                Action: s3:DeleteObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs/teams/*/runs/*/checkpoints/*/.metadata.json
              # DELIBERATELY ABSENT: s3:DeleteObjectVersion and s3:PutBucketVersioning. The
              # outputs bucket has versioning enabled, so every delete this role can make is
              # a delete marker over versions that stay. Those two actions are what would
              # turn that into the removal of bytes, and withholding both is what makes the
              # sentence above true rather than merely true today.
              #
              # Deliberately absent: any reach into sbsandbox-intern-edullm-lineage. That
              # store is write-once by bucket policy and only the admission state machine
              # writes to it. Object Lock would refuse the delete, and a role that has to be
              # stopped by Object Lock should not have been granted it.
              #
              # Deliberately absent: batch:SubmitJob, batch:TerminateJob,
              # states:StartExecution and ecr:PutImage. The container is what an untrusted
              # training command runs inside; it may write its results and it may not start
              # anything, stop anything, or publish anything.
              #
              # Deliberately absent: any logs: action. The container's stdout is written by
              # the awslogs driver under the execution role above, before this role's
              # process starts. A logs grant here would let the command write directly into
              # the record of what it printed, which is a different thing from printing.
              #
              # Deliberately absent: secretsmanager:GetSecretValue. The W&B key reaches the
              # container as an environment variable that ECS resolves under the execution
              # role. A training command that could read the secret itself could read it
              # under a name nobody injected.

  # ------------------------------------------------------------------------------------
  # Instance role: what the GPU EC2 container host runs as
  # ------------------------------------------------------------------------------------
  BatchGpuInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-batch-gpu-instance
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: join-the-batch-managed-gpu-ecs-cluster
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Every action here is listed in the ECS and ECR service authorization
              # references with no resource type, so "*" is the narrowest grant that exists
              # for all four. ecs:StartTelemetrySession is the agent's control channel and
              # is not GPU telemetry -- nothing in this file emits a GPU metric, and the
              # name is close enough to mislead a reader who is looking for one.
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecs:DiscoverPollEndpoint
                  - ecs:Poll
                  - ecs:StartTelemetrySession
                Resource: "*"
              # Batch names the ECS cluster it manages AWSBatch-<compute environment>-<id>,
              # so the compute environment's own name is what makes this scopable. Renaming
              # the environment in infra/batch-compute-gpu.yaml without changing this prefix
              # produces instances that register nowhere and a queue whose jobs sit in
              # RUNNABLE with no error anywhere -- the silent half-failure the CPU trio has
              # the same exposure to, which is why the tests compare the two files rather
              # than each against a constant.
              - Effect: Allow
                Action:
                  - ecs:DeregisterContainerInstance
                  - ecs:RegisterContainerInstance
                  - ecs:SubmitAttachmentStateChanges
                  - ecs:SubmitContainerStateChange
                  - ecs:SubmitTaskStateChange
                  - ecs:UpdateContainerInstancesState
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/AWSBatch-sbsandbox-intern-edullm-gpu-*
              # The image layers the agent pulls on the host's behalf. Same repositories as
              # the execution role, and for the same reason.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-core
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-data
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-eval-full
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-alt-cl
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-open-instruct-scored-rewards
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-p1
              # The ECS agent's own log group, which is not the job's. Scoped to the
              # /aws/ecs/ path so an instance cannot write into the record of what a job
              # printed.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/sbsandbox-intern-edullm-*

  # An instance profile is the only way an EC2 instance can hold a role, and Batch takes its
  # ARN in the compute environment. It lives beside the role it wraps because the two have no
  # independent lifetime. Expect this stack to take about three minutes for the same reason
  # infra/iam/batch-roles.yaml does: that is IAM propagation rather than a hang.
  BatchGpuInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: sbsandbox-intern-edullm-batch-gpu-instance
      Roles:
        - Ref: BatchGpuInstanceRole

Outputs:
  ExecutionRoleName:
    Value:
      Ref: BatchGpuExecutionRole
  ExecutionRoleArn:
    Value:
      Fn::GetAtt:
        - BatchGpuExecutionRole
        - Arn
  WorkloadRoleName:
    Value:
      Ref: BatchGpuWorkloadRole
  WorkloadRoleArn:
    Value:
      Fn::GetAtt:
        - BatchGpuWorkloadRole
        - Arn
  InstanceRoleName:
    Value:
      Ref: BatchGpuInstanceRole
  InstanceRoleArn:
    Value:
      Fn::GetAtt:
        - BatchGpuInstanceRole
        - Arn
  InstanceProfileName:
    Value:
      Ref: BatchGpuInstanceProfile
  InstanceProfileArn:
    Value:
      Fn::GetAtt:
        - BatchGpuInstanceProfile
        - Arn
