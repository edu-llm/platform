AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions role that stops a running job, after the workflow has checked the actor is allowed to stop that one.

Resources:
  RunCancellerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-run-canceller
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      # WHY A ROLE THAT CAN STOP ANY JOB IS THE RIGHT SHAPE, WHICH IS NOT OBVIOUS.
      #
      # The workflow decides whether the actor may cancel this run; IAM cannot. A trust
      # policy cannot see who dispatched the workflow -- `sub` and `job_workflow_ref` are
      # the same for every dispatch of a file, whoever pressed the button -- so the grant
      # cannot be narrowed to "jobs whose edullm:submitter equals the caller" however it is
      # written. The tag is readable through aws:ResourceTag and there is nothing to compare
      # it against: the identity in hand is the workflow, never the person who ran it.
      #
      # So the authorisation is in the workflow, and this role is scoped by what it can do
      # rather than by whose it can do it to: describe jobs and stop the ones this platform
      # submitted, and nothing else in the account. It cannot submit, cannot register a job
      # definition, cannot read or write S3, and cannot reach the state machine -- so the
      # worst a bypass achieves is stopping runs, which is disruptive, recoverable, and
      # loud in the lifecycle record.
      #
      # That is a real trade and it is worth naming rather than burying: the check that
      # matters lives in YAML, and a change to that file is the change to review. It is the
      # same shape as the approval gate, which is also enforced by a workflow rather than
      # by a policy.
      #
      # The sub prefix carries owner and repository ids because this organization issues
      # immutable subject claims, verified as
      # `gh api repos/edu-llm/platform/actions/oidc/customization/sub` reporting
      # sub_claim_prefix repo:edu-llm@306859726/platform@1311508598.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # One workflow file, so a job added to submit-run.yml cannot reach this and
                # a job added to cancel-run.yml is reviewed as part of the file that owns
                # the authorisation check.
                token.actions.githubusercontent.com:job_workflow_ref: edu-llm/platform/.github/workflows/cancel-run.yml@refs/heads/main
                token.actions.githubusercontent.com:repository_owner_id: "306859726"
                token.actions.githubusercontent.com:repository_id: "1311508598"
                token.actions.githubusercontent.com:sub: repo:edu-llm@306859726/platform@1311508598:ref:refs/heads/main
      # Inline rather than managed, for the reason every role here is: InternSandboxBoundary
      # denies iam:CreatePolicyVersion, so a managed policy could be created once and never
      # amended.
      Policies:
        - PolicyName: stop-a-running-job-and-read-enough-to-know-whose-it-is
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DescribeJobs and ListJobs are how the workflow learns the job's tags, which
              # is how it learns whose run it is. Neither has a resource type in Batch --
              # both are account-wide or nothing -- so the resource is a wildcard and the
              # narrowing that matters is that they are reads.
              #
              # ListJobs is needed because a submitter knows their run id and not the Batch
              # job id, and the two are joined by the job *name*, which only a list can
              # search.
              - Effect: Allow
                Action:
                  - batch:DescribeJobs
                  - batch:ListJobs
                Resource: "*"
              # The one action that changes anything, scoped to the jobs this platform
              # submitted. A job anybody else in this shared account is running is out of
              # reach.
              #
              # NOT SCOPED BY QUEUE, AND THAT IS MECHANICAL RATHER THAN A PREFERENCE.
              # TerminateJob takes a job id and a reason and nothing else, so batch:JobQueue
              # is never in the request context and a condition on it can never be satisfied.
              # A role written that way describes and lists and cannot stop anything, and it
              # says so as "no identity-based policy allows the batch:TerminateJob action" --
              # which reads as a missing grant rather than as a condition that cannot match.
              # `iam simulate-principal-policy` does not separate the two either: it accepts
              # no arn context key type, so an ArnEquals is unsatisfiable there as well and
              # the simulator answers implicitDeny for grants that work. Only a real
              # termination settles this shape, which is why one was performed.
              #
              # aws:ResourceTag is the condition key Batch does offer on a job, and it fits
              # what this role is for better than the queue did. edullm:run-id is set on
              # every submission unconditionally -- unlike edullm:submitter and
              # edullm:experiment, which are appended only when there is one -- so it selects
              # exactly the jobs this platform started. The value is matched as well as the
              # key, because a tag somebody else writes under the same name would otherwise
              # be enough on its own.
              #
              # What this gives up, stated rather than discovered: a job admitted before the
              # tag existed cannot be stopped through this role. The workflow already refuses
              # those, since an absent edullm:submitter authorises nobody, and Batch stops
              # listing a job some days after it ends -- so the set is empty in practice.
              - Effect: Allow
                Action: batch:TerminateJob
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job/*
                Condition:
                  StringLike:
                    aws:ResourceTag/edullm:run-id: "run_*"
              # DELIBERATELY ABSENT, and each for its own reason rather than as a list.
              #
              # batch:SubmitJob and batch:RegisterJobDefinition: a role that can cancel and
              # submit is a role that can replace somebody's run with its own, which is a
              # worse power than either alone.
              #
              # batch:CancelJob: it only affects a job that has not started, TerminateJob
              # covers both cases, and two verbs would mean two authorisation paths.
              #
              # Every s3: action. The cancel path learns whose run it is from a tag on the
              # job precisely so it never needs to read the lineage store, and a grant here
              # would give that reasoning away for nothing.
              #
              # Every states: action, so this cannot interfere with an admission execution
              # that is still deciding.

Outputs:
  RoleName:
    Value:
      Ref: RunCancellerRole
  RoleArn:
    Value:
      Fn::GetAtt:
        - RunCancellerRole
        - Arn
