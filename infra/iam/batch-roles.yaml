AWSTemplateFormatVersion: "2010-09-09"
Description: The three roles a Batch CPU job runs under, and the instance profile the container hosts assume.

# Three roles rather than one, because a Batch EC2 job has three identities and merging any
# two of them hands somebody a capability they had no reason to hold.
#
#   - the execution role is ECS's identity while it starts the task: it pulls the image and
#     creates the log stream, and the container never sees its credentials;
#   - the workload role is what the container's own process runs as, and it is the only one
#     of the three an untrusted training command can use;
#   - the instance role is what the EC2 host runs as, joining the ECS cluster Batch manages.
#
# Collapsing the execution role into the workload role is the tempting simplification and
# it is the one that matters: the workload would then hold ECR pull credentials, which is
# precisely the separation ECS task roles exist to provide.

Resources:
  # ------------------------------------------------------------------------------------
  # Execution role: what ECS uses to start the task
  # ------------------------------------------------------------------------------------
  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-batch-execution
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Inline rather than a customer managed policy. InternSandboxBoundary denies
      # iam:CreatePolicyVersion on every policy, so a managed policy could be created once
      # and never amended; the first permission change would fail the stack update. Inline
      # policies go through iam:PutRolePolicy, which the boundary permits on this name.
      Policies:
        - PolicyName: pull-the-image-and-open-the-log-stream
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ecr:GetAuthorizationToken has no resource type: it mints a registry-wide
              # token and there is no ARN to attach it to, so "*" is the narrowest grant
              # that exists for it. Sourced rather than measured -- AWS's own
              # AmazonECSTaskExecutionRolePolicy grants exactly this action on "*" and
              # scopes the other three ECR actions -- and it is in its own statement so
              # nobody has to guess which of the four earned the wildcard.
              #
              # What it can do is bounded on the other side: the token it returns is
              # evaluated against this role's other grants, so holding it does not widen
              # what may be pulled. The statement below is what decides that.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Two repositories, spelled out, not the sbsandbox-intern-edullm-* prefix
              # the deployer uses. This role exists to pull the images the job definitions
              # pin; a prefix would let it pull anything this project ever publishes,
              # including an image no admission decision named. Registering a further
              # repository means editing this list, which is the direction that fails
              # closed.
              #
              # THE SECOND ENTRY WAS ADOPTED FROM THE ACCOUNT RATHER THAN DESIGNED HERE,
              # AND THAT IS WHY IT IS WORTH READING. On 2026-07-31 the dataset owner
              # attached it to this role directly, outside CloudFormation, so that the
              # `edullm-validator` and `edullm-fsck` job definitions -- which run on our CPU
              # queue under this execution role -- could pull their own image. The drift
              # capture reported it the next day as a role wider than its template, which
              # is exactly what it was.
              #
              # It is adopted rather than removed because the grant is correct: an
              # execution role that cannot pull the image its job definition names produces
              # a job that never starts. What was wrong was only that no committed template
              # said so, which made this a live hazard rather than a live exposure -- a
              # `cloudformation deploy` of this stack from a tree without this line would
              # have silently revoked it and broken a pipeline that had been working, and
              # the symptom would have surfaced on somebody else's dataset promotion rather
              # than on the deploy. `infra/README.md` describes that class of hazard; this
              # is the second instance of it and the first one to be closed by adoption.
              #
              # Note what this does NOT grant, because the two repositories are not
              # symmetric in what they mean. Pulling an image is not running as an identity:
              # the container this pulls runs as whatever `jobRoleArn` the job definition
              # names, which for both of those definitions is
              # `sbsandbox-intern-edullm-dataset-validator` and not our workload role.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-core
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-data
              # Deliberately absent: logs:CreateLogGroup. infra/batch-compute.yaml creates
              # the group, so a role that could create it would only ever do so by
              # creating one nobody declared -- under a name a typo chose, with no
              # retention, invisible to the stack. The awslogs driver fails loudly on a
              # missing group, which is the answer we want.
              #
              # Deliberately absent: logs:GetLogEvents and logs:FilterLogEvents. This
              # identity writes the record of what a job printed and must not be able to
              # read back what other jobs printed.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/sbsandbox-intern-edullm-cpu:*
              # THE SAME GRANT THE GPU EXECUTION ROLE HAS CARRIED SINCE PHASE 4, arriving
              # here because a CPU pilot run needed W&B and could not reach it. ECS resolves
              # the secret under this role while starting the task and injects the plaintext;
              # the workload role holds no secretsmanager action at all, so the container's
              # own command cannot read it under another name or at another version.
              #
              # THE WILDCARD ON THIS ARN IS LOAD-BEARING AND IS NOT A PREFIX GRANT. Secrets
              # Manager appends a random six-character suffix to every secret ARN -- here
              # -fnwEVp -- which is not predictable and not stable across a
              # delete-and-recreate, so a grant written against the exact ARN works until
              # somebody recreates the secret and then fails as an access denial that reads
              # like a policy error. The trailing -* matches that suffix and nothing else:
              # the name it follows is complete, so this cannot reach a second secret unless
              # somebody creates one whose name begins with this one.
              #
              # Deliberately absent: secretsmanager:PutSecretValue, UpdateSecret and
              # DeleteSecret. This identity reads a credential in order to inject it and has
              # no business changing it. The value is set from a laptop and from nowhere else.
              #
              # Deliberately absent: secretsmanager:ListSecrets. It has no resource type, so
              # granting it would be an account-wide enumeration of sixteen other teams'
              # secret names to save a call this role never needs to make.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-*

  # ------------------------------------------------------------------------------------
  # Workload role: what the container's own command runs as
  # ------------------------------------------------------------------------------------
  BatchWorkloadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-batch-workload
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # Inline rather than a customer managed policy, for the same boundary reason as the
      # execution role above.
      Policies:
        - PolicyName: write-team-outputs-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ANY TEAM'S PREFIX, AND THAT IS THE ANSWER RATHER THAN AN OVERSIGHT. This
              # was open decision 2, answered on 2026-07-28 when its own trigger fired --
              # a second team about to submit, and Phase 4 about to write its check that
              # outputs land only under the authorized run prefix.
              #
              # The scope is teams/*/runs/*, which is the widest of the three options the
              # decision listed. It is recorded here rather than argued, and the reason it
              # is permitted at all is the sentence the decision ended on: this phase may
              # ship the widest scope provided the record says so, and may not ship a
              # narrower claim than it enforces. So the record says so here, and the Phase 4
              # isolation criterion is a gap instead of a pass. It also said so on the pilot
              # limitations page until that page was taken out of the README on 2026-07-31;
              # this comment is now the whole of the record a reader outside the team can
              # reach, which is a worse place for it than the page was.
              #
              # WHAT THIS DOES AND DOES NOT BOUND. It bounds a workload to the outputs
              # bucket and to a runs/ prefix under some team. It does not isolate one team
              # from another, and it does not isolate one run from another: a job may write
              # under any team's prefix and under any run id, including one that belongs to
              # somebody else. Nothing detects that today.
              #
              # WHY NOT NARROWER, MEASURED RATHER THAN ASSUMED. Per-team was recorded as
              # "reachable today" and is not, quite: Batch has no per-job role override at
              # submit time, so a role per team also requires a job definition per team,
              # and that structure would then be carried through every GPU change in
              # Phase 4. Per-run needs the run id to reach the policy, which needs a
              # session tag travelling from admission into the Batch job -- a mechanism
              # that does not exist. Both are Phase 5 work, where team_bindings.teams stops
              # being empty and TeamBinding.s3_namespace has something to enumerate.
              #
              # The prefix layout is already the narrow one. contracts/results.py's
              # output_prefix builds teams/{team}/runs/{run_id}/ and is the single author
              # of that string, so tightening this line later is an IAM change and not a
              # migration of keys already written into lineage records nothing rewrites.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs/teams/*/runs/*
              # Listing is a bucket-level action, so it cannot be scoped by an object ARN;
              # the prefix condition is what keeps it from enumerating another team's
              # output. Granted because a workload that cannot tell whether it already
              # wrote a shard re-writes it, and because the alternative -- listing the
              # whole bucket -- is what a reader would reach for when this is missing.
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs
                Condition:
                  StringLike:
                    s3:prefix: teams/*/runs/*
              # No s3:GetObject, no s3:DeleteObject, and no reach into
              # sbsandbox-intern-edullm-lineage at all. The lineage store is write-once by
              # bucket policy and only the admission state machine writes to it; a
              # workload role holding PutObject there would undo the property that store
              # exists to have. Object Lock would refuse the delete, and a role that has
              # to be stopped by Object Lock should not have been granted it.
              #
              # No batch:SubmitJob, no batch:TerminateJob, no states:StartExecution and no
              # ecr:PutImage either. The container is the thing an untrusted command runs
              # inside; it may write its results and it may not start anything, stop
              # anything, or publish anything. tests/test_phase3_batch_denials.py proves
              # each of those live rather than by reading this comment.
              #
              # No logs: action of any kind, which looks like an omission and is not. The
              # container's stdout and stderr are written by the awslogs driver under the
              # execution role above, before the workload's own process starts; a logs
              # grant here would let the command write directly into the record of what it
              # printed, which is a different thing from printing.
              #
              # No s3:GetObject either, so this role cannot read the dataset bucket the
              # dolma fixture's command names. That is correct for the workload Phase 3
              # runs -- a CPU smoke against a published image that reads nothing. The GPU
              # workload role is where a training run's read of that bucket is granted, in
              # infra/iam/batch-gpu-roles.yaml, because that is the role a training
              # container actually runs as; this one stays without it.
              #
              # AND THIS STATEMENT WAS FALSE FOR FOUR DAYS, WHICH IS THE MORE USEFUL HALF
              # OF THE RECORD. Between 2026-07-28 and 2026-08-01 this role carried a second
              # inline policy named `dataset-validator`, attached outside CloudFormation and
              # declared by no template here, granting s3:PutObject, s3:PutObjectTagging,
              # s3:AbortMultipartUpload, s3:GetObject, s3:GetObjectAttributes, s3:ListBucket
              # and s3:GetBucketLocation across edullm-data and edullm-landing. It was
              # attached so a dataset owner's validator could promote datasets, and it ran
              # under this role because this role was there -- but this is the role EVERY
              # CPU container on EVERY team runs as, so for those four days a job submitted
              # to print a line could write into the sealed dataset library.
              #
              # It is gone, and gone by removal rather than by rewording: the validator now
              # runs as sbsandbox-intern-edullm-dataset-validator
              # (infra/iam/dataset-validator-role.yaml), the exemption in edullm-data's own
              # bucket policy names that role instead of this one, and the inline policy was
              # deleted from this role on 2026-08-01. The recaptured evidence at
              # fixtures/evidence/phase-3/roles/ and the `ok` verdict for this role in
              # proof/phase-3/deployed-role-drift.md are what say so.
              #
              # Kept as a comment because the detection is the part worth not losing. The
              # drift report had said `role_drift` on this role since the day the policy was
              # attached; nothing was broken about the measurement, and what was missing for
              # four days was somebody acting on it. A future reader deploying this stack
              # should know that this role's history includes a grant no template ever
              # declared, and that reading the template is therefore not the same as reading
              # the account.

  # ------------------------------------------------------------------------------------
  # Instance role: what the EC2 container host runs as
  # ------------------------------------------------------------------------------------
  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-batch-instance
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Inline rather than a customer managed policy, for the same boundary reason as the
      # two roles above. This one is also where the standard advice is loudest, because
      # AWS publishes AmazonEC2ContainerServiceforEC2Role for exactly this job. Attaching
      # it would be one line. It is not attached, for two reasons that both hold: a
      # managed policy is amendable only through iam:CreatePolicyVersion, which this
      # boundary denies, and an AWS-managed policy can be widened by AWS without a diff in
      # this repository. The statements below are that policy's contents, scoped where the
      # action admits a scope.
      Policies:
        - PolicyName: join-the-batch-managed-ecs-cluster
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Every action here is listed in the ECS and ECR service authorization
              # references with no resource type. ecs:DiscoverPollEndpoint, ecs:Poll and
              # ecs:StartTelemetrySession are the agent's control channel and are not
              # about any one cluster; ecr:GetAuthorizationToken mints a registry-wide
              # token, as it does for the execution role above. "*" is the narrowest grant
              # that exists for all four, and they are in their own statement so a reader
              # can see which ones earned it rather than assuming the whole policy gave up.
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecs:DiscoverPollEndpoint
                  - ecs:Poll
                  - ecs:StartTelemetrySession
                Resource: "*"
              # Batch names the ECS cluster it manages AWSBatch-<compute environment>-<id>,
              # so the compute environment's own name is what makes this scopable at all.
              # Renaming the compute environment in infra/batch-compute.yaml without
              # changing this prefix produces instances that register nowhere and a queue
              # whose jobs sit in RUNNABLE -- the same silent half-failure the job queue
              # name has, and the reason tests/test_phase3_infrastructure.py compares the
              # two files rather than each on its own.
              - Effect: Allow
                Action:
                  - ecs:DeregisterContainerInstance
                  - ecs:RegisterContainerInstance
                  - ecs:SubmitAttachmentStateChanges
                  - ecs:SubmitContainerStateChange
                  - ecs:SubmitTaskStateChange
                  - ecs:UpdateContainerInstancesState
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/AWSBatch-sbsandbox-intern-edullm-cpu-*
              # The image layers the agent pulls on the host's behalf. Same single
              # repository as the execution role, and for the same reason.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-core
              # The ECS agent's own log group, which is not the job's. Scoped to the
              # /aws/ecs/ path so an instance cannot write into the record of what a job
              # printed.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/sbsandbox-intern-edullm-*

  # An instance profile is the only way an EC2 instance can hold a role, and Batch takes
  # its ARN in the compute environment. It lives in the same stack as the role it wraps
  # because the two have no independent lifetime: a profile with no role is inert and a
  # role no profile references cannot reach an instance.
  #
  # This was the one resource in Phase 3 whose creation had not been measured against the
  # boundary before it was written, and it now has been. InternSandboxBoundary permits
  # iam:CreateInstanceProfile and iam:AddRoleToInstanceProfile, measured on 2026-07-27 by
  # the deploy of this stack, which created the profile and attached the role. They are
  # separate actions from iam:CreateRole and were recorded here as unmeasured until that
  # run answered them.
  #
  # Worth keeping rather than deleting for one reason: this profile is why the stack takes
  # about three minutes to deploy where the other Phase 3 stacks take under one. That is
  # IAM propagation rather than a hang.
  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: sbsandbox-intern-edullm-batch-instance
      Roles:
        - Ref: BatchInstanceRole

Outputs:
  ExecutionRoleName:
    Value:
      Ref: BatchExecutionRole
  ExecutionRoleArn:
    Value:
      Fn::GetAtt:
        - BatchExecutionRole
        - Arn
  WorkloadRoleName:
    Value:
      Ref: BatchWorkloadRole
  WorkloadRoleArn:
    Value:
      Fn::GetAtt:
        - BatchWorkloadRole
        - Arn
  InstanceRoleName:
    Value:
      Ref: BatchInstanceRole
  InstanceRoleArn:
    Value:
      Fn::GetAtt:
        - BatchInstanceRole
        - Arn
  InstanceProfileName:
    Value:
      Ref: BatchInstanceProfile
  InstanceProfileArn:
    Value:
      Fn::GetAtt:
        - BatchInstanceProfile
        - Arn
