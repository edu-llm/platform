AWSTemplateFormatVersion: "2010-09-09"
Description: Service roles the admission state machine and its validator function run as.

Resources:
  AdmissionStatesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-admission-states
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      # Inline rather than a customer managed policy. InternSandboxBoundary denies
      # iam:CreatePolicyVersion on every policy, so a managed policy could be created once
      # and never amended; the first permission change would fail the stack update. Inline
      # policies go through iam:PutRolePolicy, which the boundary permits on this name.
      Policies:
        - PolicyName: run-admission-workflow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Both ARNs are needed. Step Functions invokes the unqualified function, but
              # an alias or a published version is a distinct ARN, so a template that
              # later pins the task to a version would otherwise fail at runtime rather
              # than at deploy time.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-admission-validator
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-admission-validator:*
              # PutObject only. The state machine appends lineage records and never reads,
              # overwrites or deletes one; the bucket policy refuses any write that is not
              # conditional, so even this grant cannot replace an existing record.
              #
              # Phase 3 adds two more prefixes under this same grant and no second
              # statement: binding/, written the instant Batch accepts a submission, and
              # submission-failure/, written when it refuses one. A separate Allow naming
              # binding/* would be a strict subset of this one, so it would grant nothing
              # and would read as though it did -- and the next reader would have to work
              # out which of the two was load-bearing. If this ever needs narrowing, narrow
              # it here by enumerating every prefix at once; do not layer a second Allow on
              # top of a wider one.
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/*
              # The only principal in this account that may start compute, and it is
              # reachable only through an execution the admission role started -- which in
              # turn is reachable only from a GitHub job that cleared a protected
              # environment. Nothing else holds batch:SubmitJob: not the deploy role, which
              # builds this queue and never runs anything on it; not the validator Lambda,
              # which decides and does not act; not the workload role, which is what an
              # untrusted command runs as.
              #
              # Two ARNs and two resource types, because SubmitJob authorizes against both
              # the queue it lands in and the job definition it instantiates. Granting one
              # without the other is refused, and the denial names only the missing half.
              #
              # ONE ARN PER JOB DEFINITION, ENDING IN A PREFIX WILDCARD, AND UNTIL
              # 2026-08-04 IT WAS TWO. RegisterJobDefinition mints a new revision on every
              # deploy and the revision is part of the ARN, so a grant on the bare name
              # authorizes nothing once a second revision exists; the pair `-run` and
              # `-run:*` named the definition and its revisions, for the reason
              # lambda:InvokeFunction above names two ARNs. `-run*` covers both, because an
              # IAM wildcard matches ':' like any other character -- the
              # RegisterJobDefinition scope below has always rested on that and says so at
              # length.
              #
              # THE BYTE CEILING FORCED THE COLLAPSE, AND THE WIDENING WAS WEIGHED RATHER
              # THAN OVERLOOKED. IAM caps the aggregate of a role's inline policies at
              # 10240 bytes. Rendered with this account's partition, region and id, the
              # sixteenth profile took this document to 10599, the 2026-08-03 deploy failed
              # with ServiceLimitExceeded, and the stack sat in UPDATE_ROLLBACK_COMPLETE
              # while five profiles the submission form advertised could not be submitted
              # to. Nothing was wrong with the document; the account had never received it.
              # Collapsing the pairs across both statements recovers 2956 bytes against the
              # 359 that were needed, and leaves this policy at 7643.
              #
              # WHAT IT WIDENS IS SMALL AND IS NOT NOTHING. A prefix additionally authorizes
              # any job definition whose name begins with the same string and continues
              # differently -- `-run-anything`, where before only `-run` and its revisions
              # matched. Nothing mints such a name: the deployed definitions are named by
              # infra/batch-compute*.yaml, and the per-run ones by job_definition_name,
              # which produces `sbsandbox-intern-edullm-run_<uuid7>` and so begins with
              # neither prefix. The queues below are the control that was kept whole, and
              # the reason is under EVERY QUEUE IS LISTED.
              #
              # Deliberately absent: batch:TerminateJob and batch:CancelJob. Cancellation
              # is its own path with its own principal; an admission execution that could
              # also stop a job would be able to end a run whose decision it had just
              # recorded as accepted, and nothing in the lineage store would say why.
              #
              # The queue name below is the worst rename in this phase. It appears here, in
              # infra/batch-compute.yaml, and in infra/batch-events.yaml's event pattern,
              # and no CloudFormation reference connects the three. Renaming the queue
              # without this line makes every submission fail closed, which is survivable;
              # renaming it without the event pattern makes jobs run with no lineage at
              # all. infra/README.md explains it and tests/test_phase3_infrastructure.py
              # compares all three against each other.
              #
              # EVERY QUEUE IS LISTED, NOT MATCHED BY A PREFIX. sbsandbox-intern-edullm-*
              # across both resource types would have covered Phase 4 and every phase after
              # it in one edit, and that is the reason not to: this is the only principal in
              # the account that may put work on a queue, and a prefix would extend that to
              # any queue a later phase happens to name.
              #
              # THE NINE GPU SHAPES ADDED EIGHTEEN LINES HERE AND A PREFIX WOULD HAVE ADDED
              # TWO, WHICH IS THE STRONGEST ARGUMENT AGAINST ENUMERATION AND STILL LOSES.
              # sbsandbox-intern-edullm-gpu-* is narrower than the project prefix and is
              # still a standing grant on a name nobody has created yet. What the length
              # buys is that promoting a shape is one visible edit in each of five files, and
              # tests/test_phase3_infrastructure.py compares this list against the queues the
              # templates create in both directions, so a promotion that reaches
              # config/execution-targets.yaml and not this file fails in CI rather than at the
              # first submission. Sixteen profiles are provisioned, so thirty-two ARNs are
              # listed. A seventeenth is a visible edit here.
              #
              # THE BYTE CEILING IS WHY THAT COUNT IS NOW TWO PER PROFILE AND NOT THREE, AND
              # WHY IT MATTERS THAT THE QUEUE HALF STAYED WHOLE. When this document went
              # over IAM's limit the cheapest reduction by far would have been one
              # job-queue/sbsandbox-intern-edullm-* line, and that is precisely the grant
              # this paragraph refuses. The job-definition halves collapsed instead: they
              # were an exact name plus its revisions, which one prefix expresses, whereas a
              # queue prefix would extend the only compute-starting grant in the account to
              # every queue a later phase happens to name. Adding a queue without a grant
              # stays a visible act, and tests/test_phase2_deployed_roles.py now catches one
              # that reached the templates and not the account.
              - Effect: Allow
                Action: batch:SubmitJob
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-cpu
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-cpu-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xt4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xt4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xt4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xt4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xt4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xt4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xa10g
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xa10g-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xa10g
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xa10g-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xl4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xl4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xl4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xl4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xl4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xl4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xl40s
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xl40s-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xl40s
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xl40s-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xl40s
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xl40s-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xh100
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xh100-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xa100
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xa100-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xh100
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xh100-run*
                  # THE PER-RUN DEFINITION, WITHOUT WHICH THIS ROLE CAN REGISTER A JOB
                  # DEFINITION AND NOT SUBMIT TO IT. SubmitJob authorizes against the
                  # definition as well as the queue, so a submission naming the revision
                  # registered a state earlier is denied with a 403 naming the definition --
                  # the same denial batch:TagResource produced on the first run through this
                  # path. It fails closed into a submission-failure record rather than
                  # launching anything, and it fails on every accepted submission.
                  #
                  # Scoped to the minted shape rather than to the project prefix. A run id
                  # is run_<uuid7> and job_definition_name puts it under this prefix, so
                  # sbsandbox-intern-edullm-run_* matches exactly what a registration can
                  # produce and matches neither cpu-run nor gpu-run, which do not begin
                  # run_. A definition named anything else stays a visible edit here.
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-run_*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-run_*:*
              # batch:TagResource is here to serve the SubmitJob above and for no other
              # reason. batch_submit_request always sends Tags -- the run id, the team and
              # the compute profile, which is what Phase 5's cost attribution reads -- and
              # Batch authorizes tagging-on-creation as a separate action from the create
              # itself. So a role holding SubmitJob and not this one is refused every
              # submission, which is what the first run through the whole path measured:
              #
              #   not authorized to perform: batch:TagResource on resource:
              #   arn:aws:batch:us-east-1:<account>:job-definition/sbsandbox-intern-edullm-cpu-run
              #
              # The ARNs mirror SubmitJob's exactly, because it is the same call against the
              # same two resource types and the denial named one of them. They are a
              # separate statement rather than a second action on the one above so that the
              # grant reads as what it is: not a capability to tag Batch resources, but the
              # half of SubmitJob that AWS bills to a different action name. Widening either
              # list without widening the other produces a role that can submit and cannot,
              # which fails at run time and nowhere earlier.
              #
              # No batch:UntagResource. The tags are lineage, and a principal that could
              # remove them could detach a running job from the run that paid for it.
              - Effect: Allow
                Action: batch:TagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-cpu
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-cpu-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xt4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xt4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xt4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xt4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xt4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xt4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xa10g
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xa10g-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xa10g
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xa10g-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xl4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xl4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xl4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xl4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xl4
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xl4-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xl40s
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xl40s-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-4xl40s
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-4xl40s-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xl40s
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xl40s-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-1xh100
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-1xh100-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xa100
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xa100-run*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-queue/sbsandbox-intern-edullm-gpu-8xh100
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-gpu-8xh100-run*
                  # Mirrors SubmitJob's list exactly, for the reason the comment above gives:
                  # it is the same call against the same resources, billed to a second action
                  # name, and a list widened on one and not the other produces a role that
                  # can submit and cannot.
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-run_*
                  - Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-run_*:*
              # THE FIRST GRANT THAT LETS THIS ROLE CREATE A BATCH RESOURCE RATHER THAN USE
              # ONE, AND THE REASON IS THAT AWS BATCH HAS NO SUBMIT-TIME IMAGE OVERRIDE.
              # ContainerOverrides carries command, environment, instanceType and
              # resourceRequirements and no image field, so RegisterJobDefinition is the
              # only mechanism that can put a run on the digest its manifest declared.
              # Without this, the declared digest is validated, gates admission through the
              # ECR scan above, is written immutably into lineage -- and selects nothing,
              # because what runs is whatever infra/batch-compute.yaml pins.
              #
              # NO ":*" SUFFIX, AND SINCE 2026-08-04 THE SUBMIT SCOPE NEEDS NONE EITHER.
              # Not because a revision is absent from the ARN: it is there, and
              # infra/iam/infra-deployer-role.yaml records the deploy that learned it the
              # hard way -- a grant on the bare definition name authorizes revision 1 and
              # denies revision 2, which reads as a permissions change nobody made. It is
              # because an IAM wildcard matches ':' as well as every other character, so a
              # scope ending in '*' already covers the ':5' form, and a second entry
              # spelling it out would be a strict subset of this one. The submit scope used
              # to name each definition in full and so had no trailing wildcard to do that
              # work; it now ends each one in a prefix wildcard for the same reason, and the
              # paragraph above it records the byte ceiling that forced the change. The same
              # reasoning is already written into the deployer's log-group scope.
              #
              # The prefix starts after the edullm segment for the reason every scope in
              # this repository does: sbsandbox-intern- alone is every intern's prefix in a
              # shared account, and a job definition names the two IAM roles its container
              # runs as -- so a wider scope would not be a Batch resource being edited, it
              # would be an identity handed to an image somebody else did not choose.
              #
              # DELIBERATELY ABSENT: batch:DeregisterJobDefinition. One definition is
              # registered per submission and they accumulate, which is untidy and is not a
              # problem: Batch enforces no quota on revisions. Cleaning them up is a later
              # phase's work and belongs to a different principal, because this one records
              # a run as accepted and then launches it -- a role that could also retire the
              # definition a running job is bound to could make a completed run unreadable,
              # since the binding record names a definition Batch would no longer describe.
              # Granting a verb nothing calls widens the role for nothing.
              - Effect: Allow
                Action: batch:RegisterJobDefinition
                # Narrowed to the shape a registration can actually mint, matching the two
                # lists above. The project prefix would also let this role register a
                # revision of sbsandbox-intern-edullm-cpu-run or -gpu-run, replacing the
                # image on a definition the CloudFormation stack owns and that every earlier
                # run was submitted against. Nothing needs that, and the narrower scope means
                # the deployed definitions can only be changed by the template that declares
                # them.
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:batch:${AWS::Region}:${AWS::AccountId}:job-definition/sbsandbox-intern-edullm-run_*
              # The other half of RegisterJobDefinition, and the one to argue about rather
              # than skim. A job definition names an execution role and a job role, so
              # registering one passes both -- that call is where a container's two
              # identities are fixed, and the calling principal must hold iam:PassRole for
              # each. infra/iam/infra-deployer-role.yaml carries the same pair of grants for
              # the same call and the same reason.
              #
              # FOUR WHOLE ROLE ARNS, AND THEY MUST STAY WHOLE. A prefix --
              # sbsandbox-intern-edullm-* -- would read as the same grant and is not:
              # passing a role is how a principal lends its own limits away, so a prefix
              # would let this state machine hand a container any role that ever takes a
              # matching name, including one created in a later phase with permissions
              # nobody weighed against the only principal in this account that may start
              # compute. Naming each one means a fifth is a visible edit here.
              #
              # Four rather than two because there are two backed compute profiles and each
              # has its own pair; config/execution-targets.yaml is what says so, and
              # tests/test_phase5_infrastructure.py reads that file and this list and
              # compares them, so promoting a third profile without extending this list
              # fails there rather than at the first submission on it.
              #
              # The instance roles are absent and must stay absent. An instance role is
              # passed by batch:CreateComputeEnvironment, which this principal does not
              # hold, and it is the one role in the Batch set whose credentials a process on
              # a shared container host can reach through the ECS agent.
              #
              # The blast radius is bounded on the other side too: each of these four is
              # trusted only by the AWS service its own trust policy names, so passing one
              # anywhere else yields a role that cannot be assumed.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-execution
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-workload
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-execution
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-batch-gpu-workload
              # ecr:DescribeImageScanFindings, for the ReadImageScan state the state
              # machine runs before it validates anything. The findings reach the validator
              # as a payload key the ASL builds from this task's result and from nowhere
              # else: a caller that could supply its own scan findings could declare its
              # own image clean, so the state machine reads them itself.
              #
              # Read-only, and scoped to every repository a submission can name rather than
              # to the one this project used to publish to. ecr:PutImage,
              # ecr:InitiateLayerUpload and the rest of the push path are absent: admission
              # reads what the publisher recorded and publishes nothing.
              #
              # WIDENING THIS IS NOT OPTIONAL NOW THAT ReadImageScan TAKES ITS REPOSITORY
              # FROM THE SUBMISSION, AND THE DENIAL IT PREVENTS NEVER REACHES ANYBODY AS A
              # DENIAL. ReadImageScan catches States.ALL, so an AccessDenied arrives at the
              # validator in the same branch an unscanned image does, and
              # image_scan_is_reviewed consults config/image-exceptions.yaml before it looks
              # at the summary at all. A digest with an exception would therefore be admitted
              # on a scan nobody read, which is the image gate passing because it could not
              # run rather than because it found nothing.
              - Effect: Allow
                Action: ecr:DescribeImageScanFindings
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-core
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-data
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-eval-full
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-alt-cl
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-open-instruct-scored-rewards
              # "*" is the narrowest grant that exists for the delivery half of this list.
              # CreateLogDelivery, GetLogDelivery, UpdateLogDelivery, DeleteLogDelivery,
              # ListLogDeliveries, PutResourcePolicy and DescribeResourcePolicies are
              # listed in the CloudWatch Logs service authorization reference with no
              # resource type at all, so an ARN cannot be attached to them: a scoped
              # resource would deny them outright and Step Functions logging would never
              # start. This is the grant AWS's own vended-logs setup requires, and it is
              # why the log group name is forced under /aws/vendedlogs/states/ where a
              # single shared resource policy covers every state machine in the account.
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  AdmissionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-admission-lambda
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Inline rather than a customer managed policy, for the same boundary reason as the
      # states role above.
      Policies:
        - PolicyName: write-own-log-group
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # No s3: action of any kind, and none may be added. The validator is the one
              # component that parses an untrusted run manifest, so it is the one most
              # likely to be made to do something its author did not intend. Splitting the
              # work so that the Lambda decides and the state machine records means a
              # validator that is talked into producing a hostile decision still cannot
              # put a byte into the lineage store: the write is performed by a different
              # principal, against a bucket that refuses to overwrite, from a decision the
              # state machine hands it. The absence here is the control.
              #
              # CreateLogGroup is included because Lambda creates the function's log group
              # on first invocation using this role; without it the function runs and logs
              # nowhere, which is the failure mode hardest to notice. It is scoped to this
              # function's own group, so it cannot create or write any other.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sbsandbox-intern-edullm-admission-validator:*

Outputs:
  StatesRoleName:
    Value:
      Ref: AdmissionStatesRole
  StatesRoleArn:
    Value:
      Fn::GetAtt:
        - AdmissionStatesRole
        - Arn
  LambdaRoleName:
    Value:
      Ref: AdmissionLambdaRole
  LambdaRoleArn:
    Value:
      Fn::GetAtt:
        - AdmissionLambdaRole
        - Arn
