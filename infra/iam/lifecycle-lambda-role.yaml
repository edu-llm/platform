AWSTemplateFormatVersion: "2010-09-09"
Description: Service role the lifecycle recorder function runs as while it projects Batch state changes onto lineage.

Resources:
  LifecycleLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-lifecycle-lambda
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # Inline rather than a customer managed policy. InternSandboxBoundary denies
      # iam:CreatePolicyVersion on every policy, so a managed policy could be created once
      # and never amended; the first permission change would fail the stack update. Inline
      # policies go through iam:PutRolePolicy, which the boundary permits on this name.
      Policies:
        - PolicyName: record-what-batch-reported
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # This role is the mirror image of the admission validator's. That one
              # decides and cannot write; this one writes and cannot decide. The
              # separation is not symmetry for its own sake: the recorder is reached by an
              # EventBridge delivery rather than by an execution somebody approved, so it
              # is the component furthest from the gate, and the only thing it may do with
              # that distance is append a record of something that already happened.
              #
              # PutObject only on the lineage store, and only under the four prefixes this
              # phase writes. No GetObject, no DeleteObject and no ListBucket on that
              # bucket: the bucket policy already refuses an unconditional write, and a
              # recorder that could read the store could read every team's admission
              # decisions on its way past. The one read this role does hold is a listing of
              # the outputs bucket, argued for beside the statement below.
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/binding/*
                  - Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/events/*
                  - Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/attempt/*
                  - Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/result/*
              # THE ONE READ THIS ROLE HOLDS, AND IT ENUMERATES RATHER THAN FETCHES.
              #
              # lifecycle_projection.py fills ResultManifest.checkpoints from the prefix
              # the container was handed in EDULLM_CHECKPOINT_DIR, which execution.py sets
              # to output_prefix(team, run_id) with checkpoints/ on the end. Without this
              # grant the listing is refused, checkpoints_under turns the refusal into an
              # empty tuple, and a run that trained for hours and saved a checkpoint is the
              # same record as a run that saved nothing. That degradation is deliberate,
              # because an exception inside the recorder dead-letters the delivery and
              # loses the event, the attempt and the result for a run that demonstrably
              # happened. It is also silent, so the field stays empty on every run until
              # somebody applies this stack, and nothing goes red to say so.
              #
              # s3:ListBucket IS AUTHORIZED AGAINST THE BUCKET ARN AND NOT AN OBJECT ONE,
              # so the Resource cannot narrow it and the prefix condition is the whole of
              # the narrowing. Drop the Condition and this enumerates every key in the
              # outputs bucket, which is every team's output rather than the checkpoints of
              # the run being recorded. infra/iam/audit-reader-role.yaml gives that same
              # reasoning beside both of its listings and is the precedent this matches.
              #
              # The pattern is the value the projection actually sends. list_objects_v2 is
              # called with Prefix set to the path of EDULLM_CHECKPOINT_DIR, which is
              # teams/{team}/runs/{run_id}/checkpoints/, and IAM's * matches zero
              # characters, so the trailing segment admits that prefix as well as every
              # deeper one under it. A listing of the bucket root, of teams/, or of a run's
              # own output prefix carries a value this pattern does not match and is
              # refused, which is what keeps the grant to the question being asked.
              #
              # NO s3:GetObject, AND THAT IS A DECISION RATHER THAN AN OVERSIGHT. A listing
              # carries the key, the size and the write time, which is everything a
              # CheckpointManifest needs except a digest of the payload, and
              # described_listing_checksum stands in for that. One consequence is worth
              # recording honestly. A listing cannot read the contents of a _SUCCESS
              # marker, so a checkpoint prefix whose step number lives inside the marker
              # rather than in a step{N} directory name records nothing rather than a step
              # of zero. Closing that would need s3:GetObject across the outputs bucket,
              # which buys one field on a shape OLMo-core does not write and pays for it
              # with a recorder that can read what every team's runs produced.
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs
                Condition:
                  StringLike:
                    s3:prefix: "teams/*/runs/*/checkpoints/*"
              # s3:GetObject ON ONE KEY NAME, AND THE COMMENT ABOVE IS WHY IT IS THIS NARROW.
              # That paragraph refuses GetObject across the outputs bucket to buy one
              # checkpoint field a listing nearly supplies. This is the case it does not
              # cover: an eval run's scores are the contents of metrics.json and no listing
              # can reach them, so the choice is this read or an empty field forever.
              #
              # The resource ends in the exact object name rather than a wildcard, so the
              # recorder can read the one document it is being asked to project and nothing
              # else any team wrote. A trailing * here would be the wide grant the paragraph
              # above declines, arriving under a narrower-looking rule.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs/teams/*/runs/*/metrics.json
              # The event source mapping polls as this role, so receive, delete and the
              # attribute read are all needed; without DeleteMessage a projected event is
              # redelivered until it reaches the dead-letter queue, which reads as a
              # broken projection and is a missing permission.
              #
              # The dead-letter queue is deliberately absent from this scope. Nothing
              # reads it automatically -- an event that failed projection is meant to sit
              # there until a person looks -- and a recorder that could drain its own
              # dead-letter queue could erase the evidence that it failed.
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:sbsandbox-intern-edullm-batch-lifecycle
              # No batch: action of any kind, and batch:DescribeJobs in particular.
              #
              # The Phase 3 plan asked for it on "*" -- it has no resource type, so "*" is
              # the narrowest grant that exists -- on the grounds that a Batch Job State
              # Change event carries the job's status and exit code but not its attempts
              # array, and SchedulerAttempt is built from the attempts. That premise is
              # false. The detail carries `attempts`, each with `startedAt`, `stoppedAt`,
              # `statusReason` and the container exit code, and lifecycle_projection.py
              # reads the first three straight off the event. The exit code it does not
              # read at all: no Phase 0 contract has a field for one, so it is captured
              # evidence rather than a projected value.
              #
              # Reading them from a describe instead would be actively wrong rather than
              # merely unnecessary. An event is a fixed statement about the instant the
              # state changed; a describe returns the job as it is when the recorder asks.
              # So a redelivered event would project from different inputs than its first
              # delivery, produce different bytes under the same derived key, and the
              # conditional write would refuse the second one -- silently keeping whichever
              # projection happened to arrive first. The entire write-once design rests on
              # a replay recomputing the same record, and a grant that makes the projection
              # depend on when it runs takes that property away.
              #
              # Kept out rather than kept unexercised. A grant that nothing calls is one
              # nobody notices, and the argument for it stops being checkable the moment
              # its justification is wrong. If a later state change genuinely carries a
              # detail the projection cannot read, the answer is to add the grant then,
              # with the event that needed it named.
              #
              # batch:SubmitJob, batch:TerminateJob and batch:CancelJob are absent for a
              # different reason and it still holds: the component that records what
              # happened must not be able to make something happen, and an event-driven
              # component is the worst place to put that ability -- a malformed event would
              # be a way to reach it.
              #
              # CreateLogGroup is included because Lambda creates the function's own group
              # on first invocation using this role; without it the function runs and logs
              # nowhere, which is the failure mode hardest to notice. Scoped to this
              # function's group, so it can create or write no other -- including the Batch
              # job log group, whose contents this role must be able to reference and not
              # to alter.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sbsandbox-intern-edullm-lifecycle-recorder:*

Outputs:
  RoleName:
    Value:
      Ref: LifecycleLambdaRole
  RoleArn:
    Value:
      Fn::GetAtt:
        - LifecycleLambdaRole
        - Arn
