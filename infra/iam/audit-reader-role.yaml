AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions role for the audit, which reads the account to compare it with what the platform recorded, and writes nothing anywhere.

Resources:
  AuditReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-audit-reader
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      # WHY A NEW ROLE RATHER THAN ONE OF THE FIVE THAT ALREADY EXIST.
      #
      # Every OIDC role here pins `job_workflow_ref` with `StringEquals` to one workflow
      # file, which is deliberate and is what makes each role's blast radius readable off
      # the file that can assume it. The consequence is that a token minted for audit.yml
      # matches none of them, so an audit check needing AWS has no identity at all -- and
      # the two checks that need one, checkpoint reconciliation and the W&B credential,
      # could not run.
      #
      # Widening an existing role's `job_workflow_ref` to a list was the smaller diff and
      # the worse change. The admission role can start an execution and the canceller can
      # stop any job on either queue; adding audit.yml to either would put those powers
      # behind a scheduled workflow that nobody watches dispatch. This role is instead
      # scoped by what it can do: read a named set of things and nothing else in the
      # account, where every member of that set is argued for beside the statement below.
      #
      # The sub prefix carries owner and repository ids because this organization issues
      # immutable subject claims, verified as
      # `gh api repos/edu-llm/platform/actions/oidc/customization/sub` reporting
      # sub_claim_prefix repo:edu-llm@306859726/platform@1311508598.
      #
      # refs/heads/main is the only ref in the subject, and a schedule cannot present
      # another one: GitHub runs a scheduled workflow on the default branch. So the same
      # condition that pins the file also means a branch cannot borrow this role by adding
      # a job to audit.yml and dispatching it from the branch.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:job_workflow_ref: edu-llm/platform/.github/workflows/audit.yml@refs/heads/main
                token.actions.githubusercontent.com:repository_owner_id: "306859726"
                token.actions.githubusercontent.com:repository_id: "1311508598"
                token.actions.githubusercontent.com:sub: repo:edu-llm@306859726/platform@1311508598:ref:refs/heads/main
      # Inline rather than managed, for the reason every role here is: InternSandboxBoundary
      # denies iam:CreatePolicyVersion, so a managed policy could be created once and never
      # amended.
      Policies:
        - PolicyName: read-what-the-audit-asks-about
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The intent records, which are how the reconciliation learns which runs were
              # submitted under a profile carrying a checkpoint contract; the result records,
              # which say how each of them ended; and the attempt records, which are the only
              # place a run's measured duration exists. Object-level and confined to three
              # prefixes: the same bucket holds decision, binding, events and
              # submission-failure records, and nothing scheduled here reads any of them.
              #
              # The result grant decides whether a run's prefix is held against the build,
              # not what the prefix says. A run recorded as failed has already reported its
              # failure and an empty prefix under it is the expected shape; a run recorded as
              # a success that saved nothing is the case this check exists for, and it is
              # still read from the bucket rather than believed from the record.
              #
              # WHY THE ATTEMPT GRANT IS HERE, AND WHAT ITS ABSENCE COST. The visibility
              # board syncs the prefixes in ``tools/report_run_costs.py:LINEAGE_PREFIXES``,
              # which are ``intent`` and ``attempt``, and this policy granted ``intent`` and
              # ``result``. Two files stated the same fact and nothing compared them, so the
              # board was refused on its first ``ListObjectsV2`` under ``attempt/`` on every
              # night it has ever run. ``sync_bucket`` raises on a refused prefix rather than
              # skipping it, so the refusal did not cost the attempt records alone -- it cost
              # the whole cost mapping, and every run on the board read "not costed".
              #
              # Nothing substitutes for it. ``edullm_platform.run_costs.run_costs`` skips any
              # run with no attempt record, and ``_attempt_seconds`` is the only source of a
              # duration, so with this prefix unreadable there is no cost figure, no
              # per-team split and no total. The records themselves are timings and job
              # identifiers, which is the same class of fact the intent records already
              # carry, so this widens what the role can see by a prefix rather than by a
              # kind of thing.
              #
              # ``tests/test_audit_workflow.py`` now derives the required prefix set from
              # the workflow and from that constant instead of restating it, so this list
              # and the tools cannot drift apart again without a red review.
              - Sid: ReadIntentRecords
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/intent/*
              - Sid: ReadResultRecords
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/result/*
              - Sid: ReadAttemptRecords
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/attempt/*
              # THE SECOND ACCOUNT-SIDE SOURCE, AND THE ONLY ONE THAT DOES NOT EXPIRE. The
              # board answers "what did the account actually run" from tag:GetResources,
              # which drops a finished Batch job after roughly a week -- so the account side
              # was not merely incomplete, it was silently losing runs as they aged out, and
              # a board comparing a shrinking denominator reports agreement it did not
              # verify. The binding records are written once per accepted job and never
              # expire, so they are what makes the account side's window a property of the
              # bucket rather than of the tagging API's retention. It takes the board from
              # 112 runs to 117 and lets it print the window each source covers.
              #
              # This is a record of the same kind the three prefixes above already carry --
              # a job identifier and the run it belongs to -- so it widens what the role can
              # see by a prefix rather than by a kind of thing. decision/, events/ and
              # submission-failure/ stay unreadable, and the reasons they are withheld are
              # unchanged.
              #
              # Written character-for-character as tools/visibility_board.py's
              # MISSING_BINDING_GRANT quotes it, for the reason the tagging grant below is:
              # the board prints that string into its own 05:00 report as the thing to
              # paste, so a second spelling here would mean whoever pastes the report changes
              # the role into something no test covers.
              - Sid: ReadBindingRecords
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage/binding/*
              # Listing is a bucket-level action, so it cannot be scoped by an object ARN and
              # the prefix condition is the narrowing. Granted because the check has to
              # enumerate each tree; it is handed no list of run ids.
              #
              # EVERY PREFIX FETCHED ABOVE HAS TO APPEAR HERE TOO, and the failure of
              # forgetting is not a partial read. ``aws s3 sync`` lists before it fetches, so
              # a GetObject grant whose prefix is missing from this condition reads as
              # granted in the policy document and is refused at the first call, before a
              # single object is fetched. That is exactly how ``attempt/`` failed.
              - Sid: ListLineageRecords
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-lineage
                Condition:
                  StringLike:
                    s3:prefix:
                      - intent/*
                      - result/*
                      - attempt/*
                      - binding/*
              # What a run wrote. GetObject rather than a listing alone because deciding
              # whether a checkpoint would load means reading it: HeadObject is authorized as
              # s3:GetObject, and a `_SUCCESS` marker has to be fetched to be compared
              # against what the store attests.
              - Sid: ReadRunOutput
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs/teams/*/runs/*
              # Same shape and the same reason as the workload roles' own listing grant, and
              # the same prefix condition, so this cannot enumerate anything in the bucket
              # that is not a run's output.
              - Sid: ListRunOutput
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::sbsandbox-intern-edullm-outputs
                Condition:
                  StringLike:
                    s3:prefix: teams/*/runs/*
              # THE WILDCARD ON THIS ARN IS LOAD-BEARING AND IS NOT A PREFIX GRANT. Secrets
              # Manager appends a random six-character suffix to every secret ARN -- here
              # -fnwEVp -- which is not predictable and not stable across a
              # delete-and-recreate, so a grant written against the exact ARN works until
              # somebody recreates the secret and then fails as an access denial that reads
              # like a policy error. The trailing -* matches that suffix and nothing else:
              # the name it follows is complete, so this cannot reach a second secret unless
              # somebody creates one whose name begins with this one.
              #
              # The check reads the value because the fault it exists to catch is only
              # visible in the value. A key with the literal word `api` glued to the front --
              # what pasting W&B's netrc line as one token produces -- is the right length,
              # the right shape at a glance, and refused by W&B; nothing goes red, because a
              # training run does not fail when W&B declines it.
              - Sid: ReadTheWandbKeyTheCheckValidates
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sbsandbox-intern-edullm-wandb-api-key-*
              # THE DIGEST OF THE CODE THESE THREE FUNCTIONS ARE ACTUALLY RUNNING. The release
              # record committed beside each template says what was released, and the two
              # release tripwires hold each record against a zip built from the tree. Neither
              # says anything about the account, so a function deployed out of band or a
              # release recorded from the wrong tree leaves CI green over a validator
              # enforcing bytes nobody reviewed. GetFunctionConfiguration reports CodeSha256,
              # which is the same digest in base64, and closes that half of the chain.
              #
              # GetFunctionConfiguration rather than GetFunction. The shorter name is the
              # wider grant: GetFunction answers with a presigned URL to the deployed
              # artifact, so a job holding it could fetch the code rather than describe it.
              #
              # One statement per ARN rather than one statement wildcarded to `function:*`.
              # This is a shared sandbox account with sixteen other teams in it, and a
              # wildcard would let a job nobody watches dispatch enumerate every function's
              # configuration -- environment variable names, role ARNs, layer versions -- to
              # answer a question about three of them. The names are the ones
              # `infra/admission-state-machine.yaml`, `infra/batch-events.yaml` and
              # `infra/notifications.yaml` declare, and tests/test_audit_workflow.py reads them
              # from those templates rather than restating them, so a rename that misses this
              # file fails at review.
              #
              # Unqualified, with no `:*` for versions or aliases. The check asks about
              # $LATEST, which is what the state machine and the events rule invoke, and a
              # qualified ARN would be a grant for something nothing here reads.
              - Sid: ReadAdmissionValidatorDeployedCode
                Effect: Allow
                Action: lambda:GetFunctionConfiguration
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-admission-validator
              - Sid: ReadLifecycleRecorderDeployedCode
                Effect: Allow
                Action: lambda:GetFunctionConfiguration
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-lifecycle-recorder
              - Sid: ReadExpiryJanitorDeployedCode
                Effect: Allow
                Action: lambda:GetFunctionConfiguration
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-expiry-janitor
              # The one whose deployed bytes are hardest to doubt from the outside. A notifier
              # running old code posts a message that is wrong about the money, nothing
              # compares it to anything, and the only reader is a person who reads it once and
              # believes it.
              - Sid: ReadNotifierDeployedCode
                Effect: Allow
                Action: lambda:GetFunctionConfiguration
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sbsandbox-intern-edullm-notifier
              # WHAT EACH STACK IS ACTUALLY DEPLOYED FROM. Every check in this repository
              # compares the repository against itself; nothing compared the account against
              # the repository, and the stacks under infra/iam/ are applied by hand from
              # laptops so there is not even a run log. On 2026-08-01 an s3:DeleteObject
              # grant on the GPU workload role was applied at 17:11 and taken back at 17:53
              # by somebody applying the same stack from a branch cut before it existed. A
              # change set shows what the template being applied says, not what it omits
              # relative to what is live, so nothing warned anyone.
              #
              # Every stack named in full rather than a stack/sbsandbox-intern-edullm-*
              # prefix. A template is the whole configuration of a stack, so this is the
              # widest read in this policy and it is the one worth spelling out: a prefix
              # would silently extend it to whatever a later phase deploys under a matching
              # name, and the point of the check is that a new stack is noticed rather than
              # absorbed. The list is the same one STACKS declares in
              # tools/verify_deployed_stacks.py, which tests/test_audit_workflow.py reads
              # rather than restates, so a stack added to one and not the other fails at
              # review instead of as a denial at 05:00.
              #
              # The trailing /* is CloudFormation's stack id, a uuid chosen at creation and
              # not predictable from the name. Everything before it is complete, so this
              # cannot reach a second stack unless somebody creates one whose name begins
              # with one of these.
              - Sid: ReadTheDeployedTemplateOfEachStack
                Effect: Allow
                Action: cloudformation:GetTemplate
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase1-ecr/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-ecr-publisher-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-infra-deployer-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase2-admission-service-roles/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase2-admission-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase2-lineage/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase2-artifacts/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase2-admission/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase3-batch-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase3-lifecycle-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase3-outputs/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase3-network/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase3-batch/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase3-events/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase4-gpu-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase4-gpu/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase4-gpu-shapes/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-dataset-validator-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-researcher-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-janitor-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-janitor/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-run-canceller-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-audit-reader-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-phase5-image-resolver-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-run-preview-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-notifier-iam/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-notifications/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-work/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sbsandbox-intern-edullm-lane-instance-iam/*
              # THE ONE WILDCARD RESOURCE IN THIS POLICY, AND IT IS FORCED RATHER THAN CHOSEN.
              # cloudformation:ListStacks has no resource type at all -- the request names no
              # stack, so there is nothing for a resource ARN to match and a policy that
              # names one denies the call outright. It is granted anyway because it is the
              # action that stops the check going blind: the names above are a
              # list somebody wrote, so the stack that will not be on it is the one somebody
              # deploys next, and listing the account is how that stack gets reported instead
              # of skipped. Without it the check would silently cover only what it already
              # knew about, which is the failure it exists to end.
              #
              # What it discloses is names, statuses and timestamps -- no template, no
              # parameter, no output -- for the seventy-odd stacks in this shared sandbox.
              # That is the price, and it is paid knowingly.
              #
              # aws:RequestedRegion is the only narrowing the action admits, and it is a
              # small one: the region lock permits us-east-1 and us-east-2 and everything
              # this platform has is in the first. It is here because a listing of a second
              # region would be a read nothing asks for, not because it prevents much.
              - Sid: FindStacksNothingInTheRepositoryAccountsFor
                Effect: Allow
                Action: cloudformation:ListStacks
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              # WHAT THE ACCOUNT ACTUALLY RAN, WHICH IS THE ONLY SOURCE THAT KNOWS.
              # tools/visibility_board.py joins three records of a run, and this is the one
              # that says a run existed at all in the account. Without it every run in the
              # account is trivially absent from the account side, so the board reported the
              # comparison as unanswered rather than reporting it wrongly -- which is right,
              # and which also meant the job exited 2 and went red on every night it has run.
              # There is no substitute for the board's purpose. The queue grants below arrived
              # later and answer a different question: batch:ListJobs enumerates the jobs on a
              # named queue, so it sees the sixteen queues this platform created and nothing
              # the account ran anywhere else, which is precisely the gap the board exists to
              # report. The lineage records are narrower still -- they say what this platform
              # submitted rather than what the account is running. Only the tagging API answers
              # across the whole region, so this grant stays even now that the queues are
              # readable.
              #
              # THE SECOND WILDCARD RESOURCE, AND FORCED FOR THE SAME REASON AS THE FIRST.
              # tag:GetResources names no resource in the request, so a policy naming one
              # denies the call outright and "*" is not a choice. The region condition is the
              # only narrowing the action admits. What it discloses is the ARNs and tags of
              # resources in this region, which in a shared sandbox is wider than the rest of
              # this policy; it is paid knowingly, and it is read-only in the strictest sense
              # -- the adjacent tag:TagResources and tag:UntagResources are absent, so this
              # cannot relabel a resource into or out of its own report.
              #
              # Written character-for-character as tools/visibility_board.py:MISSING_TAG_GRANT
              # quotes it. That tool prints the statement into its own report as the thing to
              # paste, so a second spelling here would mean whoever pastes the report changes
              # the role into something no test covers. tests/test_visibility_board.py holds
              # the two together.
              - Sid: FindEveryResourceThisPlatformTagged
                Effect: Allow
                Action: tag:GetResources
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              # What was launched, as against what the platform recorded launching. The
              # mismatch arm of the instruments needs a feed the platform does not write,
              # or it can only compare the platform's records with themselves.
              #
              # LookupEvents takes no resource, so the region condition is the whole of the
              # bound. It reads the ninety-day management-event history, which is already
              # visible to anyone who can read the account, and it cannot start, stop or
              # relabel anything.
              - Sid: LookUpLaunchEvents
                Effect: Allow
                Action: cloudtrail:LookupEvents
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              # WHAT EACH QUEUE DID WITH THE JOBS PUT ON IT, WHICH IS THE ONE THING
              # config/capacity.yaml's `places` COLUMN IS AND NOTHING ELSE MEASURES. That file
              # records, per profile, whether EC2 will sell this account the shape -- and its
              # own header counts eight entries that were wrong, every one of them wrong in
              # the same direction, because the answer was inferred from whatever instrument
              # somebody happened to reach for. The header's conclusion is that the verdict is
              # worth recomputing every night and the median is not, and these two actions are
              # whole of what that recompute needs: list a queue's jobs, describe the ones it
              # returns, and compare the verdict that falls out against the committed one.
              #
              # THE GRANT IS THE REASON THAT CHECK DOES NOT EXIST YET, WHICH IS WHY IT ARRIVES
              # BEFORE THE CHECK RATHER THAN WITH IT. This role held neither action, this
              # stack is applied by hand from a laptop, and a scheduled job merged against a
              # role that has not been re-applied is red from the night it ships until
              # somebody remembers -- which is the exact state the header of
              # .github/workflows/audit.yml records the visibility board spending its first
              # weeks in. So the two halves are deliberately separated: the grant lands and is
              # deployed, and the job that uses it is written against a role that already has
              # it.
              #
              # THE THIRD AND FOURTH WILDCARD RESOURCES, AND FORCED FOR THE REASON THE FIRST
              # TWO ARE. Neither action has a resource type. The service authorization
              # reference lists batch:ListJobs and batch:DescribeJobs with an empty resource
              # column and no service condition keys, so although ListJobs takes a jobQueue
              # parameter and DescribeJobs takes job ids, IAM has nothing to match a resource
              # ARN against and a policy naming one denies the call outright. Confining this
              # to the sixteen queues in config/execution-targets.yaml is not a narrowing
              # somebody declined to write, it is not expressible.
              #
              # aws:RequestedRegion is therefore the whole of the bound, as it is on the three
              # grants above. What it discloses is the job records of this region: ids, names,
              # statuses, timestamps and the queue each sat on, for every job in the account
              # rather than only this platform's. That is wider than the rest of this policy
              # and it is the same price already paid for tag:GetResources, which answers with
              # every tagged ARN in the region.
              #
              # BOTH ARE READS IN THE STRICTEST SENSE AND THE ADJACENT WRITES STAY ABSENT.
              # batch:SubmitJob, batch:CancelJob and batch:TerminateJob are the actions a
              # queue-reading credential would reach for next, and a check able to cancel a
              # job is a check able to decide the shape it is measuring does not place. The
              # rule is the one the whole policy is written to and it does not bend for the
              # check that finally needed the queues.
              - Sid: ReadTheQueuesThePlacementVerdictNeeds
                Effect: Allow
                Action:
                  - batch:ListJobs
                  - batch:DescribeJobs
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion:
                      Fn::Sub: ${AWS::Region}
              # DELIBERATELY ABSENT, and each for its own reason rather than as a list.
              #
              # Every write. This role exists to describe the account and a check that can
              # change what it is checking can manufacture its own all-clear. It is the one
              # property of this role worth holding to a test, and
              # tests/test_audit_workflow.py does.
              #
              # s3:GetObject on the rest of the lineage store, which is now decision/,
              # binding/, events/ and submission-failure/ rather than "everything but
              # intent". Nothing scheduled in audit.yml reads any of the four: the
              # reconciliation joins intent to result, and the board joins intent to attempt.
              # This paragraph claimed the result records were withheld long after they were
              # granted, which is the drift the derived check below now makes impossible to
              # repeat silently.
              #
              # s3:DeleteObject, for the reason the GPU workload role omits it. Checkpoints
              # are kept because nothing on this platform can remove one, and an audit
              # holding the delete would be the first identity able to tidy up the evidence.
              #
              # secretsmanager:PutSecretValue, UpdateSecret and DeleteSecret. The check
              # reports that a rotation was wrong; repairing it is a laptop and a person.
              #
              # secretsmanager:ListSecrets. It has no resource type, so granting it would be
              # an account-wide enumeration of sixteen other teams' secret names to save a
              # call this role never makes.
              #
              # lambda:UpdateFunctionCode and lambda:UpdateFunctionConfiguration, which are
              # the adjacent actions on the two ARNs above and the sharpest instance of the
              # rule this whole policy is written to. A check that can deploy is a check that
              # can answer its own finding by making the account match the record, which is
              # the wrong direction: the record is the reviewed artifact and the deployment
              # is the thing under suspicion. lambda:GetFunction is absent for the reason
              # given beside the grant, and lambda:ListFunctions for ListSecrets' reason.
              #
              # cloudformation:CreateStack, UpdateStack, DeleteStack, CreateChangeSet and
              # ExecuteChangeSet, which are the adjacent actions on the twenty-one ARNs
              # above and the same rule again. The drift check reports that the account is
              # not what main says; a check that could apply a template would be able to
              # answer its own finding by reconciling the account, and reconciling is
              # precisely the operation that took the delete grant back on 2026-08-01. It
              # would also be a role-creation path behind a scheduled workflow, since
              # fourteen of these stacks create roles, which the first section of
              # infra/README.md is entirely about.
              #
              # cloudformation:GetTemplateSummary and DescribeStacks. Neither is needed:
              # the summary is a derived description rather than the deployed template, and
              # the drift check reads a stack's status out of the listing it already makes.
              #
              # tag:TagResources and tag:UntagResources, which are the adjacent actions on
              # the grant above and the same rule as everywhere else in this policy. The
              # board decides what the account ran by reading tags; a check able to write one
              # could add or remove the tag that puts a run on its own report.
              #
              # Every batch: action except the two read above, and every states: and logs:
              # action. That sentence used to cover the whole batch: prefix, and the two
              # exceptions are argued for beside the grant: recomputing config/capacity.yaml's
              # `places` column means reading what each queue did with its jobs, and no other
              # source in the account holds it. What stays absent is the rest of the prefix,
              # and batch:SubmitJob, batch:CancelJob and batch:TerminateJob are the three that
              # matter -- each is a way to touch a run without anybody dispatching anything,
              # and a check that can cancel a job can decide the shape it is measuring does
              # not place. The state machine and the logs are untouched: the placement verdict
              # is a job's status and its queue, which DescribeJobs answers, and neither
              # states: nor logs: is a narrower way to ask.

Outputs:
  RoleName:
    Value:
      Ref: AuditReaderRole
  RoleArn:
    Value:
      Fn::GetAtt:
        - AuditReaderRole
        - Arn
