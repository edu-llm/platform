AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions role for publishing finished research images to ECR, one registered repository at a time.

Resources:
  EcrPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbsandbox-intern-edullm-ecr-publisher
      PermissionsBoundary:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/InternSandboxBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:job_workflow_ref: edu-llm/platform/.github/workflows/build-research-image.yml@refs/heads/main
                token.actions.githubusercontent.com:repository_owner_id: "306859726"
                # ONE ENTRY PER REGISTERED REPOSITORY, and a list here means "any of"
                # rather than "all of". Registering a repository in
                # config/repositories.yaml does nothing until its id appears here: the
                # token of any other repository fails this condition and the build dies at
                # AssumeRole, which reads like a broken role ARN rather than like a
                # repository nobody authorised.
                #
                # edullm-data was registered, given an ECR repository and a pinned base
                # before anybody noticed the registration was inert.
                # tests/test_repository_registry.py compares this list against the registry
                # in both directions so the next one cannot be.
                #
                # A LIST RATHER THAN A SEQUENCE OF EDITS, AND THAT IS DELIBERATE. This role
                # is applied from a laptop, because InternSandboxBoundary withholds
                # iam:CreateRole from the deployer, so every widening is a human operation
                # rather than a CI step. Registering two repositories one after the other
                # would be two of them, and the second would be reviewed against a template
                # the first had already changed. Four ids read as a list of who may publish;
                # four commits reach the same place and read as a history.
                token.actions.githubusercontent.com:repository_id:
                  - "1306868157"  # OLMo-core
                  - "1315813778"  # edullm-data
                  - "1310135166"  # olmo-eval-full
                  - "1319807085"  # edullm-alt-cl
                  - "1311508598"  # open-instruct-scored-rewards
              StringLike:
                # Belt and braces with the id above rather than a substitute for it. The id
                # is immutable and the path is not, so a repository renamed after this was
                # written still matches its id; the path is here because a subject claim
                # naming a repository this role has never heard of should not match on the
                # strength of a numeric field alone.
                token.actions.githubusercontent.com:sub:
                  - repo:edu-llm@306859726/OLMo-core@1306868157:ref:refs/heads/*
                  - repo:edu-llm@306859726/edullm-data@1315813778:ref:refs/heads/*
                  - repo:edu-llm@306859726/olmo-eval-full@1310135166:ref:refs/heads/*
                  - repo:edu-llm@306859726/edullm-alt-cl@1319807085:ref:refs/heads/*
                  - repo:edu-llm@306859726/open-instruct-scored-rewards@1311508598:ref:refs/heads/*
      # Inline rather than a customer managed policy. InternSandboxBoundary denies
      # iam:CreatePolicyVersion on every policy, so a managed policy could be created once
      # and never amended; the first permission change would fail the stack update. Inline
      # policies go through iam:PutRolePolicy, which the boundary permits on this name.
      Policies:
        - PolicyName: publish-research-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                # One destination per registered repository, and no wildcard. A single
                # arn ending in repository/sbsandbox-intern-edullm-* would cover every
                # future repository without anybody deciding to, which is precisely the
                # decision this list exists to make visible.
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-core
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-data
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-olmo-eval-full
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-alt-cl
                  - Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/sbsandbox-intern-edullm-open-instruct-scored-rewards

Outputs:
  RoleName:
    Value:
      Ref: EcrPublisherRole
  RoleArn:
    Value:
      Fn::GetAtt:
        - EcrPublisherRole
        - Arn
