AWSTemplateFormatVersion: "2010-09-09"
Description: Admission state machine, its validator function, and the log group their executions are recorded in.

Resources:
  # The /aws/vendedlogs/states/ prefix is not cosmetic. Step Functions delivers execution
  # logs through the CloudWatch Logs vended-logs path, which attaches a resource policy to
  # the destination log group; log groups under this prefix are covered by one shared
  # policy instead of one policy each. The account limit is ten CloudWatch Logs resource
  # policies per region and this is a shared sandbox, so a state machine logging to a
  # group outside the prefix burns a tenth of an account-wide budget that other interns
  # are also drawing on -- and the failure, once the limit is reached, lands on whoever
  # deploys next rather than on whoever spent it.
  AdmissionLogGroup:
    Type: AWS::Logs::LogGroup
    # Retained because these are the execution records of who admitted which run, with
    # IncludeExecutionData on: they are the audit trail, not a debugging convenience. The
    # cost of retaining is that deleting and recreating this stack fails at CreateLogGroup
    # until the orphaned group is removed by hand, which is the trade we want in the
    # direction that loses no evidence.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/vendedlogs/states/sbsandbox-intern-edullm-admission
      RetentionInDays: 90

  AdmissionValidatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sbsandbox-intern-edullm-admission-validator
      Description: Parses a submitted run manifest and returns the admission intent and decision.
      Runtime: python3.12
      Handler: edullm_platform.admission_handler.handler
      Role:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-admission-lambda
      # S3ObjectVersion is what makes a code change a CloudFormation change. Without it,
      # re-uploading a new zip to the same key leaves this resource's properties
      # byte-identical, the change set comes back empty, and `deploy
      # --no-fail-on-empty-changeset` reports success while the old code keeps running.
      # Pinning the version means the template must be edited for every release, and the
      # edit is the diff a reviewer sees.
      #
      # The placeholder that used to sit here did its job: the first deploy of this stack
      # failed at CreateFunction because nothing had ever built or uploaded the zip. The
      # value below is a version id produced by tools/build_admission_lambda.py and
      # uploaded by the procedure in infra/README.md. Changing the code means running that
      # procedure again and editing this line, which is the diff a reviewer sees.
      #
      # This is the second release, and the first run through the whole path is what
      # forced it. The Phase 3 amendment added ResolveExecutionTarget below, which reads
      # $.admission.payload.execution -- a key the Phase 2 package does not emit. CI
      # deployed the amended state machine and the states were correct, so nothing here
      # went red; the function behind ValidateAndDecide simply kept running Phase 2 code
      # under policy v1. The failure surfaced only on an accepted submission, after the
      # intent and decision records had been written, at the one state that reads a key
      # the deployed package had never heard of.
      #
      # The lesson is the one this pin already encodes, arriving a phase late: a state
      # machine and the function it calls are released separately, and a template test
      # cannot see the gap between them.
      #
      # THIS IS THE THIRD RELEASE, AND IT IS THE SAME SEAM WEARING DIFFERENT CLOTHES. The
      # second was a code change nobody released. This one is a *configuration* change
      # nobody released, which is harder to see coming.
      #
      # tools/build_admission_lambda.py copies config/*.yaml into the zip at
      # edullm_platform/config/, because the validator has to read the catalog it was
      # reviewed against rather than whatever is in a bucket at run time. The consequence
      # is that config/workload-catalog.yaml and config/execution-targets.yaml are part of
      # this function's release, and editing them changes nothing in the account until
      # somebody rebuilds the zip and edits the line below.
      #
      # Phase 4 met it head on. The GPU compute environment, queue, job definition and
      # roles were all deployed and VALID; the catalog said gpu-1xa10g was provisioned and
      # execution-targets named its queue. The validator, still running the previous zip,
      # refused the first GPU submission with unprovisioned_compute_profile -- a refusal
      # that is correct for the code that produced it and wrong about the account. Nothing
      # was broken except which bytes were running.
      #
      # So: promoting a compute profile is a Lambda release. Nothing in a config diff says
      # so, and the failure it produces names the profile rather than the release.
      Code:
        S3Bucket: sbsandbox-intern-edullm-artifacts
        S3Key: admission-validator/admission-validator.zip
        S3ObjectVersion: 5YS_zGtJtuYKLBGOxuilz2BoD_h5Tgp8
      Timeout: 30
      MemorySize: 512

  AdmissionStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: sbsandbox-intern-edullm-admission
      # STANDARD, not EXPRESS. Admission runs at most a few times an hour, it must be
      # exactly-once against a write-once store, and its execution history is the record
      # we intend to read back. EXPRESS is at-least-once and keeps no queryable history.
      StateMachineType: STANDARD
      RoleArn:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sbsandbox-intern-edullm-admission-states
      # Level ALL with execution data, because the thing being audited is the content of
      # the decision, not merely that a decision happened. The manifest and the decision
      # both land in the log group above, which is why that group is retained.
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn:
                Fn::GetAtt:
                  - AdmissionLogGroup
                  - Arn
      # Fn::Sub over a JSON literal rather than DefinitionSubstitutions: the only values
      # that vary are the partition and the function ARN, and substitutions would move
      # them out of the text a reader is checking. Amazon States Language uses `$.` and
      # `$$.` for paths and `{}` for States.Format placeholders, none of which Fn::Sub
      # touches -- only `${...}` is substituted.
      #
      # The three conditional lineage writes -- WriteIntent, WriteDecision and now
      # WriteBinding -- catch S3.S3Exception, measured rather than guessed.
      # tools/probe_conditional_write.py ran against this account on 2026-07-27: a
      # throwaway state machine wrote one object with `IfNoneMatch: "*"` and then wrote it
      # again, and the second execution failed with the error name `S3.S3Exception`. The
      # earlier guess that PreconditionFailed is not a modelled PutObject exception, and
      # so would arrive generic, was right -- but it was a guess, and a wrong one would
      # have produced a Catch that silently never fires.
      #
      # What the probe did NOT settle, and this is the part worth reading. `S3.S3Exception`
      # is the generic bucket for every unmodelled S3 error, so a transient 500 or a 503
      # SlowDown arrives under the same name as the 412. The status code and the message
      # "At least one of the pre-conditions you specified did not hold" appear only in the
      # Cause, and ErrorEquals cannot match on a Cause. Narrowing from States.ALL is
      # therefore a real improvement -- a Lambda failure, a States.Timeout, a
      # States.DataLimitExceeded and a modelled error such as access denied no longer land
      # in RecordConflict -- but it does not separate a duplicate from a blip.
      #
      # So RecordConflict means "the conditional write was refused", not "the key already
      # existed". It writes $.write_failure, which carries both the Error and the Cause,
      # so the distinction the routing cannot make is preserved in the record a reader
      # opens. Duplicate suppression does not rest on this either way: the same guarantee
      # is enforced independently by StartExecution refusing a repeated execution name.
      #
      # There is still no Retry on either write, and the probe is why rather than despite
      # it. A retry would have to be scoped to the transient case to be correct, that
      # scoping needs an error name the transient case does not share with the 412, and
      # the measurement says no such name exists. Retrying S3.S3Exception would retry
      # every genuine duplicate three times before reaching the conflict record it was
      # always going to reach.
      # The two lineage writes hand S3 the handler's mappings, never a string and never
      # States.JsonToString of one. The SDK integration JSON-encodes whatever the Body
      # path yields, so a string arrives quoted and escaped and every reader parses the
      # record twice; an object arrives as ordinary JSON with compact separators and the
      # key order it was given. The handler returns keys already in canonical order, so
      # what S3 stores is byte-identical to what was hashed. Both halves of that were
      # measured against a throwaway bucket rather than assumed. The object keys come
      # from the handler too, so a run id is spelled into a prefix in one place.
      #
      # These paths were right the first time and the handler was not. The first live
      # execution failed at States.Runtime reading $.Payload.intent from a handler that
      # returned intent_body; renaming the paths to match cleared the error and stored
      # every record quoted, which is the same mistake wearing a passing execution. Both
      # halves were asserted and neither was compared to the other, which is the whole
      # shape of the defect. tests/test_phase2_admission_handler.py runs the handler and
      # reads these paths out of this file, so a rename on either side fails there.
      #
      # PHASE 3 ADDS THREE THINGS AND CHANGES ONE, AND THE CHANGE IS THE SECURITY-RELEVANT
      # HALF. ValidateAndDecide used to send "Payload.$": "$" -- the caller's whole
      # execution input, forwarded unread. That was correct while every field in the input
      # was the caller's own claim and the validator judged all of them. It stops being
      # correct the moment one field is not the caller's: the image scan findings are read
      # from ECR by the state machine itself, and a pass-through payload would let a
      # caller supply an `image_scan` key of its own and declare its own image clean.
      #
      # So the payload is now built field by field, and `image_scan` comes from the
      # ReadImageScan task's result and from nowhere else. Enumerating the fields has a
      # second effect worth having: an execution started by hand with a field missing
      # fails at the parameter build, naming the field, rather than reaching a handler
      # that treats absence as a default. `approver` is enumerated for exactly that
      # reason -- the handler treats it as optional and the submitting workflow always
      # sends it, so an execution without one is a hand-started execution that should stop
      # here rather than record an approval nobody gave.
      #
      # The three new states, and what each is for:
      #
      #   ReadImageScan   reads the ECR scan findings for the digest the manifest names,
      #                   before anything is judged. It catches States.ALL and continues to
      #                   ValidateAndDecide with the error object where the findings would
      #                   have been, which is the fail-closed direction and not a shrug:
      #                   image_scan_summary_from_ecr returns None for anything that is not
      #                   a well-formed describe result, and image_scan_is_reviewed reads a
      #                   None summary as nobody having seen the findings. An image with no
      #                   scan yet returns ScanNotFoundException and is refused for the same
      #                   reason a failed scan is. The catch is broad rather than named
      #                   because the error names this integration produces have not been
      #                   measured -- the same discipline that kept States.ALL on the
      #                   lineage writes until tools/probe_conditional_write.py measured
      #                   S3.S3Exception -- and here a guessed name that never fires would
      #                   fail the whole execution on an unscanned image instead of
      #                   refusing the run with a reason.
      #   SubmitToBatch   sends the request the validator built. It carries InputPath and
      #                   no Parameters, which is deliberate; see the note on that state.
      #   WriteBinding    records the Batch job id write-once, the instant Batch accepts
      #                   the submission and before anything has started.
      #
      # And the Succeed state moved. AdmissionAccepted's true branch used to end at
      # "Admitted"; it now continues into submission and ends at "Submitted". An execution
      # that reaches Submitted has admitted a run AND launched it, and there is no longer
      # a terminal state that means "admitted and then nothing", which is the state a
      # reader would otherwise have had to interpret.
      #
      # THE EXECUTION BLOCK IS CARRIED, NOT SELECTED, AND THAT IS THE SUBTLEST THING IN THIS
      # FILE. The handler returns "execution" only when the run is accepted, and omits the
      # key entirely otherwise -- which is the right shape, because a rejected submission
      # that carried a submit request would be one InputPath away from being submitted
      # anyway. It is also a shape a ResultSelector cannot read: a payload template resolves
      # every `.$` reference before the state completes, an unresolvable reference is a
      # States.Runtime failure, and there is no defaulting form. So
      # "execution.$": "$.Payload.execution" is the natural spelling and it fails every
      # rejected run -- which is the common case, in a state machine whose whole job is to
      # refuse things.
      #
      # ResultSelector therefore carries the whole payload under "payload", which always
      # exists, and ResolveExecutionTarget lifts $.admission.payload.execution to
      # $.execution on the accepted branch only, where the key is guaranteed to be there.
      # Everything downstream reads $.execution.
      #
      # The cost is that intent and decision appear twice in the state: once at
      # $.admission.intent and $.admission.decision, which the two lineage writes read, and
      # once inside $.admission.payload. They are a few kilobytes against a 256 KiB limit, so
      # the cost is a reader who writes to the wrong one rather than a cost in bytes.
      # $.admission.payload is a carrier and nothing but ResolveExecutionTarget should ever
      # read out of it; the six named keys beside it are the interface.
      #
      # SUBMITTOBATCH PASSES THE REQUEST THROUGH WHOLE AND NAMES NO FIELD OF IT. The
      # obvious spelling is a Parameters block listing JobName, JobQueue, JobDefinition,
      # ContainerOverrides, Timeout, RetryStrategy, Tags, PropagateTags and, for a fan-out,
      # ArrayProperties. That spelling reconstructs, in a template nobody unit-tests, a
      # structure that src/edullm_platform/execution.py::batch_submit_request already builds
      # and that a test already checks field by field -- and the way it fails is by silently
      # dropping a key that was added on the Python side and not here. The mandatory attempt
      # timeout is precisely such a key, and "the timeout stopped being sent" is not a
      # failure anything downstream would notice.
      #
      # This state was planned as InputPath with no Parameters, which is the natural way to
      # say that in JSONPath and is not deployable. Measured against
      # `aws stepfunctions validate-state-machine-definition --type STANDARD` on
      # 2026-07-27, with four controls on the same definition so the verdicts mean
      # something:
      #
      #   InputPath, no Parameters   FAIL  "Parameters field is required for resource ARN:
      #                                     arn:aws:states:::aws-sdk:batch:submitJob"
      #   "Parameters.$": "$..."     FAIL  "Field 'Parameters.$' is not supported"
      #   JSONata Arguments          OK
      #   control: Parameters block  FAIL  names the missing JobQueue and JobDefinition, so
      #     with fields missing            the validator knows the SubmitJob request schema
      #   control: a field SubmitJob FAIL  "The field \"ThisFieldDoesNotExist\" is not
      #     does not have                  supported by Step Functions"
      #   control: a JSONata         FAIL  "Field '$states.inputt' does not exist"
      #     variable that is not real
      #   control: broken JSONata    FAIL  "Expected \")\" before end of expression"
      #
      # So this one state runs in JSONata while the rest of the machine stays in JSONPath,
      # which Step Functions allows per state. Arguments is a single reference to the
      # request and enumerates nothing, which is the property the plan asked InputPath for:
      # a key added on the Python side arrives here without this file being touched, and no
      # key can be dropped by an omission here because there are no keys here to omit.
      #
      # The cost is that a JSONata state replaces its whole output rather than merging into
      # it, so Output puts the submit response beside the raw input instead of ResultPath
      # doing it -- $merge([$states.input, {'submission': ...}]) is the same shape
      # "ResultPath": "$.submission" would have produced, and the Catch does the same for
      # the failure. Everything downstream is JSONPath again and reads $.admission and
      # $.submission as though nothing had changed.
      #
      # ArrayProperties is the reason for the small Choice before the binding is written.
      # batch_submit_request omits it for a single container -- Batch rejects an array job
      # of size one, so emitting it unconditionally would fail every non-fan-out submission
      # -- and Amazon States Language cannot include a Parameters key conditionally.
      #
      # THIS WAS ONE WRITE STATE AND TWO PASS STATES, AND IT WAS WRONG IN A WAY THAT ONLY A
      # REAL RUN COULD SHOW. The single-container Pass said "Result": null, intending to set
      # $.binding_array_size to a literal null for one WriteBinding to read. Amazon States
      # Language does not distinguish a null Result from an absent one: a Pass with no Result
      # passes its input through, so $.binding_array_size received the entire execution
      # payload. Every binding this platform has written is 27 kilobytes of duplicated
      # admission decision with an object where an integer belongs, and each one is refused
      # by BatchJobBinding when anything tries to read it back.
      #
      # Nothing caught it. The template test compares the body's key set against the
      # contract's field names and the key was present; the write succeeded, because S3 does
      # not validate; and the lineage store is write-once, so the eight records already
      # written stay wrong forever. It is the exact failure the paragraph below predicted --
      # a record that fails validation only when somebody reads it back -- arriving through
      # the one route that paragraph did not consider, which was the value rather than the
      # key.
      #
      # So there are now two write states and no null. The fan-out path writes array_size
      # from the size; the single-container path omits the key entirely, which the contract
      # already permits because array_size is int | None with a default. The duplication is
      # deliberate: the alternative is a JSONPath reference that resolves to null, and a
      # reference that resolves to nothing is the failure mode that stopped the first real
      # submission of this phase at ResolveExecutionTarget.
      #
      # The binding body is assembled here rather than returned by the handler, which is the
      # opposite of how the intent and the decision are handled, and the reason is that the
      # Batch job id does not exist until SubmitToBatch has run. It is the one lineage
      # record whose bytes this file decides, so the key set is compared against
      # BatchJobBinding's own field names by tests/test_phase3_infrastructure.py -- a field
      # added to the contract and not here would otherwise be a record that fails validation
      # only when somebody reads it back.
      #
      # Comments live out here because everything below DefinitionString is inside a
      # literal block that is parsed as JSON, where a "#" line is a syntax error.
      DefinitionString:
        Fn::Sub: |
          {
            "Comment": "Read the image scan, validate a submitted run manifest, record the intent and the decision as write-once lineage, submit the accepted run to Batch, and record the binding.",
            "StartAt": "ReadImageScan",
            "States": {
              "ReadImageScan": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:ecr:describeImageScanFindings",
                "Parameters": {
                  "RepositoryName": "sbsandbox-intern-edullm-olmo-core",
                  "ImageId": {
                    "ImageDigest.$": "$.manifest.image_digest"
                  }
                },
                "ResultPath": "$.image_scan",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.image_scan",
                    "Next": "ValidateAndDecide"
                  }
                ],
                "Next": "ValidateAndDecide"
              },
              "ValidateAndDecide": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${AdmissionValidatorFunction.Arn}",
                  "Payload": {
                    "run_id.$": "$.run_id",
                    "submitter.$": "$.submitter",
                    "approver.$": "$.approver",
                    "approving_environment.$": "$.approving_environment",
                    "approved_manifest_sha256.$": "$.approved_manifest_sha256",
                    "manifest.$": "$.manifest",
                    "workflow_run.$": "$.workflow_run",
                    "image_scan.$": "$.image_scan"
                  }
                },
                "ResultSelector": {
                  "accepted.$": "$.Payload.accepted",
                  "run_id.$": "$.Payload.run_id",
                  "intent_key.$": "$.Payload.intent_key",
                  "decision_key.$": "$.Payload.decision_key",
                  "intent.$": "$.Payload.intent",
                  "decision.$": "$.Payload.decision",
                  "payload.$": "$.Payload"
                },
                "ResultPath": "$.admission",
                "Retry": [
                  {
                    "ErrorEquals": [
                      "Lambda.ServiceException",
                      "Lambda.AWSLambdaException",
                      "Lambda.SdkClientException",
                      "Lambda.TooManyRequestsException"
                    ],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 3,
                    "BackoffRate": 2
                  }
                ],
                "Next": "WriteIntent"
              },
              "WriteIntent": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:s3:putObject",
                "Parameters": {
                  "Bucket": "sbsandbox-intern-edullm-lineage",
                  "Key.$": "$.admission.intent_key",
                  "Body.$": "$.admission.intent",
                  "ContentType": "application/json",
                  "ChecksumAlgorithm": "SHA256",
                  "IfNoneMatch": "*"
                },
                "ResultPath": null,
                "Catch": [
                  {
                    "ErrorEquals": ["S3.S3Exception"],
                    "ResultPath": "$.write_failure",
                    "Next": "RecordConflict"
                  }
                ],
                "Next": "WriteDecision"
              },
              "WriteDecision": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:s3:putObject",
                "Parameters": {
                  "Bucket": "sbsandbox-intern-edullm-lineage",
                  "Key.$": "$.admission.decision_key",
                  "Body.$": "$.admission.decision",
                  "ContentType": "application/json",
                  "ChecksumAlgorithm": "SHA256",
                  "IfNoneMatch": "*"
                },
                "ResultPath": null,
                "Catch": [
                  {
                    "ErrorEquals": ["S3.S3Exception"],
                    "ResultPath": "$.write_failure",
                    "Next": "RecordConflict"
                  }
                ],
                "Next": "AdmissionAccepted"
              },
              "RecordConflict": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:s3:putObject",
                "Parameters": {
                  "Bucket": "sbsandbox-intern-edullm-lineage",
                  "Key.$": "States.Format('conflicts/{}.json', $$.Execution.Name)",
                  "Body.$": "States.JsonToString($)",
                  "ContentType": "application/json",
                  "ChecksumAlgorithm": "SHA256",
                  "IfNoneMatch": "*"
                },
                "ResultPath": null,
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.conflict_write_failure",
                    "Next": "AdmissionConflict"
                  }
                ],
                "Next": "AdmissionConflict"
              },
              "AdmissionAccepted": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.admission.accepted",
                    "BooleanEquals": true,
                    "Next": "ResolveExecutionTarget"
                  }
                ],
                "Default": "Rejected"
              },
              "ResolveExecutionTarget": {
                "Type": "Pass",
                "InputPath": "$.admission.payload.execution",
                "ResultPath": "$.execution",
                "Next": "SubmitToBatch"
              },
              "SubmitToBatch": {
                "Type": "Task",
                "QueryLanguage": "JSONata",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:batch:submitJob",
                "Arguments": "{% $states.input.execution.submit_request %}",
                "Output": "{% $merge([$states.input, {'submission': $states.result}]) %}",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "Output": "{% $merge([$states.input, {'submission_failure': $states.errorOutput}]) %}",
                    "Next": "RecordSubmissionFailure"
                  }
                ],
                "Next": "BindingIsFanOut"
              },
              "RecordSubmissionFailure": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:s3:putObject",
                "Parameters": {
                  "Bucket": "sbsandbox-intern-edullm-lineage",
                  "Key.$": "States.Format('submission-failure/{}.json', $.admission.run_id)",
                  "Body.$": "States.JsonToString($)",
                  "ContentType": "application/json",
                  "ChecksumAlgorithm": "SHA256",
                  "IfNoneMatch": "*"
                },
                "ResultPath": null,
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.submission_failure_write_failure",
                    "Next": "SubmissionFailed"
                  }
                ],
                "Next": "SubmissionFailed"
              },
              "BindingIsFanOut": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.execution.submit_request.ArrayProperties",
                    "IsPresent": true,
                    "Next": "RecordFanOutSize"
                  }
                ],
                "Default": "WriteBindingForSingleContainer"
              },
              "RecordFanOutSize": {
                "Type": "Pass",
                "InputPath": "$.execution.submit_request.ArrayProperties.Size",
                "ResultPath": "$.binding_array_size",
                "Next": "WriteBindingForFanOut"
              },
              "WriteBindingForFanOut": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:s3:putObject",
                "Parameters": {
                  "Bucket": "sbsandbox-intern-edullm-lineage",
                  "Key.$": "States.Format('binding/{}.json', $.admission.run_id)",
                  "Body": {
                    "schema_version": 1,
                    "run_id.$": "$.admission.run_id",
                    "batch_job_id.$": "$.submission.JobId",
                    "batch_job_arn.$": "$.submission.JobArn",
                    "batch_job_name.$": "$.submission.JobName",
                    "job_queue_arn.$": "$.execution.target.job_queue_arn",
                    "job_definition_arn.$": "$.execution.target.job_definition_arn",
                    "compute_profile.$": "$.execution.target.compute_profile",
                    "log_group.$": "$.execution.target.log_group",
                    "attempt_duration_seconds.$": "$.execution.submit_request.Timeout.AttemptDurationSeconds",
                    "attempts.$": "$.execution.submit_request.RetryStrategy.Attempts",
                    "array_size.$": "$.binding_array_size",
                    "submitted_at.$": "$$.State.EnteredTime"
                  },
                  "ContentType": "application/json",
                  "ChecksumAlgorithm": "SHA256",
                  "IfNoneMatch": "*"
                },
                "ResultPath": null,
                "Catch": [
                  {
                    "ErrorEquals": ["S3.S3Exception"],
                    "ResultPath": "$.write_failure",
                    "Next": "RecordConflict"
                  }
                ],
                "Next": "Submitted"
              },
              "WriteBindingForSingleContainer": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::aws-sdk:s3:putObject",
                "Parameters": {
                  "Bucket": "sbsandbox-intern-edullm-lineage",
                  "Key.$": "States.Format('binding/{}.json', $.admission.run_id)",
                  "Body": {
                    "schema_version": 1,
                    "run_id.$": "$.admission.run_id",
                    "batch_job_id.$": "$.submission.JobId",
                    "batch_job_arn.$": "$.submission.JobArn",
                    "batch_job_name.$": "$.submission.JobName",
                    "job_queue_arn.$": "$.execution.target.job_queue_arn",
                    "job_definition_arn.$": "$.execution.target.job_definition_arn",
                    "compute_profile.$": "$.execution.target.compute_profile",
                    "log_group.$": "$.execution.target.log_group",
                    "attempt_duration_seconds.$": "$.execution.submit_request.Timeout.AttemptDurationSeconds",
                    "attempts.$": "$.execution.submit_request.RetryStrategy.Attempts",
                    "submitted_at.$": "$$.State.EnteredTime"
                  },
                  "ContentType": "application/json",
                  "ChecksumAlgorithm": "SHA256",
                  "IfNoneMatch": "*"
                },
                "ResultPath": null,
                "Catch": [
                  {
                    "ErrorEquals": ["S3.S3Exception"],
                    "ResultPath": "$.write_failure",
                    "Next": "RecordConflict"
                  }
                ],
                "Next": "Submitted"
              },
              "Submitted": {
                "Type": "Succeed"
              },
              "SubmissionFailed": {
                "Type": "Fail",
                "Error": "BatchSubmissionFailed",
                "Cause": "The run was admitted and Batch refused the submission. The decision is recorded under decision/ and the failure under submission-failure/ in the lineage bucket."
              },
              "Rejected": {
                "Type": "Fail",
                "Error": "AdmissionRejected",
                "Cause": "The validator refused this run. The refusal and its reasons are recorded under decision/ in the lineage bucket."
              },
              "AdmissionConflict": {
                "Type": "Fail",
                "Error": "AdmissionConflict",
                "Cause": "A lineage record for this run already existed, so the conditional write was refused. The attempt is recorded under conflicts/ in the lineage bucket."
              }
            }
          }

Outputs:
  StateMachineName:
    # Ref on AWS::StepFunctions::StateMachine returns the ARN, not the name, so the two
    # outputs are the other way round from every IAM role in this repository.
    Value:
      Fn::GetAtt:
        - AdmissionStateMachine
        - Name
  StateMachineArn:
    Value:
      Ref: AdmissionStateMachine
  ValidatorFunctionName:
    Value:
      Ref: AdmissionValidatorFunction
  LogGroupName:
    Value:
      Ref: AdmissionLogGroup
