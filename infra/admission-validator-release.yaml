# What is actually deployed as the admission validator, recorded beside the template that
# names it.
#
# THE GAP THIS CLOSES COST A LIVE RUN. tools/build_admission_lambda.py copies the seven
# files it names in ADMISSION_CONFIG into the zip, so the validator reads the catalog it was
# reviewed against rather than whatever is in a bucket when it runs. That is the right
# property. Its consequence is that config/workload-catalog.yaml and
# config/execution-targets.yaml are part of this function's release -- and editing them
# changes nothing in the account until somebody rebuilds the zip, uploads it, and edits
# S3ObjectVersion in infra/admission-state-machine.yaml.
#
# It copied config/*.yaml until 2026-08-04, which put files this function never opens into
# that sentence as well. Narrowing it to the measured seven is what the "package less" note
# below asked for, applied a second time -- to the configuration rather than the modules.
#
# Phase 4 walked into it. The GPU compute environment, queue, job definition and roles were
# deployed and VALID, both config files agreed, the suite was green, and the first GPU
# submission was refused with unprovisioned_compute_profile -- because the deployed zip
# still held a catalog in which that profile was not provisioned. The refusal was correct
# for the bytes that produced it and wrong about the account, and it named the compute
# profile rather than the release, which is why it took a run to find.
#
# So the digest below is compared against a zip built from the current tree. Change
# anything the package carries -- the handler, a contract it imports, or a config file --
# without releasing, and the comparison fails at CI with the reason, instead of at
# admission with a refusal that reads like a configuration mistake.
#
# The build is deterministic, so a rebuild that changed nothing produces the same digest
# and needs no edit here. Releasing means running the procedure in infra/README.md and
# updating both fields below in the same commit as the change that caused them to move.
#
# WHAT IT CAUGHT, TWICE, ON THE DAY IT WAS WRITTEN. The second time is the one that
# justifies it. config/image-exceptions.yaml is packaged too, and it is the file the
# validator reads to decide whether an image carrying blocking scan findings may run. The
# training image was published, its findings read, its exception written and the job
# definition repointed at it -- and none of that would have reached the validator. The next
# submission would have been refused by a principal that had never heard of the digest,
# which is the same shape as the refusal that cost the first GPU run: correct for the bytes
# that produced it, wrong about the account, and naming the image rather than the release.
#
# THIS CONTROL WAS COARSER THAN THE DEFECT IT CATCHES, AND THE FIX WAS THE ONE THIS COMMENT
# ARGUED FOR. The builder used to package all of src/edullm_platform, so the digest moved for
# any change to the package -- including modules the validator never imports. It moved four
# times in one session, once on a change to phase3_evidence.py, which the handler does not
# touch. The recorded reasoning was that narrowing means computing reachability and that
# getting reachability wrong reintroduces this failure while looking covered, so the fix
# should be to package less rather than to check less.
#
# Packaging less is what happened. tools/build_admission_lambda.py now decides the module
# list by importing the entrypoint in a clean interpreter and recording what Python actually
# loaded, rather than by reading imports statically -- so a module reachable only through a
# runtime import is carried, and the failure mode the old comment feared needs the import to
# not happen during startup at all. The package went from 66 modules to 28.
#
# The tax that remains is one rebuild, one upload and one edit per change to a module the
# handler reaches, and it needs laptop AWS credentials, so a contributor without them is
# blocked on somebody who has. The honest reading of a moved digest is unchanged: the
# deployed zip is not the zip this tree builds.
#
# THE RELEASE THIS RECORD WAS OWED HAS BEEN CUT, AND HOW IT CAME TO BE OWED IS WORTH
# KEEPING. Adding PublishedDatasetReference to
# src/edullm_platform/contracts/dataset_registry.py changed the bytes of a module the
# handler imports, so the digest moved and
# tests/test_released_zips.py::test_the_released_zip_is_the_one_this_tree_builds[validator]
# (which lived in tests/test_phase2_lambda_package.py at the time)
# went red. It was left red rather than papered over. The two ways to make it green without
# uploading anything are both worse: writing a digest for a zip nobody uploaded would defeat
# the one mechanism here that detects deployed-versus-tree skew, and would do it by making
# the record assert the thing this whole comment exists to prevent; suppressing the test
# would be the same act differently spelled, and there is no xfail anywhere in this
# repository.
#
# WAITING FOR SOMEBODY ELSE'S RELEASE WAS TRIED FIRST AND DOES NOT WORK. This change
# originally sat on a branch beside four IAM and measurement changes, on the reasoning that
# a concurrent workstream owed the next release anyway and this could ride it. That release
# was cut -- 9aa6e4f, from a tree without this contract in it -- and recorded a digest this
# tree did not match. Riding somebody else's release only works if they take your change
# with them, and nothing in the procedure makes them notice they should. So the branch was
# split, the IAM work went ahead on its own, and this waited for a release cut on purpose
# from a tree containing it. That is the ordering rule: the person who moves a packaged
# module cuts the release, and does not hand the debt to whoever releases next.
#
# The change is additive -- no existing field moved, config/datasets.yaml is unchanged, and
# nothing on the handler's path reads the new list -- so the validator this release deploys
# makes byte-for-byte the same admission decisions as the one before it. What was stale was
# the record, never the behaviour.
#
# THIS RELEASE WAS CAUSED BY A COMMENT, AND THAT IS WORTH KNOWING RATHER THAN SURPRISING.
# Retiring the forward phase numbering reworded one comment in
# src/edullm_platform/admission_handler.py, which explains why `ecr_repository` is required
# rather than defaulted. No statement changed and no behaviour did. The comment is in a
# module the package carries, so the bytes moved and the tripwire went red, which is the
# control working as specified: it compares packaged bytes and does not try to judge which
# byte changes matter. The consequence is that a docstring or comment edit to any of the
# twenty-eight modules is a release, and the cheap reading of a moved digest stays correct.
# The deployed validator makes the same decisions before and after.
#
# THIS RELEASE CARRIES A CONFIG CHANGE, WHICH IS THE CASE THE WHOLE FILE IS ABOUT. Three
# research groups were renamed and two were added in config/organization.yaml, and that file
# is packaged, so the deployed validator was reading the six old group names until this
# release. The consequence is smaller than it looks and is worth stating rather than leaving
# to inference: nothing on the handler's path looks a team up against team_bindings, so the
# stale zip refused nothing it should have admitted. What it did mean is that the roster the
# validator answers submitter and approver questions from was two names out of date, which is
# the same class of skew as the compute profile that cost the first GPU run and is invisible
# for the same reason.
#
# THIS RELEASE IS OWED FOR A COMMENT IN A PACKAGED CONFIG FILE, AND NOTHING THIS FUNCTION
# READS HAS MOVED. The multi-GPU launcher guard added in #159 refuses a command that starts
# one process on a machine with several devices, and it does that while the submission
# compiles: src/edullm_platform/launchers.py and src/edullm_platform/submission.py are not
# among the twenty-eight modules this zip carries, because the validator is never given a
# command it could apply the check to. What did move is config/workload-catalog.yaml, where
# the paragraph on olmo-core-train-4gpu was rewritten to say the omission is refused rather
# than only warned about. That file is packaged, so the bytes moved and the tripwire went
# red -- the control comparing bytes and declining to decide which ones matter, which is the
# same property that makes it worth having. The validator this release deploys makes
# byte-for-byte the same admission decisions as the one before it.
#
# Released from main rather than from the branch, because deploy-phase2-admission.yml only
# runs there. The zip was built from c9a785d and the digest below is what a local rebuild of
# that tree produces, checked rather than copied.
#
# THIS RELEASE IS THE LAST THING BETWEEN A REGISTERED EVALUATION REPOSITORY AND A RUN, WHICH
# IS WHY IT IS WORTH SAYING WHAT IT CARRIES. config/image-exceptions.yaml gained twelve
# reviews of the Ubuntu 24.04 findings in olmo-eval-full's CUDA base. The validator reads
# that file on every admission, so until this deploys, a submission naming olmo-eval-full is
# registered, has a workload profile, is offered by the form, and is refused at the image
# gate on thirteen criticals a reviewer has already accepted. Cut from dccfa06.
#
# THIS RELEASE IS THE HALF OF THE PAGED-READ FIX THAT LIVES IN THE ZIP, AND WITHOUT IT THE
# OTHER HALF IS WORSE THAN NOTHING. #167 changed two things: ReadImageScan now asks ECR for
# every finding, which is deployed by CloudFormation and took effect the moment that merged,
# and image_scan_verdict now says which of four things went wrong, which is in this package
# and does not. Between the two, a truncated read that this validator still describes as an
# unreviewed finding is the exact sentence the change exists to stop saying. Cut from
# 83318b3, and the digest below is a local rebuild of that tree rather than a copied number.
#
# THIS RELEASE CARRIES A CONTAINER MEMORY CORRECTION AND CHANGES NO ADMISSION DECISION.
# src/edullm_platform/execution.py is one of the twenty-eight modules in this zip, and #187
# moved two entries in CONTAINER_SHAPES: gpu-1xl4 from 15360 to 14315 and gpu-1xl40s from
# 31744 to 30587, because a g6.xlarge registers 15339 MiB with ECS and a g6e.xlarge 31611,
# so both shapes asked for more than their host can offer and Batch refused to place them.
# Nothing on the handler's path reads a shape's memory -- placement is Batch's decision and
# it is taken long after admission -- so the validator this release deploys admits and
# refuses exactly what the one before it did. What was stale was the bytes, never the
# behaviour.
#
# THE ORDERING RULE IN THIS FILE IS WHY THIS RELEASE IS ITS OWN COMMIT. #187 landed red on
# the tripwire deliberately: bumping the digest there would have described a release nobody
# had performed, since deploy-phase2-admission.yml runs only from main and the zip could not
# be uploaded until the change merged. So the release was cut from main at ae829f0 with
# tools/release_lambda.py, which uploaded before editing and read the version id below off
# what S3 returned. Neither field here was typed by hand.
#
# Only the validator was released. The lifecycle recorder rebuilds to 82d291969f3b, the
# digest already in its own record, because since 2026-08-04 each builder names the config
# its own handler reads and execution.py is not among the recorder's modules. Releasing it
# too would have uploaded identical bytes under a new version id and put a Lambda nobody
# changed through a CloudFormation update, so `--function validator` was passed rather than
# taking the tool's default of both.
#
# THIS RELEASE CARRIES FIVE SEALED CORPORA THE DEPLOYED VALIDATOR DENIES OUTRIGHT, AND IT IS
# THE FIRST TIME THIS RECORD HAS STOOD BETWEEN A SUBMITTER AND BYTES THAT ALREADY EXIST.
# #266 registered pretrain/reservoir-dolma2 v1, pretrain/refhq-instruct v3,
# pretrain/formal-proof-premises-500m v3, pretrain/fineweb-edu-750m v2 and
# pretrain/fineweb2-equal-bytes v1 in config/datasets.yaml -- 1,029,436,494,332 bytes that
# are sealed in s3://edullm-data/ and were carried nowhere. That file is in
# ADMISSION_CONFIG, so until this deploys the previous zip refuses all five under
# unregistered_dataset.
#
# The shape is worse than a plain refusal and is worth naming rather than leaving to
# inference. `edullm check` reads the merged registry off the laptop and reports nothing
# wrong, so the submission is dispatched, a lead spends attention approving it, and the
# refusal arrives from inside AWS after the gate, naming the dataset. The researcher is told
# their corpus is unregistered by a principal that disagrees with their own tooling, and the
# approval is already spent. That is the Phase 4 shape above, arriving through the registry
# rather than through the catalog.
#
# A RELEASE IS NOT A DEPLOY, AND CONFUSING THE TWO COST ANOTHER READER AN HOUR TONIGHT. The
# workflow uploads the zip and prints the version id; nothing in the account moves until the
# template edit above merges and deploy-phase2-admission.yml applies the stack on the push.
# So the honest way to confirm a release landed is `aws lambda get-function-configuration
# --query CodeSha256`, base64-decoded and compared against the digest below -- not the
# workflow log, which is green the moment the object is in the bucket. Reading the function
# straight after a successful release returns the previous digest, and that is the expected
# answer rather than a failure.
#
# main had moved eight commits and released this validator twice while #266 was open, so
# the pair was re-derived before the release rather than assumed: the account was running
# 15c3f101, the tree at 6bbb42e built 7a149fc4, and those were exactly the two digests the
# pending record named. That check is cheap and it is the one that says whether the release
# you are about to cut is the release that is owed.
#
# AND IT WENT STALE ANYWAY, WHICH IS THE SECOND TIME THIS FILE HAS RECORDED THAT AND THE
# FIRST TIME IT WAS RECORDED BY THE PERSON IT HAPPENED TO. The zip built from 6bbb42e was
# uploaded as version xli6Px4xuLliM0o9_yl3UgREQhDEXTSF, and while it sat in review #271
# added CheckpointPayload to contracts/results.py and #274 landed on top. That module is in
# the import tree this zip carries, so the tree stopped building 7a149fc4 and started
# building the digest below -- through no mistake by either change, exactly as the entry
# about 985c2cb and #250 in edullm_platform.pending_amendments describes. Merging the first
# paste would have put a record on main naming a zip that is in the bucket and is not what
# main builds, which is the one thing this file exists to prevent.
#
# So it was re-cut from 6f90582 rather than merged and fixed afterwards, and both fields
# below were read off what the workflow printed and checked against a local rebuild of that
# tree. The uploaded-but-superseded object is left in the bucket: it is addressed by version
# and nothing points at it, and deleting an artifact to tidy up is how a rollback target
# disappears.
#
# The lesson for the next person is smaller than the paragraph. Re-derive the pair
# immediately before pasting, not only before dispatching, because the interval that matters
# is the one between the upload and the merge rather than the one before the upload.
#
# The workflow uploads both zips and only this record moves. The recorder's digest moved too
# -- #271 is a behaviour change for it rather than an import -- but that difference is
# recorded in its own pending entry with its own reason and window, and repointing its
# template here would take a release somebody else is accountable for out of their hands.
# AND THIS ONE IS OWED TO THE ONE ABOVE, WHICH IS A SHAPE THIS FILE HAS NOT RECORDED BEFORE.
# Registering the five corpora made pretrain/fineweb2-equal-bytes nameable, and that corpus
# is raw text in a trainable family: a submission naming it compiled clean, classified
# routine and was admitted, and what it reached was OLMo-core memmapping gzipped JSON as
# uint16 tokens. So the release that closed a disagreement between a laptop and the account
# put a silent hazard within reach, and this release carries the refusal for it.
#
# What moved is config/datasets.yaml, which gains a payload_profile on each of the
# twenty-nine published entries, and contracts/dataset_registry.py, which gains
# CORPUS_PAYLOAD_PROFILES and requires it alongside the family. One admission answer changes
# across the whole registry, measured rather than assumed: that corpus goes from admitted to
# dataset_is_not_a_corpus, and every other registered name answers exactly as before.
#
# The skew this closes ran the safe way for once. Between #284 merging and this deploying,
# the tree refused and the account admitted, so a submitter met the refusal on their laptop
# ahead of the approval gate rather than from inside AWS behind it. That is the inverse of
# the paragraph two entries up and is worth naming as the direction to prefer when a change
# has to sit in the window.
#
# Cut from b54eb40. The pair was re-derived immediately before pasting rather than only
# before dispatching, which is the correction the entry above earned.
schema_version: 1

#: The object the template's Code block names. Kept here as well so the two can be
#: compared: a version id edited in one place and not the other is a template pointing at
#: a zip nobody recorded, or a record describing a zip nobody deployed.
s3_key: admission-validator/admission-validator.zip
