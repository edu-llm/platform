# What is actually deployed as the admission validator, recorded beside the template that
# names it.
#
# THE GAP THIS CLOSES COST A LIVE RUN. tools/build_admission_lambda.py copies config/*.yaml
# into the zip, so the validator reads the catalog it was reviewed against rather than
# whatever is in a bucket when it runs. That is the right property. Its consequence is that
# config/workload-catalog.yaml and config/execution-targets.yaml are part of this
# function's release -- and editing them changes nothing in the account until somebody
# rebuilds the zip, uploads it, and edits S3ObjectVersion in
# infra/admission-state-machine.yaml.
#
# Phase 4 walked into it. The GPU compute environment, queue, job definition and roles were
# deployed and VALID, both config files agreed, the suite was green, and the first GPU
# submission was refused with unprovisioned_compute_profile -- because the deployed zip
# still held a catalog in which that profile was not provisioned. The refusal was correct
# for the bytes that produced it and wrong about the account, and it named the compute
# profile rather than the release, which is why it took a run to find.
#
# So the digest below is compared against a zip built from the current tree. Change
# anything the package carries -- the handler, a contract it imports, or a config file --
# without releasing, and the comparison fails at CI with the reason, instead of at
# admission with a refusal that reads like a configuration mistake.
#
# The build is deterministic, so a rebuild that changed nothing produces the same digest
# and needs no edit here. Releasing means running the procedure in infra/README.md and
# updating both fields below in the same commit as the change that caused them to move.
#
# WHAT IT CAUGHT, TWICE, ON THE DAY IT WAS WRITTEN. The second time is the one that
# justifies it. config/image-exceptions.yaml is packaged too, and it is the file the
# validator reads to decide whether an image carrying blocking scan findings may run. The
# training image was published, its findings read, its exception written and the job
# definition repointed at it -- and none of that would have reached the validator. The next
# submission would have been refused by a principal that had never heard of the digest,
# which is the same shape as the refusal that cost the first GPU run: correct for the bytes
# that produced it, wrong about the account, and naming the image rather than the release.
#
# THIS CONTROL WAS COARSER THAN THE DEFECT IT CATCHES, AND THE FIX WAS THE ONE THIS COMMENT
# ARGUED FOR. The builder used to package all of src/edullm_platform, so the digest moved for
# any change to the package -- including modules the validator never imports. It moved four
# times in one session, once on a change to phase3_evidence.py, which the handler does not
# touch. The recorded reasoning was that narrowing means computing reachability and that
# getting reachability wrong reintroduces this failure while looking covered, so the fix
# should be to package less rather than to check less.
#
# Packaging less is what happened. tools/build_admission_lambda.py now decides the module
# list by importing the entrypoint in a clean interpreter and recording what Python actually
# loaded, rather than by reading imports statically -- so a module reachable only through a
# runtime import is carried, and the failure mode the old comment feared needs the import to
# not happen during startup at all. The package went from 66 modules to 28.
#
# The tax that remains is one rebuild, one upload and one edit per change to a module the
# handler reaches, and it needs laptop AWS credentials, so a contributor without them is
# blocked on somebody who has. The honest reading of a moved digest is unchanged: the
# deployed zip is not the zip this tree builds.
#
# THE RELEASE THIS RECORD WAS OWED HAS BEEN CUT, AND HOW IT CAME TO BE OWED IS WORTH
# KEEPING. Adding PublishedDatasetReference to
# src/edullm_platform/contracts/dataset_registry.py changed the bytes of a module the
# handler imports, so the digest moved and
# tests/test_phase2_lambda_package.py::test_the_released_zip_is_the_one_this_tree_builds
# went red. It was left red rather than papered over. The two ways to make it green without
# uploading anything are both worse: writing a digest for a zip nobody uploaded would defeat
# the one mechanism here that detects deployed-versus-tree skew, and would do it by making
# the record assert the thing this whole comment exists to prevent; suppressing the test
# would be the same act differently spelled, and there is no xfail anywhere in this
# repository.
#
# WAITING FOR SOMEBODY ELSE'S RELEASE WAS TRIED FIRST AND DOES NOT WORK. This change
# originally sat on a branch beside four IAM and measurement changes, on the reasoning that
# a concurrent workstream owed the next release anyway and this could ride it. That release
# was cut -- 9aa6e4f, from a tree without this contract in it -- and recorded a digest this
# tree did not match. Riding somebody else's release only works if they take your change
# with them, and nothing in the procedure makes them notice they should. So the branch was
# split, the IAM work went ahead on its own, and this waited for a release cut on purpose
# from a tree containing it. That is the ordering rule: the person who moves a packaged
# module cuts the release, and does not hand the debt to whoever releases next.
#
# The change is additive -- no existing field moved, config/datasets.yaml is unchanged, and
# nothing on the handler's path reads the new list -- so the validator this release deploys
# makes byte-for-byte the same admission decisions as the one before it. What was stale was
# the record, never the behaviour.
#
# THIS RELEASE WAS CAUSED BY A COMMENT, AND THAT IS WORTH KNOWING RATHER THAN SURPRISING.
# Retiring the forward phase numbering reworded one comment in
# src/edullm_platform/admission_handler.py, which explains why `ecr_repository` is required
# rather than defaulted. No statement changed and no behaviour did. The comment is in a
# module the package carries, so the bytes moved and the tripwire went red, which is the
# control working as specified: it compares packaged bytes and does not try to judge which
# byte changes matter. The consequence is that a docstring or comment edit to any of the
# twenty-eight modules is a release, and the cheap reading of a moved digest stays correct.
# The deployed validator makes the same decisions before and after.
#
# THIS RELEASE CARRIES A CONFIG CHANGE, WHICH IS THE CASE THE WHOLE FILE IS ABOUT. Three
# research groups were renamed and two were added in config/organization.yaml, and that file
# is packaged, so the deployed validator was reading the six old group names until this
# release. The consequence is smaller than it looks and is worth stating rather than leaving
# to inference: nothing on the handler's path looks a team up against team_bindings, so the
# stale zip refused nothing it should have admitted. What it did mean is that the roster the
# validator answers submitter and approver questions from was two names out of date, which is
# the same class of skew as the compute profile that cost the first GPU run and is invisible
# for the same reason.
#
# Released from main rather than from the branch, because deploy-phase2-admission.yml only
# runs there. The zip was built from 2baf0ea and the digest below is what a local rebuild of
# that tree produces, checked rather than copied.
schema_version: 1

#: The object the template's Code block names. Kept here as well so the two can be
#: compared: a version id edited in one place and not the other is a template pointing at
#: a zip nobody recorded, or a record describing a zip nobody deployed.
s3_key: admission-validator/admission-validator.zip
s3_object_version: tub5rH2W9dpCLooOvqBZuy.tHGWslzTe

