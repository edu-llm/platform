# What is actually deployed as the expiry janitor, recorded beside the template that names it.
#
# THE SAME TRIPWIRE THE OTHER TWO FUNCTIONS CARRY, AND THIS ONE HAS THE QUIETEST FAILURE OF THE
# THREE. The validator's failure is loud: a submission is refused for a reason correct about the
# deployed bytes and wrong about the account. The recorder's is quiet: lineage records that look
# right and do not join. This function's is quieter still -- a janitor running code this tree
# does not describe stops nothing, and a sweep that stops nothing is indistinguishable from a
# quiet morning. The counts it prints are the only signal, and they are correct for whatever
# bytes are running.
#
# The build is deterministic, so a rebuild that changed nothing produces the same digest and
# needs no edit here. Releasing means running tools/release_lambda.py and updating both fields
# below in the same commit as the change that caused them to move.
#
# It carries no configuration, so no edit under config/ moves this digest. What does move it is
# a change to any module edullm_platform.janitor_handler imports -- which is
# edullm_platform.expiry_janitor, edullm_platform.researcher_lane and the contracts package
# beneath them, and nothing else.
schema_version: 1
s3_key: expiry-janitor/expiry-janitor.zip
# THE SECOND RELEASE OF THIS FUNCTION, 2026-08-06, AND IT NEEDED NO FLAG. It carries the repair
# to the batched stop: one machine carrying DisableApiStop refused the stop of every machine
# sharing its sweep, and the summary sat behind that call so the failed sweeps printed nothing
# at all. The digest below moved with the handler, the bucket already held an object under this
# key, and tools/release_lambda.py's ordinary comparison saw the difference and uploaded.
#
# THE FIRST RELEASE NEEDED --force AND THE REASON IS KEPT HERE BECAUSE THE NEXT FUNCTION'S FIRST
# RELEASE WILL MEET IT TOO. Until that release all three of this field, infra/expiry-janitor.yaml's
# S3ObjectVersion and a guard step in the phase-3 workflow carried
# PLACEHOLDER-UNTIL-THE-FIRST-UPLOAD, and tests/test_janitor_package.py held the token in all of
# them or in none, so the guard came out in the same change. The digest was already correct for
# that tree -- written when the zip was built and deliberately not uploaded -- so the "the record
# already names this digest" comparison would have skipped an upload of an object the bucket did
# not hold. --force exists for exactly that case and for no other, which is why it is not needed
# here: a record right about the bytes, naming an object that is missing.
s3_object_version: h8HSBm_rNjFqzRIrZgmt9gAJfBQmKqi1
