name: Feedback on the platform itself
description: Something was confusing, tedious, or missing. Not a broken run.
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This is the one we most want during the pilot. The platform was built and used by one
        person, so everything obvious to him is untested on everyone else. "I did not
        understand what this field wanted" is a real report and worth filing.

  - type: textarea
    id: what
    attributes:
      label: What were you trying to do?
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: What got in the way
      description: >-
        Wording that did not make sense, a field you had to guess at, a step you could not
        find, a wait with no explanation. Small things count.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How much did it cost you?
      options:
        - "I worked it out on my own"
        - "I had to ask somebody"
        - "I gave up"
    validations:
      required: true
