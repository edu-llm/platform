# THE ONE FORM FOUR TEMPLATES COLLAPSED INTO, and the collapse is the point rather than the
# tidiness. docs-frank/reference/system-overview.md, "What you click, and what generates it":
# one place makes asks countable, which turns the third identical one into a config change.
# Four forms produce four uncounted queues, and the third identical ask looks like a first one
# in whichever queue it landed in.
#
# THE KIND LABEL IS APPLIED BY WHOEVER TRIAGES, NOT BY THE FORM. A GitHub issue form cannot set
# a label conditionally on a dropdown value -- `labels:` here is unconditional. So the dropdown
# is what the requester answers, `ask` is what every issue carries, and the kind label is what
# tools/report_asks.py groups on. The triager's one job is putting one on. Said here because
# the alternative reading is that the labelling was forgotten.
#
# `edullm ask --kind` is the other door into the same queue and it labels for itself, which is
# why the dropdown's options are held equal to that verb's vocabulary by
# tests/test_triage_form.py rather than written independently. A kind reachable through one
# door and not the other is an ask filed where nothing counts.
#
# THE ROUTE IS PERSON, LEAD, OWNER, and the `lead` field is what makes the middle rung real.
# system-overview.md's umbrella diagram sends work that fits no route to the submitter's lead
# and then to the owner. Without a named lead every ask is the owner's, which is the load this
# was meant to spread.
name: Ask for something
description: Access, a dataset, a run that went wrong, or feedback. This replaced four separate forms.
labels: ["ask"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything goes here now.** Access, dataset requests, run problems and feedback were
        four forms; they are one, so that a request nobody has made before is visibly different
        from the third copy of one somebody has.

        Pick the kind below and fill in what applies. Nothing here grants anything by itself.

        If you have `edullm` installed, `edullm ask --kind <kind>` files the same thing from a
        terminal and attaches which version and which reviewed configuration you were on, which
        is the commonest cause of a refusal that looks wrong and the one thing this form cannot
        ask you for.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of ask is this?
      description: >-
        This is what makes asks countable. The third identical ask of one kind is a sign the
        platform is missing something rather than that three people need a favour. Whoever
        triages this puts the matching label on, because a form cannot set one conditionally.
      options:
        - access-request
        - dataset-request
        - feedback
        - run-problem
    validations:
      required: true

  - type: input
    id: lead
    attributes:
      label: Which team lead have you spoken to?
      description: >-
        Name your group's lead, or the group you are in if you do not know who leads it. A lead
        can approve a configuration pull request — profiles, workloads, the roster and datasets
        all live under `config/**` and eight leads hold approval there. Merging one and
        deploying it are the platform owner's, so an ask that needs either reaches him through
        your lead rather than instead of them.
      placeholder: pre-training, or the lead's GitHub username
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### If you picked `access-request`, read this before filling in the rest

        **Access here is not one switch, and knowing that up front will save you a confusing
        afternoon.** Four separate things have to be true before a run works end to end, they
        live in three different systems, and only one of them is a file in this repository.
        Each one fails differently, and none of them fails by saying "you do not have access".

        - **Write access on this repository** is what makes the Run button visible at all. The
          submission form is a GitHub Actions workflow, and GitHub only shows a manual workflow
          to people who can write here. Most collaborators currently cannot see it. If this is
          the piece you are missing, the symptom is that the page other people are describing
          to you does not exist.
        - **A place on the roster** in `config/organization.yaml` is what admission checks. If
          you can submit but are not on it, the submission is refused as soon as you dispatch
          it, with a message naming this file. Nothing is compiled and no reviewer is asked.
          Adding you is a pull request against this repository.
        - **A Weights and Biases account in the eduLLM team** is what puts your name on your
          own run. This one is optional and it fails silently: without it the run still works,
          it just logs under the platform's service account instead of you, and nothing warns
          you afterwards.
        - **Approval authority**, only if you need to release other people's runs. That is two
          lists in two systems that have to agree, and when they disagree the failure looks
          like a permissions bug rather than a list being out of date.

        Filing this puts all four in one place for whoever sets you up. It does not grant
        anything by itself — three of the four are actions an organization owner takes outside
        this repository.

  - type: input
    id: github_login
    attributes:
      label: Your GitHub username
      description: >-
        Exactly as GitHub spells it, not your display name. This is the string that goes on the
        roster and the one admission compares against, so a near-miss here produces a refusal
        that looks like it is about something else.
      placeholder: octocat
    validations:
      required: true

  - type: input
    id: display_name
    attributes:
      label: Your name
      description: How you want to be referred to by a human reading the roster.
    validations:
      required: true

  - type: input
    id: wandb_username
    attributes:
      label: Your Weights and Biases username, if you have one
      description: >-
        Leave this blank if you do not have an account or are not sure. Blank is a real answer
        and it costs you only attribution. A guess is worse than blank: if the name is not a
        real login inside the eduLLM team, W&B does not complain, it just logs the run as the
        service account — which looks exactly like sending no name at all, and the only person
        placed to notice is you, later, wondering where your runs went.
    validations:
      required: false

  - type: input
    id: group
    attributes:
      label: Which group are you working with
      description: >-
        The research group or the person you are working under. This is here so the request
        reaches whoever sets you up, and so your runs are attributed to the right group
        afterwards. It does not decide who approves them — approval authority is
        organization-wide here, so whoever holds it can release any group's routine run
        including yours, and naming a group grants nobody in it anything.
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: What do you need?
      description: >-
        One or two sentences. If this is a run problem, paste the run id and the link to the
        workflow run — those two make it answerable without a conversation. If it is a dataset,
        say roughly how many tokens, which tokenizer, when you need it, and whether a result
        will depend on it being reproducible.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What are you trying to do?
      description: >-
        The work behind the ask. This is what tells whoever reads it whether the platform can
        already do this a different way, and it is what makes two asks recognisable as the same
        ask when they are worded differently. For a dataset this matters more than the file
        list: the shape usually follows from the question, and the people who build it know
        shapes you do not.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### If you picked `run-problem`, the five fields below are what make it answerable

        **"I cannot do X" is unanswerable without the command and what it printed.** The next
        five are optional because this form is also filled in by people whose problem is that
        they cannot get as far as a command. Fill in the ones you have. Every one you leave
        blank is a round trip, and the person on the other end is the one who merges every
        configuration change.

        If you have `edullm` installed, `edullm ask --kind run-problem` fills in the version
        for you and files the same issue in the same queue.

  - type: input
    id: command
    attributes:
      label: The command you ran
      description: >-
        The whole line, as you typed it, including the flags. A refusal usually names the one
        field to change and which field that is depends on what was asked for.
      placeholder: edullm submit --experiment context-length-sweep --dataset regmix-10b-v1
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: >-
        Paste it rather than describing it. `edullm check --json` and `edullm status --json`
        print a refusal as a list of codes, and the code is the part that identifies the wall.
        The prose beside it is written for a person and gets reworded, so a summary in your
        own words can match no code at all.
      render: text
    validations:
      required: false

  - type: input
    id: repository
    attributes:
      label: Which repository you were in
      description: >-
        The research codebase, not this one. A refusal about registration, an image or a
        Dockerfile is about that repository, and the same command run in two of them gets two
        answers.
      placeholder: OLMo-core
    validations:
      required: false

  - type: input
    id: compute_profile
    attributes:
      label: Which compute profile you asked for
      description: >-
        The profile named in `.edullm/run.yaml` or on the command line. What a profile costs,
        which queue can place it and how many people have to approve it are all decided by
        this, so a refusal that looks like a permissions problem is often a placement one.
      placeholder: cpu-small
    validations:
      required: false

  - type: input
    id: cli_version
    attributes:
      label: Which version of edullm, from `edullm --version`
      description: >-
        An install checking against the reviewed configuration it was built with is the
        commonest cause of a refusal that looks wrong, and it is invisible from everything
        else on this form. Re-installing is one line and it is worth trying before you file.
      placeholder: 3.4.3
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: >-
        Optional, and the most useful field on the form when it is filled in. If this is an
        access ask, the first step is trying the credentials install yourself — eighteen of the
        roles in this account are issued on request with nobody in the loop, so it may already
        work. Say here whether you tried and what happened. If something was confusing rather
        than broken, say that too: "I did not understand what this field wanted" is a real
        report and the pilot most wants those.
    validations:
      required: false
