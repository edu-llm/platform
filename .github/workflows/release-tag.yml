name: Cut a release when the CLI or the configuration changes

# THE ONE THING THAT MAKES `edullm submit`'S STALENESS CHECK MEAN ANYTHING. That check asks
# `repos/edu-llm/platform/releases/latest` and compares the answer with the version the
# researcher has installed, so if releases are cut by somebody remembering to, then the
# morning somebody forgets is the morning every CLI in the field is told it is current.
# The dangerous config change is the one nobody thought was a release: #188 took two H100
# shapes off the form, and a CLI from before it will price an H100 run, call it valid, and
# spend a lead's approval on a submission admission then refuses.
#
# THE PATHS BELOW ARE THE SURFACE AN INSTALLED CLI CAN OBSERVE, AND NOTHING WIDER. They used
# to be `src/edullm_platform/**`, `config/**` and `pyproject.toml`, which is the whole
# platform and the whole control plane. Twelve of the sixteen merges before this one matched
# that list and six of them changed nothing an installed `edullm` would answer differently:
# #195, #198, #201, #202, #206 and #207 moved a proof generator, a capacity table nothing in
# the CLI opens, a checkpoint reader, a run comparator and an account reader. Each one would
# have moved `releases/latest` and told thirty-five machines they were behind, which is how
# a staleness warning stops being read.
#
# So the list is the CLI's own package, every module it transitively imports, the seven
# configuration files it opens, and the file its version lives in. The seventh is
# config/run-history.json, which is a measurement rather than a rule and is the only one the
# CLI tolerates the absence of -- but a release that moves it is still a release after which
# an install quotes different durations, so it belongs here exactly as the six rules do. It
# is written out rather
# than globbed because the two directories it reaches into hold modules it does not import,
# and tests/test_release_tag_workflow.py derives the same set from the import graph and from
# watching the loader open files. A new import either lands here or fails the suite, and the
# failure prints the block to paste.
#
# THIS WORKFLOW TAGS AND IT DOES NOT WRITE. That is the correction, and the reason for it is
# that the previous arrangement could not work and had not worked since #201. It computed
# the next patch version, committed the bump to pyproject.toml and uv.lock, and pushed that
# commit to main -- which branch protection refuses, in as many words:
#
#     remote: - Changes must be made through a pull request.
#     remote: - 2 of 2 required status checks are expected.
#
# Seven merges in a row failed on that line. `releases/latest` went on naming a tag cut
# before all of them, so the automation written to keep the install line current was the
# thing keeping it stale. The protection is not the problem: it is the only thing between an
# agent and an unreviewed change to main, and it is not weakened, bypassed or exempted here.
#
# WHICH LEAVES THE BUMP TO A PULL REQUEST, AND THAT IS BETTER THAN IT SOUNDS. `ci.yml` will
# not let a change to the paths below merge unless it declares a version one step above the
# latest release, so the bump lands inside the pull request that earns it -- reviewed, and
# with the four gates run over it. It is also the only arrangement in which a minor or a
# major is expressible at all: a bot that computes the next patch can only ever say "another
# one", and #199 added a refusal that can stop a submission which used to go through and got
# a patch because nothing could give it anything else.
#
# SO THE ONLY WAY THIS STEP FAILS IS THE ONE WORTH BEING LOUD ABOUT. A merge that changed
# the CLI or the configuration and still declares a released version means the pull-request
# check was bypassed -- enforce_admins is off on this repository -- or two pull requests
# bumped to the same number and raced. Both leave real work unreleased, and the failure
# mode of saying nothing is that `releases/latest` goes on naming the older tag while every
# installed CLI compares equal to it and is told it is current. That is precisely the false
# "you are current" this whole subsystem exists to prevent, so it is a red run and not a
# skip. It clears with a one-line bump pull request.
#
# AND THE VERSION HAS TO BE THE NEXT ONE, NOT MERELY ONE NOBODY HAS USED. That is this
# file's half of covering the push path, and it is here rather than in ci.yml because this
# is where the push already is: the trigger above has already decided the merge is one a
# release must carry, so this step needs no base commit and cannot have the failure the
# pull-request check was fixed for. The checkout is complete, the releases API is already
# read, and nothing else runs on a merge that could ask.
#
# The gap it closes is narrow and it is the one that cannot be undone. `ci.yml` asks the
# same question before the merge; when that check does not run -- an administrator merging
# past it, or its own read of the releases API failing and being treated as "no release
# exists yet" -- a version already released still stops here, but 0.2.7 against a released
# v0.2.2 did not. It was a version no release had, so it was tagged and published, leaving
# four numbers that never existed and a `releases/latest` nobody chose. Unreleased work is
# recoverable with a bump pull request; a published tag is not.
#
# NOT ON A DISPATCH, THOUGH. That handle exists for the morning several releases are
# missing, which is exactly the state in which the declared version is several steps above
# the last one cut. Holding a repair to the rule the ordinary path follows would take the
# repair away.
#
# NO WHEEL IS BUILT AND NOTHING IS UPLOADED. `uv tool install git+...@<tag>` builds the
# wheel on the researcher's own machine from the tagged source, so a release here is a tag,
# a name and generated notes. No PyPI token, no signing key, no index, no new runner OS.

on:
  push:
    branches: [main]
    paths:
      - "src/edullm_platform/cli/**"
      - "src/edullm_platform/__init__.py"
      - "src/edullm_platform/admission.py"
      - "src/edullm_platform/canonical.py"
      - "src/edullm_platform/checkpoint_commands.py"
      - "src/edullm_platform/config.py"
      - "src/edullm_platform/contracts/__init__.py"
      - "src/edullm_platform/contracts/admission.py"
      - "src/edullm_platform/contracts/authorization.py"
      - "src/edullm_platform/contracts/base.py"
      - "src/edullm_platform/contracts/bindings.py"
      - "src/edullm_platform/contracts/dataset.py"
      - "src/edullm_platform/contracts/dataset_registry.py"
      - "src/edullm_platform/contracts/execution.py"
      - "src/edullm_platform/contracts/identity.py"
      - "src/edullm_platform/contracts/image.py"
      - "src/edullm_platform/contracts/image_scan.py"
      - "src/edullm_platform/contracts/inventory.py"
      - "src/edullm_platform/contracts/lifecycle.py"
      - "src/edullm_platform/contracts/manifest.py"
      - "src/edullm_platform/contracts/policy.py"
      - "src/edullm_platform/contracts/repository_registry.py"
      - "src/edullm_platform/contracts/results.py"
      - "src/edullm_platform/contracts/source_identity.py"
      - "src/edullm_platform/contracts/validation.py"
      - "src/edullm_platform/contracts/vocabulary.py"
      - "src/edullm_platform/contracts/workload.py"
      - "src/edullm_platform/corpora.py"
      - "src/edullm_platform/daily_ceiling.py"
      - "src/edullm_platform/errors.py"
      - "src/edullm_platform/execution.py"
      - "src/edullm_platform/image_resolution.py"
      - "src/edullm_platform/launchers.py"
      - "src/edullm_platform/manifest_helpers.py"
      - "src/edullm_platform/placement.py"
      - "src/edullm_platform/precision.py"
      - "src/edullm_platform/researcher_lane.py"
      - "src/edullm_platform/reviewed_configuration.py"
      - "src/edullm_platform/run_history.py"
      - "src/edullm_platform/submission.py"
      - "src/edullm_platform/tokenizers.py"
      - "config/datasets.yaml"
      - "config/image-exceptions.yaml"
      - "config/organization.yaml"
      - "config/policy.yaml"
      - "config/repositories.yaml"
      - "config/run-history.json"
      - "config/workload-catalog.yaml"
      - "pyproject.toml"
  # The handle this workflow did not have on the morning it was needed. Seven releases were
  # missed while it was broken, and the only way to cut them once it was fixed would have
  # been a commit to main whose sole purpose was to touch a path in the list above. A
  # release that was missed is exactly the state somebody has to be able to repair by hand,
  # and dispatching costs no commit and changes nothing about what gets tagged: the steps
  # below read the ref they were dispatched at, the same way they read the ref that was
  # pushed.
  workflow_dispatch:

# contents: write is the whole of it, and it is why this is its own file rather than a job
# in ci.yml -- that workflow declares contents: read and runs on pull_request, including
# from forks. Nothing here runs on a pull request and nothing here reads one.
#
# It is also, now, the *only* write this workflow makes: a tag and a release. Neither is
# protected on this repository -- there are no rulesets and no tag protection -- and
# neither touches refs/heads/main, which is the ref that is.
permissions:
  contents: write

# Serialized rather than cancelled. Two merges landing a minute apart must produce two
# releases; cancelling the first would leave its commit on main with no tag pointing at it.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    name: tag and release
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for two reasons, and the shallow default defeats both. The decision
      # below is "does this tag already exist", and a shallow fetch brings no tags at all --
      # which would read as "no tag exists" every time and try to cut one that is already
      # there. The notes then ask what has moved since the previous release, which needs the
      # history between that tag and here.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # WHAT PYPROJECT.TOML SAYS IS WHAT GETS TAGGED, and nothing here writes it.
      #
      # The version is a literal in a file, so only a commit can move it and only a pull
      # request can put a commit on main. That is the whole shape of this workflow: the
      # pull request declares the version its change will be released as, and this tags it.
      # An install from that tag then reports a version equal to its own tag, which is what
      # the staleness comparison assumes and what tests/test_cli_install_command.py asserts.
      - name: Decide the version this merge releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # Which of the two triggers started this, because the rule below applies to one
          # of them. A push is the automated path and has a check in front of it; a
          # dispatch is somebody repairing releases that were missed.
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # BEFORE ANYTHING ELSE, BECAUSE THE ANNOTATED TAG BELOW NEEDS A TAGGER. A runner
          # has no configured identity and its hostname has no domain, so git's
          # auto-detected address is bogus and `git tag -a` -- which asks for the identity
          # in strict mode, exactly as `git commit` does -- dies with "unable to
          # auto-detect email address". Local config, so it survives into the next step
          # through .git/config.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # THE LAST PLACE A VERSION ABOVE THE CEILING CAN BE STOPPED, and the only one that
          # is downstream of the merge. The tool refuses to report a declared version above
          # MAJOR_CEILING, so a hand-edited 5.0.0 that got past `Checks (CI)` -- merged by an
          # administrator, or on a run where that check did not execute -- dies here, one
          # step before `git tag`. A tag is the one thing in this file that cannot be undone.
          # mktemp rather than RUNNER_TEMP, which tests/test_release_tag_workflow.py does not
          # set: that module runs this step's script under a real shell, which is the only
          # reason any of it is tested at all.
          ceiling_said="$(mktemp)"
          if ! version="$(python3 tools/next_version.py 2>"${ceiling_said}")"; then
            echo "::error::pyproject.toml declares a version this repository will not tag. Nothing was tagged."
            {
              echo '## A version above the ceiling'
              echo
              echo '```'
              cat "${ceiling_said}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            # Said twice on purpose: ::error:: puts it at the top of the run, and the step
            # summary is what somebody sees without opening a log.
            echo "::error::v${version} is already released, so this change has no release to cut. Bump project.version in a pull request."
            cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          ## Nothing to release, and something to release

          This change touched the CLI or the reviewed configuration, so an installed
          \`edullm\` would answer differently after it. But \`pyproject.toml\` still declares
          **${version}**, and **v${version}** is already released -- so there is no new
          version to tag, and this change will reach nobody until there is.

          Nothing here can bump it. This workflow cannot write to \`main\`: branch protection
          requires a pull request, and pushing the bump anyway is the failure this workflow
          spent seven merges producing.

          **To release it**, open an ordinary pull request that runs one of these and commits
          what it writes. Almost every change here is a patch, and a patch needs no reason.

          \`\`\`bash
          uv run python tools/next_version.py --bump patch
          uv run python tools/next_version.py --bump minor --why "<what a researcher can now do>"
          SUMMARY
            # WHAT THIS PAGE SAYS ABOUT THE MAJOR, ASKED RATHER THAN ASSERTED. The tool
            # refuses to produce a version above MAJOR_CEILING, so asking it whether a major
            # of this version exists is the same question a reader is about to ask by running
            # the command. Written as two blocks rather than one with a variable in it,
            # because the strings below are commands to a reader and must stay heredoc data:
            # test_nothing_here_commits_anything_or_pushes_a_branch reads every line this
            # workflow *runs*, and a bump command in a shell assignment reads as one.
            if python3 tools/next_version.py --next major --of "${version}" >/dev/null 2>&1; then
              cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          uv run python tools/next_version.py --bump major --why "<what stopped working>"
          ```
          SUMMARY
            else
              cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ```

          There is no major to take. This repository is held to the major it is on, and
          `MAJOR_CEILING` in `tools/next_version.py` is the one line that lifts it. Until it
          is lifted a break is released as a minor, carrying the sentence in its `--why`.
          SUMMARY
            fi
            cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY

          Each moves \`pyproject.toml\`, \`uv.lock\` and the pinned install line together.
          Merging it cuts the release.
          SUMMARY
            exit 1
          fi
          # READ ONCE, HERE, FOR BOTH THINGS IN THIS JOB THAT NEED IT. The rule below
          # measures from the latest release and the note underneath it describes the range
          # since the latest release, and two reads of one endpoint are two answers to a
          # question that has one.
          previous="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          # A release whose tag has been deleted leaves a name nothing can reach, and
          # `git diff` against it would kill the next step under `set -e`. Treated as no
          # previous release, which says the configuration moved: a reader told to re-check
          # config that did not move has lost a minute, and one not told about config that
          # did move has an `edullm check` that disagrees with admission. It is also how a
          # failed read of the releases API arrives here, which is deliberate for the same
          # reason and is why nothing below turns an unanswered read into a refusal.
          if [ -n "${previous}" ] \
             && ! git rev-parse --verify --quiet "${previous}^{commit}" >/dev/null; then
            previous=""
          fi
          # THE NEXT VERSION, AND NOT MERELY ONE NOBODY HAS USED. Reaching here with
          # anything else means the pull-request check did not run or did not pass, and the
          # cost of shrugging is a published tag: 0.2.7 above a released v0.2.2 leaves four
          # numbers that never existed and a `releases/latest` nobody chose.
          #
          # Skipped on a dispatch, which is the handle for the morning several releases are
          # missing -- the state in which the declared version is several steps above the
          # last one cut, and the one repair this rule would take away.
          # WHICH STEP THIS VERSION TAKES, COMPUTED WHENEVER IT CAN BE AND NOT ONLY WHEN IT
          # IS ABOUT TO BE ENFORCED. The rule below is skipped on a dispatch; the note
          # underneath still wants to know whether this release is a patch, so that a Break
          # section and a Summary section land on the releases that earned one. Two things
          # asking the same arithmetic is one place to get it wrong, so it is asked once.
          size=""
          if [ -n "${previous}" ]; then
            released="${previous#v}"
            next_patch="$(python3 tools/next_version.py --next patch --of "${released}")"
            next_minor="$(python3 tools/next_version.py --next minor --of "${released}")"
            # Empty while MAJOR_CEILING holds, because the tool refuses to produce a version
            # above it. Tolerated rather than deleted so that lifting the ceiling needs no
            # edit here: this classifies a major again the moment the tool will compute one.
            # The two above are not tolerated, for the reason ci.yml gives at the same lines.
            next_major="$(python3 tools/next_version.py --next major --of "${released}" 2>/dev/null || true)"
            if [ "${version}" = "${next_patch}" ]; then
              size="patch"
            elif [ "${version}" = "${next_minor}" ]; then
              size="minor"
            elif [ -n "${next_major}" ] && [ "${version}" = "${next_major}" ]; then
              size="major"
            fi
          fi
          if [ "${EVENT}" = "push" ] && [ -n "${previous}" ] && [ -z "${size}" ]; then
            echo "::error::v${version} is not the next version above the latest release ${previous}, so this merge would publish a tag nobody chose. Nothing is tagged. Declare the next version in a pull request; the step summary names the commands and what each of them would produce."
            cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          ## A version that is not the next one

          This change touched the CLI or the reviewed configuration, so an installed
          \`edullm\` would answer differently after it. But \`pyproject.toml\` declares
          **${version}**, the latest release is **${previous}**, and that is not one step.
          Tagging it would publish **v${version}** over numbers between the two that were
          never cut, and \`releases/latest\` would name a version nobody chose.

          A tag is the one thing here that cannot be taken back, so nothing was tagged.

          \`Checks (CI)\` asks this same question on the pull request, before the merge.
          Reaching here means it did not run, did not pass, or was merged past --
          \`enforce_admins\` is off on this repository.

          Nothing here can bump it either. This workflow cannot write to \`main\`: branch
          protection requires a pull request, and pushing the bump anyway is the failure this
          workflow spent seven merges producing.

          **To release this work**, open an ordinary pull request that runs one of these and
          commits what it writes.

          Almost every change here is a patch. If a re-install fixes it, it is one, and it
          needs no reason.

          \`\`\`bash
          uv run python tools/next_version.py --bump patch   # ${next_patch}
          \`\`\`

          A minor is a new command, a new flag, a new optional spec field, or a new refusal
          that can stop a submission which used to go through. It has to say why, and the
          sentence is published in the release note.

          \`\`\`bash
          uv run python tools/next_version.py --bump minor --why "<what a researcher can now do>"   # ${next_minor}
          \`\`\`

          A major is a flag or field removed or given a new meaning, or a changed exit code,
          which breaks somebody who already has this installed.
          SUMMARY
            # DECIDED BY WHETHER THERE IS A MAJOR, NOT BY WHAT IS TRUE TODAY. An empty
            # next_major is MAJOR_CEILING refusing to compute one; a value means the ceiling
            # has been lifted past this release. Prose that assumed either would be wrong on
            # the day the other happened, which is exactly the day somebody reads this page.
            # Two heredocs rather than one with a variable in it, for the reason the summary
            # above gives: a bump command in a shell assignment reads to
            # test_nothing_here_commits_anything_or_pushes_a_branch as a bump this workflow runs.
            if [ -n "${next_major}" ]; then
              cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY
          It has to say why too, and the sentence is published in the release note.

          \`\`\`bash
          uv run python tools/next_version.py --bump major --why "<what stopped working>"   # ${next_major}
          \`\`\`
          SUMMARY
            else
              cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          There is none to take: this repository is held to the major it is on, and
          `MAJOR_CEILING` in `tools/next_version.py` is the one line that lifts it. Until it
          is lifted a break is released as a minor, carrying the sentence in its `--why`.
          SUMMARY
            fi
            cat >> "${GITHUB_STEP_SUMMARY}" <<SUMMARY

          Each moves \`pyproject.toml\`, \`uv.lock\` and the pinned install line together.
          Merging it cuts the release.
          SUMMARY
            exit 1
          fi
          # THE SENTENCE THE AUTHOR HAD TO WRITE TO WIDEN THE VERSION, ON ITS WAY TO THE NOTE.
          #
          # Read here rather than in the step below for the same reason the previous release
          # is: this step already has the file open and the arithmetic done, and two places
          # asking one question is two answers to it. Held to the step the version actually
          # takes, so a sentence left behind by a previous minor cannot publish a Summary on
          # a patch -- `ci.yml` refuses that disagreement before the merge, and this is what
          # makes the note right anyway on a merge that got past it.
          reason=""
          if [ "${size}" = "minor" ] || [ "${size}" = "major" ]; then
            said="$(python3 tools/next_version.py --show-why)"
            if [ "${said%% *}" = "${size}" ]; then
              reason="${said#* }"
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"
          echo "size=${size}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      # A RELEASE AND NOT ONLY A TAG, deliberately. The CLI's probe reads
      # `repos/.../releases/latest`, which a bare tag does not create and which answers 404
      # for a repository that has tags and no releases -- so tagging alone would leave the
      # probe permanently unable to answer, which it reads as "say nothing".
      #
      # WHETHER THE CONFIGURATION MOVED IS THE FIRST LINE OF THE NOTES, because it is the one
      # thing a reader needs and the one thing generated notes cannot infer. A release that
      # changed only code costs a researcher nothing to skip; one that moved the reviewed
      # configuration is a release after which their `edullm check` and the platform answer
      # the same question differently.
      #
      # THE SEVEN FILES THE CLI OPENS AND NOT `config/`. That directory holds capacity tables,
      # execution targets and generated reports the CLI never reads, and v0.2.1 said the
      # reviewed configuration had moved when the only file that changed was
      # config/capacity.yaml. Everybody who re-installed on that sentence did it for nothing,
      # which is the same currency the staleness warning is spent in.
      #
      # ONE RANGE FOR BOTH HALVES OF THE NOTE. The previous release is read from the releases
      # API rather than from `git describe`, because those two can disagree and did: v0.2.1
      # was cut from a branch, so it is `releases/latest` and it is not an ancestor of main,
      # and `git describe` answers v0.2.0 here. `--generate-notes` builds its pull request
      # list against the previous *release*, so a headline computed from `git describe` would
      # have described a wider range than the list below it and claimed a configuration
      # change the list did not show. The same tag is handed to both -- and now to the step
      # above as well, which reads it once and hands it down rather than asking again.
      - name: Cut the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          # Empty when there is no previous release, when its tag has been deleted, or when
          # the read of the releases API did not answer. All three mean the same thing to
          # everything below: there is no range to describe, so describe none.
          PREVIOUS: ${{ steps.version.outputs.previous }}
          # The step this version takes above that release, and the sentence its author had
          # to write to take it. Both empty for a patch, which is what almost every release
          # here is and the one that carries no human section at all.
          SIZE: ${{ steps.version.outputs.size }}
          REASON: ${{ steps.version.outputs.reason }}
          # Held to what edullm_platform.cli.configuration actually opens by
          # tests/test_release_tag_workflow.py, which watches the loader rather than reading
          # this list. Restated here because a workflow cannot import anything.
          CONFIGURATION_FILES: >-
            config/datasets.yaml
            config/image-exceptions.yaml
            config/organization.yaml
            config/policy.yaml
            config/repositories.yaml
            config/run-history.json
            config/workload-catalog.yaml
        run: |
          set -euo pipefail
          # Split deliberately: CONFIGURATION_FILES is a list of seven, none of which
          # contains a space or a glob character. Quoted, it would ask git for one path with
          # six spaces in its name, which matches nothing and reports every release as
          # code-only.
          set -- ${CONFIGURATION_FILES}
          if [ -z "${PREVIOUS}" ] || ! git diff --quiet "${PREVIOUS}" HEAD -- "$@"; then
            headline="**This release moves the reviewed configuration**, so \`edullm check\` answers differently after you re-install."
          else
            headline="This release changes code only. The reviewed configuration is unchanged."
          fi

          # THE TWO HUMAN SECTIONS, WRITTEN BY THE PERSON WHO EARNED THE VERSION RATHER THAN
          # BY WHOEVER REMEMBERS AFTERWARDS.
          #
          # The house standard has said since it was written that a Summary is never omitted
          # and that a major carries a Break above everything. Twenty-nine releases have been
          # cut and not one of them has either, because both were things a person had to go
          # back and edit onto a published note, and a release cut on every qualifying merge
          # is a note nobody goes back to. The sentence is now required at bump time to widen
          # the version at all, which puts it in the tree before the merge, in front of a
          # reviewer, and here.
          #
          # A PATCH GETS NEITHER, AND THAT IS THE POINT RATHER THAN A GAP. A patch is anything
          # a re-install fixes; the two machine-written lines are the whole of what a reader
          # of one needs, and a Summary invented for it would be the padding that teaches
          # people to stop reading the ones that mean something.
          : > "${RUNNER_TEMP}/notes.md"
          if [ "${SIZE}" = "major" ] && [ -n "${REASON}" ]; then
            # ABOVE THE MACHINE'S FIRST LINE, which is the one placement rule the standard is
            # emphatic about. A researcher who reads only the first screen has to meet the
            # thing that stopped working before they meet anything else.
            cat >> "${RUNNER_TEMP}/notes.md" <<EOF
          > **Something that worked before does not work now.** ${REASON}
          > Re-install before you submit again. \`uv tool install --force git+https://github.com/${GITHUB_REPOSITORY}@${TAG}\`

          EOF
          fi
          cat >> "${RUNNER_TEMP}/notes.md" <<EOF
          ${headline}

          Install, upgrade or repair. One idempotent line does all three.

          \`\`\`bash
          uv tool install --force git+https://github.com/${GITHUB_REPOSITORY}@${TAG}
          \`\`\`

          **Installed before v4.2.2?** The package was called \`edullm-platform\` then and is called \`edullm\` now, so an install of the new name does not replace the old one. Run \`uv tool uninstall edullm-platform\` **before** the line above and not after: both own the same \`edullm\` executable, uv deletes it with the old entry, and the wrong order leaves \`uv tool list\` reporting a healthy \`edullm\` with nothing on your path. Re-run the install line if that has already happened. Where the old name was never installed it exits 2 saying so, which is fine.

          \`uv tool upgrade\` will not move an install made from that line. The line pins this tag, and \`uv tool upgrade\` follows the ref an install named. It answers \`Nothing to upgrade\` and exits 0 however far behind that install falls, with \`--reinstall\` too. It does upgrade an install made from the same URL with no tag on the end, which is the line the README carries. Re-running the line above is the upgrade for either.
          EOF
          if [ "${SIZE}" = "minor" ] && [ -n "${REASON}" ]; then
            # DIRECTLY ABOVE THE GENERATED LIST, which is where it lands for free: everything
            # --generate-notes adds is appended after this file, so the end of this file is
            # the seam the standard asks for.
            cat >> "${RUNNER_TEMP}/notes.md" <<EOF

          ## Summary

          - ${REASON}
          EOF
          fi

          # Unquoted on purpose, so that an empty value contributes no argument at all. A tag
          # name here is v followed by three integers, so there is nothing in it to split on.
          start_tag=""
          if [ -n "${PREVIOUS}" ]; then
            start_tag="--notes-start-tag ${PREVIOUS}"
          fi

          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --generate-notes ${start_tag}
