name: "Deploy: admission control plane"

# The deployer role trust policy pins job_workflow_ref to
# edu-llm/platform/.github/workflows/deploy-phase2-admission.yml@refs/heads/main.
# Renaming or moving this file silently revokes every deployment. Do not rename it.
on:
  workflow_dispatch:
    inputs:
      release_lambdas:
        description: "Build both Lambda zips and upload them to the artifacts bucket, printing the version id and digest to paste into the release records. Deploys nothing new by itself."
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-phase2-admission.yml
      - infra/lineage-bucket.yaml
      - infra/artifacts-bucket.yaml
      - infra/admission-state-machine.yaml

permissions:
  contents: read

# One group across all three stacks rather than one per stack. They are deployed in
# dependency order by a single job, so two concurrent runs would interleave a bucket
# create with an admission update rather than queue behind each other.
concurrency:
  group: cloudformation-sbsandbox-intern-edullm-phase2
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy, and verify Phase 2 admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # WHO MAY DEPLOY BY HAND, ENUMERATED RATHER THAN MATCHED. workflow_dispatch is
      # offered to anybody holding write, and write stopped meaning "an admin" when the
      # pilot opened. Without this, a researcher can reconcile a CloudFormation stack into
      # the sandbox account by pressing a button, through a role they cannot see and were
      # never shown.
      #
      # Only the dispatch path is guarded. A push to main has already been through a
      # code-owner review of both the template and the workflow that applies it, and
      # refusing there would strand an approved infrastructure change with no way to land.
      #
      # It fails rather than skipping. A job-level `if` that evaluates false reports the
      # job as skipped, which reads as success in the checks list and tells the person
      # nothing at all.
      #
      # First in the job, before the checkout, so a refused dispatch does no work. The list
      # is checked against config/organization.yaml by tests/test_deploy_authorization.py,
      # which also holds all three deploy workflows to carrying this same step -- three
      # copies kept honest by a test, the way the job queue name already is, rather than by
      # a composite action that would move the control out of the file it protects.
      - name: Refuse a hand-started deploy from somebody who may not make one
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "${ACTOR}" in
            philote-dev|BritishAmericqn) ;;
            *)
              echo "deploy_dispatch_not_authorized:${ACTOR}" >&2
              echo "Deploying infrastructure by hand is limited to the repository admins." >&2
              echo "Open a pull request against the template instead: a merge to main deploys it after a code-owner review." >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          # Account IDs are not secret, but the verification step below reads a state
          # machine ARN out of a stack output, and masking keeps that ARN from turning a
          # public log into a free lookup of the sandbox account number.
          mask-aws-account-id: true

      # THE UPLOAD HALF OF A RELEASE, MOVED OFF THE LAPTOP THAT COULD NOT MAKE IT.
      #
      # `infra/README.md` describes a release as three steps run by a person: build the zip,
      # `put-object` it, paste the returned version id and digest into the template and the
      # release record. It argued the upload belongs on a laptop because an S3 write is not
      # applying a stack, and that was a reasonable line until the night it was not.
      #
      # On 2026-08-01 `main` went red on the release tripwire -- the built zip no longer
      # matched the recorded one -- and every credential that could fix it had been revoked
      # server-side. The repair for a red `main` was reachable only through a browser login
      # nobody was awake to complete. The deployer role, meanwhile, was sitting right here
      # holding `s3:PutObject` on the artifacts bucket, granted in
      # `infra/iam/infra-deployer-role.yaml` and unused for this.
      #
      # SO THE STEP LIVES IN THIS FILE RATHER THAN A NEW ONE, AND THAT IS THE TRUST POLICY
      # TALKING. The role's condition pins `job_workflow_ref` to exactly three workflow files
      # at `refs/heads/main`. A `release-lambda.yml` could not assume the role until the
      # policy named it, and amending the policy needs the AWS access this step exists to
      # replace -- so a new file is a door that can only be opened from inside the room.
      # Adding steps to a named file needs nobody's permission.
      #
      # It uploads and prints; it does not edit or commit. The values are pasted into the two
      # files by hand in a reviewed pull request, which keeps the deploy on the far side of a
      # review -- the property `infra/README.md` was protecting, preserved.
      #
      # BOTH FUNCTIONS, BECAUSE ONE CONFIG EDIT IS TWO RELEASES. `build_package` copies
      # `config/*.yaml` into whatever zip it builds and the lifecycle recorder's builder calls
      # that same function, so editing a catalog moves the recorder's digest even though
      # nothing the recorder does reads a catalog. Releasing one and not the other is how the
      # tripwire ends up red on the function nobody was thinking about.
      - name: Install uv
        if: github.event_name == 'workflow_dispatch' && inputs.release_lambdas
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build and upload both Lambda zips
        if: github.event_name == 'workflow_dispatch' && inputs.release_lambdas
        run: |
          set -euo pipefail
          uv sync --locked

          # Each builder prints a JSON record carrying the digest. The digest is read from
          # that record rather than hashed again here, because the tripwire compares against
          # what the builder reports and a second hasher is a second chance to disagree.
          #
          # WRITTEN OUT LONGHAND, TWICE, RATHER THAN THROUGH A SHELL FUNCTION, AND TWO
          # HOUSE RULES IN THIS REPOSITORY ARE WHY. workflow_support.aws_commands requires
          # every CLI invocation to be a top-level command so that a reader can see each one
          # in the diff, which rules out capturing a version id through a command
          # substitution. And every script here is shlex-split by the IAM-capability test,
          # which reads a lone apostrophe in a comment as an unterminated quote. So: no
          # apostrophes below, and each upload starts its own line and redirects to a file.
          #
          # The two records go to the step summary AND to the log, through tee. The summary
          # alone was the first attempt and it stranded the values: it renders in the web UI
          # and no API returns it, so the caller who dispatched the run from a terminal --
          # which is the whole point of this step existing -- could not read what it
          # produced. The log is the copy a script can fetch.
          uv run python tools/build_admission_lambda.py \
            --output "${RUNNER_TEMP}/admission-validator.zip" \
            > "${RUNNER_TEMP}/admission-validator-build.json"

          uv run python tools/build_lifecycle_lambda.py \
            --output "${RUNNER_TEMP}/lifecycle-recorder.zip" \
            > "${RUNNER_TEMP}/lifecycle-recorder-build.json"

          # Both builds before either upload. A record naming a zip whose sibling build then
          # failed is the half-released state the tripwire cannot describe.
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key admission-validator/admission-validator.zip \
            --body "${RUNNER_TEMP}/admission-validator.zip" \
            --content-type application/zip \
            --query VersionId --output text \
            > "${RUNNER_TEMP}/admission-validator-version.txt"

          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key lifecycle-recorder/lifecycle-recorder.zip \
            --body "${RUNNER_TEMP}/lifecycle-recorder.zip" \
            --content-type application/zip \
            --query VersionId --output text \
            > "${RUNNER_TEMP}/lifecycle-recorder-version.txt"

          python - \
            "${RUNNER_TEMP}/admission-validator-build.json" \
            "${RUNNER_TEMP}/admission-validator-version.txt" \
            "${RUNNER_TEMP}/lifecycle-recorder-build.json" \
            "${RUNNER_TEMP}/lifecycle-recorder-version.txt" \
            | tee -a "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import sys
          from pathlib import Path

          records = [
              ("infra/admission-validator-release.yaml", sys.argv[1], sys.argv[2]),
              ("infra/lifecycle-recorder-release.yaml", sys.argv[3], sys.argv[4]),
          ]

          print("## Released. Paste each block into the file above it, and set the matching")
          print("## `S3ObjectVersion` in the template beside it. Nothing is deployed yet.")
          for destination, build_path, version_path in records:
              digest = json.loads(Path(build_path).read_text(encoding="utf-8"))["sha256"]
              version = Path(version_path).read_text(encoding="utf-8").strip()
              # An unversioned bucket answers a put with no VersionId, and the literal
              # "None" is what --output text prints for it. Recording that would pin the
              # template to an object that cannot be addressed by version.
              if not version or version == "None":
                  raise SystemExit(f"{destination}: the upload returned no VersionId")
              print(f"\n### {destination}\n")
              print("```yaml")
              print(f"s3_object_version: {version}")
              print(f"sha256: {digest}")
              print("```")
          PY

      - name: Validate CloudFormation templates
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infra/lineage-bucket.yaml
          aws cloudformation validate-template --template-body file://infra/artifacts-bucket.yaml
          aws cloudformation validate-template --template-body file://infra/admission-state-machine.yaml

      # No --capabilities on any of the three deploys, and that is a checked claim rather
      # than an omission. CloudFormation demands CAPABILITY_IAM or CAPABILITY_NAMED_IAM
      # only for templates containing AWS::IAM::AccessKey, Group, InstanceProfile,
      # ManagedPolicy, Policy, Role, User or UserToGroupAddition. None of these three
      # templates contains any of them: the two bucket stacks carry an S3 bucket and an
      # AWS::S3::BucketPolicy, which is a resource policy and not an IAM entity, and the
      # admission stack carries a log group, a function and a state machine.
      #
      # Passing an existing role to a new state machine or function is a different thing
      # from creating one. It needs iam:PassRole on the deployer -- granted, by ARN, in
      # infra/iam/infra-deployer-role.yaml -- and no stack capability at all.
      #
      # Leaving the acknowledgement off is worth more than it costs. The IAM stacks in
      # infra/iam/ are applied from a laptop and this role has no iam:CreateRole, so a
      # template that grew an IAM resource would fail either way; without the capability
      # it fails at InsufficientCapabilities, naming the reason, instead of at an
      # AccessDenied several minutes into a rollback.
      - name: Deploy Phase 2 lineage bucket stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase2-lineage \
            --template-file infra/lineage-bucket.yaml \
            --no-fail-on-empty-changeset

      - name: Deploy Phase 2 artifacts bucket stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase2-artifacts \
            --template-file infra/artifacts-bucket.yaml \
            --no-fail-on-empty-changeset

      # Last, and it has to be last. The function reads its code from a versioned object
      # in the artifacts bucket, and the state machine writes its records into the lineage
      # bucket, so both buckets have to exist first. Nothing links the stacks -- no
      # exports, no imports -- so CloudFormation will not enforce that ordering; this step
      # order is the only thing that does.
      - name: Deploy Phase 2 admission stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase2-admission \
            --template-file infra/admission-state-machine.yaml \
            --no-fail-on-empty-changeset

      - name: Verify Phase 2 admission control plane
        run: |
          set -euo pipefail
          state_machine_arn_file="${RUNNER_TEMP}/phase2-state-machine-arn.txt"
          state_machine_json="${RUNNER_TEMP}/phase2-state-machine.json"
          function_json="${RUNNER_TEMP}/phase2-validator-function.json"
          lineage_json="${RUNNER_TEMP}/phase2-lineage-object-lock.json"
          artifacts_json="${RUNNER_TEMP}/phase2-artifacts-versioning.json"

          aws cloudformation describe-stacks \
            --stack-name sbsandbox-intern-edullm-phase2-admission \
            --query "Stacks[0].Outputs[?OutputKey=='StateMachineArn'].OutputValue" \
            --output text > "${state_machine_arn_file}"

          read -r state_machine_arn < "${state_machine_arn_file}"

          aws stepfunctions describe-state-machine \
            --state-machine-arn "${state_machine_arn}" \
            --query '{name:name,status:status,type:type,loggingLevel:loggingConfiguration.level,includeExecutionData:loggingConfiguration.includeExecutionData}' \
            --output json > "${state_machine_json}"

          aws lambda get-function-configuration \
            --function-name sbsandbox-intern-edullm-admission-validator \
            --query '{functionName:FunctionName,runtime:Runtime,handler:Handler,packageType:PackageType}' \
            --output json > "${function_json}"

          aws s3api get-object-lock-configuration \
            --bucket sbsandbox-intern-edullm-lineage \
            --query '{objectLockEnabled:ObjectLockConfiguration.ObjectLockEnabled}' \
            --output json > "${lineage_json}"

          aws s3api get-bucket-versioning \
            --bucket sbsandbox-intern-edullm-artifacts \
            --query '{status:Status}' \
            --output json > "${artifacts_json}"

          python - "${state_machine_json}" "${function_json}" "${lineage_json}" "${artifacts_json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected_state_machine = {
              "name": "sbsandbox-intern-edullm-admission",
              "status": "ACTIVE",
              "type": "STANDARD",
              "loggingLevel": "ALL",
              "includeExecutionData": True,
          }
          expected_function = {
              "functionName": "sbsandbox-intern-edullm-admission-validator",
              "runtime": "python3.12",
              "handler": "edullm_platform.admission_handler.handler",
              "packageType": "Zip",
          }
          # The lock itself, not a retention rule. Turning the lock on is creation-only,
          # so it is what a deploy can silently get wrong and never fix; the rule is a
          # live setting this phase deliberately leaves unset, and asserting its absence
          # here would fail the deploy on the day somebody correctly adds it.
          expected_lineage_object_lock = {"objectLockEnabled": "Enabled"}
          expected_artifacts_versioning = {"status": "Enabled"}

          expectations = [
              ("state machine", expected_state_machine),
              ("validator function", expected_function),
              ("lineage bucket object lock", expected_lineage_object_lock),
              ("artifacts bucket versioning", expected_artifacts_versioning),
          ]
          arguments = sys.argv[1:]
          if len(arguments) != len(expectations):
              raise SystemExit("phase 2 verification was handed the wrong number of files")

          failures = []
          for (label, expected), argument in zip(expectations, arguments):
              observed = json.loads(Path(argument).read_text(encoding="utf-8"))
              if observed != expected:
                  failures.append(f"{label}: expected {expected}, observed {observed}")

          if failures:
              raise SystemExit("phase 2 admission verification failed:\n" + "\n".join(failures))

          print("PHASE2_ADMISSION_VERIFICATION_PASSED")
          PY
