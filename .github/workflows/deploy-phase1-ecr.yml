name: "Deploy: ECR registry"

# The deployer role trust policy pins job_workflow_ref to
# edu-llm/platform/.github/workflows/deploy-phase1-ecr.yml@refs/heads/main.
# Renaming or moving this file silently revokes every deployment. Do not rename it.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-phase1-ecr.yml
      - infra/ecr-repositories.yaml

permissions:
  contents: read

concurrency:
  group: cloudformation-sbsandbox-intern-edullm-phase1-ecr
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy, and verify Phase 1 ECR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # WHO MAY DEPLOY BY HAND, ENUMERATED RATHER THAN MATCHED. workflow_dispatch is
      # offered to anybody holding write, and write stopped meaning "an admin" when the
      # pilot opened. Without this, a researcher can reconcile a CloudFormation stack into
      # the sandbox account by pressing a button, through a role they cannot see and were
      # never shown.
      #
      # Only the dispatch path is guarded. A push to main has already been through a
      # code-owner review of both the template and the workflow that applies it, and
      # refusing there would strand an approved infrastructure change with no way to land.
      #
      # It fails rather than skipping. A job-level `if` that evaluates false reports the
      # job as skipped, which reads as success in the checks list and tells the person
      # nothing at all.
      #
      # First in the job, before the checkout, so a refused dispatch does no work. The list
      # is checked against config/organization.yaml by tests/test_deploy_authorization.py,
      # which also holds all three deploy workflows to carrying this same step -- three
      # copies kept honest by a test, the way the job queue name already is, rather than by
      # a composite action that would move the control out of the file it protects.
      - name: Refuse a hand-started deploy from somebody who may not make one
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "${ACTOR}" in
            philote-dev|BritishAmericqn) ;;
            *)
              echo "deploy_dispatch_not_authorized:${ACTOR}" >&2
              echo "Deploying infrastructure by hand is limited to the repository admins." >&2
              echo "Open a pull request against the template instead: a merge to main deploys it after a code-owner review." >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900

      - name: Validate CloudFormation template
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infra/ecr-repositories.yaml

      - name: Deploy Phase 1 ECR stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase1-ecr \
            --template-file infra/ecr-repositories.yaml \
            --no-fail-on-empty-changeset

      - name: Verify Phase 1 ECR repository
        run: |
          set -euo pipefail
          repository_json="${RUNNER_TEMP}/phase1-ecr-repository.json"
          lifecycle_json="${RUNNER_TEMP}/phase1-ecr-lifecycle.json"

          aws ecr describe-repositories \
            --repository-names sbsandbox-intern-edullm-olmo-core \
            --query 'repositories[0].{repositoryName:repositoryName,encryptionType:encryptionConfiguration.encryptionType,scanOnPush:imageScanningConfiguration.scanOnPush,imageTagMutability:imageTagMutability}' \
            --output json > "${repository_json}"

          aws ecr get-lifecycle-policy \
            --repository-name sbsandbox-intern-edullm-olmo-core \
            --query '{lifecyclePolicyText:lifecyclePolicyText}' \
            --output json > "${lifecycle_json}"

          python - "${repository_json}" "${lifecycle_json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          repository_path = Path(sys.argv[1])
          lifecycle_path = Path(sys.argv[2])

          expected_repository = {
              "repositoryName": "sbsandbox-intern-edullm-olmo-core",
              "encryptionType": "AES256",
              "scanOnPush": True,
              "imageTagMutability": "IMMUTABLE",
          }
          expected_policy = {
              "rules": [
                  {
                      "rulePriority": 1,
                      "description": "Expire untagged images older than 7 days",
                      "selection": {
                          "tagStatus": "untagged",
                          "countType": "sinceImagePushed",
                          "countUnit": "days",
                          "countNumber": 7,
                      },
                      "action": {"type": "expire"},
                  },
                  {
                      "rulePriority": 2,
                      "description": "Retain at most 50 tagged images",
                      "selection": {
                          "tagStatus": "tagged",
                          "tagPatternList": ["*"],
                          "countType": "imageCountMoreThan",
                          "countNumber": 50,
                      },
                      "action": {"type": "expire"},
                  },
              ]
          }

          actual_repository = json.loads(repository_path.read_text(encoding="utf-8"))
          lifecycle_response = json.loads(lifecycle_path.read_text(encoding="utf-8"))
          actual_policy = json.loads(lifecycle_response["lifecyclePolicyText"])

          if actual_repository != expected_repository:
              raise SystemExit("repository configuration verification failed")
          if actual_policy != expected_policy:
              raise SystemExit("lifecycle policy verification failed")

          print("PHASE1_ECR_VERIFICATION_PASSED")
          PY
