name: Look at a run, or stop it

# THE AUTHORISATION LIVES HERE AND NOT IN IAM, WHICH IS THE THING TO KNOW ABOUT THIS FILE.
#
# A trust policy cannot see who dispatched a workflow -- every dispatch of this file
# presents the same `sub` and the same `job_workflow_ref` whoever pressed the button. So
# "may this person stop this run" cannot be expressed as a grant however it is written: the
# submitter is readable off the job through aws:ResourceTag, and there is nothing to compare
# it against, because the identity in hand is this file rather than the person who ran it.
# The role can therefore stop any run this platform submitted. The check below is the whole
# control, and a change to it is the change to review.
#
# What bounds the damage is the role's shape rather than its scope: it can describe jobs,
# stop them, and read events out of the two log groups this platform's jobs write to, and
# it can do nothing else in the account. It cannot submit, cannot register a job
# definition, cannot read a bucket, cannot reach the state machine. The worst a bypass
# achieves is stopping runs -- disruptive, recoverable, and written into the lifecycle
# record like any other termination.
#
# The log read is the newest of those and the only one that discloses rather than acts. It
# is granted because naming a log stream to somebody who has no AWS credential is not an
# answer, and because reading the tail of a log by hand is what filed nine credential
# failures as distributed training bugs. What it costs is that a container's own output now
# reaches everybody who can see a workflow run here.
#
# The role's trust names this file specifically, so a job added to submit-run.yml cannot
# reach it and a job added here is reviewed alongside the check it would bypass.

on:
  workflow_dispatch:
    inputs:
      # LEAVING IT BLANK IS THE ORDINARY CASE, AND A DROPDOWN IS NOT AVAILABLE.
      #
      # The question people arrive with is about their own most recent run, and answering it
      # used to mean finding a UUID on a workflow run from hours ago and copying it by hand.
      # A dropdown of that person's jobs would be the obvious fix and GitHub does not offer
      # one: workflow_dispatch choice options are static text in this file, with no way to
      # generate them per dispatcher, which is why every other dropdown here is a hardcoded
      # list.
      #
      # So the field is optional instead. Blank, this lists the runs Batch still holds for
      # whoever dispatched it and reports on the newest, which is a dropdown's job done after
      # the fact and with each run's state beside it rather than only its id.
      run_id:
        description: "Leave blank for your own most recent run. Otherwise run_ followed by a UUID, as printed on the submission that started it."
        required: false
        default: ""
        type: string
      # LOOKING IS THE DEFAULT AND STOPPING IS THE OPT-IN, WHICH IS THE SAFE WAY ROUND.
      #
      # This file used to do one thing, and the question people actually arrive with is the
      # other one: what is my run doing. There was no answer to it that did not require an
      # AWS credential, so the answer was to ask somebody who had one -- and the only button
      # in reach was the one that stops the run.
      #
      # Unticked, nothing in the account changes: the job is found and described and that is
      # all. So a mis-dispatch costs a page of output rather than somebody's twelve hours.
      stop:
        description: "Tick to stop the run. Left unticked, this only reports what the run is doing and changes nothing."
        required: false
        default: false
        type: boolean
      reason:
        description: "Why you are stopping it. Required only when stopping — it is recorded on the termination, so the run's history says what happened rather than just that it ended."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One cancellation per run at a time. Two dispatches racing would have the second find a
  # job already terminating and report a failure that is really a success.
  #
  # A blank run id falls back to this workflow run's own id rather than to the empty string,
  # which would put every look-up dispatch in one group and make two people asking about
  # their own runs queue behind each other for no reason.
  group: cancel-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  cancel:
    name: Say what the run is doing, and stop it if asked
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Before AWS is touched at all, because a malformed id is a mistake to answer in the
      # workflow rather than a call to make with a credential in hand.
      - name: Check the run id looks like one
        env:
          RUN_ID: ${{ inputs.run_id }}
          STOP: ${{ inputs.stop }}
        run: |
          set -euo pipefail
          if [[ -z "${RUN_ID}" ]]; then
            # STOPPING NAMES ITS RUN. Looking is safe to guess at, because the cost of
            # reporting on the wrong run is a page of output. Terminating the wrong one
            # costs somebody their work, and "my newest" is exactly the guess most likely
            # to be wrong under a retry, where the run somebody wants to stop is the one
            # before the attempt that just started.
            if [[ "${STOP}" == "true" ]]; then
              echo "stopping_requires_a_run_id" >&2
              echo "Leaving the run id blank reports on your most recent run. Stopping one names it, so that a mis-dispatch cannot end a run you did not mean." >&2
              exit 1
            fi
            exit 0
          fi
          if [[ ! "${RUN_ID}" =~ ^run_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "run_id_not_well_formed" >&2
            echo "A run id reads run_ followed by a UUID, and is printed on the submission that started it. This is not one." >&2
            exit 1
          fi

      # SAY WHICH STACK IS MISSING, RATHER THAN LETTING THE CREDENTIAL STEP SAY NOTHING.
      #
      # This workflow assumes sbsandbox-intern-edullm-run-canceller, and that role is created
      # by infra/iam/run-canceller-role.yaml, which is applied from a laptop -- the deployer
      # role holds no iam:CreateRole, deliberately, so no stack under infra/iam/ can be
      # applied from CI. The stack is applied and AWS_RUN_CANCELLER_ROLE_ARN is set, so this
      # guard is quiet -- it stays because those are two separate acts and either can be
      # undone without the other noticing.
      #
      # Quiet matters because the alternative is silent. configure-aws-credentials with an
      # empty role-to-assume reports "Credentials could not be loaded, please check your
      # action inputs: Could not load credentials from any providers", which reads as a
      # broken secret or an expired federation and sends the reader to the OIDC
      # configuration. The cause would be one stack and one variable, and this says so.
      - name: Say if the canceller role was never deployed
        env:
          ROLE_ARN: ${{ vars.AWS_RUN_CANCELLER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "run_canceller_role_not_deployed" >&2
            echo "AWS_RUN_CANCELLER_ROLE_ARN is unset, so this workflow has no identity to assume." >&2
            echo "The role comes from infra/iam/run-canceller-role.yaml, which is applied from a laptop" >&2
            echo "because the deployer role holds no iam:CreateRole. See 'The Phase 4 stacks' in" >&2
            echo "infra/README.md for the stack and the variable it needs." >&2
            echo "Until then, ask an admin: they can read a run through the Deploy: Batch execution" >&2
            echo "estate workflow, which takes a run id and reports on it." >&2
            exit 1
          fi

      # The roster the authorisation check reads has to be the reviewed one on main, not a
      # copy pasted into this file, so the repository is checked out for it.
      - name: Check out the platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the platform tooling
        env:
          UV_VERSION: "0.11.32"
        run: |
          set -euo pipefail
          pipx install "uv==${UV_VERSION}"
          installed="$(uv --version)"
          if [[ "${installed}" != "uv ${UV_VERSION}" && "${installed}" != "uv ${UV_VERSION} "* ]]; then
            echo "unexpected_uv_version" >&2
            echo "Expected uv ${UV_VERSION} but PATH answers with: ${installed}" >&2
            exit 1
          fi
          uv sync --locked

      # EVERY QUEUE A RUN COULD BE ON, READ OUT OF THE FILE THAT DECIDES WHERE RUNS GO.
      #
      # This file used to loop over two queue names typed into it and the account has
      # eleven. A run on gpu-4xa10g or gpu-8xh100 was therefore reported as no job at all.
      # The person asking was told nothing exists under their run id, could not see the run
      # and could not stop it, and the container went on billing until its runtime ceiling.
      # That is the worst way this workflow can be wrong, because the wrong answer is a
      # confident one and reads exactly like a run that finished days ago.
      #
      # Read rather than listed, because the list moves. Nine GPU shapes were promoted in
      # one change and more are being provisioned, so any spelling of the queues inside this
      # file is a second roster that agrees with config/execution-targets.yaml until the next
      # promotion and then silently stops. Reading the configuration means a queue added
      # there is searched here with no edit to this file, which is the whole argument.
      #
      # Nothing in CloudFormation connects that file to this one. That is the same seam
      # tests/test_phase3_infrastructure.py compares three copies of the queue name across,
      # and tests/test_cancel_run_workflow.py adds the equivalent comparison for this one.
      # The queues this searches are the queues the configuration names, and no queue name
      # appears anywhere in this file for either side to drift from.
      #
      # An empty answer is refused rather than looped over zero times. A search across no
      # queues finds no job and reports the run as one Batch has stopped listing, which is
      # the same sentence a genuine absence produces and is the confusion this step exists
      # to end.
      - name: List every queue a run could be on
        run: |
          set -euo pipefail
          uv run --frozen python - > "${RUNNER_TEMP}/queues.txt" <<'PY'
          from pathlib import Path

          from edullm_platform.config import load_yaml
          from edullm_platform.contracts.execution import ExecutionTargetCatalog

          catalog = load_yaml(Path("config/execution-targets.yaml"), ExecutionTargetCatalog)
          # Deduplicated and sorted, because two profiles may share a queue and the order a
          # configuration file happens to declare its rows in is not a search order.
          for queue in sorted({target.job_queue for target in catalog.targets}):
              print(queue)
          PY
          if [[ ! -s "${RUNNER_TEMP}/queues.txt" ]]; then
            echo "no_execution_targets_configured" >&2
            echo "config/execution-targets.yaml names no job queue, so there is nowhere to look for this run. That is a broken checkout rather than a missing run." >&2
            exit 1
          fi
          echo "Searching $(wc -l < "${RUNNER_TEMP}/queues.txt") queue(s)."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_RUN_CANCELLER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The run id is the Batch job *name*, which is the join this platform maintains
      # deliberately: the S3 key, the Step Functions execution name and the job name are one
      # identifier. Searching by name is why the role needs ListJobs.
      # WHOSE RUNS THESE ARE, ANSWERED FROM THE JOB RATHER THAN FROM THE LINEAGE STORE.
      #
      # Every job carries an edullm:submitter tag naming the login that dispatched the
      # submission, which is the same fact the authorisation step below reads. Listing on it
      # costs no new permission: ListJobs and DescribeJobs are already what this role holds.
      #
      # Tags do not come back on a list, only on a describe, so the jobs are listed first and
      # described in batches of a hundred, which is the most DescribeJobs accepts. Runs
      # submitted before the tag existed carry no submitter and are left out rather than
      # shown as unowned: this list is offered as "your runs", and one that quietly included
      # somebody else's would be worse than one that missed an old job of your own.
      - name: Work out which run, if you did not name one
        id: resolve
        env:
          RUN_ID: ${{ inputs.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [[ -n "${RUN_ID}" ]]; then
            echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          listed="${RUNNER_TEMP}/mine.txt"
          : > "${listed}"
          unsearched="${RUNNER_TEMP}/unsearched-listing.txt"
          : > "${unsearched}"
          # Word splitting on the enumeration rather than mapfile, which needs bash 4.2 and
          # is absent from the bash macOS ships -- a workflow body is executed by the test
          # suite as well as by the runner, and one that only works on the runner is one the
          # suite cannot hold to anything. A queue name carries no whitespace, so splitting
          # on it is exact rather than merely convenient.
          #
          # A REFUSED CALL IS RECORDED AND DOES NOT END THE SEARCH, AND THIS IS NOT ABOUT A
          # QUEUE THAT DOES NOT EXIST. A queue this configuration names and the account has
          # not been given yet answers with an empty list and exits zero -- measured against
          # all five undeployed shapes and against a name that is not a queue at all -- so
          # there is nothing to guard on that side and nothing here pretends otherwise.
          #
          # What has to be guarded is a call Batch refuses. Sixteen queues by seven states is
          # a hundred and twelve sequential calls, six and a half minutes of them, and a blank
          # dispatch runs that search twice; ListJobs is throttled per account, so a refusal
          # is an ordinary Tuesday rather than a fault. Under set -e one refusal ends the loop
          # over every queue left, and the enumeration is sorted, so a throttle on gpu-1xh100
          # -- third of sixteen -- would skip nine of the eleven queues that exist. That is
          # the two-queue bug again by a different route.
          #
          # Recorded rather than swallowed. A bare `|| true` would keep the search alive and
          # then answer "no runs" to somebody whose run was on a queue nobody looked at, which
          # is the confident wrong answer this enumeration exists to stop producing. The count
          # is carried into the report below so an incomplete search reads as incomplete.
          for queue in $(cat "${RUNNER_TEMP}/queues.txt"); do
            for state in RUNNING STARTING RUNNABLE SUBMITTED PENDING SUCCEEDED FAILED; do
              aws batch list-jobs --job-queue "${queue}" --job-status "${state}" \
                --query 'jobSummaryList[].jobId' --output text >> "${listed}" \
                || echo "${queue} ${state}" >> "${unsearched}"
            done
          done

          uv run --frozen python - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          import subprocess

          actor = os.environ["ACTOR"]
          raw = open(os.environ["RUNNER_TEMP"] + "/mine.txt").read().split()
          ids = list(dict.fromkeys(job for job in raw if job and job != "None"))
          unsearched = [
              line
              for line in open(
                  os.environ["RUNNER_TEMP"] + "/unsearched-listing.txt"
              ).read().splitlines()
              if line
          ]

          # THE ROWS THIS DROPS ARE COUNTED, BECAUSE A LIST OFFERED AS "YOUR RUNS" HAS TO BE
          # ABLE TO SAY IT IS NOT ALL OF THEM. Leaving an untagged job out is the right
          # call -- see the step comment -- but it is a job Batch listed and this did not
          # show, which is indistinguishable from a job nobody looked for unless the
          # difference is written down.
          unattributed = 0
          mine = []
          for start in range(0, len(ids), 100):
              batch = ids[start : start + 100]
              described = subprocess.run(
                  ["aws", "batch", "describe-jobs", "--jobs", *batch, "--output", "json"],
                  capture_output=True,
                  check=True,
                  text=True,
              )
              for job in json.loads(described.stdout)["jobs"]:
                  submitter = (job.get("tags") or {}).get("edullm:submitter")
                  if submitter == actor:
                      mine.append(job)
                  elif submitter is None:
                      unattributed += 1

          mine.sort(key=lambda job: job.get("createdAt", 0), reverse=True)

          #: How many rows the table carries. A summary nobody scrolls is its own kind of
          #: wrong answer, so the cap stays and what it hides is declared under the table.
          SHOWN = 20

          # BEFORE THE ANSWER, BECAUSE IT CHANGES WHAT THE ANSWER MEANS. A list of runs that
          # is missing the queues Batch refused to search is not a list of your runs, and the
          # sentence below it would otherwise read as a complete one.
          if unsearched:
              print(
                  f"> **The search was incomplete.** {len(unsearched)} of the queue searches "
                  "were refused, most likely throttled, so any run of yours on those queues "
                  "is missing from what follows. Dispatching again re-runs the search."
              )
              print()

          # THE SAME SENTENCE THE SEARCH-REFUSED CASE GETS, FOR THE OTHER WAY A ROW GOES
          # MISSING. "No runs found" spoken over jobs that were listed and could not be
          # attributed is the confident wrong answer twice over, because this is the branch
          # a person reaches when they already suspect something is wrong.
          if unattributed:
              print(
                  f"> **{unattributed} listed job(s) carry no submitter tag** and are left "
                  "out of what follows rather than shown as yours. A run admitted before "
                  "that tag existed is one of them. Naming its run id searches for that one "
                  "job regardless of whose it is."
              )
              print()

          if not mine:
              print(f"## No runs found for `{actor}`")
              print()
              print(
                  "Batch stops listing a job some days after it ends, so this is either no "
                  "runs yet or none recent enough to still be listed. Naming a run id "
                  "explicitly searches for that one job instead."
              )
              raise SystemExit(0)

          print(f"## Runs submitted by `{actor}`")
          print()
          print("| Run | Status | Queue |")
          print("| --- | --- | --- |")
          for job in mine[:SHOWN]:
              queue = job.get("jobQueue", "").rsplit("/", 1)[-1]
              print(f"| `{job['jobName']}` | {job.get('status')} | {queue} |")
          print()
          # UNDER THE TABLE RATHER THAN OVER IT, AND ONLY WHEN IT IS TRUE. The rows above
          # are the newest by creation, and a run still going after several hours sorts
          # below everything submitted since -- including the ones that have already
          # finished, which this searches for too. So the row a person dispatching a blank
          # listing is most often looking for is the row the cap drops first, and it was
          # dropped in silence: `run_019fd602-4e05` was RUNNING, three hours and twenty
          # minutes in, and absent from a table the named search answered immediately.
          if len(mine) > SHOWN:
              print(
                  f"> **This is the {SHOWN} newest of {len(mine)} and not all of them.** "
                  f"{len(mine) - SHOWN} more are yours and are not above, newest first, so "
                  "a run that has been going for hours sits below anything submitted since. "
                  "Naming its run id searches every queue and every state for that one job."
              )
              print()
          print("Reporting on the newest below. To act on another, dispatch again naming it.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"run_id={mine[0]['jobName']}\n")
          PY

      - name: Find the job, and read whose it is
        id: find
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${RUN_ID}" ]]; then
            echo "not_running=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          found=""
          unsearched="${RUNNER_TEMP}/unsearched-search.txt"
          : > "${unsearched}"
          # SUCCEEDED and FAILED are searched too, and they were not before. A job that has
          # ended cannot be stopped, so for the cancel path they are the same as not finding
          # it -- but they are most of what somebody looking at a run wants to see, and a
          # workflow that answers "nothing to report" about a run that failed an hour ago is
          # worse than no answer at all. The live states stay first so that a run id reused
          # across a retry finds the attempt that is still going.
          #
          # The guard is the one the loop above carries and it is here for the same reason: a
          # queue the account does not have answers empty and exits zero, while a throttled
          # call exits non-zero and, unguarded, ends the search over every queue after it.
          # Which of the two happened decides whether the sentence below is true, so the
          # refusals are counted rather than dropped.
          for queue in $(cat "${RUNNER_TEMP}/queues.txt"); do
            for state in SUBMITTED PENDING RUNNABLE STARTING RUNNING SUCCEEDED FAILED; do
              candidate="$(aws batch list-jobs \
                --job-queue "${queue}" \
                --job-status "${state}" \
                --query "jobSummaryList[?jobName=='${RUN_ID}'].jobId" \
                --output text)" || {
                echo "${queue} ${state}" >> "${unsearched}"
                candidate=""
              }
              if [[ -n "${candidate}" && "${candidate}" != "None" ]]; then
                found="${candidate}"
                break 2
              fi
            done
          done

          if [[ -z "${found}" ]]; then
            # Not an error worth a red run. A run that already finished cannot be stopped,
            # and telling somebody their cancellation failed when what happened is that
            # their job ended is the kind of message that sends people looking for a fault.
            #
            # BOTH ANSWERS GO UNDER THE RUN ID AS A HEADING, AND THEY DID NOT, WHICH MEANT
            # NEITHER REACHED A TERMINAL. `edullm status` reads sections of this job's log
            # back by heading, and these two sentences were the only thing this workflow
            # prints that carried none -- so an admitted run whose job Batch cannot find
            # spent a runner, waited 73 seconds on 2026-08-06, and handed back "the workflow
            # finished success and its report named no section this verb reads". The heading
            # is the run id because that is the one `status` already looks for, and it is
            # written here rather than left to the describe step because that step is
            # skipped on exactly this path.
            echo "not_running=true" >> "${GITHUB_OUTPUT}"
            refused="$(wc -l < "${unsearched}" | tr -d ' ')"
            if [[ "${refused}" != "0" ]]; then
              # NOT THE SAME ANSWER, AND SAYING SO IS THE WHOLE POINT OF COUNTING. "No job
              # exists" and "part of the search was refused" are different facts, and the
              # first spoken in place of the second is the defect this enumeration was built
              # to fix, reappearing as a throttle rather than as a missing queue.
              echo "queue_search_incomplete" >&2
              {
                echo "## ${RUN_ID}"
                echo
                echo "No job was found under this run id, and ${refused} of the queue searches were refused -- so this does not say the run does not exist, it says nobody managed to look everywhere. Batch throttles a long enumeration, and a refused call is a queue that went unread. Dispatch again before concluding the run is gone."
              } | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            {
              echo "## ${RUN_ID}"
              echo
              echo "No job is queued, running or recently finished under this run id. Batch stops listing a job some days after it ends, so an older run is not missing -- it is out of the window this can search."
              echo
              echo "The submission that minted this id was admitted, so a job was placed. What this cannot tell you is whether it ran and aged out of the listing or never started, and neither of those is a run you can still read from here."
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "job_id=${found}" >> "${GITHUB_OUTPUT}"
          submitter="$(aws batch describe-jobs --jobs "${found}" \
            --query 'jobs[0].tags."edullm:submitter"' --output text)"
          echo "submitter=${submitter}" >> "${GITHUB_OUTPUT}"

      # WHAT THE RUN IS DOING, WHICH IS THE QUESTION THIS FILE NOW ANSWERS FIRST.
      #
      # Printed on every dispatch, including one that goes on to stop the run: somebody about
      # to cancel twelve hours of work should see what they are cancelling in the same output.
      #
      # Written to a file and read by python rather than formatted with --query, because the
      # useful fields are spread across the job, its container and its attempts, and a JMESPath
      # expression long enough to reach all of them is one nobody can check. statusReason and
      # the container's reason are the two that carry why a job is not running -- Batch puts
      # the placement story in the first and the exit story in the second, and a report showing
      # only status says RUNNABLE for both "waiting for capacity" and "asking for more vCPU
      # than the instance has".
      #
      # THE EXIT CODE IS PRINTED AS A NUMBER AND NEVER AS A STAGE. Six of the sixty-seven
      # failures in the retained window carry codes researchers invented in the same numeric
      # range this platform's staged scheme uses, and only two carry a staged one, so reading
      # a 76 or an 85 as a platform stage would misdescribe three runs for every one it
      # described. Thirty-eight of those failures carry exit code 1, which says only that a
      # program raised, and the log tail below is the only thing that says which.
      - name: Say what the run is doing
        id: describe
        if: steps.find.outputs.not_running != 'true'
        env:
          JOB_ID: ${{ steps.find.outputs.job_id }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          described="${RUNNER_TEMP}/job.json"
          aws batch describe-jobs --jobs "${JOB_ID}" --output json > "${described}"
          uv run --frozen python - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from pathlib import Path

          from edullm_platform.config import load_yaml
          from edullm_platform.contracts.execution import ExecutionTargetCatalog

          job = json.load(open(os.environ["RUNNER_TEMP"] + "/job.json"))["jobs"][0]
          container = job.get("container", {})
          attempts = job.get("attempts", [])

          def when(key):
              milliseconds = job.get(key)
              if not milliseconds:
                  return "not yet"
              from datetime import datetime, timezone

              return datetime.fromtimestamp(milliseconds / 1000, timezone.utc).isoformat()

          # WHICH LOG GROUP, RESOLVED FROM THE QUEUE THROUGH THE SAME FILE THE SEARCH ABOVE
          # ENUMERATES. The nine GPU shapes share one group with the original GPU queue and
          # the CPU queue has its own, so the group is a property of the queue rather than
          # something derivable from the run id or the stream name. Reading it here means the
          # step below asks CloudWatch for a group this repository declares rather than one
          # this workflow guessed, and a queue promoted with a group of its own is picked up
          # with no edit here.
          queue = job.get("jobQueue", "").rsplit("/", 1)[-1]
          catalog = load_yaml(Path("config/execution-targets.yaml"), ExecutionTargetCatalog)
          log_group = next(
              (target.log_group for target in catalog.targets if target.job_queue == queue),
              None,
          )
          log_stream = container.get("logStreamName") or None

          print("## " + os.environ["RUN_ID"])
          print()
          print("| | |")
          print("| --- | --- |")
          print(f"| Status | `{job.get('status')}` |")
          print(f"| Why | {job.get('statusReason') or 'nothing reported'} |")
          print(f"| Queued | {when('createdAt')} |")
          print(f"| Started | {when('startedAt')} |")
          print(f"| Stopped | {when('stoppedAt')} |")
          print(f"| Attempts | {len(attempts)} of {job.get('retryStrategy', {}).get('attempts', 1)} |")
          print(f"| Exit code | {container.get('exitCode', 'none yet')} |")
          # NOT "Container said", WHICH IS WHAT THIS ROW CLAIMED AND IS NOT WHAT THE FIELD IS.
          # `container.reason` is Batch's own short note about why a container is in the state
          # it is in -- OutOfMemoryError, CannotPullContainerError, "Essential container in
          # task exited" -- and it is not one byte of what the program printed. A job that ran
          # to SUCCEEDED normally carries none, so the row read `| Container said | nothing |`
          # about runs with nine lines waiting in CloudWatch. Two were read that way on
          # 2026-08-06, and "my job produced no output" is the wrong conclusion about a job
          # that worked. `nothing reported` rather than `nothing` for the same reason, and it
          # is the wording the `Why` row above already uses for the same absence.
          print(f"| Why the container stopped | {container.get('reason') or 'nothing reported'} |")
          print(f"| Image | `{container.get('image', 'unknown')}` |")
          print(f"| Queue | `{queue or 'unknown'}` |")
          print(f"| Log group | `{log_group or 'not named by config/execution-targets.yaml'}` |")
          print(f"| Log stream | `{log_stream or 'not yet assigned'}` |")
          print()
          # AN EXIT CODE IS A NUMBER THIS PLATFORM DID NOT CHOOSE, AND SAYING SO IS THE POINT.
          # Two of the sixty-seven failures in the retained window carry a staged code and six
          # carry researcher-invented ones in the same range, so any sentence here that read a
          # number as a stage would be wrong three times as often as it was right.
          print(
              "The exit code above is whatever the container returned, and it is not a stage "
              "of this platform. Researchers have used codes in the same range for their own "
              "meanings, so read it against the program that ran."
          )
          print()
          # WHERE THE OUTPUT IS, SAID HERE BECAUSE THIS IS THE WHOLE OF WHAT `edullm status`
          # PRINTS. Nothing in the table above is the program's own output, and the row that
          # claimed to be was the reason two people concluded a working run had printed
          # nothing. On this page the tail is the section below; through the CLI it is a
          # different verb, and the reader has no way to know that from a table.
          print(
              f"Nothing above is the program's own output. `edullm logs "
              f"{os.environ['RUN_ID']}` prints the last lines it printed."
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"log_group={log_group or ''}\n")
              handle.write(f"log_stream={log_stream or ''}\n")
          PY

      # THE LOG ITSELF, WHICH IS THE THING THE PERSON DISPATCHING THIS ACTUALLY CAME FOR.
      #
      # Naming the stream and stopping was this workflow's whole answer, and the name is
      # useless to the reader it is printed for: reaching a stream needs an AWS credential,
      # and not having one is why they are here. So a run that failed sent somebody to ask an
      # operator, and the operator read the tail of the log -- which is exactly the reading
      # that filed nine W&B login failures as distributed training bugs, because the last
      # lines of a torch run say `ProcessGroup is not registered` and the cause is twenty
      # lines earlier.
      #
      # Fifty lines rather than the whole stream, and that number is a judgement worth
      # stating. A GPU training log is hundreds of megabytes and a step summary is capped, so
      # the whole thing cannot go here whatever anybody prefers. Fifty is enough to carry a
      # Python traceback with its cause, which is the shape most of these failures have, and
      # it is deliberately not enough to bury the reader -- somebody who needs more now knows
      # the group and the stream and can be given credentials for one read.
      #
      # WHAT THIS CHANGES ABOUT WHO CAN READ A RUN'S OUTPUT, STATED RATHER THAN LEFT TO BE
      # DISCOVERED. A step summary is visible to everybody who can see this repository's
      # workflow runs, so a container's own output now reaches them, where before it needed
      # an AWS credential. That is the intended effect and it is also the cost: a program that
      # prints something it should not is now printing it somewhere wider. The grant behind it
      # is a read of two log groups and nothing else, and infra/iam/run-canceller-role.yaml
      # carries the argument beside the statement.
      #
      # Not gated on `stop`, for the reason the report above is not: the question people
      # arrive with is what their run did, and answering it must not require ending the run.
      - name: Show the last fifty lines the container printed
        if: steps.find.outputs.not_running != 'true'
        env:
          LOG_GROUP: ${{ steps.describe.outputs.log_group }}
          LOG_STREAM: ${{ steps.describe.outputs.log_stream }}
        run: |
          set -euo pipefail
          # A queued job has no stream yet and a queue outside the configuration resolves to
          # no group. Both are ordinary and neither is an error. There is nothing to read in
          # either case, and saying which of the two it is beats a refusal nobody can act on.
          if [[ -z "${LOG_STREAM}" ]]; then
            echo "The container has not started, so there is no log stream to read yet." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ -z "${LOG_GROUP}" ]]; then
            echo "This job is on a queue config/execution-targets.yaml does not name, so which log group holds its stream cannot be resolved from this checkout." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # --no-start-from-head is what makes this the tail. GetLogEvents returns the newest
          # events when it is false, which is its default, and the events come back oldest
          # first inside that window either way -- so the block below reads in the order the
          # container printed and holds the last fifty lines rather than the first fifty.
          events="${RUNNER_TEMP}/log-tail.json"
          read_status=0
          aws logs get-log-events \
            --log-group-name "${LOG_GROUP}" \
            --log-stream-name "${LOG_STREAM}" \
            --limit 50 \
            --no-start-from-head \
            --output json > "${events}" 2> "${RUNNER_TEMP}/log-tail-error.txt" || read_status=$?
          if [[ "${read_status}" -ne 0 ]]; then
            # Never a failed dispatch. The report above is already written and is worth
            # having, and a run whose log cannot be read is not a run nobody should be told
            # about. The error text is withheld because a CLI diagnostic names the resource,
            # and a log stream ARN carries the account id into a page anybody may read.
            echo "log_tail_unreadable" >&2
            echo "The log stream was named and could not be read. The likeliest cause is that the logs:GetLogEvents grant on the canceller role is not applied in this account. See Stack 4 in infra/README.md." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          uv run --frozen python - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os

          events = json.load(open(os.environ["RUNNER_TEMP"] + "/log-tail.json")).get("events", [])
          print("### The last lines this run printed")
          print()
          if not events:
              print(
                  "The stream exists and holds no events. A container that was killed before "
                  "it wrote anything looks like this, and so does one whose output went "
                  "somewhere other than stdout."
              )
          else:
              print(f"{len(events)} line(s), oldest first. This is the end of the stream.")
              print()
              print("```")
              for event in events:
                  print(str(event.get("message", "")).rstrip("\n"))
              print("```")
              print()
              print(
                  "Read upward from the end rather than only at it. A failure whose last "
                  "lines are a torch distributed error is usually a credential or a "
                  "configuration refused much earlier, and the line that says so is above."
              )
          PY

      # THE CHECK. Two ways to be allowed and no third: it is your run, or you are an
      # organization admin. Read out of config/organization.yaml rather than from a list
      # here, so the answer is the same one every other part of this platform gives.
      - name: Refuse a cancellation the actor is not entitled to make
        if: inputs.stop && steps.find.outputs.not_running != 'true'
        env:
          ACTOR: ${{ github.actor }}
          SUBMITTER: ${{ steps.find.outputs.submitter }}
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import os
          import sys
          from pathlib import Path

          from edullm_platform.config import load_yaml
          from edullm_platform.contracts.inventory import OrganizationInventory

          actor = os.environ["ACTOR"]
          submitter = os.environ["SUBMITTER"]
          inventory = load_yaml(Path("config/organization.yaml"), OrganizationInventory)
          admins = set(inventory.admins)

          # An absent tag arrives from the AWS CLI as the string "None", and a run admitted
          # before the submitter tag existed has one. It must not match anybody: comparing
          # an actor against "None" is how a missing record turns into an authorisation.
          if submitter in ("", "None"):
              owns = False
          else:
              owns = actor == submitter

          if owns or actor in admins:
              why = "it is their run" if owns else "they are an organization admin"
              print(f"{actor} may stop this run: {why}.")
              sys.exit(0)

          print(f"cancel_not_authorized:{actor}", file=sys.stderr)
          print(
              "This run was submitted by somebody else and you are not an admin, so it was "
              "not stopped. Ask the person who submitted it, or an admin.",
              file=sys.stderr,
          )
          sys.exit(1)
          PY

      - name: Stop it
        if: inputs.stop && steps.find.outputs.not_running != 'true'
        env:
          JOB_ID: ${{ steps.find.outputs.job_id }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The reason is optional on the form because looking at a run needs none, and it is
          # required here because a termination with no recorded reason is the thing
          # lifecycle_projection cannot tell from a failure. Checked before the call rather
          # than passed empty.
          if [[ -z "${REASON// /}" ]]; then
            echo "cancel_reason_missing" >&2
            echo "Stopping a run needs a reason: it is recorded on the termination, and without one the run's history cannot say it was cancelled rather than that it broke." >&2
            exit 1
          fi
          # The reason reaches the lifecycle record, which is what lets
          # lifecycle_projection tell an operator's cancellation from a failure. Naming who
          # asked is the half that a bare reason leaves out.
          aws batch terminate-job --job-id "${JOB_ID}" \
            --reason "Cancelled by ${ACTOR}: ${REASON}"
          {
            echo "## Run stopped"
            echo
            echo "\`${RUN_ID}\` was terminated at ${ACTOR}'s request."
            echo
            echo "The termination is recorded like any other, so the run's history says it was"
            echo "cancelled rather than that it failed. Anything it had already written to its"
            echo "output prefix is still there, including checkpoints."
          } >> "${GITHUB_STEP_SUMMARY}"
