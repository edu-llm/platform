# WHETHER RESEARCHERS CAN SUBMIT, ASKED ON A CLOCK RATHER THAN WHEN SOMEBODY WONDERS.
#
# On 2026-08-06 submit-run.yml failed seven times between 05:33 and 06:50 UTC. Six were one
# defect in edullm submit and one was the platform correctly refusing a commit with no
# image. Nothing noticed. It was found by an agent working the merge queue that happened to
# look at a run list, and filed as outside its remit because it blocked no merge.
#
# The three places that could have caught it are all blind for the same structural reason:
# every alarm is on AWS/Lambda or AWS/SQS, the notifier consumes Batch job state changes,
# and the audit reads the account. All three watch AWS. These submissions died in the
# compile job, on a GitHub runner, before admission was ever called, so AWS emitted nothing
# about any of them. That is why this reads the Actions API and holds no credential.
#
# It goes red on three things and deliberately not on two. It goes red on a failure that is
# never a judgement, on one reason refusing several unrelated submissions, and on a run that
# reached the approval gate and ended with nobody having answered it. It stays green on a
# submission refused for a good reason, because an unregistered dataset or a commit nobody
# built is the platform working; and green on a run a lead declined, because a lead refusing
# an expensive run is the gate working and its first look reported two of those as outages.
# tools/watch_submission_health.py argues the distinctions and the tests hold them.
name: Is submission healthy

on:
  # THE EVENT FIRST, BECAUSE THE CLOCK IS NOT A DELIVERY GUARANTEE. This shipped on */30 and
  # its entire history was one run, at 09:34; the 10:00, 10:30 and 11:00 ticks never fired,
  # across a window in which five submissions ended badly. GitHub documents that scheduled
  # workflows may be delayed or dropped when the runner fleet is loaded, and a watcher whose
  # only trigger can be silently dropped is a watcher nobody has. This fires when a
  # submission finishes, which is both the only moment the answer can have changed and a
  # delivery GitHub does make.
  workflow_run:
    workflows: ["Submit a run"]
    types: [completed]
  schedule:
    # Kept as a floor rather than replaced by the event. workflow_run only fires when a
    # submission completes, so it cannot see an hour in which nobody managed to dispatch one
    # at all -- which is what a broken dispatch path looks like from here, and is exactly the
    # outage worth catching. Every half hour: the window this was written for was seventy-
    # seven minutes long, so the floor alone still sees a repeat of it while it is happening.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "ISO instant to look from, e.g. 2026-08-06T05:00:00Z"
        required: false
      until:
        description: "ISO instant to look to, defaulting to now"
        required: false

# No AWS role is assumed anywhere in this file and no id-token is requested, because there
# is nothing in AWS to ask. actions:read reads the runs, their jobs and the approvals that
# separate a decline from a failure; checks:read reads the annotations on a failed gate job,
# which is the Checks API and not the Actions one and is therefore its own grant, and is what
# names a branch policy so it is not mistaken for a run nobody reviewed; issues:write is how
# it reaches a person. Listing any permission sets every unlisted one to none, so a grant
# left off here is a 403 rather than a default.
permissions:
  contents: read
  actions: read
  checks: read
  issues: write

concurrency:
  group: watch-submission-health
  cancel-in-progress: false

jobs:
  submissions:
    name: Can a researcher submit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Two hours rather than a day. Long enough for three failures to accumulate into the
      # repetition that separates a defect from a refusal, and short enough that the check
      # goes green on its own once a fix lands instead of staying red until a window rolls.
      - name: Read what submissions did
        id: read
        run: |
          set -uo pipefail
          if [[ -n "${WATCH_SINCE}" ]]; then
            set -- --since "${WATCH_SINCE}"
          else
            set -- --hours 2
          fi
          if [[ -n "${WATCH_UNTIL}" ]]; then
            set -- "$@" --until "${WATCH_UNTIL}"
          fi
          # The verdict is the exit code and the prose is for a person, so the code is
          # captured rather than allowed to end the step, and the prose is kept whatever it
          # says. Exit 2 is not exit 1: it means the check could not look, which must not be
          # reported as submissions being healthy nor as them being broken.
          status=0
          uv run --frozen python tools/watch_submission_health.py "$@" > verdict.txt 2>&1 || status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          cat verdict.txt
          {
            echo "## Can a researcher submit"
            echo
            echo '```'
            cat verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_SINCE: ${{ inputs.since }}
          WATCH_UNTIL: ${{ inputs.until }}

      # A red run in a list nobody opens is exactly how the seven were missed, so the
      # verdict is carried to somewhere with a notification attached. One open issue at a
      # time: an outage lasting an hour would otherwise file two every hour, and a hundred
      # duplicates is the same as none.
      #
      # NEITHER LOOKUP GOES THROUGH SEARCH, AND THAT IS THE WHOLE OF WHAT WENT WRONG HERE.
      # The first version filed the issue correctly, printed its URL, threw the URL away, and
      # asked `gh issue list --search` for the number back half a second later. `--search` is
      # the search index rather than the issues themselves, GitHub populates it
      # asynchronously, and a half-second-old issue is not in it: the substitution came back
      # empty, `gh issue comment ""` refused it, and a watcher that had just done its job
      # reported itself broken. Retrying the search would have been a patch on the symptom.
      # The number is on stdout and never needed looking up at all.
      #
      # The dedupe above it was reading that same index, so the failure had a silent twin
      # nobody had hit yet. This workflow fires on every submission, two submissions can
      # finish a minute apart, and both runs would have seen an empty index and both filed --
      # which is the duplicate storm the dedupe exists to prevent. `--json` without
      # `--search` lists the issues, which answers about a second-old one.
      - name: Tell somebody
        if: steps.read.outputs.status != '0'
        run: |
          set -euo pipefail
          # An exact title match, where `${TITLE} in:title` was a full-text one that would
          # equally have matched somebody's issue quoting this one's title back.
          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "issue #${existing} already says this; not filing another"
            exit 0
          fi
          # The body goes to a file rather than down a pipe, because the reference now has to
          # be captured and `$(gh ... <<'BODY_END' ... BODY_END )` is a heredoc inside a
          # command substitution, which bash 3.2 does not parse.
          cat > issue-body.md <<'BODY_END'
          A scheduled check read the recent submit-run.yml runs and something in them is not
          a submitter's fault. The verdict is in the job summary of the run that filed this.

          This is closed by fixing what it names, or by the next scheduled run going green on
          its own once a fix has landed. Re-running the failed submissions does not close it.
          BODY_END
          filed="$(gh issue create --title "${TITLE}" --body-file issue-body.md)"
          echo "filed ${filed}"
          # An empty reference here would reach `gh issue comment` as the empty string and
          # produce `invalid issue format: ""`, which is a sentence about argument parsing
          # rather than about what happened. The issue is filed by this point either way.
          if [[ -z "${filed}" ]]; then
            echo "::error::the issue was filed but printed no reference to comment the verdict on"
            exit 1
          fi
          gh issue comment "${filed}" --body-file verdict.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Submissions are failing for a reason no submitter can fix

      - name: Report the verdict as this job's own outcome
        if: steps.read.outputs.status != '0'
        run: |
          echo "::error::watch_submission_health exited ${{ steps.read.outputs.status }}."
          exit 1
