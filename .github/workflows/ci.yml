name: Checks (CI)

# Everything here can fail a build, and everything here answers a question about the
# change under review. What used to sit below the test job and could not fail a build —
# the two acceptance gates — now lives in nightly.yml, where it is load-bearing. See the
# argument at the top of that file before moving either of them back.
#
# pull_request (not pull_request_target) is deliberate: fork pull requests run with a
# read-only token and no access to secrets. Do not change this without understanding
# that pull_request_target grants write access and secrets to code from forks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared floor in pyproject.toml; 3.13 is what maintainers run.
        python-version: ["3.12", "3.13"]
    steps:
      # Two commits rather than the shallow default, for the last step in this job. On a
      # pull request actions/checkout leaves the merge commit at HEAD, so depth 2 brings
      # its two parents with it and HEAD^1 is the base branch -- which makes the diff
      # against it the change under review and nothing else. Two commits, not the whole
      # history: this runs twice per pull request and the cost is the point of not
      # reaching for fetch-depth: 0.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy

      # loadgroup, not the default per-test distribution, and not loadfile either. A
      # worker is a process and a session fixture is built once per process, so where a
      # test runs decides what the run costs. tests/conftest.py puts each module in its
      # own group, which is what loadfile would do anyway; it also puts the two proof
      # generators in one group, which loadfile cannot, and they need it because they
      # share a single nested full-suite verification that they each pay for separately
      # once they are on separate workers. Measured over two interleaved pairs: loadfile
      # 49.9s and 50.3s, loadgroup 47.0s and 47.4s, for 33s of CPU rather than 46s.
      #
      # The flags live here and not in pyproject.toml so that a local `uv run pytest -q`
      # stays serial, ordered, and readable when something fails.
      - name: Tests
        run: uv run --frozen pytest -q -n4 --dist loadgroup

      - name: Schemas reproduce from the models
        run: |
          uv run --frozen python tools/export_schemas.py
          git diff --exit-code schemas

      # THE HALF OF release-tag.yml THAT HAS TO HAPPEN BEFORE A MERGE, NOT AFTER IT.
      #
      # That workflow tags whatever `project.version` declares and cannot bump it, because
      # the bump is a commit and only a pull request may put a commit on main -- it spent
      # seven merges failing to push one past branch protection. So the version a change
      # will be released as has to be declared by the pull request making the change, and
      # this is what makes that true without depending on anybody remembering it.
      #
      # The file the workflow's header rejected this idea in was arguing against a check
      # that "is forgotten in exactly the hotfix where the config change is most urgent".
      # It was arguing against discipline. This is a required check inside a required job,
      # so it is not forgotten; it is passed, or it is deliberately bypassed by an
      # administrator -- and release-tag.yml goes red on the merge when it is, which is the
      # second half of the same guard.
      #
      # AND IT IS WHERE A MINOR BECOMES SAYABLE. The version has to be one of the three
      # steps above the latest release and the author picks which, so `--bump minor` is a
      # thing somebody can do and the tree records that they did. What it will not accept is
      # silence: a change that reaches an installed CLI and declares nothing fails here
      # rather than being handed a patch nobody chose.
      #
      # THE LATEST RELEASE AND NOT THE BASE BRANCH is what the three steps are measured
      # from, because those two can disagree and did. v0.2.1 was cut from a branch by hand
      # while this workflow was broken, so `releases/latest` named it while main's
      # pyproject.toml still declared 0.2.0, and a patch above the base branch would have
      # been a version already released.
      #
      # LAST IN THE JOB ON PURPOSE. Failing it means one command and one commit, and
      # somebody who has to run it would rather learn that alongside the test results than
      # instead of them.
      #
      # IT FAILS CLOSED ON ITS OWN MALFUNCTION, which is the correction. It used to pass
      # when it could not identify the base, on the argument that a confused step should
      # not block every merge in the repository and that release-tag.yml catches it one
      # merge later anyway. The second half of that was not true. That workflow refuses a
      # version already released, so it catches the change that declared nothing; a change
      # that declared 0.2.7 with v0.2.2 released is a version no release has, and it was
      # tagged. Catching one of the two cases is luck rather than a check, and the case it
      # missed is the one nothing afterwards can undo -- a tag is published the moment it
      # is pushed.
      #
      # WHICH LEAVES THE COST OF REFUSING, AND IT IS PAID IN THE MESSAGE. A step that says
      # "could not determine base" and stops arrives in front of somebody whose checkout is
      # already misbehaving, so the refusal names both places it looked, why neither
      # answered, the three things worth trying in order, and the two commands that answer
      # the question by hand in the meantime. It also tries the base the event names before
      # it refuses at all, which cannot introduce a flake: that fetch runs only on the path
      # that was already going to refuse, so failing it changes nothing and passing it
      # turns a refusal into a real comparison.
      - name: A change a release must carry declares a version no release has
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The second place the base can be read from, and not the same fact as HEAD^1.
          # That one is a property of this checkout; this one is a property of the pull
          # request, so a checkout that arrived without the parent can still be told which
          # commit to go and get.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="HEAD^1"
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            git fetch --no-tags --quiet --depth=1 origin "${BASE_SHA}" 2>/dev/null || true
            base="${BASE_SHA}"
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            {
              echo "::error::this check cannot tell which commit this pull request is based on, so it cannot tell whether the change is one a release has to carry. It refuses rather than passing, because the version has to be declared before the merge and nothing after the merge can declare it."
              echo
              echo "WHAT IT COULD NOT DETERMINE. The base of this pull request, which is the"
              echo "commit the change under review is the difference from. Both places it can be"
              echo "read from came back with nothing."
              echo
              echo "  HEAD^1"
              echo "      The first parent of the merge commit actions/checkout leaves at HEAD on"
              echo "      a pull request. fetch-depth: 2 in this workflow is what brings it, and"
              echo "      at the shallow default it is not there."
              echo "  ${BASE_SHA:-(the event named no base commit)}"
              echo "      github.event.pull_request.base.sha, fetched by name as a second"
              echo "      attempt. That fetch did not answer either."
              echo
              echo "WHY THAT HAPPENS. The checkout is not the one this step was written for. A"
              echo "re-run of a run whose merge commit has been rewritten since, a base branch"
              echo "force-pushed while this run was starting, a fetch-depth that no longer"
              echo "reaches the parent, or a runner that could not reach the remote."
              echo
              echo "WHY IT DOES NOT SIMPLY PASS. It used to, and that was the hole. A pull"
              echo "request whose base was unreachable merged without ever being asked to declare"
              echo "a version, and the workflow that tags the merge refuses only a version that is"
              echo "already released -- so a version nobody chose was tagged, published, and told"
              echo "every install to fetch it."
              echo
              echo "WHAT TO DO, IN THE ORDER WORTH TRYING."
              echo
              echo "  1. Re-run this job. A fresh checkout recomputes the merge commit, which is"
              echo "     enough whenever this run started against a ref that has since moved."
              echo "  2. Push to the branch, or rebase it on main. Either makes GitHub build a"
              echo "     new merge commit for the checkout to find."
              echo "  3. If this pull request conflicts with main, resolve the conflict. There is"
              echo "     no merge commit to check out while there is one."
              echo
              echo "AND WHAT IT WOULD HAVE ASKED, so a reviewer can ask it by hand meanwhile. The"
              echo "first has to be exactly one patch, minor or major above the second whenever"
              echo "the change touches the CLI, a module the CLI imports, one of the six"
              echo "configuration files it opens, or pyproject.toml."
              echo
              echo "  uv run python tools/next_version.py"
              echo "  gh release view --json tagName --jq .tagName"
            } >&2
            exit 1
          fi
          # Read out of release-tag.yml rather than restated here. That workflow's push
          # trigger is the definition of "worth a release", Actions gives one workflow no
          # way to share a list with another, and a second copy nothing compares is how the
          # two drift until a change merges having never been asked to declare a version.
          paths="$(uv run --frozen python tools/release_paths.py | tr '\n' ' ')"
          # Split deliberately: these are directories and files, none of which contains a
          # space or a glob character. Quoted, it would ask git for one path with forty
          # spaces in its name, which matches nothing and passes everything.
          set -- ${paths}
          touched="$(git diff --name-only "${base}" HEAD -- "$@")"
          if [ -z "${touched}" ]; then
            echo "This change touches nothing an installed edullm would answer differently"
            echo "about, so it needs no version of its own."
            exit 0
          fi
          declared="$(uv run --frozen python tools/next_version.py)"
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No release exists yet, so ${declared} is the first one and there is nothing"
            echo "here to measure it against."
            exit 0
          fi
          released="${latest#v}"
          for size in patch minor major; do
            candidate="$(uv run --frozen python tools/next_version.py --next "${size}" --of "${released}")"
            if [ "${declared}" = "${candidate}" ]; then
              echo "This change will be released as v${declared} when it merges, a ${size}"
              echo "above ${latest}."
              exit 0
            fi
          done
          {
            echo "::error::pyproject.toml declares ${declared}, which is not a patch, minor or major above the latest release ${latest}. Run 'uv run python tools/next_version.py --bump <size>' and commit the result."
            echo
            echo "This change touches:"
            echo "${touched}" | sed 's/^/  /'
            echo
            echo "Those are the paths a release has to carry -- the CLI's own modules, the"
            echo "modules it imports, and the configuration files it opens -- so an installed"
            echo "edullm answers differently once this merges. The latest release is"
            echo "${latest} and pyproject.toml declares ${declared}, which is not one step"
            echo "above it."
            echo
            echo "Nothing after the merge can fix that. release-tag.yml tags what"
            echo "pyproject.toml declares and cannot bump it: the bump is a commit, and"
            echo "branch protection means only a pull request may put one on main. This"
            echo "pull request is the pull request."
            echo
            echo "Pick the size this change is, run it, and commit what it writes."
            echo
            for size in patch minor major; do
              candidate="$(uv run --frozen python tools/next_version.py --next "${size}" --of "${released}")"
              echo "  uv run python tools/next_version.py --bump ${size}   # ${candidate}"
            done
            echo
            echo "A minor is a new command, a new flag, a new optional spec field, or a new"
            echo "refusal that can stop a submission which used to go through. A major is a"
            echo "flag or field removed or given a new meaning, or a changed exit code."
            echo "Anything else a re-install fixes is a patch."
            echo
            echo "Each moves pyproject.toml, uv.lock and the pinned install line together."
            echo "Commit all three."
          } >&2
          exit 1
