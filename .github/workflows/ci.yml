name: CI

# pull_request (not pull_request_target) is deliberate: fork pull requests run with a
# read-only token and no access to secrets. Do not change this without understanding
# that pull_request_target grants write access and secrets to code from forks.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared floor in pyproject.toml; 3.13 is what maintainers run.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy

      # loadgroup, not the default per-test distribution, and not loadfile either. A
      # worker is a process and a session fixture is built once per process, so where a
      # test runs decides what the run costs. tests/conftest.py puts each module in its
      # own group, which is what loadfile would do anyway; it also puts the two proof
      # generators in one group, which loadfile cannot, and they need it because they
      # share a single nested full-suite verification that they each pay for separately
      # once they are on separate workers. Measured over two interleaved pairs: loadfile
      # 49.9s and 50.3s, loadgroup 47.0s and 47.4s, for 33s of CPU rather than 46s.
      #
      # The flags live here and not in pyproject.toml so that a local `uv run pytest -q`
      # stays serial, ordered, and readable when something fails.
      - name: Tests
        run: uv run --frozen pytest -q -n4 --dist loadgroup

      - name: Schemas reproduce from the models
        run: |
          uv run --frozen python tools/export_schemas.py
          git diff --exit-code schemas

  gate:
    name: phase 0 gate (informational)
    runs-on: ubuntu-latest
    # Not a required check. The gate reads captured AWS and GitHub evidence that
    # expires after 30 days, so it can legitimately go red for reasons unrelated to
    # the change under review. It is also red whenever a Phase 0 criterion is a
    # recorded gap, which is a statement about the phase rather than about the
    # change. The contract rules it enforces are covered by the test suite above,
    # which is what blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the acceptance gate
        run: uv run --frozen python tools/validate_phase0.py

  phase1-gate:
    name: phase 1 gate (informational)
    runs-on: ubuntu-latest
    # Not a required check, for the same reason as the Phase 0 gate above. It reads
    # captured AWS evidence that expires — the records of the one live publish run
    # expire on 2026-08-25 and nothing renews them — so it can legitimately go red for
    # reasons unrelated to the change under review, and a required check that does that
    # gets routed around rather than read. The contract rules it enforces are covered by
    # the test suite above, which is what blocks a merge.
    #
    # Informational is not the same as unwatched. Running here is the point: the expiry
    # of live evidence should surface as a red job on an ordinary morning rather than
    # wait for somebody to remember to run the gate by hand. Do not promote this to a
    # required check without accepting that it will block unrelated work the day the
    # evidence lapses.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Reads committed records only. It needs no credentials and reaches no AWS API.
      - name: Run the acceptance gate
        run: uv run --frozen python tools/validate_phase1.py
