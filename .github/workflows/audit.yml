      # two to drift apart.
      #
      # There is a window in which this is legitimately red and a re-run clears it, and it is
      # wider than the release job's: a CI stack is applied when its change reaches main, so
      # between the merge and the deploy the template on main is not the one deployed. It is
      # minutes wide against a schedule that runs once a day, so it is a caveat for whoever
      # dispatches this by hand after a merge rather than a reason to soften the job.
      - name: Compare each deployed stack against the template main declares
        run: uv run --frozen python tools/verify_deployed_stacks.py

  visibility-board:
    name: the three records of a run agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS A RUN NOBODY CAN ACCOUNT FOR, AND THE UNION IS NOT THE POINT.
      # Three systems each hold a third of the truth about a run. W&B holds what it logged,
      # the account holds what it ran on, and the outputs bucket holds what it left behind,
      # and nothing joins them, so a run present in one and absent from the other two stays
      # that way. Measured live on 2026-08-02 the account was running 46 runs that log nowhere
      # anybody can find, and the bucket held a nine gibibyte prefix whose directory name is a
      # uuid4, so no run id can ever match it and nothing says what config produced it.
      #
      # There is no fetch step. The board syncs the lineage prefixes it needs itself, because
      # the attempt records it prices unlogged spend from are a prefix the reader role does not
      # hold; a fetch step would have to carry the same degradation the tool already carries,
      # and the two spellings would drift.
      #
      # The exit code is translated here rather than left to the tool, which is the
      # checkpoint job's arrangement and not the release job's. The board's output is a
      # markdown report meant for the step summary, so this step has a body whatever else it
      # does, and the two non-zero exits mean different things: 1 is a disagreement and sends
      # the reader to a run, 2 is a source that was not read and sends them to a grant. A
      # reader who cannot tell those apart goes hunting a submitter on the morning a
      # credential lapsed.
      - name: Join what W&B, the account and the outputs bucket each say
        run: |
          set -uo pipefail
          status=0
          uv run --frozen python tools/visibility_board.py --output board.md || status=$?

          if [[ -s board.md ]]; then
            cat board.md >> "${GITHUB_STEP_SUMMARY}"
            cat board.md
          fi

          if [[ "${status}" -eq 2 ]]; then
            echo "visibility_board_incomplete" >&2
            echo "A source was not read, so the comparisons that need it were not made. The" >&2
            echo "board above names each gap and what stopped being answerable, and quotes" >&2
            echo "the IAM statement where a grant is what is missing." >&2
            exit 1
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "the_three_records_of_a_run_disagree" >&2
            echo "A run is in one of the three sources and not the others. The board above" >&2
            echo "says which runs and which way each disagreement runs." >&2
            exit 1
          fi

  placement-verdicts:
    name: the recorded placement verdicts are ones the queues support
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS THE ACCOUNT'S NEIGHBOURS, NOT A DIFF. config/capacity.yaml
      # records whether EC2 will sell this account each of seventeen shapes, and every one of
      # the eight times it has been wrong it said a machine could not be had when it could.
      # The instrument that produced those eight was a one-shot pool probe; the instrument
      # that overturned them every time was a Batch queue that kept asking. This reads the
      # queues.
      #
      # It writes nothing. The file is nine tenths reviewed prose, and a bot editing it would
      # need a write credential, a pull-request path and a surgical anchored substitution --
      # three new failure points bought to save one hand edit. The role this assumes holds no
      # write anywhere in the account, which is the same argument from the other side.
      #
      # The exit code is translated here rather than left to the tool, which is the
      # visibility board's arrangement and not the release job's. The report is markdown meant
      # for the step summary, so this step has a body whatever else it does, and the two
      # non-zero exits send a reader to different places: 1 is a disagreement and sends them
      # to a compute profile, 2 is a grant or a credential. Somebody who cannot tell those
      # apart goes re-measuring a pool on the morning a role lapsed.
      - name: Recompute each placement verdict from the sixteen queues
        run: |
          set -uo pipefail
          status=0
          uv run --frozen python tools/verify_placement_verdicts.py --output placement.md || status=$?

          if [[ -s placement.md ]]; then
            cat placement.md >> "${GITHUB_STEP_SUMMARY}"
            cat placement.md
          fi

          if [[ "${status}" -eq 2 ]]; then
            echo "placement_verdicts_unusable" >&2
            echo "The queues were not read, so no verdict was recomputed and this run says" >&2
            echo "nothing about config/capacity.yaml either way. The error above says which" >&2
            echo "read was refused; a denial is usually batch:ListJobs or batch:DescribeJobs," >&2
            echo "granted in infra/iam/audit-reader-role.yaml and applied by hand." >&2
            exit 1
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "placement_verdict_disagrees_with_the_account" >&2
            echo "A shape's recorded 'places' verdict is not one its queue supports. The" >&2
            echo "table above says what each queue shows and which way the disagreement" >&2
            echo "runs. Nothing was rewritten: the edit is a person's, in a pull request." >&2
            exit 1
          fi

  substrate-capture:
    name: today is written down before its sources forget it
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS NOTHING, AND THAT IS WHY IT IS DIFFERENT FROM EVERY OTHER JOB
      # HERE. The other eight compare two things and go red when they disagree. This one
      # takes a reading and writes it down, because two of the four sources it reads forget:
      # Batch drops a job about a week after it ends, and CloudWatch keeps the stdout of a
      # run for ninety days. Every verdict in this file can be recomputed tomorrow from
      # sources that will still be there. A reading cannot, so it is taken first and what to
      # make of it is decided later.
      #
      # The date is UTC because the runner is and because the branch this lands on is keyed
      # by day. A local date would produce two names for one morning.
      #
      # The tool exits 2 when it could not read and 0 when it read something, and it has no
      # exit 1 because it judges nothing. A refused source is not a failure of this job --
      # the reading carries the refusal, which is the point of writing the gaps into the file
      # rather than only into this log.
      - name: Read the account and write today down
        run: |
          set -uo pipefail
          reading="substrate/$(date -u +%F).json"
          status=0
          uv run --frozen python tools/read_substrate.py --write "${reading}" > reading.txt \
            || status=$?
          cat reading.txt
          {
            echo "## The reading of $(date -u +%F)"
            echo
            echo '```'
            cat reading.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${status}" -ne 0 ]]; then
            echo "substrate_not_read" >&2
            echo "No reading was taken, so this morning has no record and two of the four" >&2
            echo "sources will have forgotten some of it by the time anybody asks. The" >&2
            echo "error above says which read was refused. Nothing was written." >&2
            exit 1
          fi
          if [[ ! -s "${reading}" ]]; then
            echo "substrate_reading_is_empty" >&2
            echo "The tool reported success and left no file, which means the write is not" >&2
            echo "wired to the read. tools/read_substrate.py --write is what produces it." >&2
            exit 1
          fi

      # BEFORE ANYTHING ELSE HAPPENS TO IT, AND UNCONDITIONALLY. The artifact is how the
      # reading reaches the job that commits it, and it is also the copy that survives a
      # branch push being refused. Ninety days is the longest retention available and is the
      # same ninety days CloudWatch keeps a run log for, which is a coincidence worth not
      # relying on: the branch is the durable copy and this is the hand-off.
      - name: Publish the reading
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: substrate
          path: substrate/
          if-no-files-found: warn
          retention-days: 90

  substrate-history:
    name: the readings are kept where they can be diffed
    needs: substrate-capture
    # ALWAYS, BECAUSE A PARTIAL READING IS STILL A READING. substrate-capture goes red when a
    # source was refused and still writes what it did read, and the morning a grant lapsed is
    # exactly the morning somebody will want the file. What it does not do is invent one: the
    # capture writes nothing at all when the collection failed outright, so there is no file
    # to commit and this exits without one.
    if: always()
    runs-on: ubuntu-latest
    # THE SINGLE WRITER OF machine/substrate, AND THE REASON THE GROUP IS HERE RATHER THAN ON
    # THE FILE. The branch is orphaned and appended to, so two runs pushing at once lose a
    # reading and a perishable source means the loss is permanent. Keyed on this branch and
    # not shared with activity-history, which pushes a different one and is a sibling that
    # should still run beside this within a run. Never cancelling, because a cancelled writer
    # is the same lost morning arriving differently. The block under the trigger says why the
    # eleven jobs that only compute verdicts are no longer in a group at all.
    concurrency:
      group: audit-substrate-history
      cancel-in-progress: false
    # THE ONLY WRITE IN THIS FILE, AND IT IS DELIBERATELY IN A JOB THAT CANNOT REACH AWS. No
    # job here holds both a credential into the account and a write into this repository; a
    # reader that could commit could publish a reading it made up, which is the same argument
    # infra/iam/audit-reader-role.yaml makes for the role holding no write in the account.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Collect the reading
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: substrate
          path: substrate/

      # AN ORPHAN BRANCH, APPENDED TO RATHER THAN FORCE-PUSHED. main refuses this push and
      # should. Branch protection requires two status checks this token cannot produce, and
      # buying an exception to that in order to publish a record is the wrong trade. The
      # required review that used to be the reason came off main on 2026-08-05 and the
      # checks are what refuse the push now, which changes nothing about where this goes.
      # What
      # makes the branch the right place is that history is the product here -- the sources
      # forget, so last week is the only copy of last week -- which is the opposite of the
      # run index, where a snapshot refreshed on state change is overwritten in place and its
      # history is noise. Both need excluding from protection rules; only the other one needs
      # a force push. The single writer for this branch is this job's own concurrency group,
      # declared above it.
      - name: Keep the reading on the machine/substrate branch
        run: |
          set -euo pipefail
          [[ -n "$(ls -A substrate 2>/dev/null || true)" ]] || {
            echo "no reading was published, so there is nothing to keep"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin machine/substrate --depth=1 || true
          git switch machine/substrate 2>/dev/null || git switch --orphan machine/substrate
          git add --force substrate/
          git diff --cached --quiet || git commit -m "substrate: $(date -u +%F)"
          git push origin machine/substrate

  activity-history:
    name: the day is a page somebody can read
    needs: substrate-capture
    # ALWAYS, FOR THE REASON THE HISTORY JOB GIVES AND ONE MORE. The capture goes red when a
    # source was refused and still writes what it did read, and the morning a source was
    # refused is exactly the morning the page is worth having, because the page is where the
    # refusal is written in words. What this cannot do is invent one: with no artifact there
    # is no reading, and it exits without writing anything.
    if: always()
    runs-on: ubuntu-latest
    # THE SINGLE WRITER OF machine/activity, for the reason substrate-history is the single
    # writer of its own branch: the page is appended to and never force-pushed, because a
    # source having been refused for a week is a diff rather than a value. Its own group
    # rather than substrate-history's, since the branches are different and the two are
    # siblings that should not serialise against each other inside one run.
    concurrency:
      group: audit-activity-history
      cancel-in-progress: false
    # NO id-token, SO THIS JOB CANNOT REACH THE ACCOUNT HOWEVER ITS STEPS ARE WRITTEN. Same
    # separation substrate-history is built on, and tests/test_ci_workflow.py holds the two
    # sets disjoint. It costs the budget section, which needs Cost Explorer; the page prints
    # the reason rather than an empty heading.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Collect the reading
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: substrate
          path: substrate/

      # THE PAGE IS A VIEW OVER THE READING BESIDE IT AND READS NOTHING ELSE. --reading is
      # what makes that true, and it is why this job needs no credential: a second collection
      # here would be a second ingestion of one account, and the two would eventually
      # disagree about one run and publish two dollar figures for it.
      #
      # The day is the reading's own day rather than yesterday, because the collector reads
      # one day of CloudTrail and the tool refuses a mismatch list built from a window nobody
      # asked about. Reporting yesterday from today's reading would cost the mismatch arm
      # every morning; reporting today costs the last nineteen hours of runs, which the next
      # morning's page carries in full.
      - name: Write the day as a page
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          reading="substrate/${day}.json"
          if [[ ! -s "${reading}" ]]; then
            echo "activity_has_no_reading_to_read" >&2
            echo "substrate-capture published no reading for ${day}, so there is nothing to" >&2
            echo "make a page out of. The capture's own failure is the one to read." >&2
            exit 1
          fi
          uv run --frozen python tools/report_activity.py \
            --day "${day}" --reading "${reading}" --output-dir activity --offline
          {
            echo "## The activity of ${day}"
            echo
            cat "activity/${day}.md"
          } >> "${GITHUB_STEP_SUMMARY}"

      # BEFORE THE PUSH, AND UNCONDITIONALLY. Same hand-off argument as the reading's: a
      # branch push that is refused must cost the branch and not the page.
      - name: Publish the page
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: activity
          path: activity/
          if-no-files-found: warn
          retention-days: 90

      # APPENDED TO, NEVER FORCE-PUSHED, for the reason the readings are: the history is the
      # product. A page is how somebody sees that a source has been refused for a week, and
      # that is a diff rather than a value. The single writer is this job's own concurrency
      # group, declared above it, which is what makes an append safe.
      - name: Keep the page on the machine/activity branch
        run: |
          set -euo pipefail
          [[ -n "$(ls -A activity 2>/dev/null || true)" ]] || {
            echo "no page was written, so there is nothing to keep"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # THE PAGE IS MOVED ASIDE BEFORE THE SWITCH, WHICH THE SIBLING JOB DOES NOT DO. A
          # page for a day this branch already carries is an untracked file git refuses to
          # overwrite, so `git switch` fails, the `||` falls through to `--orphan`, and the
          # push is then rejected as non-fast-forward -- a red job for a re-run, which is a
          # thing somebody does to a page far more often than to a reading.
          written="$(mktemp -d)"
          cp -R activity/. "${written}/"
          rm -rf activity
          git fetch origin machine/activity --depth=1 || true
          git switch machine/activity 2>/dev/null || git switch --orphan machine/activity
          mkdir -p activity
          cp -R "${written}/." activity/
          git add --force activity/
          git diff --cached --quiet || git commit -m "activity: $(date -u +%F)"
          git push origin machine/activity

  roster-against-the-account:
    name: who the account knows about that the roster does not
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS A PERSON, AND IT IS THE ONE JOB HERE WHOSE FINDING IS NOT A
      # FAULT. Anybody in the organization can self-serve an Intern-<first>.<last>-sbsandbox
      # role in about five minutes, admission reads config/organization.yaml, and nothing
      # tells that file a role appeared. So the ordinary sequence is that somebody holds AWS
      # credentials for a week and is refused by `edullm submit` the first time they use
      # them, with no symptom before that moment. On 2026-08-05 the account held 43 of these
      # roles against a 35-person roster and nobody knew until somebody counted by hand.
      #
      # NO EXIT CODE 1, BY CONSTRUCTION IN THE TOOL RATHER THAN BY continue-on-error HERE.
      # The distinction matters and it is the reason this job is allowed on a schedule whose
      # header says nothing here is informational. A red cross means something is wrong; a
      # person appearing in the account before the roster is Tuesday. A job that went red for
      # it would be red most mornings, and a check that is red most mornings is one nobody
      # reads on the morning it means something -- which would cost the five jobs above their
      # signal as well as this one. So the finding is a step summary and the exit code is
      # zero, exactly as tools/report_asks.py argues for its own queue length.
      #
      # Exit 2 is a real failure and is red, because a comparison that could not be made says
      # nothing about the roster in either direction. The tool separates the two ways that
      # happens: a refused read, which is usually iam:ListRoles and which prints the grant to
      # paste, and an account that answered with no Intern-* role at all, which is not a tidy
      # account but a read that did not work.
      - name: Compare who the account knows about against who the roster does
        run: |
          set -uo pipefail
          status=0
          uv run --frozen python tools/report_roster_against_the_account.py \
            --region "${AWS_REGION:-us-east-1}" > roster.md || status=$?

          if [[ -s roster.md ]]; then
            cat roster.md >> "${GITHUB_STEP_SUMMARY}"
            cat roster.md
          fi

          if [[ "${status}" -ne 0 ]]; then
            echo "roster_comparison_unmade" >&2
            echo "The account was not read, so this run says nothing about the roster either" >&2
            echo "way. The error above says which read was refused; a denial is iam:ListRoles," >&2
            echo "granted in infra/iam/audit-reader-role.yaml and applied by hand." >&2
            exit 1
          fi

  # NO `permissions:` BLOCK, WHICH IS THE CATEGORY RATHER THAN AN OVERSIGHT. This job reads
  # two committed files and nothing else, so the file-level `contents: read` is the whole of
  # what it needs, and tests/test_ci_workflow.py refuses a block on a job of this kind. No
  # id-token means no AWS identity is obtainable however the steps are later written.
  lead-gate:
    name: who can open the lead gate, and how old the answer is
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # THIS ONE IS RED ON A FINDING AND THE JOB ABOVE IT IS NOT, AND THE DIFFERENCE IS NOT
      # INCONSISTENCY. A person reaching AWS before the roster is Tuesday, so
      # roster-against-the-account reports it and exits 0. A disagreement here is a fault in
      # both directions: a login on the GitHub team the roster does not authorize opens
      # `run-approval-lead` and is then refused by admission, spending somebody's approval on
      # a no, and an authorized login absent from the team is a person the gate can never
      # route to, their own group's runs included. Both were live at once for two days ending
      # 2026-07-30.
      #
      # WHAT IS ACTUALLY NEW HERE IS THE CLOCK. tests/test_phase2_github_evidence.py already
      # makes this comparison on every push. What it cannot do is notice that the capture it
      # compares was taken by hand and has been sitting there. FreshEvidenceModel refuses one
      # after thirty days, and thirty days is exactly how long the ninth member of that team
      # went unnoticed. config/reports/lead-gate.yaml shortens that window and this job is
      # what enforces it.
      #
      # It reads GitHub for nothing, and config/organization.yaml explains why at length:
      # orgs/edu-llm/teams/team-leads/members needs the Members organization permission, the
      # GITHUB_TOKEN has no organization permissions, and a PAT would be a secret
      # test_the_repository_holds_no_secret_a_branch_could_read forbids by name. So a clean
      # run means the last hand capture agreed with the roster and is recent enough to be
      # worth believing, and it does not mean somebody was not added to the team this morning.
      - name: Compare the captured team against the roster, and say how old the capture is
        run: |
          set -uo pipefail
          status=0
          uv run --frozen python tools/report_who_can_open_the_lead_gate.py > lead-gate.md \
            || status=$?

          if [[ -s lead-gate.md ]]; then
            cat lead-gate.md >> "${GITHUB_STEP_SUMMARY}"
            cat lead-gate.md
          fi

          exit "${status}"

  open-asks:
    name: which asks have stopped being asks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading this repository's own issues. Nothing here writes anything anywhere, which is
      # why this job needs no role and no repository variable -- the two things that make every
      # other job on this schedule able to fail before it starts. It is the only job in this
      # file that cannot fail for a reason outside the question it was asked.
      issues: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # NO continue-on-error, AND THAT IS NOT AN OVERSIGHT. tools/report_asks.py has no exit
      # code 1 by construction -- a long queue of asks is a finding and never a failure, for the
      # reason tools/report_spend.py states about itself: a red job in a path something else
      # depends on is one step away from being a control. Exit 2 means the count could not be
      # taken, which is a real failure and should be red.
      - name: Count the open asks
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python tools/report_asks.py >> "$GITHUB_STEP_SUMMARY"
