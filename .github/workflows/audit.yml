name: The audit (what the platform recorded, against what is actually there)

# THE AUDIT HOLDS WHAT THIS PLATFORM RECORDED AGAINST WHAT IS ACTUALLY THERE, AND GOES RED
# WHEN THE TWO DISAGREE. That is the one thing the jobs below have in common, and it is why
# none of them belongs on the pull-request path. Each asks about the account, about somebody
# else's repository, or about what people have filed here, rather than about a change -- so
# no diff can cause what it finds, no diff can be blamed for it, and a check that ran per
# pull request would be asking a question the diff in front of it cannot answer.
#
# The count is deliberately not stated. It was "seven" through three additions, and a number
# in a header nothing checks is wrong from the second time somebody adds a job. What is
# checked is that every job is named below, by tests/test_ci_workflow.py.
#
# Nothing here is continue-on-error, and that is the whole point of the arrangement. There
# is no alerting infrastructure, so a red run is the signal, and a job that cannot go red is
# not one. It runs at 05:00 so that a disagreement is waiting rather than arriving
# mid-morning, which is a property of the schedule and not what the file is for.
#
# THREE JOBS WERE REMOVED ON 2026-08-05 WITH THE APPARATUS THEY SERVED. proof-bundles-reproduce
# reran the whole suite inside itself to reproduce a recorded suite result;
# contract-and-manifest-gate and branch-to-image-gate ran the Phase 0 and Phase 1 acceptance
# gates. The phase model those three reported against was replaced by the slice plans, and
# twelve of the thirteen run ids the bundles cited named container images an ECR lifecycle
# rule had already deleted. What the gates enforced that is still worth enforcing is in the
# test suite: the nine configuration checks are tests/test_operational_inventory.py and the
# recorded digests are tests/test_serialization_goldens.py, both on the pull-request path.
#
# Why each is here rather than in ci.yml:
#
#   checkpoint-reconciliation, wandb-credential, deployed-lambda-release,
#     deployed-stack-templates and visibility-board — these five read the account, and that
#     is why they are here rather than on the pull-request path. Each describes a state a
#     change cannot cause and cannot be blamed for: a run that trained for hours and saved
#     nothing did so before the diff under review existed, a credential pasted wrongly into
#     Secrets Manager has nothing to do with any file, a Lambda deployed out of band is by
#     definition something no diff records, a stack applied from a stale branch is a
#     diff that was never merged, and a run that logged nowhere logged nowhere weeks ago.
#     They also need an AWS identity, and putting one on the
#     pull-request path would mean a fork's pull request runs with it in reach.
#
#   placement-verdicts — the sixth, and the one whose failure has no error attached to it
#     anywhere. It reads the sixteen Batch queues and recomputes each `places` verdict in
#     config/capacity.yaml, which records whether EC2 will sell this account a shape. That
#     is a fact about the account's neighbours: a pool becomes obtainable because somebody
#     else's job finished, so no diff to this repository can cause it and no pull-request
#     check can catch it. It also needs an AWS identity, for the reason the five above give.
#
#   substrate-capture — the eighth, and the only one here whose output is a record rather
#     than a verdict. It reads lineage, the resource tags and (once that reader is built)
#     CloudTrail into one document per day and writes it down. It is here rather than on the
#     pull-request path for the reason the five above are, and it is on a schedule for a
#     reason none of them share: two of the sources it reads forget. Batch drops a job about
#     a week after it ends and CloudWatch keeps a run's stdout for ninety days, so a morning
#     nobody read is a question that becomes unanswerable rather than merely unanswered. A
#     verdict can be recomputed whenever somebody wants it; a reading cannot.
#
#   substrate-history — the ninth, and the only job in this file that writes anything. It
#     holds no AWS identity at all: it takes the artifact substrate-capture published and
#     commits it to the `machine/substrate` branch, so no job here holds both a credential
#     into the account and a write into this repository. That split is the whole reason it
#     is a second job rather than three more steps on the eighth. The branch is orphaned and
#     appended to, never force-pushed, because with a perishable source the history is the
#     product; the single writer is this file's own `concurrency: group: audit`.
#
#   registered-dockerfiles — the seventh, and the only one whose subject is other people's
#     repositories. It reads the research repositories over the GitHub API to ask whether
#     each registration's dockerfile_path is actually on the branch it names, which is a
#     question no diff to this repository can answer: a registration goes stale when
#     somebody else's default branch moves, not when this one does. It is here rather than
#     on the pull-request path for the same reason as the account checks -- a research
#     repository renamed at four in the afternoon would turn every unrelated pull request
#     red -- and because a fork's pull request should not be able to spend this
#     repository's API budget enumerating an organisation.
#
#   open-asks — the newest, the cheapest, and the only one whose subject is neither the
#     account nor a repository but the people using this one. It counts the open issues
#     labelled `ask` by kind and says which kinds have reached the threshold
#     config/reports/asks.yaml names. docs-frank/reference/system-overview.md says one place
#     makes asks countable "which turns the third identical one into a config change"; this
#     is that sentence made into a number somebody can read. It is here rather than on the
#     pull-request path because what it measures is what other people filed, which no diff
#     causes and no diff can be blamed for.
#
#     It is also the only job in this file that cannot fail for a reason outside the question
#     it was asked. It assumes no role, reads no repository variable and takes no secret --
#     `gh api` on the token the runner already holds is the whole of its access -- so it has
#     none of the credential preamble its neighbours carry and none of the three ways they
#     can go red before starting. tools/report_asks.py has no exit code 1 by construction: a
#     queue of asks getting long is a finding and never a failure, for the reason
#     tools/report_spend.py gives about itself. Exit 2 means the count could not be taken,
#     which is a real failure and is red.
#
# ONE OF THE SEVEN IS NO LONGER ONLY A SIGNAL, AND THAT CHANGES WHAT A RED CROSS ON IT
# COSTS. wandb-credential publishes its answer as an artifact, and submit-run.yml refuses a
# submission on the strength of it -- because the role this job assumes is the only
# GitHub-facing identity in the account holding secretsmanager:GetSecretValue on that
# secret, and infra/iam/admission-role.yaml argues at length why the submit path should not
# be given one. So a refused key stops submissions rather than waiting for somebody to
# notice a red scheduled run, which is the whole reason the artifact exists. It also means
# repairing the key is not finished until this workflow is dispatched again: nothing else
# writes a newer verdict, and a refusal is honoured until one does.
#
# The six assume sbsandbox-intern-edullm-audit-reader, which can read the lineage
# records, what the runs wrote, one secret, the deployed digest of the two admission
# functions, the deployed template of each stack and the jobs on each Batch queue, and holds
# no write anywhere in the account.
# infra/iam/audit-reader-role.yaml argues each grant; the short version is that a check
# able to change what it is checking can produce its own all-clear. The role is applied
# from a laptop like every IAM stack here, so a fresh clone of this repository does not
# bring it with it, and each of those jobs says so by name rather than failing at the
# credential step with an empty role.
#
# THAT ROLE DID NOT HOLD EVERYTHING THE VISIBILITY BOARD READS, AND THAT JOB WAS RED FROM THE
# NIGHT IT SHIPPED UNTIL 2026-08-04. Two grants were missing and either one alone was enough. The
# visibility board reads what the account is running out of the resource tags every
# submission sets, which needs tag:GetResources; and it prices those runs from the lineage
# store's attempt/ prefix, which the role granted on neither the fetch nor the listing while
# tools/report_run_costs.py synced it. Both are granted now, in one deploy, and the job
# reports a verdict rather than a gap.
#
# Neither had a substitute. Enumerating the queues sees only what this platform submitted
# to the sixteen queues it created, and the lineage records are narrower still, so neither
# answers what the account is running -- which is the gap the board reports. The durations
# are only in the attempt records, and sync_bucket raises on a refused prefix rather than
# skipping it, so that refusal cost the whole cost mapping and not the attempt half of it.
#
# THE batch:ListJobs AND batch:DescribeJobs GRANTS #227 ADDED NOW HAVE THE READER THEY WERE
# ADDED FOR. placement-verdicts is that job. The grant landed first and on purpose, and the
# order was checked against the live role before the job was written rather than assumed:
# this stack is applied by hand, so a job merged ahead of its permissions is red from the
# night it ships, which is what the paragraph above is about.
#
# The board still exits 2 and this job still goes red if a source cannot be read, because a
# grant can lapse and a credential can. What changed is that a gap is now a finding about
# the account rather than the expected shape of an ordinary night.
#
# A DISAGREEMENT ABOUT A COMPUTE PROFILE IS WORTH A RED SCHEDULED RUN, AND THE REASON IS THE
# ONE config/capacity.yaml OPENS WITH: THE FAILURE IT CATCHES HAS NO ERROR ATTACHED TO IT. A
# shape that has quietly become obtainable throws nothing, logs nothing and fails nothing.
# The submission path goes on printing "may not place" over a pool that is running jobs, and
# the only symptom is submitters deciding not to submit, which is not a thing any system
# here can observe. That file has taken eight corrections and not one of them was found by
# somebody doubting an entry; they were found because a person went and enumerated the
# queues. This is that enumeration, on a schedule.
#
# It is also a job that cannot go red for a reason nobody can act on, which is the other
# half of deserving the alarm. It reports a disagreement only where the account's evidence
# is conclusive on its own: a job started on a shape recorded as unplaceable, or the median
# job on a shape recorded as prompt waited past the limit that queue itself cancels a
# waiting job at, or an entry credits a queue nothing has ever been submitted to. It does
# not compare medians, so the drift from 89 minutes to 61 that this file's header describes
# passes in silence. There is no expiring evidence behind it and nothing outside the account
# to go stale.
#
# Making it informational instead was the alternative and it is the one thing that would not
# work. A continue-on-error job cannot fail anything, which is the state the two acceptance
# gates spent on the pull-request path before they were moved here and then deleted with the
# apparatus they served, and an unread report about a file nobody doubts is how the entries
# stayed wrong for two days with three nodes alive.
#
# Nothing here is a required check and nothing here should become one: the two required
# contexts are `checks (python 3.12)` and `checks (python 3.13)`,
# pinned in branch protection.

on:
  schedule:
    # 05:00 UTC, so a failure is waiting rather than arriving mid-morning.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  registered-dockerfiles:
    name: every registration names a Dockerfile that is there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # WHAT THIS CATCHES IS A REGISTRATION NOTHING EVER LOOKED AT. Seven of a
      # registration's eight fields are held against something in this repository. The
      # eighth, dockerfile_path, is a free string that tools/register_repository.py writes
      # and never checks, and its own help text calls .edullm/Dockerfile a convention -- so
      # open-instruct-scored-rewards was registered against a directory it does not have,
      # validated, merged, created its ECR repository, widened the publisher role and
      # reached the submission form's dropdown with nothing going red anywhere. The file is
      # only read by docker build inside the caller repository's own workflow, and that
      # repository has no caller workflow either, so no build ever ran to discover it.
      #
      # The GITHUB_TOKEN is enough because every registered repository is public. It is
      # read-only here and this job writes nothing.
      #
      # No translation of the exit code, for the reason the AWS jobs below give. The tool
      # prints its own reason and its own sentence, and tells a registration that points at
      # nothing apart from a check that could not look -- restating that here would be a
      # second place for the two to drift apart.
      - name: Check every registration against the repository it names
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python tools/verify_registered_dockerfiles.py

  checkpoint-reconciliation:
    name: runs that promised a checkpoint have one
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only these two jobs mint a token, so the three gates above keep the read-only
      # permission the file declares and cannot assume anything.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Before the credential step, because configure-aws-credentials meets an empty role
      # with "Credentials could not be loaded", which reads as broken federation and sends
      # the reader to the OIDC configuration rather than to a stack nobody applied.
      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The whole intent tree, because the report is handed no list of run ids and an
      # intent record is what says a run was submitted under a profile promising
      # checkpoints. The result tree beside it says how each run ended, which is what
      # decides whether its prefix is held against anything.
      - name: Fetch the intent records
        env:
          LINEAGE_BUCKET: sbsandbox-intern-edullm-lineage
        run: |
          set -euo pipefail
          aws s3 sync "s3://${LINEAGE_BUCKET}/intent/" lineage/intent/ --only-show-errors
          # All of them or none. A half-synced result tree reads as runs that never
          # finished, which would quietly stop asking about the runs that did, so a refusal
          # here removes the directory and the report judges every run as it did before.
          # The audit reader role does not hold result/ until the stack in infra/README.md
          # is applied from a laptop, so a denial is the expected answer for now.
          if ! aws s3 sync "s3://${LINEAGE_BUCKET}/result/" lineage/result/ --only-show-errors; then
            echo "note: could not read result/, so every contracted run will be judged"
            rm -rf lineage/result
          fi

      # THIS JOB WAS RED FOR MONTHS AND THAT WAS THE FINDING, NOT A FAULT IN IT. Fourteen of
      # the fifteen runs carrying a checkpoint contract had nothing a resume could load: six
      # wrote nothing at all, and eight wrote a step0 holding only train/rank0.pt, which is
      # rank 0's trainer state with no weights and no optimizer beside it. The second group
      # is the reason this check exists -- they wrote, so every count-based reading of the
      # bucket called them healthy. Thirteen of the fourteen are recorded as failures and
      # stop being held against this job once the role can read result/.
      #
      # The fifteenth cannot be repaired, so it is named in
      # config/reports/checkpoint-acknowledgements.yaml with the reason beside it. That is
      # per run rather than a date cutoff: a run nobody has written down is judged as before,
      # so a new offender turns this red the next morning, which is the only reason letting
      # the job go green is not the same as switching it off.
      - name: Reconcile what those runs actually wrote
        run: |
          set -uo pipefail
          status=0
          uv run --frozen python tools/find_runs_that_saved_nothing.py \
            --lineage-root lineage \
            --output reconciliation.md || status=$?

          if [[ -s reconciliation.md ]]; then
            cat reconciliation.md >> "${GITHUB_STEP_SUMMARY}"
            cat reconciliation.md
          fi

          # Two ways to be non-zero and they are not the same answer. The report exits 2
          # when it could not read the records or the bucket, which is never a statement
          # that nothing is wrong, and a reader who cannot tell that from a real finding
          # goes looking for runs that are fine.
          if [[ "${status}" -eq 2 ]]; then
            echo "checkpoint_reconciliation_unusable" >&2
            echo "The report could not read the lineage records or the outputs bucket, so it" >&2
            echo "has not said anything about the runs. The error above says which." >&2
            exit 1
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "runs_promised_a_checkpoint_and_have_none" >&2
            echo "A run declared a checkpoint contract and a resume would find nothing to" >&2
            echo "load. The table above says which runs, and whether each wrote nothing or" >&2
            echo "wrote something no loader will accept." >&2
            exit 1
          fi

  wandb-credential:
    name: the stored W&B key is one W&B accepts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS A ROTATION, NOT A TRAINING BUG. The value before the one
      # stored now was a good key with the literal word `api` glued to the front, which is
      # what pasting W&B's netrc line as a single token produces. W&B refused it outright
      # and nothing on this platform went red, because a training run does not fail when
      # W&B declines it -- the run trains, logs nowhere, and exits zero. The check resolves
      # the key against W&B rather than only measuring it, because the shape was very
      # nearly right and only W&B's answer settles it.
      #
      # It never prints the key. The output is a length, a truncated digest and the entity
      # W&B resolved it to.
      #
      # THE ANSWER IS WRITTEN TO A FILE AS WELL AS TO THE LOG, BECAUSE SOMETHING ELSE READS
      # IT NOW. submit-run.yml refuses a submission on the strength of this verdict, and it
      # has to, because no identity that workflow can obtain holds the read this job makes
      # -- infra/iam/admission-role.yaml argues that beside the grant it is an argument
      # about. So this job is the only place the question gets answered, and the artifact
      # below is how the answer reaches the path that spends money.
      #
      # A run that could not read the secret at all leaves the file empty rather than
      # absent, because the redirect creates it before the tool runs. That is the wanted
      # shape: the preflight reads an unparseable report as no verdict and falls back to the
      # night before, which is genuinely the newest thing anybody knows.
      - name: Ask W&B whether it would accept the stored key
        run: |
          set -uo pipefail
          report="${RUNNER_TEMP}/wandb-credential.json"
          status=0
          uv run --frozen python tools/verify_wandb_credential.py > "${report}" || status=$?
          cat "${report}"
          if [[ "${status}" -ne 0 ]]; then
            echo "wandb_credential_would_be_refused" >&2
            echo "The looks_wrong list above names the fault. The secret is set from a" >&2
            echo "laptop and from nowhere else, so repairing it is a person rather than a" >&2
            echo "re-run of this job." >&2
            echo "Submissions are refused while this stands, because submit-run.yml reads" >&2
            echo "this verdict. Repair the key, then dispatch this workflow again." >&2
            exit 1
          fi

      # if: always(), and that is the entire point of the step rather than caution. The
      # verdict worth publishing most is the refusal, and the step above exits 1 on exactly
      # that -- so an upload conditioned on success would publish every answer except the
      # one submit-run.yml exists to act on, and a bad key would read downstream as no
      # verdict rather than as a refusal.
      #
      # Ninety days, which is the default spelled out. The preflight only ever reads the
      # newest few, and a verdict older than a day and a half is reported as stale there
      # rather than acted on, so the retention is for a person reading back over a rotation
      # rather than for the check.
      - name: Publish what W&B said, for the submission preflight to read
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wandb-credential
          path: ${{ runner.temp }}/wandb-credential.json
          if-no-files-found: error
          retention-days: 90

  deployed-lambda-release:
    name: the deployed functions are the ones released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS A DEPLOYMENT, NOT A DIFF. Two committed tripwires compare each
      # release record against a zip built from the tree, so record-against-tree fails on
      # the pull request that causes it. Nothing compared deployed-against-record, and the
      # gap is not theoretical: on 2026-08-01 two release dispatches ran minutes apart from
      # the same account, harmless only because both built from the same commit. The
      # workflow queues releases rather than interleaving them, which does not stop the
      # second releaser recording the first one's digest as their own.
      #
      # No translation of the exit code here, unlike the two jobs above. Those wrap tools
      # that report a finding without a machine-readable reason, so the step supplies one.
      # This one prints its own reason and its own sentence, and distinguishes "the digests
      # disagree" from "I could not look" in its exit code; restating that would be a
      # second place for the two to drift apart.
      #
      # There is a window in which this is legitimately red and a re-run clears it: a
      # release is recorded in one commit and deployed by CI when that commit reaches main,
      # so between the merge and the deploy the record describes bytes the account does not
      # have yet. It is minutes wide and this runs once a day at 05:00, so it is a caveat
      # for whoever dispatches this by hand after a release rather than a reason to soften
      # the job. The failure names both digests, so the case is recognisable from the log.
      - name: Compare what AWS is running against what was released
        run: uv run --frozen python tools/verify_deployed_lambdas.py

  deployed-stack-templates:
    name: the deployed stacks are the templates main declares
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS AN APPLY, NOT A DIFF. Every other check in this repository
      # compares the repository against itself, and the stacks under infra/iam/ are applied
      # by hand from laptops with no run log at all. On 2026-08-01 an s3:DeleteObject grant
      # was added to the GPU workload role and applied at 17:11; at 17:53 the same stack was
      # applied from a branch cut before the grant existed and the grant was gone. Nothing
      # warned anybody, because a change set shows what the template being applied says and
      # not what it omits relative to what is live.
      #
      # No translation of the exit code, for the reason the job above gives. The tool prints
      # its own reason and its own sentence and separates a disagreement from an unanswered
      # question in its exit code, and restating that here would be a second place for the
      # two to drift apart.
      #
      # There is a window in which this is legitimately red and a re-run clears it, and it is
      # wider than the release job's: a CI stack is applied when its change reaches main, so
      # between the merge and the deploy the template on main is not the one deployed. It is
      # minutes wide against a schedule that runs once a day, so it is a caveat for whoever
      # dispatches this by hand after a merge rather than a reason to soften the job.
      - name: Compare each deployed stack against the template main declares
        run: uv run --frozen python tools/verify_deployed_stacks.py

  visibility-board:
    name: the three records of a run agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS A RUN NOBODY CAN ACCOUNT FOR, AND THE UNION IS NOT THE POINT.
      # Three systems each hold a third of the truth about a run. W&B holds what it logged,
      # the account holds what it ran on, and the outputs bucket holds what it left behind,
      # and nothing joins them, so a run present in one and absent from the other two stays
      # that way. Measured live on 2026-08-02 the account was running 46 runs that log nowhere
      # anybody can find, and the bucket held a nine gibibyte prefix whose directory name is a
      # uuid4, so no run id can ever match it and nothing says what config produced it.
      #
      # There is no fetch step. The board syncs the lineage prefixes it needs itself, because
      # the attempt records it prices unlogged spend from are a prefix the reader role does not
      # hold; a fetch step would have to carry the same degradation the tool already carries,
      # and the two spellings would drift.
      #
      # The exit code is translated here rather than left to the tool, which is the
      # checkpoint job's arrangement and not the release job's. The board's output is a
      # markdown report meant for the step summary, so this step has a body whatever else it
      # does, and the two non-zero exits mean different things: 1 is a disagreement and sends
      # the reader to a run, 2 is a source that was not read and sends them to a grant. A
      # reader who cannot tell those apart goes hunting a submitter on the morning a
      # credential lapsed.
      - name: Join what W&B, the account and the outputs bucket each say
        run: |
          set -uo pipefail
          status=0
          uv run --frozen python tools/visibility_board.py --output board.md || status=$?

          if [[ -s board.md ]]; then
            cat board.md >> "${GITHUB_STEP_SUMMARY}"
            cat board.md
          fi

          if [[ "${status}" -eq 2 ]]; then
            echo "visibility_board_incomplete" >&2
            echo "A source was not read, so the comparisons that need it were not made. The" >&2
            echo "board above names each gap and what stopped being answerable, and quotes" >&2
            echo "the IAM statement where a grant is what is missing." >&2
            exit 1
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "the_three_records_of_a_run_disagree" >&2
            echo "A run is in one of the three sources and not the others. The board above" >&2
            echo "says which runs and which way each disagreement runs." >&2
            exit 1
          fi

  placement-verdicts:
    name: the recorded placement verdicts are ones the queues support
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS THE ACCOUNT'S NEIGHBOURS, NOT A DIFF. config/capacity.yaml
      # records whether EC2 will sell this account each of seventeen shapes, and every one of
      # the eight times it has been wrong it said a machine could not be had when it could.
      # The instrument that produced those eight was a one-shot pool probe; the instrument
      # that overturned them every time was a Batch queue that kept asking. This reads the
      # queues.
      #
      # It writes nothing. The file is nine tenths reviewed prose, and a bot editing it would
      # need a write credential, a pull-request path and a surgical anchored substitution --
      # three new failure points bought to save one hand edit. The role this assumes holds no
      # write anywhere in the account, which is the same argument from the other side.
      #
      # The exit code is translated here rather than left to the tool, which is the
      # visibility board's arrangement and not the release job's. The report is markdown meant
      # for the step summary, so this step has a body whatever else it does, and the two
      # non-zero exits send a reader to different places: 1 is a disagreement and sends them
      # to a compute profile, 2 is a grant or a credential. Somebody who cannot tell those
      # apart goes re-measuring a pool on the morning a role lapsed.
      - name: Recompute each placement verdict from the sixteen queues
        run: |
          set -uo pipefail
          status=0
          uv run --frozen python tools/verify_placement_verdicts.py --output placement.md || status=$?

          if [[ -s placement.md ]]; then
            cat placement.md >> "${GITHUB_STEP_SUMMARY}"
            cat placement.md
          fi

          if [[ "${status}" -eq 2 ]]; then
            echo "placement_verdicts_unusable" >&2
            echo "The queues were not read, so no verdict was recomputed and this run says" >&2
            echo "nothing about config/capacity.yaml either way. The error above says which" >&2
            echo "read was refused; a denial is usually batch:ListJobs or batch:DescribeJobs," >&2
            echo "granted in infra/iam/audit-reader-role.yaml and applied by hand." >&2
            exit 1
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "placement_verdict_disagrees_with_the_account" >&2
            echo "A shape's recorded 'places' verdict is not one its queue supports. The" >&2
            echo "table above says what each queue shows and which way the disagreement" >&2
            echo "runs. Nothing was rewritten: the edit is a person's, in a pull request." >&2
            exit 1
          fi

  substrate-capture:
    name: today is written down before its sources forget it
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the audit reader role is deployed
        env:
          ROLE_ARN: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "audit_reader_role_not_deployed" >&2
            echo "AWS_AUDIT_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role is infra/iam/audit-reader-role.yaml, applied from a laptop like" >&2
            echo "every IAM stack here. See infra/README.md for the stack name and the" >&2
            echo "repository variable it needs." >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # WHAT THIS CATCHES IS NOTHING, AND THAT IS WHY IT IS DIFFERENT FROM EVERY OTHER JOB
      # HERE. The other eight compare two things and go red when they disagree. This one
      # takes a reading and writes it down, because two of the four sources it reads forget:
      # Batch drops a job about a week after it ends, and CloudWatch keeps the stdout of a
      # run for ninety days. Every verdict in this file can be recomputed tomorrow from
      # sources that will still be there. A reading cannot, so it is taken first and what to
      # make of it is decided later.
      #
      # The date is UTC because the runner is and because the branch this lands on is keyed
      # by day. A local date would produce two names for one morning.
      #
      # The tool exits 2 when it could not read and 0 when it read something, and it has no
      # exit 1 because it judges nothing. A refused source is not a failure of this job --
      # the reading carries the refusal, which is the point of writing the gaps into the file
      # rather than only into this log.
      - name: Read the account and write today down
        run: |
          set -uo pipefail
          reading="substrate/$(date -u +%F).json"
          status=0
          uv run --frozen python tools/read_substrate.py --write "${reading}" > reading.txt \
            || status=$?
          cat reading.txt
          {
            echo "## The reading of $(date -u +%F)"
            echo
            echo '```'
            cat reading.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${status}" -ne 0 ]]; then
            echo "substrate_not_read" >&2
            echo "No reading was taken, so this morning has no record and two of the four" >&2
            echo "sources will have forgotten some of it by the time anybody asks. The" >&2
            echo "error above says which read was refused. Nothing was written." >&2
            exit 1
          fi
          if [[ ! -s "${reading}" ]]; then
            echo "substrate_reading_is_empty" >&2
            echo "The tool reported success and left no file, which means the write is not" >&2
            echo "wired to the read. tools/read_substrate.py --write is what produces it." >&2
            exit 1
          fi

      # BEFORE ANYTHING ELSE HAPPENS TO IT, AND UNCONDITIONALLY. The artifact is how the
      # reading reaches the job that commits it, and it is also the copy that survives a
      # branch push being refused. Ninety days is the longest retention available and is the
      # same ninety days CloudWatch keeps a run log for, which is a coincidence worth not
      # relying on: the branch is the durable copy and this is the hand-off.
      - name: Publish the reading
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: substrate
          path: substrate/
          if-no-files-found: warn
          retention-days: 90

  substrate-history:
    name: the readings are kept where they can be diffed
    needs: substrate-capture
    # ALWAYS, BECAUSE A PARTIAL READING IS STILL A READING. substrate-capture goes red when a
    # source was refused and still writes what it did read, and the morning a grant lapsed is
    # exactly the morning somebody will want the file. What it does not do is invent one: the
    # capture writes nothing at all when the collection failed outright, so there is no file
    # to commit and this exits without one.
    if: always()
    runs-on: ubuntu-latest
    # THE ONLY WRITE IN THIS FILE, AND IT IS DELIBERATELY IN A JOB THAT CANNOT REACH AWS. No
    # job here holds both a credential into the account and a write into this repository; a
    # reader that could commit could publish a reading it made up, which is the same argument
    # infra/iam/audit-reader-role.yaml makes for the role holding no write in the account.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Collect the reading
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: substrate
          path: substrate/

      # AN ORPHAN BRANCH, APPENDED TO RATHER THAN FORCE-PUSHED. main refuses this push and
      # should. Branch protection requires two status checks this token cannot produce, and
      # buying an exception to that in order to publish a record is the wrong trade. The
      # required review that used to be the reason came off main on 2026-08-05 and the
      # checks are what refuse the push now, which changes nothing about where this goes.
      # What
      # makes the branch the right place is that history is the product here -- the sources
      # forget, so last week is the only copy of last week -- which is the opposite of the
      # run index, where a snapshot refreshed on state change is overwritten in place and its
      # history is noise. Both need excluding from protection rules; only the other one needs
      # a force push. The single writer for this branch is the concurrency group at the top
      # of this file.
      - name: Keep the reading on the machine/substrate branch
        run: |
          set -euo pipefail
          [[ -n "$(ls -A substrate 2>/dev/null || true)" ]] || {
            echo "no reading was published, so there is nothing to keep"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin machine/substrate --depth=1 || true
          git switch machine/substrate 2>/dev/null || git switch --orphan machine/substrate
          git add --force substrate/
          git diff --cached --quiet || git commit -m "substrate: $(date -u +%F)"
          git push origin machine/substrate

  open-asks:
    name: which asks have stopped being asks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading this repository's own issues. Nothing here writes anything anywhere, which is
      # why this job needs no role and no repository variable -- the two things that make every
      # other job on this schedule able to fail before it starts. It is the only job in this
      # file that cannot fail for a reason outside the question it was asked.
      issues: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # NO continue-on-error, AND THAT IS NOT AN OVERSIGHT. tools/report_asks.py has no exit
      # code 1 by construction -- a long queue of asks is a finding and never a failure, for the
      # reason tools/report_spend.py states about itself: a red job in a path something else
      # depends on is one step away from being a control. Exit 2 means the count could not be
      # taken, which is a real failure and should be red.
      - name: Count the open asks
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python tools/report_asks.py >> "$GITHUB_STEP_SUMMARY"
