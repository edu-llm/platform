name: "Deploy: Batch execution estate"

# The deployer role trust policy pins job_workflow_ref to
# edu-llm/platform/.github/workflows/deploy-phase3-batch.yml@refs/heads/main.
# Renaming or moving this file silently revokes every deployment. Do not rename it.
on:
  workflow_dispatch:
    inputs:
      # AN OPERATOR'S VIEW OF A RUN, HERE BECAUSE THIS IS WHERE THE CREDENTIAL IS.
      #
      # cancel-run.yml is the workflow researchers use to look at a run, and it assumes
      # sbsandbox-intern-edullm-run-canceller -- a role that describes jobs and stops them
      # and reaches nothing else. That is the right shape for a button thirty-four people
      # can press, and it is not deployed: creating it needs iam:CreateRole, the deployer
      # role deliberately has none, and the credential that does is a laptop one.
      #
      # This deployer role already holds batch:DescribeJobs and batch:ListJobs, and this
      # dispatch is already limited to two admins by the step below. So the operator view
      # costs no new role: it is a report at the end of a deploy that has already run.
      #
      # IT DOES NOT HOLD logs:GetLogEvents, THOUGH THIS COMMENT ONCE CLAIMED IT DID. That
      # claim was the justification for reading the log here, and the fallback branch of the report
      # branch said the opposite in as many words. infra/iam/infra-deployer-role.yaml settles
      # it: GetLogEvents and FilterLogEvents are absent from this role deliberately, so a
      # deploy credential can never become a way to read the logs of anyone in this shared
      # account. The header was wrong; the policy is what it is.
      #
      # WHAT THAT COSTS, SO THE NEXT PERSON DOES NOT REDISCOVER IT. This report exists to
      # explain a container that dies in seconds, and the only evidence such a container
      # leaves is its log. Four training runs on 2026-08-01 died between five and forty
      # seconds with exit 1 and "Essential container in task exited" -- which is what a bad
      # hyperparameter, a lost quote, a missing entry point and a broken credential all look
      # like from outside. Each was diagnosed by guessing and resubmitting.
      #
      # The fix is a scoped grant: logs:GetLogEvents on the two /aws/batch/ log groups this
      # platform creates and nowhere else. The existing argument in the role template is
      # about the other tenants in this account, whose Lambda and application logs are none of this
      # business of this platform; it is not an argument about output written by containers this
      # operator of this role launched. That grant is not made here because applying it needs the
      # laptop credential the role template is deployed with, and making the template say
      # something the deployed role does not is the drift every capture test exists to catch.
      #
      # cancel-run.yml stays as it is either way: it names the stream and stops, because
      # widening a two-verb role to read logs would spend the argument for its shape.
      #
      # A DISPATCH CARRYING A RUN ID NOW DEPLOYS NOTHING, having previously deployed
      # everything. The first version let the deploy run and appended the report, on the
      # argument that gating eight steps is eight chances to gate one wrongly while an
      # empty changeset costs only three minutes.
      #
      # What that argument missed is the shape of the use. A job sits in RUNNABLE while
      # Batch finds it a GPU, and the only way to learn that it moved is to ask again --
      # so this gets pressed every few minutes for as long as a run takes, not once. Each
      # of those reconciled six CloudFormation stacks in a shared account, against a
      # working tree that may be mid-change, while another agent deploys into the same
      # stacks. An empty changeset is cheap; a non-empty one nobody asked for is not.
      #
      # So the deploy steps carry `if: inputs.describe_run == ''`, and the eighth-chance
      # worry is answered by a test that holds every step which touches the account to
      # carrying that condition, rather than by trusting the list to stay complete.
      describe_run:
        description: "A run id to report on — status, why, exit code, the command it was given. Or `queues` for everything waiting. Reports only: no stack is deployed. Leave empty for an ordinary deploy."
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-phase3-batch.yml
      - infra/outputs-bucket.yaml
      - infra/batch-network.yaml
      - infra/batch-compute.yaml
      - infra/batch-compute-gpu.yaml
      - infra/batch-compute-gpu-shapes.yaml
      - infra/batch-events.yaml
      - infra/expiry-janitor.yaml
      - infra/notifications.yaml
      - infra/admission-state-machine.yaml

permissions:
  contents: read

# The same group Phase 2 uses, and that is not a copy-paste slip. These two workflows
# deploy one stack in common -- sbsandbox-intern-edullm-phase2-admission, which Phase 3
# amends rather than replaces -- and infra/admission-state-machine.yaml is in both path
# filters, so a push that touches it starts both runs. Sharing the group makes the second
# wait instead of racing the first into a mid-update stack. The group keeps Phase 2's name
# because Phase 2 named it first and renaming it is an edit to that workflow.
#
# ASKING ABOUT A RUN TAKES A DIFFERENT GROUP, because it changes nothing. A describe
# dispatch skips every deploy and verify step below, so serialising it against the stacks
# would make a question wait on somebody else's deploy -- and, worse, make a deploy wait on
# a question, which is the direction that costs. Per run id rather than one shared name so
# two people asking about two runs do not queue behind each other either.
concurrency:
  group: >-
    ${{ inputs.describe_run != ''
        && format('describe-{0}', inputs.describe_run)
        || 'cloudformation-sbsandbox-intern-edullm-phase2' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy, and verify CPU and GPU batch execution
    runs-on: ubuntu-latest
    # Longer than Phase 2's fifteen. A compute environment takes a few minutes to reach
    # VALID because Batch creates an ECS cluster and an Auto Scaling group behind it, and a
    # VPC with five subnets is not instant either.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # WHO MAY DEPLOY BY HAND, ENUMERATED RATHER THAN MATCHED. workflow_dispatch is
      # offered to anybody holding write, and write stopped meaning "an admin" when the
      # pilot opened. Without this, a researcher can reconcile a CloudFormation stack into
      # the sandbox account by pressing a button, through a role they cannot see and were
      # never shown.
      #
      # Only the dispatch path is guarded. A push to main has already been through a
      # code-owner review of both the template and the workflow that applies it, and
      # refusing there would strand an approved infrastructure change with no way to land.
      #
      # It fails rather than skipping. A job-level `if` that evaluates false reports the
      # job as skipped, which reads as success in the checks list and tells the person
      # nothing at all.
      #
      # First in the job, before the checkout, so a refused dispatch does no work. The list
      # is checked against config/organization.yaml by tests/test_deploy_authorization.py,
      # which also holds all three deploy workflows to carrying this same step -- three
      # copies kept honest by a test, the way the job queue name already is, rather than by
      # a composite action that would move the control out of the file it protects.
      - name: Refuse a hand-started deploy from somebody who may not make one
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "${ACTOR}" in
            philote-dev|BritishAmericqn) ;;
            *)
              echo "deploy_dispatch_not_authorized:${ACTOR}" >&2
              echo "Deploying infrastructure by hand is limited to the repository admins." >&2
              echo "Open a pull request against the template instead: a merge to main deploys it after a code-owner review." >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          # Account IDs are not secret, but the verification step reads a state machine ARN
          # out of a stack output, and masking keeps that ARN from turning a public log into
          # a free lookup of the sandbox account number.
          mask-aws-account-id: true

      # WHAT VALIDATE-TEMPLATE CHECKS, AND WHAT IT DOES NOT. It parses the document and
      # reports the parameters and capabilities it found. It does not check a resource's
      # properties against that resource's schema: a template declaring an
      # AWS::Batch::JobQueue whose only property is one Batch has never heard of validates
      # clean, measured on 2026-07-27. So a pass here means "this is a CloudFormation
      # template", not "this will deploy".
      #
      # It is still worth running first, because the failure it does catch -- a malformed
      # document -- is the one worth catching before three stacks have already changed. What
      # covers the rest is tests/test_phase3_infrastructure.py against the committed files,
      # and the verification step against the deployed account.
      #
      # EVERY TEMPLATE IS UPLOADED AND VALIDATED BY URL, BECAUSE ONE OF THEM NO LONGER FITS.
      #
      # CloudFormation caps a template carried in the request body at 51,200 bytes, and the
      # cap is not a deploy-time one a rollback recovers from: ValidateTemplate,
      # CreateChangeSet and CreateStack all refuse the call outright with "Member must have
      # length less than or equal to 51200". Measured on 2026-08-02,
      # infra/batch-compute-gpu-shapes.yaml is 68,715 bytes -- thirteen GPU shapes and the
      # vCPU arithmetic explaining them -- so the line that used to validate it inline could
      # not have run, and the next push to main would have failed here.
      #
      # A template read out of S3 is capped at 1 MB instead. `deploy` reaches that cap with
      # --s3-bucket and uploads the file itself. `validate-template` has no such flag: it
      # takes --template-url or --template-body and nothing else, so the object has to be in
      # the bucket before the validation rather than as a side effect of the deploy. That is
      # why the upload lives in this step and not in the deploy steps below.
      #
      # ALL SEVEN RATHER THAN THE ONE OVER THE LINE. infra/admission-state-machine.yaml is
      # 49,632 bytes, which is 1,568 from the same cliff -- one paragraph of the kind of
      # comment this repository writes everywhere. Two of seven at or over is not an
      # exception, and a workflow where six templates take one path and the seventh takes
      # another is a trap for whoever adds the eighth. Uniformity costs six more PutObject
      # calls of a few kilobytes each per deploy, and tests/test_phase3_batch_deployment_workflow.py
      # holds the list to being all of them rather than a chosen few.
      #
      # THE KEY LAYOUT, WHICH CARRIES TWO NAMING SCHEMES BECAUSE TWO THINGS WRITE HERE.
      # cloudformation-templates/ is the third top-level name in the artifacts bucket,
      # beside admission-validator/ and lifecycle-recorder/, and it says what it holds.
      # Directly under it, one object per template named for the file, which is what the
      # --template-url lines below read and what a person opens when a validation fails.
      # Under cloudformation-templates/checksummed/, the objects `deploy --s3-bucket`
      # writes: the CLI names those for the checksum of the file rather than for the file,
      # and skips the upload when that key already exists. They sit in a prefix of their own
      # so a page of hex names is not read as damage to the readable half.
      #
      # THE BUCKET IS VERSIONED AND NOTHING EXPIRES ANYTHING IN IT. The readable half gains
      # a version per template per deploy, about 200 KB in all, and the checksummed half
      # gains a key the first time a given template body is deployed and nothing after. That
      # is noise beside the Lambda zips already here, and it buys something: the version at
      # a readable key is the exact bytes some validation passed on. If it ever stops being
      # noise the answer is a lifecycle rule on the prefix in infra/artifacts-bucket.yaml,
      # and s3:PutLifecycleConfiguration is already granted.
      #
      # NO IAM CHANGE WAS NEEDED FOR ANY OF THIS. infra/iam/infra-deployer-role.yaml grants
      # s3:PutObject and s3:GetObject on sbsandbox-intern-edullm-artifacts/*, in the inline
      # policy named deploy-phase2-admission-stacks, for the release procedure in the Phase 2
      # workflow. IAM evaluates the inline policies of a role together, so a grant named for
      # Phase 2 is in reach from a step in Phase 3. It is the same role and the same session.
      #
      # Path-style URLs, not virtual-hosted. That is the form the CLI itself builds when
      # --s3-bucket hands a TemplateURL to CloudFormation, so both halves of this workflow
      # address the same object the same way.
      - name: Upload and validate the CloudFormation templates
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/outputs-bucket.yaml \
            --body infra/outputs-bucket.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/outputs-bucket.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/batch-network.yaml \
            --body infra/batch-network.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/batch-network.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/batch-compute.yaml \
            --body infra/batch-compute.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/batch-compute.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/batch-compute-gpu.yaml \
            --body infra/batch-compute-gpu.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/batch-compute-gpu.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/batch-compute-gpu-shapes.yaml \
            --body infra/batch-compute-gpu-shapes.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/batch-compute-gpu-shapes.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/notifications.yaml \
            --body infra/notifications.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/notifications.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/batch-events.yaml \
            --body infra/batch-events.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/batch-events.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/expiry-janitor.yaml \
            --body infra/expiry-janitor.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/expiry-janitor.yaml
          aws s3api put-object \
            --bucket sbsandbox-intern-edullm-artifacts \
            --key cloudformation-templates/admission-state-machine.yaml \
            --body infra/admission-state-machine.yaml
          aws cloudformation validate-template \
            --template-url https://s3.${AWS_REGION}.amazonaws.com/sbsandbox-intern-edullm-artifacts/cloudformation-templates/admission-state-machine.yaml

      # No --capabilities on any deploy here, for the reason the Phase 2 workflow states and
      # checks: CloudFormation demands CAPABILITY_IAM or CAPABILITY_NAMED_IAM only for
      # templates containing an IAM entity, and none of these five contains one. The four
      # Phase 3 roles and the instance profile live in infra/iam/ and are applied from a
      # laptop, because this role holds no iam:CreateRole.
      #
      # Withholding the acknowledgement is worth more than it costs: a template that grew an
      # IAM resource fails at InsufficientCapabilities, naming the reason, instead of at an
      # AccessDenied several minutes into a rollback.
      #
      # --s3-bucket on all seven, for the reason set out at length above the validation step:
      # one of these templates is past the 51,200-byte inline limit and a second is 1,568
      # bytes short of it. The CLI uploads the file and passes a TemplateURL, keyed by the
      # checksum of the file, so an unchanged template writes no object at all.
      #
      # THE ORDER OF THE NEXT FIVE STEPS IS THE ONLY THING THAT ENFORCES IT, for three of
      # the four dependencies. infra/batch-compute.yaml imports the network stack's exported
      # subnet and security group IDs, so CloudFormation does enforce that one -- an import
      # of an export that does not exist fails the deploy. Nothing links the others.
      - name: Deploy Phase 3 outputs bucket stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-outputs \
            --template-file infra/outputs-bucket.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      - name: Deploy Phase 3 network stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-network \
            --template-file infra/batch-network.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # After the network, because the compute environment imports its subnets and security
      # group. Also after AWSServiceRoleForBatch exists, which is a laptop command in
      # infra/README.md and not something this workflow can do or check -- a compute
      # environment created without it fails in a way that names the role and not the reason.
      - name: Deploy Phase 3 batch compute stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-batch \
            --template-file infra/batch-compute.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # The GPU sibling, deployed here rather than from a workflow of its own, and the
      # reason is the events stack below. That stack's rule now names both queues, so a
      # separate Phase 4 workflow would put the GPU queue's creation and the rule that
      # matches it in two runs with nothing ordering them -- reintroducing exactly the
      # deploy-order seam the next comment exists to close, across a boundary no test can
      # see. One workflow keeps compute-before-events true for both queues.
      #
      # It imports the same network stack exports as the CPU environment, so
      # CloudFormation enforces that dependency. Nothing enforces its ordering against the
      # GPU IAM stack, which is applied from a laptop before this runs.
      - name: Deploy Phase 4 GPU batch compute stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase4-gpu \
            --template-file infra/batch-compute-gpu.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # THE OTHER THIRTEEN GPU SHAPES, IN A SECOND STACK RATHER THAN IN THE ONE ABOVE. That
      # stack had running training jobs when these were added, and an update to it replaces
      # nothing by itself but does put a live compute environment through a change nobody
      # needed. A separate stack also means the thirteen can be rolled back without touching
      # the shape researchers are already using.
      #
      # After the stack above rather than beside it, because this template creates no log
      # group. It names /aws/batch/sbsandbox-intern-edullm-gpu, which that one creates, and
      # the awslogs driver takes a string so CloudFormation enforces nothing. Deployed first
      # into an account without that stack, these thirteen definitions would register cleanly
      # and log nowhere.
      - name: Deploy the remaining GPU shapes stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase4-gpu-shapes \
            --template-file infra/batch-compute-gpu-shapes.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # RECOVER A CREATE THAT FAILED AND ROLLED BACK, BECAUSE THE STEP BELOW CANNOT.
      #
      # A stack whose first create failed sits in ROLLBACK_COMPLETE holding none of its
      # resources, and CloudFormation refuses to update it. The step below computes an update
      # change set, is told the stack cannot be updated, and exits non-zero. So one failed
      # create breaks every later dispatch of this workflow -- including dispatches with
      # nothing to do with notifications -- and the three steps below it never run.
      #
      # THAT HAPPENED ON 2026-08-05. The step below created the stack at 23:42 UTC,
      # CreateFunction was refused for want of iam:PassRole on
      # sbsandbox-intern-edullm-notifier-lambda, and the stack rolled back six seconds later
      # holding nothing. Recovering it took a person with a laptop credential deleting the
      # stack by hand. Deleting it here removes the class rather than that one instance, and
      # the permission fix it was waiting on is a separate change to the deployer role.
      #
      # NO NEW GRANT WAS NEEDED FOR THIS. The deployer role already answers allowed for
      # cloudformation:DeleteStack on the ARN of this stack, measured on 2026-08-05.
      #
      # ONE STATUS AND NOTHING ELSE, WHICH IS THE WHOLE OF THE BLAST RADIUS ARGUMENT. A guard
      # that quietly deletes a healthy stack is far worse than the problem it solves. So this
      # deletes only from ROLLBACK_COMPLETE, the one status a stack can hold while provably
      # containing nothing: it is reachable only from a first create that failed, and that
      # create rolled back every resource it had begun. Every other status is left alone and
      # said out loud, and that deliberately includes UPDATE_ROLLBACK_COMPLETE, which is also
      # a rollback and also not healthy. It is not deleted, because that stack is live and
      # holds the resources of the template it carried before the update that failed.
      #
      # THE STATUS IS NOT TRUSTED ON ITS OWN EITHER. Every resource is listed and every one
      # must read DELETE_COMPLETE before anything is deleted. That costs one call and it is
      # what stands between a wrong belief about this status and a stack full of queues.
      #
      # It refuses rather than skipping when that check fails. A skip would leave the deploy
      # below to fail on the stack state, which is the failure this step exists to prevent
      # and which reads as a broken template.
      - name: Delete the notifier stack if a failed create left it unupdatable
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          stack=sbsandbox-intern-edullm-notifications
          status_file="${RUNNER_TEMP}/notifications-status.txt"
          held_file="${RUNNER_TEMP}/notifications-held-resources.txt"
          aws cloudformation describe-stacks --stack-name "${stack}" --query 'Stacks[0].StackStatus' --output text > "${status_file}" 2>/dev/null || echo ABSENT > "${status_file}"
          read -r status < "${status_file}"
          if [[ "${status}" == "ABSENT" ]]; then
            echo "::notice::No stack called ${stack}, so the step below creates it."
            exit 0
          fi
          if [[ "${status}" != "ROLLBACK_COMPLETE" ]]; then
            echo "::notice::${stack} is in ${status}. This guard deletes only from ROLLBACK_COMPLETE, so it is left exactly as it is."
            exit 0
          fi
          aws cloudformation list-stack-resources --stack-name "${stack}" --query 'StackResourceSummaries[?ResourceStatus!=`DELETE_COMPLETE`].LogicalResourceId' --output text > "${held_file}"
          if [[ -s "${held_file}" ]]; then
            echo "::error::${stack} is in ROLLBACK_COMPLETE and still holds resources that do not read DELETE_COMPLETE, so it is not the empty failed create this guard deletes. Nothing has been deleted. The resources it still holds are listed below and somebody has to look at this by hand."
            cat "${held_file}"
            exit 1
          fi
          echo "::warning::Deleting ${stack} and then creating it again. It is in ROLLBACK_COMPLETE, which means its first create failed and rolled every resource back out, so it holds nothing and CloudFormation will not accept an update to it. Without this, the step below would fail on the state of the stack rather than on anything wrong with the template. Why that create failed is in the stack events and is worth reading, because this deletion does not fix it."
          aws cloudformation delete-stack --stack-name "${stack}"
          aws cloudformation wait stack-delete-complete --stack-name "${stack}"
          echo "::notice::Deleted ${stack}, which held no resources. The step below now creates it from scratch."

      # BEFORE THE EVENTS STACK, BECAUSE THE RULE'S SECOND TARGET NAMES A QUEUE THIS CREATES.
      # EventBridge does not check that an SQS target exists at PutTargets time, so the wrong
      # order deploys perfectly and drops every notification until somebody notices a channel
      # that has gone quiet, which is the exact failure this whole stack exists to detect.
      - name: Deploy the notifier stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-notifications \
            --template-file infra/notifications.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # After every compute stack, because the EventBridge rule's pattern names the job queue
      # ARNs. Nothing makes CloudFormation check that: the pattern is a string, and a rule
      # scoped to a queue that does not exist deploys perfectly and matches nothing forever.
      - name: Deploy Phase 3 batch events stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-events \
            --template-file infra/batch-events.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # THE EXPIRY JANITOR, WHICH IS NOTHING TO DO WITH BATCH AND IS HERE ANYWAY. It sweeps EC2
      # instances a person launched through edullm-researcher, on a schedule rather than on an
      # event. It is a step on this file because the deployer role's trust pins
      # job_workflow_ref to three files with StringEquals, and a new workflow file would need
      # that trust amended by the AWS access the amendment exists to grant -- infra/README.md
      # calls that a door that only opens from inside.
      #
      # No --capabilities: nothing in this template is IAM. The role it names is applied from a
      # laptop as sbsandbox-intern-edullm-janitor-iam, and this stack fails on CreateFunction
      # until the deployer carries iam:PassRole for it -- also a laptop deploy. See
      # infra/README.md, the researcher lane table.
      #
      # IT SKIPS WHILE THE CODE OBJECT HAS NEVER BEEN UPLOADED, and that is the whole of the
      # guard below. The template pins a placeholder S3ObjectVersion because the zip has been
      # built and never uploaded, so deploying it would fail -- and failing here would break
      # every unrelated dispatch of this workflow for a stack nobody can create yet. The skip
      # is loud rather than silent, tools/verify_deployed_stacks.py reports the stack as
      # declared and not deployed for as long as it lasts, and tests/test_janitor_package.py
      # refuses to let the guard outlive the placeholder it checks for.
      - name: Deploy the expiry janitor stack
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          if grep -q 'S3ObjectVersion: PLACEHOLDER-UNTIL-THE-FIRST-UPLOAD' infra/expiry-janitor.yaml; then
            echo "::notice::the expiry janitor's zip has never been uploaded, so this stack is skipped. Release it from a laptop with tools/release_lambda.py --function janitor, and land the version id and digest it writes."
            exit 0
          fi
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-janitor \
            --template-file infra/expiry-janitor.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # Last, and it is the Phase 2 stack under its Phase 2 name. The amended state machine
      # submits to the queue and job definition the batch stack creates, so deploying it
      # first would leave a submit state pointing at nothing -- which fails at run time
      # rather than at deploy time, on the first accepted run.
      - name: Deploy the amended admission state machine
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase2-admission \
            --template-file infra/admission-state-machine.yaml \
            --s3-bucket sbsandbox-intern-edullm-artifacts \
            --s3-prefix cloudformation-templates/checksummed \
            --no-fail-on-empty-changeset

      # WHAT THIS STEP CANNOT PROVE, said here so the green tick is read correctly. A
      # compute environment reporting VALID and ENABLED establishes that Batch accepted the
      # instance type, the subnets, the security group and the instance profile. It
      # establishes nothing about whether a job can run, because Batch does not fail a job
      # it cannot place -- it waits, indefinitely, with no error. Only a job observed in
      # RUNNING proves the placement, the egress and the ECR pull, and this workflow cannot
      # submit one: the deployer holds no batch:SubmitJob and must not, because the
      # admission state machine is the only principal in the account that may start compute.
      #
      # That proof comes from tools/probe_batch_compute.py before this stack is built, and
      # from the Wave 5 live matrix afterwards.
      # WHY THE STACK REFUSED, WHICH THE DEPLOY ITSELF DOES NOT SAY.
      #
      # `cloudformation deploy` prints "Failed to create/update the stack. Run the following
      # command to fetch the list of events leading up to the failure" and exits 255. The
      # command it names is one nobody can run: the deployer role is assumed inside this job
      # and is gone by the time a person reads the log, and no laptop credential in this
      # project can reach the account at all right now. So the reason lives for thirty
      # seconds inside a runner and is then unreachable forever.
      #
      # That happened on 2026-08-01 08:06 UTC. Adding JobStateTimeLimitActions to the two job
      # queues was refused, the deploy reported only its own exit code, and diagnosing it
      # meant reading the template and guessing at which of the property constraints had been
      # violated.
      #
      # if: failure() rather than always(), because a green deploy has no events worth
      # printing and this would otherwise add noise to every run. It reads the events rather
      # than the stack status, and only the FAILED ones, because a rolled-back stack reports
      # UPDATE_ROLLBACK_COMPLETE at the top level -- a status that says something went wrong
      # and never says what.
      #
      # continue-on-error so that a diagnostic which cannot itself run does not replace the
      # deploy failure it was trying to explain with a different one.
      - name: Say why the stack refused
        if: failure() && inputs.describe_run == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          for stack in \
            sbsandbox-intern-edullm-phase3-outputs \
            sbsandbox-intern-edullm-phase3-network \
            sbsandbox-intern-edullm-phase3-batch \
            sbsandbox-intern-edullm-phase4-gpu \
            sbsandbox-intern-edullm-phase3-events \
            sbsandbox-intern-edullm-phase2-admission
          do
            echo "--- ${stack}"
            aws cloudformation describe-stack-events \
              --stack-name "${stack}" \
              --max-items 40 \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].{logical:LogicalResourceId,status:ResourceStatus,reason:ResourceStatusReason}" \
              --output table || echo "no events readable for ${stack}"
          done

      - name: Verify CPU and GPU batch execution
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          state_machine_arn_file="${RUNNER_TEMP}/phase3-state-machine-arn.txt"
          compute_environment_json="${RUNNER_TEMP}/phase3-compute-environment.json"
          job_queue_json="${RUNNER_TEMP}/phase3-job-queue.json"
          job_definition_json="${RUNNER_TEMP}/phase3-job-definition.json"
          gpu_compute_environment_json="${RUNNER_TEMP}/phase4-gpu-compute-environment.json"
          gpu_job_queue_json="${RUNNER_TEMP}/phase4-gpu-job-queue.json"
          gpu_job_definition_json="${RUNNER_TEMP}/phase4-gpu-job-definition.json"
          rule_json="${RUNNER_TEMP}/phase3-lifecycle-rule.json"
          state_machine_json="${RUNNER_TEMP}/phase3-state-machine.json"
          outputs_json="${RUNNER_TEMP}/phase3-outputs-versioning.json"

          aws cloudformation describe-stacks \
            --stack-name sbsandbox-intern-edullm-phase2-admission \
            --query "Stacks[0].Outputs[?OutputKey=='StateMachineArn'].OutputValue" \
            --output text > "${state_machine_arn_file}"

          read -r state_machine_arn < "${state_machine_arn_file}"

          aws batch describe-compute-environments \
            --compute-environments sbsandbox-intern-edullm-cpu \
            --query "computeEnvironments[0].{name:computeEnvironmentName,type:type,status:status,state:state,minvCpus:computeResources.minvCpus,subnetCount:length(computeResources.subnets)}" \
            --output json > "${compute_environment_json}"

          aws batch describe-job-queues \
            --job-queues sbsandbox-intern-edullm-cpu \
            --query "jobQueues[0].{name:jobQueueName,status:status,state:state}" \
            --output json > "${job_queue_json}"

          aws batch describe-job-definitions \
            --job-definition-name sbsandbox-intern-edullm-cpu-run \
            --status ACTIVE \
            --query "reverse(sort_by(jobDefinitions,&revision))[0].{name:jobDefinitionName,type:type,status:status,digestPinned:contains(containerProperties.image,'@sha256:'),tagged:contains(containerProperties.image,':latest')}" \
            --output json > "${job_definition_json}"

          aws batch describe-compute-environments \
            --compute-environments sbsandbox-intern-edullm-gpu \
            --query "computeEnvironments[0].{name:computeEnvironmentName,type:type,status:status,state:state,minvCpus:computeResources.minvCpus,subnetCount:length(computeResources.subnets),imageType:computeResources.ec2Configuration[0].imageType}" \
            --output json > "${gpu_compute_environment_json}"

          aws batch describe-job-queues \
            --job-queues sbsandbox-intern-edullm-gpu \
            --query "jobQueues[0].{name:jobQueueName,status:status,state:state}" \
            --output json > "${gpu_job_queue_json}"

          aws batch describe-job-definitions \
            --job-definition-name sbsandbox-intern-edullm-gpu-run \
            --status ACTIVE \
            --query "reverse(sort_by(jobDefinitions,&revision))[0].{name:jobDefinitionName,type:type,status:status,digestPinned:contains(containerProperties.image,'@sha256:'),tagged:contains(containerProperties.image,':latest'),requestsAGpu:contains(containerProperties.resourceRequirements[].type,'GPU'),injectsTheWandbKey:contains(containerProperties.secrets[].name,'WANDB_API_KEY')}" \
            --output json > "${gpu_job_definition_json}"

          aws events describe-rule \
            --name sbsandbox-intern-edullm-batch-lifecycle \
            --query "{name:Name,state:State,scopedToOurQueue:contains(EventPattern,'job-queue/sbsandbox-intern-edullm-cpu'),scopedToTheGpuQueue:contains(EventPattern,'job-queue/sbsandbox-intern-edullm-gpu')}" \
            --output json > "${rule_json}"

          aws stepfunctions describe-state-machine \
            --state-machine-arn "${state_machine_arn}" \
            --query "{status:status,submitsToBatch:contains(definition,'SubmitToBatch'),writesTheBinding:contains(definition,'WriteBinding'),readsTheImageScan:contains(definition,'ReadImageScan')}" \
            --output json > "${state_machine_json}"

          aws s3api get-bucket-versioning \
            --bucket sbsandbox-intern-edullm-outputs \
            --query "{status:Status}" \
            --output json > "${outputs_json}"

          python - "${compute_environment_json}" "${job_queue_json}" "${job_definition_json}" "${gpu_compute_environment_json}" "${gpu_job_queue_json}" "${gpu_job_definition_json}" "${rule_json}" "${state_machine_json}" "${outputs_json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          # minvCpus is pinned at zero here as well as in the template because this is the
          # number that bills when nobody is looking, and a console edit would not show up
          # in a template test. subnetCount is five because us-east-1e cannot hold a
          # c7i.8xlarge and a sixth subnet would be one Batch considers and can never place
          # into -- which produces a job that waits rather than one that errors.
          expected_compute_environment = {
              "name": "sbsandbox-intern-edullm-cpu",
              "type": "MANAGED",
              "status": "VALID",
              "state": "ENABLED",
              "minvCpus": 0,
              "subnetCount": 5,
          }
          expected_job_queue = {
              "name": "sbsandbox-intern-edullm-cpu",
              "status": "VALID",
              "state": "ENABLED",
          }
          # Booleans rather than the image reference, so this check cannot print the
          # registry host and the account id inside it. digestPinned is the property that
          # matters; tagged is asserted false as well, because an image reference can carry
          # both a tag and a digest and only the digest decides which bytes run.
          expected_job_definition = {
              "name": "sbsandbox-intern-edullm-cpu-run",
              "type": "container",
              "status": "ACTIVE",
              "digestPinned": True,
              "tagged": False,
          }
          # THE ONE CHECK IN THIS FILE THAT CATCHES A FAILURE NOTHING ELSE REPORTS.
          #
          # imageType must be ECS_AL2023_NVIDIA. Left to its default the GPU environment
          # runs the same AMI as the CPU one, which carries no NVIDIA driver -- so an
          # instance launches, joins the cluster, takes the job and runs it on the CPU at
          # GPU prices. Nothing errors. The job does not wait, no permission is denied, and
          # the only trace is that the container cannot see a device. Every other line in
          # this expectation would be satisfied by that environment.
          #
          # subnetCount is five because describe-instance-type-offerings reports g5.xlarge
          # in all five availability zones the network stack has a subnet in. That is not a
          # property of GPU shapes in general and must be re-measured before a different one
          # is promoted: g6e and p4d are absent from us-east-1f.
          expected_gpu_compute_environment = {
              "name": "sbsandbox-intern-edullm-gpu",
              "type": "MANAGED",
              "status": "VALID",
              "state": "ENABLED",
              "minvCpus": 0,
              "subnetCount": 5,
              "imageType": "ECS_AL2023_NVIDIA",
          }
          expected_gpu_job_queue = {
              "name": "sbsandbox-intern-edullm-gpu",
              "status": "VALID",
              "state": "ENABLED",
          }
          # requestsAGpu is the other half of the AMI check above and fails just as quietly
          # on its own: without a GPU entry in resourceRequirements, ECS does not select the
          # NVIDIA runtime for the task, so even on the right AMI no device is attached.
          # Both have to be right and neither reports the other being wrong.
          #
          # injectsTheWandbKey is read as a boolean and never as a value. What is asserted
          # is that a secret of that name is wired, not what it resolves to -- the runner
          # log is world readable.
          expected_gpu_job_definition = {
              "name": "sbsandbox-intern-edullm-gpu-run",
              "type": "container",
              "status": "ACTIVE",
              "digestPinned": True,
              "tagged": False,
              "requestsAGpu": True,
              "injectsTheWandbKey": True,
          }
          # The seam that produces no error anywhere when it breaks. A rule scoped to a
          # queue nobody submits to matches nothing, jobs run, and no lifecycle event,
          # attempt or result record is ever written. Read as booleans so the deployed
          # pattern is compared against the deployed queue names rather than printed. Both
          # queues are asserted because one rule now serves both, and a pattern that lost
          # either half would leave the runs on that queue invisible to lineage.
          #
          # No apostrophe anywhere in a run body, here or above, and it is not a style
          # preference. tests/test_phase3_batch_deployment_workflow.py parses these scripts
          # with shlex to read the aws calls out of them, and one unbalanced quote in a
          # comment makes the whole script unparseable -- so the tests that check this
          # workflow never submits a job, and never prints an account id, fail with a
          # quoting error rather than an answer.
          expected_rule = {
              "name": "sbsandbox-intern-edullm-batch-lifecycle",
              "state": "ENABLED",
              "scopedToOurQueue": True,
              "scopedToTheGpuQueue": True,
          }
          # Three states, because the amendment is three states and a partial deploy that
          # left one out would be an admission path that decides and never submits.
          expected_state_machine = {
              "status": "ACTIVE",
              "submitsToBatch": True,
              "writesTheBinding": True,
              "readsTheImageScan": True,
          }
          expected_outputs_versioning = {"status": "Enabled"}

          expectations = [
              ("compute environment", expected_compute_environment),
              ("job queue", expected_job_queue),
              ("job definition", expected_job_definition),
              ("gpu compute environment", expected_gpu_compute_environment),
              ("gpu job queue", expected_gpu_job_queue),
              ("gpu job definition", expected_gpu_job_definition),
              ("lifecycle rule", expected_rule),
              ("admission state machine", expected_state_machine),
              ("outputs bucket versioning", expected_outputs_versioning),
          ]
          arguments = sys.argv[1:]
          if len(arguments) != len(expectations):
              raise SystemExit("batch verification was handed the wrong number of files")

          failures = []
          for (label, expected), argument in zip(expectations, arguments):
              observed = json.loads(Path(argument).read_text(encoding="utf-8"))
              if observed != expected:
                  failures.append(f"{label}: expected {expected}, observed {observed}")

          if failures:
              raise SystemExit("batch verification failed:\n" + "\n".join(failures))

          print("PHASE3_BATCH_VERIFICATION_PASSED")
          PY

      # THE THIRTEEN SHAPES, IN A STEP OF THEIR OWN AND NOT ADDED TO THE ONE ABOVE. That step
      # names one environment, one queue and one definition per axis and compares each
      # against a written-out expectation; thirteen more of each would be thirty-nine more
      # files and thirty-nine more literals, and the interesting property is the same for
      # all of them. So this loops and the expectation is the loop body.
      #
      # imageType is the check worth having here, for the reason the step above records at
      # length: an environment left on the default AMI carries no NVIDIA driver, so an
      # instance launches, takes the job and runs it on the CPU at GPU prices with nothing
      # erroring anywhere. Thirteen environments is thirteen chances to get that wrong.
      #
      # requestsAGpu and gpuCount together, because the count is what a shape is. A
      # g5.48xlarge definition asking for one GPU deploys, runs, bills for eight devices and
      # uses one, and every other line of this check passes.
      #
      # subnetCount is deliberately not read here, unlike in the step above. Four of these
      # thirteen place into four subnets rather than five, because g6e.xlarge, g6e.12xlarge,
      # g6e.48xlarge and p4d.24xlarge are not offered in us-east-1f, so one expected count in
      # this loop body would be wrong for four shapes and a per-shape count is a fourth field
      # in the list below that nothing would check the correctness of. The measurement lives
      # in infra/batch-compute-gpu-shapes.yaml beside the subnet lists it produced, and no
      # test in this repository compares the two. Re-measure with
      # describe-instance-type-offerings before promoting a fourteenth.
      #
      # No apostrophe in this body. tests/test_phase3_batch_deployment_workflow.py parses
      # these scripts with shlex, and one unbalanced quote makes the whole script
      # unparseable.
      - name: Verify the remaining GPU shapes
        if: inputs.describe_run == ''
        run: |
          set -euo pipefail
          shapes_json="${RUNNER_TEMP}/phase4-gpu-shapes.json"
          : > "${shapes_json}"
          # Every shape this stack deploys, and the list has to stay that way: it carried
          # thirteen of the fourteen job definitions in infra/batch-compute-gpu-shapes.yaml,
          # and the one it left out was gpu-1xh100. That is the shape with the least margin
          # for going unchecked -- it is the newest, it is a p5.4xlarge, and it is the one
          # that shipped asking for more memory than its host registers. gpu-1xa10g is not
          # here and should not be: it lives in infra/batch-compute-gpu.yaml and the earlier
          # "Verify CPU and GPU batch execution" step covers it.
          for shape in gpu-1xt4:4:1 gpu-4xt4:48:4 gpu-8xt4:96:8 gpu-4xa10g:48:4 gpu-8xa10g:192:8 gpu-1xl4:4:1 gpu-4xl4:48:4 gpu-8xl4:192:8 gpu-1xl40s:4:1 gpu-4xl40s:48:4 gpu-8xl40s:192:8 gpu-8xa100:96:8 gpu-1xh100:16:1 gpu-8xh100:192:8; do
            profile="${shape%%:*}"
            rest="${shape#*:}"
            vcpus="${rest%%:*}"
            gpus="${rest##*:}"
            name="sbsandbox-intern-edullm-${profile}"
            aws batch describe-compute-environments \
              --compute-environments "${name}" \
              --query "computeEnvironments[0].{name:computeEnvironmentName,type:type,status:status,state:state,minvCpus:computeResources.minvCpus,imageType:computeResources.ec2Configuration[0].imageType}" \
              --output json >> "${shapes_json}"
            aws batch describe-job-queues \
              --job-queues "${name}" \
              --query "jobQueues[0].{name:jobQueueName,status:status,state:state}" \
              --output json >> "${shapes_json}"
            aws batch describe-job-definitions \
              --job-definition-name "${name}-run" \
              --status ACTIVE \
              --query "reverse(sort_by(jobDefinitions,&revision))[0].{name:jobDefinitionName,type:type,status:status,digestPinned:contains(containerProperties.image,'@sha256:'),requestsAGpu:contains(containerProperties.resourceRequirements[].type,'GPU'),gpuCount:containerProperties.resourceRequirements[?type=='GPU']|[0].value,vcpuCount:containerProperties.resourceRequirements[?type=='VCPU']|[0].value}" \
              --output json >> "${shapes_json}"
            printf '%s %s %s\n' "${profile}" "${vcpus}" "${gpus}" >> "${RUNNER_TEMP}/phase4-gpu-shapes-expected.txt"
          done

          python - "${shapes_json}" "${RUNNER_TEMP}/phase4-gpu-shapes-expected.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          # Three JSON documents were appended per shape, in order, so the reader takes them
          # three at a time against the same list the loop above walked.
          decoder = json.JSONDecoder()
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          documents = []
          index = 0
          while index < len(text):
              if text[index].isspace():
                  index += 1
                  continue
              document, index = decoder.raw_decode(text, index)
              documents.append(document)

          expected_shapes = [
              line.split() for line in Path(sys.argv[2]).read_text(encoding="utf-8").split("\n") if line
          ]
          if len(documents) != 3 * len(expected_shapes):
              raise SystemExit(
                  f"expected three answers per shape, got {len(documents)} for "
                  f"{len(expected_shapes)} shapes"
              )

          failures = []
          for position, (profile, vcpus, gpus) in enumerate(expected_shapes):
              name = f"sbsandbox-intern-edullm-{profile}"
              environment, queue, definition = documents[3 * position : 3 * position + 3]
              expected_environment = {
                  "name": name,
                  "type": "MANAGED",
                  "status": "VALID",
                  "state": "ENABLED",
                  "minvCpus": 0,
                  "imageType": "ECS_AL2023_NVIDIA",
              }
              expected_queue = {"name": name, "status": "VALID", "state": "ENABLED"}
              expected_definition = {
                  "name": f"{name}-run",
                  "type": "container",
                  "status": "ACTIVE",
                  "digestPinned": True,
                  "requestsAGpu": True,
                  "gpuCount": gpus,
                  "vcpuCount": vcpus,
              }
              for label, expected, observed in (
                  ("compute environment", expected_environment, environment),
                  ("job queue", expected_queue, queue),
                  ("job definition", expected_definition, definition),
              ):
                  if observed != expected:
                      failures.append(f"{profile} {label}: expected {expected}, observed {observed}")

          if failures:
              raise SystemExit("gpu shape verification failed:\n" + "\n".join(failures))

          print("PHASE4_GPU_SHAPE_VERIFICATION_PASSED")
          PY

      # THE TOOLING THE ENUMERATION BELOW NEEDS, INSTALLED ONLY WHEN A REPORT WAS ASKED FOR.
      #
      # This workflow installed no interpreter at all until now, and the two report steps
      # below were written in python3 for exactly that reason. What changed is that they must
      # read config/execution-targets.yaml, which is a pydantic contract behind a YAML file
      # rather than a list of strings -- and reading it any other way would be a second
      # mechanism for a question cancel-run.yml already answers one way.
      #
      # Gated on the dispatch carrying a run id, so a deploy pays nothing for it. A report
      # pays about twenty seconds, against a search of sixteen queues that takes minutes.
      #
      # Pinned to the version cancel-run.yml pins, because these two now run the same reader
      # over the same file and a version skew between them is a difference nobody would look
      # for.
      - name: Install the platform tooling
        if: inputs.describe_run != ''
        env:
          UV_VERSION: "0.11.32"
        run: |
          set -euo pipefail
          pipx install "uv==${UV_VERSION}"
          installed="$(uv --version)"
          if [[ "${installed}" != "uv ${UV_VERSION}" && "${installed}" != "uv ${UV_VERSION} "* ]]; then
            echo "unexpected_uv_version" >&2
            echo "Expected uv ${UV_VERSION} but PATH answers with: ${installed}" >&2
            exit 1
          fi
          uv sync --locked

      # EVERY QUEUE A RUN COULD BE ON, READ OUT OF THE FILE THAT DECIDES WHERE RUNS GO.
      #
      # The two report steps below looped over two queue names typed into this file, and the
      # account has eleven. That is the defect cancel-run.yml was fixed for, still sitting in
      # the workflow cancel-run.yml points people at when the run-canceller role is missing --
      # so the fallback answered "no job" about any run on one of the other nine, to an admin
      # who had been sent here precisely because the ordinary path was unavailable.
      #
      # Read rather than listed, and read the same way: this is the step out of cancel-run.yml
      # unchanged, so a queue promoted in config/execution-targets.yaml is searched in both
      # workflows with no edit to either. No queue name appears in the report steps below for
      # a second roster to grow out of.
      #
      # An empty answer is refused rather than looped over zero times, for the reason that
      # file gives: a search across no queues finds no job and reports it in the same words a
      # genuine absence gets.
      - name: List every queue a run could be on
        if: inputs.describe_run != ''
        run: |
          set -euo pipefail
          uv run --frozen python - > "${RUNNER_TEMP}/queues.txt" <<'PY'
          from pathlib import Path

          from edullm_platform.config import load_yaml
          from edullm_platform.contracts.execution import ExecutionTargetCatalog

          catalog = load_yaml(Path("config/execution-targets.yaml"), ExecutionTargetCatalog)
          # Deduplicated and sorted, because two profiles may share a queue and the order a
          # configuration file happens to declare its rows in is not a search order.
          for queue in sorted({target.job_queue for target in catalog.targets}):
              print(queue)
          PY
          if [[ ! -s "${RUNNER_TEMP}/queues.txt" ]]; then
            echo "no_execution_targets_configured" >&2
            echo "config/execution-targets.yaml names no job queue, so there is nowhere to look. That is a broken checkout rather than an empty estate." >&2
            exit 1
          fi
          echo "Searching $(wc -l < "${RUNNER_TEMP}/queues.txt") queue(s)."

      # WHAT ONE RUN IS DOING, INCLUDING WHAT IT PRINTED.
      #
      # Runs only when the dispatch named a run, so an ordinary deploy is unchanged. See the
      # note on the input for why this lives in a deploy workflow rather than in a workflow of
      # its own.
      #
      # The log tail is the part that is not available anywhere else in this repository. A run
      # that dies before its first step -- an unreadable corpus, a missing permission, a
      # tokenizer the image cannot build -- writes its reason to CloudWatch and nothing else,
      # and until now reading it needed a laptop credential.
      #
      # continue-on-error, because a report that cannot be produced must not turn a successful
      # deploy red. The deploy already happened by this point.
      # WHAT IS ON THE QUEUES AT ALL, which is a different question from what one run is
      # doing and the one that explains the commonest confusing answer: RUNNABLE.
      #
      # A job sits in RUNNABLE while Batch looks for capacity, and reports no reason for it
      # ever. There is one A10G behind the GPU queue, so the usual cause is that somebody
      # else's job has it -- which the per-run report cannot show, because it only ever looks
      # at the run it was given. Two people each polling their own run both see "queued, no
      # reason" and neither learns that they are queued behind each other.
      - name: Say what is on the queues
        if: inputs.describe_run == 'queues'
        continue-on-error: true
        run: |
          set -euo pipefail
          # tee rather than a bare redirect, because the step summary is readable in the web
          # UI and nowhere else -- there is no API for it. Everything that matters here has to
          # be in the log too, or a person reading this run through the CLI sees an empty step.
          {
            echo "## What is on the queues"
            echo
            echo "| Queue | State | Run | Started |"
            echo "| --- | --- | --- | --- |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          # A REFUSED CALL IS COUNTED AND DOES NOT END THE SEARCH, AND THAT IS NOT ABOUT A
          # QUEUE THE ACCOUNT DOES NOT HAVE. A queue named in the configuration and not yet
          # deployed answers an empty list and exits zero, so it costs a call and contributes
          # nothing, which is correct and needs no guard. A throttled call exits non-zero, and
          # under set -e one of those would end the loop over every queue after it -- sixteen
          # queues by five states is eighty sequential calls, which is long enough for Batch
          # to say no. The queues are sorted, so an early refusal hides most of the estate.
          refused=0
          for queue in $(cat "${RUNNER_TEMP}/queues.txt"); do
            for state in RUNNING STARTING RUNNABLE PENDING SUBMITTED; do
              aws batch list-jobs \
                --job-queue "${queue}" \
                --job-status "${state}" \
                --query "jobSummaryList[].[jobName,startedAt]" \
                --output text > "${RUNNER_TEMP}/q-${queue}-${state}.txt" || {
                refused=$((refused + 1))
                : > "${RUNNER_TEMP}/q-${queue}-${state}.txt"
              }
              while read -r name started; do
                [[ -z "${name}" ]] && continue
                echo "| ${queue##*-} | ${state} | \`${name}\` | ${started} |" | tee -a "${GITHUB_STEP_SUMMARY}"
              done < "${RUNNER_TEMP}/q-${queue}-${state}.txt"
            done
          done
          if [[ "${refused}" -ne 0 ]]; then
            # Counted rather than swallowed, because an empty table and a table missing the
            # rows nobody managed to read look identical, and the sentence below would be a
            # confident claim about an estate that went half unread.
            echo "queue_search_incomplete" >&2
            echo "**${refused} of the queue searches were refused**, so rows are missing above and the line below does not hold. Batch throttles a long enumeration; dispatch again to re-read." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "Nothing above means every queue this platform configures is empty of live work." | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Say what one run is doing
        if: inputs.describe_run != '' && inputs.describe_run != 'queues'
        continue-on-error: true
        env:
          RUN_ID: ${{ inputs.describe_run }}
        run: |
          set -euo pipefail
          if [[ ! "${RUN_ID}" =~ ^run_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "run_id_not_well_formed" >&2
            exit 1
          fi
          found=""
          queue_of=""
          # The guard the queue view above carries, for the same reason and with the same
          # distinction: a queue the account has not been given answers empty and exits zero,
          # and a throttled call exits non-zero and would otherwise end the search over every
          # queue left. Sixteen queues by seven states is a hundred and twelve calls.
          refused=0
          for queue in $(cat "${RUNNER_TEMP}/queues.txt"); do
            for state in RUNNING STARTING RUNNABLE PENDING SUBMITTED SUCCEEDED FAILED; do
              candidate="${RUNNER_TEMP}/list-${queue}-${state}.txt"
              aws batch list-jobs \
                --job-queue "${queue}" \
                --job-status "${state}" \
                --query "jobSummaryList[?jobName=='${RUN_ID}'].jobId" \
                --output text > "${candidate}" || {
                refused=$((refused + 1))
                : > "${candidate}"
              }
              if [[ -s "${candidate}" && "$(cat "${candidate}")" != "None" ]]; then
                found="$(cat "${candidate}")"
                queue_of="${queue}"
                break 2
              fi
            done
          done
          if [[ -z "${found}" ]]; then
            if [[ "${refused}" -ne 0 ]]; then
              # Two different facts, and the wrong one of them is what sent people looking
              # for runs that were there all along. Not finding a job says the run is not
              # listed; a refused call says nobody looked at that queue.
              echo "queue_search_incomplete" >&2
              echo "No job under ${RUN_ID} was found, and ${refused} of the queue searches were refused -- so the search was incomplete rather than the run being absent. Dispatch again before concluding anything." | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "No job under ${RUN_ID} on any configured queue, within the window Batch still lists." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          aws batch describe-jobs --jobs "${found}" --output json > "${RUNNER_TEMP}/job.json"
          # WHAT THE RUN LEFT BEHIND, WHICH IS EVIDENCE THE EXIT CODE DOES NOT CARRY.
          #
          # A checkpoint object under the prefix of a run means the trainer got past its first
          # save; an empty prefix on a run that reported forty seconds of life means it never
          # reached one. Neither is visible in a status of FAILED and an exit code of 1.
          #
          # Listing only. The deployer holds s3:ListBucket over the buckets carrying our
          # prefix and s3:GetObject over the artifacts bucket alone, so this can say what
          # exists and never what is in it -- which is the right shape for a role whose job
          # is to deploy stacks rather than to read the results of a team.
          aws s3 ls "s3://sbsandbox-intern-edullm-outputs/teams/" --recursive \
            > "${RUNNER_TEMP}/outputs.txt" 2>/dev/null || : > "${RUNNER_TEMP}/outputs.txt"
          grep -F "${RUN_ID}" "${RUNNER_TEMP}/outputs.txt" > "${RUNNER_TEMP}/wrote.txt" || : > "${RUNNER_TEMP}/wrote.txt"
          # python3, not `uv run`, though uv is now installed above for the queue enumeration.
          # This report imports nothing outside the standard library, and the interpreter that
          # is on the runner already needs no virtualenv resolved in front of it.
          stream="$(python3 -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/job.json'))['jobs'][0].get('container',{}).get('logStreamName') or '')")"
          if [[ -n "${stream}" ]]; then
            aws logs get-log-events \
              --log-group-name "/aws/batch/${queue_of}" \
              --log-stream-name "${stream}" \
              --limit 120 \
              --output json > "${RUNNER_TEMP}/log.json" || echo '{"events":[]}' > "${RUNNER_TEMP}/log.json"
          else
            echo '{"events":[]}' > "${RUNNER_TEMP}/log.json"
          fi
          python3 - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from datetime import datetime, timezone

          temporary = os.environ["RUNNER_TEMP"]
          job = json.load(open(temporary + "/job.json"))["jobs"][0]
          container = job.get("container", {})

          def when(key):
              milliseconds = job.get(key)
              if not milliseconds:
                  return "not yet"
              return datetime.fromtimestamp(milliseconds / 1000, timezone.utc).isoformat()

          print("## " + os.environ["RUN_ID"])
          print()
          print("| | |")
          print("| --- | --- |")
          print(f"| Status | `{job.get('status')}` |")
          print(f"| Why | {job.get('statusReason') or 'nothing reported'} |")
          print(f"| Queued | {when('createdAt')} |")
          print(f"| Started | {when('startedAt')} |")
          print(f"| Stopped | {when('stoppedAt')} |")
          print(f"| Exit code | {container.get('exitCode', 'none yet')} |")
          print(f"| Container said | {container.get('reason') or 'nothing'} |")
          print(f"| Image | `{container.get('image', 'unknown')}` |")
          print()

          # WHETHER IT WROTE ANYTHING, which distinguishes two failures that read alike. A
          # run that reached its first checkpoint and then died is a training problem; one
          # whose prefix is empty after forty seconds never got that far. Status FAILED and
          # exit code 1 are identical in both.
          wrote = [line for line in open(temporary + "/wrote.txt").read().splitlines() if line]
          print("### What it wrote")
          print()
          if wrote:
              print("```")
              for line in wrote[:40]:
                  print(line)
              if len(wrote) > 40:
                  print(f"... and {len(wrote) - 40} more objects")
              print("```")
          else:
              print("Nothing under this run's output prefix.")
          print()

          # THE COMMAND AND THE ENVIRONMENT, BECAUSE A RUN THAT DIES IN SECONDS DIED ON ONE OF
          # THEM. A container that exits before its first training step usually never opened a
          # corpus: it was handed a command it could not run, or an environment missing the
          # variables that say which corpus to open. Both are in the job description, and both
          # were invisible while this report printed only status and exit code.
          print("### What it was told to run")
          print()
          print("```")
          print(" ".join(container.get("command", []) or ["<nothing>"]))
          print("```")
          print()

          # Names always, values only for the ones that decide what the run reads. The rest
          # can hold a W&B key, and this summary is readable by anyone who can see the run.
          told = {
              variable.get("Name", variable.get("name", "")): variable.get(
                  "Value", variable.get("value", "")
              )
              for variable in container.get("environment", [])
          }
          shown = ("EDULLM_DATASET_ID", "EDULLM_DATASET_VERSION", "EDULLM_DATASET_TOKENIZER")
          print("### The environment it was given")
          print()
          print("| Name | Value |")
          print("| --- | --- |")
          for name in sorted(told):
              value = told[name] if name in shown else "(not shown)"
              print(f"| `{name}` | {value} |")
          for name in shown:
              if name not in told:
                  print(f"| `{name}` | **ABSENT** |")
          print()

          events = json.load(open(temporary + "/log.json")).get("events", [])
          if events:
              print(f"### Last {len(events)} log lines")
              print()
              print("```")
              for event in events:
                  print(event.get("message", ""))
              print("```")
          else:
              # This branch was right while the header above was wrong, and it is reached on
              # every single run: the role holds no logs:GetLogEvents, by the decision
              # recorded in infra/iam/infra-deployer-role.yaml.
              #
              # The old wording said there was no log content and that this role cannot read
              # logs deliberately, which reads like a limit somebody chose for this report --
              # and that is how the contradiction survived. It is a limit on the credential.
              # The consequence is that the one question this report exists to answer is the
              # one it cannot. Saying so plainly is the difference between a reader believing
              # the container printed nothing and a reader knowing nobody looked.
              print(
                  "**The log was not read.** This deploy credential holds no "
                  "logs:GetLogEvents, so this says nothing about whether the container "
                  "printed anything. For a job that died in seconds the log is usually the "
                  "only evidence there is, and reading it needs a credential that can: "
                  "aws logs get-log-events, against the Batch log group and the stream "
                  "named above."
              )
          PY
