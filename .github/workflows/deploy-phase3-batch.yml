name: "Deploy: Batch execution estate"

# The deployer role trust policy pins job_workflow_ref to
# edu-llm/platform/.github/workflows/deploy-phase3-batch.yml@refs/heads/main.
# Renaming or moving this file silently revokes every deployment. Do not rename it.
on:
  workflow_dispatch:
    inputs:
      # AN OPERATOR'S VIEW OF A RUN, HERE BECAUSE THIS IS WHERE THE CREDENTIAL IS.
      #
      # cancel-run.yml is the workflow researchers use to look at a run, and it assumes
      # sbsandbox-intern-edullm-run-canceller -- a role that describes jobs and stops them
      # and reaches nothing else. That is the right shape for a button thirty-four people
      # can press, and it is not deployed: creating it needs iam:CreateRole, the deployer
      # role deliberately has none, and the credential that does is a laptop one.
      #
      # This deployer role already holds batch:DescribeJobs and batch:ListJobs, and this
      # dispatch is already limited to two admins by the step below. So the operator view
      # costs no new role: it is a report at the end of a deploy that has already run.
      #
      # IT DOES NOT HOLD logs:GetLogEvents, THOUGH THIS COMMENT ONCE CLAIMED IT DID. That
      # claim was the justification for reading the log here, and the fallback branch of the report
      # branch said the opposite in as many words. infra/iam/infra-deployer-role.yaml settles
      # it: GetLogEvents and FilterLogEvents are absent from this role deliberately, so a
      # deploy credential can never become a way to read the logs of anyone in this shared
      # account. The header was wrong; the policy is what it is.
      #
      # WHAT THAT COSTS, SO THE NEXT PERSON DOES NOT REDISCOVER IT. This report exists to
      # explain a container that dies in seconds, and the only evidence such a container
      # leaves is its log. Four training runs on 2026-08-01 died between five and forty
      # seconds with exit 1 and "Essential container in task exited" -- which is what a bad
      # hyperparameter, a lost quote, a missing entry point and a broken credential all look
      # like from outside. Each was diagnosed by guessing and resubmitting.
      #
      # The fix is a scoped grant: logs:GetLogEvents on the two /aws/batch/ log groups this
      # platform creates and nowhere else. The existing argument in the role template is
      # about the other tenants in this account, whose Lambda and application logs are none of this
      # business of this platform; it is not an argument about output written by containers this
      # operator of this role launched. That grant is not made here because applying it needs the
      # laptop credential the role template is deployed with, and making the template say
      # something the deployed role does not is the drift every capture test exists to catch.
      #
      # cancel-run.yml stays as it is either way: it names the stream and stops, because
      # widening a two-verb role to read logs would spend the argument for its shape.
      #
      # A dispatch carrying a run id still deploys first. That is deliberate rather than
      # sloppy: gating eight deploy steps on an input is eight chances to gate one wrongly,
      # and `cloudformation deploy` with nothing to change exits successfully having done
      # nothing. The cost of the honest version is about three minutes.
      describe_run:
        description: "A run id to report on after deploying — status, why, exit code, and the tail of its log. Leave empty for an ordinary deploy."
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-phase3-batch.yml
      - infra/outputs-bucket.yaml
      - infra/batch-network.yaml
      - infra/batch-compute.yaml
      - infra/batch-compute-gpu.yaml
      - infra/batch-events.yaml
      - infra/admission-state-machine.yaml

permissions:
  contents: read

# The same group Phase 2 uses, and that is not a copy-paste slip. These two workflows
# deploy one stack in common -- sbsandbox-intern-edullm-phase2-admission, which Phase 3
# amends rather than replaces -- and infra/admission-state-machine.yaml is in both path
# filters, so a push that touches it starts both runs. Sharing the group makes the second
# wait instead of racing the first into a mid-update stack. The group keeps Phase 2's name
# because Phase 2 named it first and renaming it is an edit to that workflow.
concurrency:
  group: cloudformation-sbsandbox-intern-edullm-phase2
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy, and verify CPU and GPU batch execution
    runs-on: ubuntu-latest
    # Longer than Phase 2's fifteen. A compute environment takes a few minutes to reach
    # VALID because Batch creates an ECS cluster and an Auto Scaling group behind it, and a
    # VPC with five subnets is not instant either.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # WHO MAY DEPLOY BY HAND, ENUMERATED RATHER THAN MATCHED. workflow_dispatch is
      # offered to anybody holding write, and write stopped meaning "an admin" when the
      # pilot opened. Without this, a researcher can reconcile a CloudFormation stack into
      # the sandbox account by pressing a button, through a role they cannot see and were
      # never shown.
      #
      # Only the dispatch path is guarded. A push to main has already been through a
      # code-owner review of both the template and the workflow that applies it, and
      # refusing there would strand an approved infrastructure change with no way to land.
      #
      # It fails rather than skipping. A job-level `if` that evaluates false reports the
      # job as skipped, which reads as success in the checks list and tells the person
      # nothing at all.
      #
      # First in the job, before the checkout, so a refused dispatch does no work. The list
      # is checked against config/organization.yaml by tests/test_deploy_authorization.py,
      # which also holds all three deploy workflows to carrying this same step -- three
      # copies kept honest by a test, the way the job queue name already is, rather than by
      # a composite action that would move the control out of the file it protects.
      - name: Refuse a hand-started deploy from somebody who may not make one
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "${ACTOR}" in
            philote-dev|BritishAmericqn) ;;
            *)
              echo "deploy_dispatch_not_authorized:${ACTOR}" >&2
              echo "Deploying infrastructure by hand is limited to the repository admins." >&2
              echo "Open a pull request against the template instead: a merge to main deploys it after a code-owner review." >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          # Account IDs are not secret, but the verification step reads a state machine ARN
          # out of a stack output, and masking keeps that ARN from turning a public log into
          # a free lookup of the sandbox account number.
          mask-aws-account-id: true

      # WHAT VALIDATE-TEMPLATE CHECKS, AND WHAT IT DOES NOT. It parses the document and
      # reports the parameters and capabilities it found. It does not check a resource's
      # properties against that resource's schema: a template declaring an
      # AWS::Batch::JobQueue whose only property is one Batch has never heard of validates
      # clean, measured on 2026-07-27. So a pass here means "this is a CloudFormation
      # template", not "this will deploy".
      #
      # It is still worth running first, because the failure it does catch -- a malformed
      # document -- is the one worth catching before three stacks have already changed. What
      # covers the rest is tests/test_phase3_infrastructure.py against the committed files,
      # and the verification step against the deployed account.
      - name: Validate CloudFormation templates
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://infra/outputs-bucket.yaml
          aws cloudformation validate-template --template-body file://infra/batch-network.yaml
          aws cloudformation validate-template --template-body file://infra/batch-compute.yaml
          aws cloudformation validate-template --template-body file://infra/batch-compute-gpu.yaml
          aws cloudformation validate-template --template-body file://infra/batch-events.yaml
          aws cloudformation validate-template --template-body file://infra/admission-state-machine.yaml

      # No --capabilities on any deploy here, for the reason the Phase 2 workflow states and
      # checks: CloudFormation demands CAPABILITY_IAM or CAPABILITY_NAMED_IAM only for
      # templates containing an IAM entity, and none of these five contains one. The four
      # Phase 3 roles and the instance profile live in infra/iam/ and are applied from a
      # laptop, because this role holds no iam:CreateRole.
      #
      # Withholding the acknowledgement is worth more than it costs: a template that grew an
      # IAM resource fails at InsufficientCapabilities, naming the reason, instead of at an
      # AccessDenied several minutes into a rollback.
      #
      # THE ORDER OF THE NEXT FIVE STEPS IS THE ONLY THING THAT ENFORCES IT, for three of
      # the four dependencies. infra/batch-compute.yaml imports the network stack's exported
      # subnet and security group IDs, so CloudFormation does enforce that one -- an import
      # of an export that does not exist fails the deploy. Nothing links the others.
      - name: Deploy Phase 3 outputs bucket stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-outputs \
            --template-file infra/outputs-bucket.yaml \
            --no-fail-on-empty-changeset

      - name: Deploy Phase 3 network stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-network \
            --template-file infra/batch-network.yaml \
            --no-fail-on-empty-changeset

      # After the network, because the compute environment imports its subnets and security
      # group. Also after AWSServiceRoleForBatch exists, which is a laptop command in
      # infra/README.md and not something this workflow can do or check -- a compute
      # environment created without it fails in a way that names the role and not the reason.
      - name: Deploy Phase 3 batch compute stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-batch \
            --template-file infra/batch-compute.yaml \
            --no-fail-on-empty-changeset

      # The GPU sibling, deployed here rather than from a workflow of its own, and the
      # reason is the events stack below. That stack's rule now names both queues, so a
      # separate Phase 4 workflow would put the GPU queue's creation and the rule that
      # matches it in two runs with nothing ordering them -- reintroducing exactly the
      # deploy-order seam the next comment exists to close, across a boundary no test can
      # see. One workflow keeps compute-before-events true for both queues.
      #
      # It imports the same network stack exports as the CPU environment, so
      # CloudFormation enforces that dependency. Nothing enforces its ordering against the
      # GPU IAM stack, which is applied from a laptop before this runs.
      - name: Deploy Phase 4 GPU batch compute stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase4-gpu \
            --template-file infra/batch-compute-gpu.yaml \
            --no-fail-on-empty-changeset

      # After both compute stacks, because the EventBridge rule's pattern names the job queue
      # ARNs. Nothing makes CloudFormation check that: the pattern is a string, and a rule
      # scoped to a queue that does not exist deploys perfectly and matches nothing forever.
      - name: Deploy Phase 3 batch events stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase3-events \
            --template-file infra/batch-events.yaml \
            --no-fail-on-empty-changeset

      # Last, and it is the Phase 2 stack under its Phase 2 name. The amended state machine
      # submits to the queue and job definition the batch stack creates, so deploying it
      # first would leave a submit state pointing at nothing -- which fails at run time
      # rather than at deploy time, on the first accepted run.
      - name: Deploy the amended admission state machine
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name sbsandbox-intern-edullm-phase2-admission \
            --template-file infra/admission-state-machine.yaml \
            --no-fail-on-empty-changeset

      # WHAT THIS STEP CANNOT PROVE, said here so the green tick is read correctly. A
      # compute environment reporting VALID and ENABLED establishes that Batch accepted the
      # instance type, the subnets, the security group and the instance profile. It
      # establishes nothing about whether a job can run, because Batch does not fail a job
      # it cannot place -- it waits, indefinitely, with no error. Only a job observed in
      # RUNNING proves the placement, the egress and the ECR pull, and this workflow cannot
      # submit one: the deployer holds no batch:SubmitJob and must not, because the
      # admission state machine is the only principal in the account that may start compute.
      #
      # That proof comes from tools/probe_batch_compute.py before this stack is built, and
      # from the Wave 5 live matrix afterwards.
      # WHY THE STACK REFUSED, WHICH THE DEPLOY ITSELF DOES NOT SAY.
      #
      # `cloudformation deploy` prints "Failed to create/update the stack. Run the following
      # command to fetch the list of events leading up to the failure" and exits 255. The
      # command it names is one nobody can run: the deployer role is assumed inside this job
      # and is gone by the time a person reads the log, and no laptop credential in this
      # project can reach the account at all right now. So the reason lives for thirty
      # seconds inside a runner and is then unreachable forever.
      #
      # That happened on 2026-08-01 08:06 UTC. Adding JobStateTimeLimitActions to the two job
      # queues was refused, the deploy reported only its own exit code, and diagnosing it
      # meant reading the template and guessing at which of the property constraints had been
      # violated.
      #
      # if: failure() rather than always(), because a green deploy has no events worth
      # printing and this would otherwise add noise to every run. It reads the events rather
      # than the stack status, and only the FAILED ones, because a rolled-back stack reports
      # UPDATE_ROLLBACK_COMPLETE at the top level -- a status that says something went wrong
      # and never says what.
      #
      # continue-on-error so that a diagnostic which cannot itself run does not replace the
      # deploy failure it was trying to explain with a different one.
      - name: Say why the stack refused
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          for stack in \
            sbsandbox-intern-edullm-phase3-outputs \
            sbsandbox-intern-edullm-phase3-network \
            sbsandbox-intern-edullm-phase3-batch \
            sbsandbox-intern-edullm-phase4-gpu \
            sbsandbox-intern-edullm-phase3-events \
            sbsandbox-intern-edullm-phase2-admission
          do
            echo "--- ${stack}"
            aws cloudformation describe-stack-events \
              --stack-name "${stack}" \
              --max-items 40 \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].{logical:LogicalResourceId,status:ResourceStatus,reason:ResourceStatusReason}" \
              --output table || echo "no events readable for ${stack}"
          done

      - name: Verify CPU and GPU batch execution
        run: |
          set -euo pipefail
          state_machine_arn_file="${RUNNER_TEMP}/phase3-state-machine-arn.txt"
          compute_environment_json="${RUNNER_TEMP}/phase3-compute-environment.json"
          job_queue_json="${RUNNER_TEMP}/phase3-job-queue.json"
          job_definition_json="${RUNNER_TEMP}/phase3-job-definition.json"
          gpu_compute_environment_json="${RUNNER_TEMP}/phase4-gpu-compute-environment.json"
          gpu_job_queue_json="${RUNNER_TEMP}/phase4-gpu-job-queue.json"
          gpu_job_definition_json="${RUNNER_TEMP}/phase4-gpu-job-definition.json"
          rule_json="${RUNNER_TEMP}/phase3-lifecycle-rule.json"
          state_machine_json="${RUNNER_TEMP}/phase3-state-machine.json"
          outputs_json="${RUNNER_TEMP}/phase3-outputs-versioning.json"

          aws cloudformation describe-stacks \
            --stack-name sbsandbox-intern-edullm-phase2-admission \
            --query "Stacks[0].Outputs[?OutputKey=='StateMachineArn'].OutputValue" \
            --output text > "${state_machine_arn_file}"

          read -r state_machine_arn < "${state_machine_arn_file}"

          aws batch describe-compute-environments \
            --compute-environments sbsandbox-intern-edullm-cpu \
            --query "computeEnvironments[0].{name:computeEnvironmentName,type:type,status:status,state:state,minvCpus:computeResources.minvCpus,subnetCount:length(computeResources.subnets)}" \
            --output json > "${compute_environment_json}"

          aws batch describe-job-queues \
            --job-queues sbsandbox-intern-edullm-cpu \
            --query "jobQueues[0].{name:jobQueueName,status:status,state:state}" \
            --output json > "${job_queue_json}"

          aws batch describe-job-definitions \
            --job-definition-name sbsandbox-intern-edullm-cpu-run \
            --status ACTIVE \
            --query "reverse(sort_by(jobDefinitions,&revision))[0].{name:jobDefinitionName,type:type,status:status,digestPinned:contains(containerProperties.image,'@sha256:'),tagged:contains(containerProperties.image,':latest')}" \
            --output json > "${job_definition_json}"

          aws batch describe-compute-environments \
            --compute-environments sbsandbox-intern-edullm-gpu \
            --query "computeEnvironments[0].{name:computeEnvironmentName,type:type,status:status,state:state,minvCpus:computeResources.minvCpus,subnetCount:length(computeResources.subnets),imageType:computeResources.ec2Configuration[0].imageType}" \
            --output json > "${gpu_compute_environment_json}"

          aws batch describe-job-queues \
            --job-queues sbsandbox-intern-edullm-gpu \
            --query "jobQueues[0].{name:jobQueueName,status:status,state:state}" \
            --output json > "${gpu_job_queue_json}"

          aws batch describe-job-definitions \
            --job-definition-name sbsandbox-intern-edullm-gpu-run \
            --status ACTIVE \
            --query "reverse(sort_by(jobDefinitions,&revision))[0].{name:jobDefinitionName,type:type,status:status,digestPinned:contains(containerProperties.image,'@sha256:'),tagged:contains(containerProperties.image,':latest'),requestsAGpu:contains(containerProperties.resourceRequirements[].type,'GPU'),injectsTheWandbKey:contains(containerProperties.secrets[].name,'WANDB_API_KEY')}" \
            --output json > "${gpu_job_definition_json}"

          aws events describe-rule \
            --name sbsandbox-intern-edullm-batch-lifecycle \
            --query "{name:Name,state:State,scopedToOurQueue:contains(EventPattern,'job-queue/sbsandbox-intern-edullm-cpu'),scopedToTheGpuQueue:contains(EventPattern,'job-queue/sbsandbox-intern-edullm-gpu')}" \
            --output json > "${rule_json}"

          aws stepfunctions describe-state-machine \
            --state-machine-arn "${state_machine_arn}" \
            --query "{status:status,submitsToBatch:contains(definition,'SubmitToBatch'),writesTheBinding:contains(definition,'WriteBinding'),readsTheImageScan:contains(definition,'ReadImageScan')}" \
            --output json > "${state_machine_json}"

          aws s3api get-bucket-versioning \
            --bucket sbsandbox-intern-edullm-outputs \
            --query "{status:Status}" \
            --output json > "${outputs_json}"

          python - "${compute_environment_json}" "${job_queue_json}" "${job_definition_json}" "${gpu_compute_environment_json}" "${gpu_job_queue_json}" "${gpu_job_definition_json}" "${rule_json}" "${state_machine_json}" "${outputs_json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          # minvCpus is pinned at zero here as well as in the template because this is the
          # number that bills when nobody is looking, and a console edit would not show up
          # in a template test. subnetCount is five because us-east-1e cannot hold a
          # c7i.8xlarge and a sixth subnet would be one Batch considers and can never place
          # into -- which produces a job that waits rather than one that errors.
          expected_compute_environment = {
              "name": "sbsandbox-intern-edullm-cpu",
              "type": "MANAGED",
              "status": "VALID",
              "state": "ENABLED",
              "minvCpus": 0,
              "subnetCount": 5,
          }
          expected_job_queue = {
              "name": "sbsandbox-intern-edullm-cpu",
              "status": "VALID",
              "state": "ENABLED",
          }
          # Booleans rather than the image reference, so this check cannot print the
          # registry host and the account id inside it. digestPinned is the property that
          # matters; tagged is asserted false as well, because an image reference can carry
          # both a tag and a digest and only the digest decides which bytes run.
          expected_job_definition = {
              "name": "sbsandbox-intern-edullm-cpu-run",
              "type": "container",
              "status": "ACTIVE",
              "digestPinned": True,
              "tagged": False,
          }
          # THE ONE CHECK IN THIS FILE THAT CATCHES A FAILURE NOTHING ELSE REPORTS.
          #
          # imageType must be ECS_AL2023_NVIDIA. Left to its default the GPU environment
          # runs the same AMI as the CPU one, which carries no NVIDIA driver -- so an
          # instance launches, joins the cluster, takes the job and runs it on the CPU at
          # GPU prices. Nothing errors. The job does not wait, no permission is denied, and
          # the only trace is that the container cannot see a device. Every other line in
          # this expectation would be satisfied by that environment.
          #
          # subnetCount is five because describe-instance-type-offerings reports g5.xlarge
          # in all five availability zones the network stack has a subnet in. That is not a
          # property of GPU shapes in general and must be re-measured before a different one
          # is promoted: g6e and p4d are absent from us-east-1f.
          expected_gpu_compute_environment = {
              "name": "sbsandbox-intern-edullm-gpu",
              "type": "MANAGED",
              "status": "VALID",
              "state": "ENABLED",
              "minvCpus": 0,
              "subnetCount": 5,
              "imageType": "ECS_AL2023_NVIDIA",
          }
          expected_gpu_job_queue = {
              "name": "sbsandbox-intern-edullm-gpu",
              "status": "VALID",
              "state": "ENABLED",
          }
          # requestsAGpu is the other half of the AMI check above and fails just as quietly
          # on its own: without a GPU entry in resourceRequirements, ECS does not select the
          # NVIDIA runtime for the task, so even on the right AMI no device is attached.
          # Both have to be right and neither reports the other being wrong.
          #
          # injectsTheWandbKey is read as a boolean and never as a value. What is asserted
          # is that a secret of that name is wired, not what it resolves to -- the runner
          # log is world readable.
          expected_gpu_job_definition = {
              "name": "sbsandbox-intern-edullm-gpu-run",
              "type": "container",
              "status": "ACTIVE",
              "digestPinned": True,
              "tagged": False,
              "requestsAGpu": True,
              "injectsTheWandbKey": True,
          }
          # The seam that produces no error anywhere when it breaks. A rule scoped to a
          # queue nobody submits to matches nothing, jobs run, and no lifecycle event,
          # attempt or result record is ever written. Read as booleans so the deployed
          # pattern is compared against the deployed queue names rather than printed. Both
          # queues are asserted because one rule now serves both, and a pattern that lost
          # either half would leave the runs on that queue invisible to lineage.
          #
          # No apostrophe anywhere in a run body, here or above, and it is not a style
          # preference. tests/test_phase3_batch_deployment_workflow.py parses these scripts
          # with shlex to read the aws calls out of them, and one unbalanced quote in a
          # comment makes the whole script unparseable -- so the tests that check this
          # workflow never submits a job, and never prints an account id, fail with a
          # quoting error rather than an answer.
          expected_rule = {
              "name": "sbsandbox-intern-edullm-batch-lifecycle",
              "state": "ENABLED",
              "scopedToOurQueue": True,
              "scopedToTheGpuQueue": True,
          }
          # Three states, because the amendment is three states and a partial deploy that
          # left one out would be an admission path that decides and never submits.
          expected_state_machine = {
              "status": "ACTIVE",
              "submitsToBatch": True,
              "writesTheBinding": True,
              "readsTheImageScan": True,
          }
          expected_outputs_versioning = {"status": "Enabled"}

          expectations = [
              ("compute environment", expected_compute_environment),
              ("job queue", expected_job_queue),
              ("job definition", expected_job_definition),
              ("gpu compute environment", expected_gpu_compute_environment),
              ("gpu job queue", expected_gpu_job_queue),
              ("gpu job definition", expected_gpu_job_definition),
              ("lifecycle rule", expected_rule),
              ("admission state machine", expected_state_machine),
              ("outputs bucket versioning", expected_outputs_versioning),
          ]
          arguments = sys.argv[1:]
          if len(arguments) != len(expectations):
              raise SystemExit("batch verification was handed the wrong number of files")

          failures = []
          for (label, expected), argument in zip(expectations, arguments):
              observed = json.loads(Path(argument).read_text(encoding="utf-8"))
              if observed != expected:
                  failures.append(f"{label}: expected {expected}, observed {observed}")

          if failures:
              raise SystemExit("batch verification failed:\n" + "\n".join(failures))

          print("PHASE3_BATCH_VERIFICATION_PASSED")
          PY

      # WHAT ONE RUN IS DOING, INCLUDING WHAT IT PRINTED.
      #
      # Runs only when the dispatch named a run, so an ordinary deploy is unchanged. See the
      # note on the input for why this lives in a deploy workflow rather than in a workflow of
      # its own.
      #
      # The log tail is the part that is not available anywhere else in this repository. A run
      # that dies before its first step -- an unreadable corpus, a missing permission, a
      # tokenizer the image cannot build -- writes its reason to CloudWatch and nothing else,
      # and until now reading it needed a laptop credential.
      #
      # continue-on-error, because a report that cannot be produced must not turn a successful
      # deploy red. The deploy already happened by this point.
      - name: Say what one run is doing
        if: inputs.describe_run != ''
        continue-on-error: true
        env:
          RUN_ID: ${{ inputs.describe_run }}
        run: |
          set -euo pipefail
          if [[ ! "${RUN_ID}" =~ ^run_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "run_id_not_well_formed" >&2
            exit 1
          fi
          found=""
          queue_of=""
          for queue in sbsandbox-intern-edullm-gpu sbsandbox-intern-edullm-cpu; do
            for state in RUNNING STARTING RUNNABLE PENDING SUBMITTED SUCCEEDED FAILED; do
              candidate="${RUNNER_TEMP}/list-${queue}-${state}.txt"
              aws batch list-jobs \
                --job-queue "${queue}" \
                --job-status "${state}" \
                --query "jobSummaryList[?jobName=='${RUN_ID}'].jobId" \
                --output text > "${candidate}"
              if [[ -s "${candidate}" && "$(cat "${candidate}")" != "None" ]]; then
                found="$(cat "${candidate}")"
                queue_of="${queue}"
                break 2
              fi
            done
          done
          if [[ -z "${found}" ]]; then
            echo "No job under ${RUN_ID} on either queue, within the window Batch still lists." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          aws batch describe-jobs --jobs "${found}" --output json > "${RUNNER_TEMP}/job.json"
          # python3, not `uv run`: this workflow never installs uv, and the report imports
          # nothing outside the standard library.
          stream="$(python3 -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/job.json'))['jobs'][0].get('container',{}).get('logStreamName') or '')")"
          if [[ -n "${stream}" ]]; then
            aws logs get-log-events \
              --log-group-name "/aws/batch/${queue_of}" \
              --log-stream-name "${stream}" \
              --limit 120 \
              --output json > "${RUNNER_TEMP}/log.json" || echo '{"events":[]}' > "${RUNNER_TEMP}/log.json"
          else
            echo '{"events":[]}' > "${RUNNER_TEMP}/log.json"
          fi
          python3 - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          import os
          from datetime import datetime, timezone

          temporary = os.environ["RUNNER_TEMP"]
          job = json.load(open(temporary + "/job.json"))["jobs"][0]
          container = job.get("container", {})

          def when(key):
              milliseconds = job.get(key)
              if not milliseconds:
                  return "not yet"
              return datetime.fromtimestamp(milliseconds / 1000, timezone.utc).isoformat()

          print("## " + os.environ["RUN_ID"])
          print()
          print("| | |")
          print("| --- | --- |")
          print(f"| Status | `{job.get('status')}` |")
          print(f"| Why | {job.get('statusReason') or 'nothing reported'} |")
          print(f"| Queued | {when('createdAt')} |")
          print(f"| Started | {when('startedAt')} |")
          print(f"| Stopped | {when('stoppedAt')} |")
          print(f"| Exit code | {container.get('exitCode', 'none yet')} |")
          print(f"| Container said | {container.get('reason') or 'nothing'} |")
          print(f"| Image | `{container.get('image', 'unknown')}` |")
          print()

          # THE COMMAND AND THE ENVIRONMENT, BECAUSE A RUN THAT DIES IN SECONDS DIED ON ONE OF
          # THEM. A container that exits before its first training step usually never opened a
          # corpus: it was handed a command it could not run, or an environment missing the
          # variables that say which corpus to open. Both are in the job description, and both
          # were invisible while this report printed only status and exit code.
          print("### What it was told to run")
          print()
          print("```")
          print(" ".join(container.get("command", []) or ["<nothing>"]))
          print("```")
          print()

          # Names always, values only for the ones that decide what the run reads. The rest
          # can hold a W&B key, and this summary is readable by anyone who can see the run.
          told = {
              variable.get("Name", variable.get("name", "")): variable.get(
                  "Value", variable.get("value", "")
              )
              for variable in container.get("environment", [])
          }
          shown = ("EDULLM_DATASET_ID", "EDULLM_DATASET_VERSION", "EDULLM_DATASET_TOKENIZER")
          print("### The environment it was given")
          print()
          print("| Name | Value |")
          print("| --- | --- |")
          for name in sorted(told):
              value = told[name] if name in shown else "(not shown)"
              print(f"| `{name}` | {value} |")
          for name in shown:
              if name not in told:
                  print(f"| `{name}` | **ABSENT** |")
          print()

          events = json.load(open(temporary + "/log.json")).get("events", [])
          if events:
              print(f"### Last {len(events)} log lines")
              print()
              print("```")
              for event in events:
                  print(event.get("message", ""))
              print("```")
          else:
              # This branch was right while the header above was wrong, and it is reached on
              # every single run: the role holds no logs:GetLogEvents, by the decision
              # recorded in infra/iam/infra-deployer-role.yaml.
              #
              # The old wording said there was no log content and that this role cannot read
              # logs deliberately, which reads like a limit somebody chose for this report --
              # and that is how the contradiction survived. It is a limit on the credential.
              # The consequence is that the one question this report exists to answer is the
              # one it cannot. Saying so plainly is the difference between a reader believing
              # the container printed nothing and a reader knowing nobody looked.
              print(
                  "**The log was not read.** This deploy credential holds no "
                  "logs:GetLogEvents, so this says nothing about whether the container "
                  "printed anything. For a job that died in seconds the log is usually the "
                  "only evidence there is, and reading it needs a credential that can: "
                  "aws logs get-log-events, against the Batch log group and the stream "
                  "named above."
              )
          PY
