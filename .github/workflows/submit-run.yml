name: Submit a run

# WHAT THIS LINE CAN AND CANNOT CARRY, BECAUSE THE OBVIOUS THING IT IS FOR IS THE ONE THING
# IT CANNOT DO. `run-name` is evaluated when the run starts, before any job exists, so it
# cannot carry the platform run id -- the compile job mints that, minutes later. What it can
# carry is what the dispatch already said, which is enough to pick a run out of the list by
# eye: who, which repository, and which experiment. The id-to-workflow-run join is written
# by the index-the-run job below, at the moment the second half of it exists.
#
# The separator is a middle dot rather than an em dash, which is the house standard in
# docs-frank/reference/writing-releases-and-docs.md and the one this line arrived breaking.
# It is also the separator every notification the runs channel posts already uses, so a
# submission title and the message about how that submission ended now read as one voice.
run-name: >-
  ${{ inputs.repository }} by ${{ github.actor }}${{ inputs.experiment && format(' · {0}',
  inputs.experiment) || '' }}

# The admission role trust policy pins job_workflow_ref to
# edu-llm/platform/.github/workflows/submit-run.yml@refs/heads/main, and pins the subject
# claim to :environment:run-approval-lead and :environment:run-approval-admin. Renaming or
# moving this file, or renaming either GitHub environment, silently revokes every
# submission: the failure arrives as an AssumeRole denial that reads like a broken role
# ARN. Change infra/iam/admission-role.yaml in the same commit or do not change this.
#
# The form below is SubmissionInputs field for field. Fourteen properties against a
# workflow_dispatch ceiling of twenty-five, so the length is a usability question rather
# than a platform constraint. Nine are required and five may be left empty. Three of the
# five take a registered default when they are -- the two bounds from the workload profile
# and the image digest from whatever the declared commit published -- and the other two are
# the fan-out pair, which is absent altogether unless both are given.
#
# It read fifteen and six and a fan-out triple, which was true until fanout_parallelism was
# removed for the reason recorded above that pair. Corrected by counting rather than by
# reading, which is the only way a number in a comment stays true; the limitations heading
# further down carries no count at all, for the same reason said at greater length.
#
# compute_profile is the ninth required field and was one of seven overrides. It is
# required because the workload profile stopped declaring a machine, so there is no
# registered default for it to fall back to and no honest way to leave it blank.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Which repository this run's code comes from."
        required: true
        type: choice
        options:
          # Sorted case-insensitively, which is what the option test compares against, so
          # this reads as a list rather than as the order the registrations happened in.
          - edullm-alt-cl
          - edullm-data
          - edullm-p1
          - OLMo-core
          - olmo-eval-full
          - open-instruct-scored-rewards
      commit_sha:
        description: "Branch, tag or commit. Use main for a first run."
        required: true
        type: string
      image_digest:
        description: "Leave blank. The image comes from the commit above."
        required: false
        type: string
        default: ""
      # FREE TEXT, AND THE FIELD BELOW IS A DROPDOWN, WHICH LOOKS INCONSISTENT UNTIL YOU ASK
      # WHAT EACH LIST WAS PROTECTING.
      #
      # This was a `choice` enumerating config/workload-catalog.yaml. The catalog is owned by
      # the admins and all eight team leads, so a lead can already merge a new entry; this
      # file is owned by two people, because two IAM trust policies pin its exact filename
      # with StringEquals. Registering a workload therefore needed both files in one pull
      # request and the second needed an owner -- for a reason that has nothing to do with
      # the workload. The catalog was open and the form was closed, and the form is what a
      # researcher meets.
      #
      # WHAT THE DROPDOWN WAS BUYING, WHICH IS LESS THAN THE ONE BELOW BUYS. A name nothing
      # registers is refused by tools/compile_submission.py in the compile job -- before the
      # approval gate, before any credential exists, and with the registered names printed
      # in the refusal. That is the trade this form already makes for commit_sha, command
      # and wandb_project. Nothing here was ever unexpressible the way an unobtainable
      # machine is: every workload the catalog carries resolves, and the one whose
      # repository is unregistered is refused by the same compile job either way.
      #
      # WHAT IT WAS COSTING. `edullm-data-validate` shipped in the same pull request as the
      # registration it made usable, and could not have shipped without an owner on it.
      # tests/test_submission_form_options.py held this list equal to the catalog in both
      # directions, so a lead adding an entry made that test red and had nowhere to fix it.
      #
      # DO NOT MAKE compute_profile FREE TEXT BY ANALOGY. That list is what made gpu-1xh100
      # and gpu-8xh100 unexpressible rather than merely refusable on 2026-08-04, and the
      # note above it says why a refusal would not have been enough. Nothing similar was
      # ever protected here.
      #
      # WHAT WENT WITH THE OPTIONS. Each one carried a comment, and the two that were rules
      # rather than description are both in config/workload-catalog.yaml at greater length,
      # beside the entries they are about: olmo-core-train on why a multi-GPU command needs
      # torch.distributed.run, and open-instruct-scored-rewards-train on why its command has
      # to expand $EDULLM_CHECKPOINT_DIR. Both are enforced while compiling rather than
      # described here -- require_a_process_for_every_device and
      # require_a_save_folder_a_retry_can_find -- so the sentence a submitter needs reaches
      # them in a refusal either way. The catalog is the only place that enumerates now.
      workload_profile:
        description: "Which entry in config/workload-catalog.yaml. Start with olmo-core-check."
        required: true
        type: string
      # REQUIRED, AND BESIDE THE WORKLOAD BECAUSE THE TWO ARE ONE DECISION MADE TWICE.
      # This was an optional override defaulting to `inherit`, on the belief that the
      # workload profile carried the answer. It did not: the value here won whenever it was
      # filled in, nothing refused a disagreement between the two, and a submitter who left
      # it alone got whichever machine a catalog entry happened to name. The catalog no
      # longer names one, so there is nothing left to inherit from and the sentinel is gone
      # rather than left to resolve to nothing.
      #
      # Asking is the change. A machine is the most expensive field on this form by some
      # distance -- $0.526 an hour against $55.04, a hundredfold -- and it is the one a
      # submitter is best placed to answer, because they know what they are about to run.
      # Sorted, because tests/test_submission_form_options.py compares this list against
      # the provisioned profiles in config/workload-catalog.yaml sorted. Every one of them
      # has a queue and a job definition; picking one costs the wait for a machine and not
      # a refusal after approval.
      #
      # gpu-1xh100 AND gpu-8xh100 CAME OFF THIS LIST ON 2026-08-04, AND THIS IS THE EDIT THAT
      # ACTUALLY PROTECTS ANYBODY. Their queues exist and are healthy; EC2 will not sell this
      # account a p5 of either size, so a job routed to one waits in RUNNABLE and no field a
      # submitter can read ever says why. The per-queue cancel that was supposed to end that
      # wait cannot fire -- Batch matches those rules on statusReason and leaves it null for
      # this failure.
      #
      # Removing the option is what makes the shape unreachable. The catalog flag alone would
      # not have been enough: resolve_execution_target runs inside admission, which is after
      # the approval gate, so an unprovisioned profile reaching that far is refused with
      # no_execution_target having already spent somebody's signature. A `choice` input
      # rejects a value that is not listed, so the two edits together mean the form cannot
      # express the request at all. Send anybody who wanted eight H100 to gpu-8xa100.
      compute_profile:
        description: "Which machine this run gets. Start with cpu-32vcpu."
        required: true
        type: choice
        options:
          - cpu-32vcpu
          - gpu-1xa10g
          - gpu-1xl4
          - gpu-1xl40s
          - gpu-1xt4
          - gpu-4xa10g
          - gpu-4xl4
          - gpu-4xl40s
          - gpu-4xt4
          - gpu-8xa100
          - gpu-8xa10g
          - gpu-8xl4
          - gpu-8xl40s
          - gpu-8xt4
      # A DROPDOWN FOR THE MACHINE'S REASON AND NOT THE WORKLOAD'S, WHICH IS WORTH SAYING
      # HERE BECAUSE THE SYMMETRY ARGUMENT POINTS THE WRONG WAY. Registering a dataset takes
      # config/datasets.yaml, owned by nine, and this file, owned by two -- the same two-file
      # shape #232 removed for workload profiles. The cost is identical. What the two lists
      # protect is not, so this one stays.
      #
      # WHAT THE WORKLOAD LIST PROTECTED WAS NOTHING, AND THIS ONE IS NOT THAT. An
      # unregistered workload name is refused while the submission compiles, so removing the
      # options changed who could merge a registration and nothing a submitter could reach.
      # An unregistered *dataset* name is refused there too -- but an unregistered name is
      # not what this list is holding back. Twelve registered entries are deliberately not
      # offered, and seven of them are refused elsewhere: the four tokenizers and the vendor
      # mirror trip `dataset_is_not_a_corpus` by family, at all three checks, and the two
      # retired entries trip `retired_dataset_release` at the two checks before the approval
      # gate. The other five are admitted. Measured on 2026-08-05 by running each of them
      # through `edullm check`, through `tools/compile_submission.py`, and through
      # admission:
      #
      #   lean4-mathlib-bytes-v3, math-memory-full-v1      tokenizer/bytes-utf8
      #   math-sft-60m-v1, pedagogy70-normal30-v1,         no tokenizer declared
      #     frontload-cl-chat-sft-v1
      #
      # Every one of those five compiles clean, classifies routine, and is admitted. Nothing
      # downstream says a word. A run naming one spends its whole allocation reaching a
      # container that cannot construct a model for the tokens it just resolved, and exits
      # 69. So this list is not a second lock on a locked door; for those five it is the
      # only lock there is.
      #
      # That is the compute_profile argument rather than the workload_profile one, and it is
      # stronger here than there: an unprovisioned machine at least reaches
      # `no_execution_target`, late and expensively.
      #
      # THE SET WAS SEVEN WHEN THIS WAS WRITTEN AND IS FIVE, WHICH IS WHAT THE LAST
      # PARAGRAPH SAID WOULD HAPPEN. It said the answer would change when the refusals were
      # built, and named `retired` as one of the two. `retired:` had no enforcement anywhere
      # -- config/datasets.yaml said so in as many words, that the flag "keeps admission's
      # answer and removes the menu item" -- and it is now refused by
      # `require_a_dataset_release_that_is_current`, on the laptop and in the compile job.
      # So `dolma-2026-07` and `fineweb-edu-1b-v2` left the set, this list stopped being the
      # only thing standing between either of them and an immutable lineage record, and
      # nothing about the options moved.
      #
      # WHAT WOULD CHANGE THE ANSWER AGAIN, so this stays a decision rather than a
      # preference. The remaining half is a corpus whose tokenizer nothing here can
      # construct, refused while compiling; build that and the five become refusable rather
      # than merely unlistable, at which point this can be free text on exactly #232's
      # reasoning. Until then the option list is the enforcement for them.
      # tests/test_submission_form_options.py holds that measurement, derived from the same
      # functions the compile job and admission use, and goes red when it stops being true
      # in either direction.
      dataset_release:
        description: "Which corpus this run reads. Pick none if it reads nothing."
        required: true
        type: choice
        options:
          - none
          - regmix-10b-v1
          - reservoir-dolma2-v1
          - refhq-instruct-v3
          - refhq-regmix-5p5b-v2
          - olmo-original-30b-v1
          - olmo-127b-v1
          - olmo-150b-dolma2-v1
          - math-frontload-100m-v1
          - formal-proof-premises-500m-v3
          - frontload-cl-10b-v1
          - fineweb-edu-1b-v6
          - fineweb-edu-750m-v2
          - fineweb2-phase0-equal-bpe-2b-v1
          - fineweb2-phase0-equal-superbpe-2b-v1
          - fineweb2-unimax-bpe-20b-v1
          - fineweb2-unimax-superbpe-20b-v1
      # A DROPDOWN BECAUSE THE COST OF A TYPO WAS PAID SOMEWHERE THE TYPIST NEVER LOOKS.
      # This was free text and nothing refused an unrecognised value, so `pre-traning`
      # compiled, classified, was approved, ran, wrote its outputs under
      # teams/pre-traning/runs/ and booked its spend to a group that does not exist. The
      # cost report groups by whatever people typed, so the run simply is not in its
      # group's total and no refusal ever names the reason.
      #
      # The options are the eight team_ids in config/organization.yaml, in the order that
      # file declares them, and tests/test_submission_form_options.py holds them to it.
      # There is no `other`: eight is the whole list, and an escape hatch here would be the
      # free-text field back under a different name.
      team:
        description: "Your group. Pick scratch for anything you will not keep."
        required: true
        type: choice
        options:
          - platform
          - memory-split
          - input-core
          - pre-training
          - post-training
          - data-prep
          - eval-inference
          - scratch
      experiment:
        description: "Groups related runs. Lower-case with hyphens, like onboarding."
        required: true
        type: string
      wandb_project:
        description: "Weights and Biases project the run reports into."
        required: true
        type: string
      command:
        description: "What the container runs. Leave the default for a first run."
        required: true
        type: string
        # PRE-FILLED RATHER THAN DESCRIBED, WHICH IS THE DIFFERENCE BETWEEN AN EXAMPLE AND
        # A FIRST RUN. The description used to end with this exact line and ask the reader
        # to type it, which meant a first submission required retyping sixty characters of
        # Python with two kinds of quote in it, correctly, into a single-line text box.
        # Every character of that was an opportunity to be refused for a reason that has
        # nothing to do with whether this platform works.
        #
        # Splits under POSIX rules into three arguments whose first is `python`, which is
        # what RunManifest.command requires: a first element naming a program rather than a
        # whole command line. A default that could not compile would be worse than none.
        default: "python -c 'import sys; print(\"edullm ready\", sys.version)'"
      maximum_runtime_hours:
        description: "Override the runtime bound, in hours."
        required: false
        type: string
        default: ""
      maximum_attempts:
        description: "Override the attempt bound."
        required: false
        type: string
        default: ""
      # THERE WERE THREE OF THESE AND THE MIDDLE ONE WAS REMOVED, WHICH IS WORTH KNOWING
      # BEFORE SOMEBODY ADDS IT BACK. `fanout_parallelism` asked how many cells you expected
      # to run at once and was labelled as recorded rather than enforced. Batch's SubmitJob
      # takes a size for an array job and no concurrency cap, so the number went into the
      # manifest and the approver page and was never sent anywhere. A submitter who filled
      # it in came away believing their concurrency was bounded, saw the figure again on the
      # approval, and had nothing limiting them. What bounds how many cells run at once is
      # the compute environment's vCPU ceiling divided by what one cell reserves, and the
      # only way to say that is to stop offering a box that implies otherwise.
      fanout_size:
        description: "Cells in a fan-out. Declare both fan-out fields or neither."
        required: false
        type: string
        default: ""
      fanout_index_parameter:
        description: "What the index varies, such as seed or shard."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # A JOB HOLDING AWS CREDENTIALS, AHEAD OF THE APPROVAL GATE, AND WHY THAT IS ALL RIGHT.
  #
  # The invariant this file maintains is not "an unapproved dispatch never reaches AWS".
  # The deny-unapproved job below already holds id-token: write and calls STS on every
  # dispatch, by design. The invariant is that an unapproved dispatch cannot obtain the
  # *admission* role: it cannot start an execution, cannot submit a job, and cannot write
  # lineage. The role assumed here starts nothing and writes nothing. It holds two ECR
  # reads and returns what build-research-image.yml already prints into a step summary.
  #
  # What it does relax is a weaker second property, and that is worth stating plainly: the
  # approval gate used to be chosen before the run reached AWS at all, and the scan summary
  # this job reads is what picks that gate. The compensating control already exists and is
  # written out in tools/compile_submission.py -- admission re-derives the findings from the
  # registry itself and fails closed on disagreement, so an understated summary buys a
  # submitter a gate they still cannot pass.
  #
  # infra/iam/image-resolver-role.yaml carries the argument in full, beside the two actions
  # it is an argument about, including why a trust policy cannot tell this job from any
  # other job in this file. Read it there rather than trusting this summary of it.
  # A JOB OF ITS OWN, AND THE REASON IS THE GUARD ON THE JOB BELOW. The resolve job holds
  # `id-token: write`, and a test refuses it any `outputs` at all: what crosses out of a job
  # that can mint a credential has to be a document, never a string in the expression
  # context. That rule is right and this work does not belong under it -- turning a branch
  # name into a commit needs no AWS, no token that can reach it, and nothing from the
  # registry.
  #
  # So it happens here instead, in a job that cannot request an OIDC token by any spelling,
  # and both jobs below read the answer. Placing it first also means a branch that does not
  # exist is refused before a credential has been minted for it.
  identify:
    name: Resolve what the submitter named to a commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Resolve what the submitter named to a commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_REPOSITORY: ${{ inputs.repository }}
          RESEARCH_OWNER: ${{ github.repository_owner }}
          DECLARED: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          # A commit passes through untouched. Only something that is not one is looked up,
          # so the ordinary path costs no API call and the lookup cannot reinterpret a SHA
          # as a ref that happens to share its name.
          if [[ "${DECLARED}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha=${DECLARED}" >> "$GITHUB_OUTPUT"
            echo "Using the commit as given."
            exit 0
          fi
          # WHY A LOOKUP AND NOT A REFUSAL. The image resolver in the job below already
          # refuses anything that is not forty hex characters, and says what that costs:
          # the image tag is twelve characters of whatever it is handed, so a branch name
          # resolves to a tag nobody published and comes back as "this commit has no image"
          # -- sending the submitter to build something that is already built. That guard
          # stays. This exists so it is never reached by somebody who typed the only name
          # they know their work by.
          #
          # No token is strictly required, since every research repository is public, but
          # the GITHUB_TOKEN this workflow already holds raises the rate limit from sixty an
          # hour per runner IP to a thousand, and shared runners make the smaller figure a
          # real risk rather than a theoretical one. An apostrophe is avoided in this block
          # deliberately: a seam test shlex-parses every run body to find the AWS calls, and
          # one stray quote makes the whole file unparseable to it.
          resolved="$(gh api "repos/${RESEARCH_OWNER}/${RESEARCH_REPOSITORY}/commits/${DECLARED}" --jq .sha 2>/dev/null || true)"
          if [[ ! "${resolved}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "unresolvable_revision" >&2
            echo "There is no branch, tag or commit called '${DECLARED}' in ${RESEARCH_OWNER}/${RESEARCH_REPOSITORY}. Nothing was compiled and no reviewer was asked. Check the spelling, or push the branch first." >&2
            exit 1
          fi
          echo "commit_sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "'${DECLARED}' is ${resolved}. That commit is what the record will name, because a branch moves and a record must not."

  resolve:
    name: Read which image the declared commit published
    runs-on: ubuntu-latest
    needs: [identify]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the platform tooling
        env:
          UV_VERSION: "0.11.32"
        run: |
          set -euo pipefail
          pipx install "uv==${UV_VERSION}"
          installed="$(uv --version)"
          if [[ "${installed}" != "uv ${UV_VERSION}" && "${installed}" != "uv ${UV_VERSION} "* ]]; then
            echo "unexpected_uv_version" >&2
            echo "Expected uv ${UV_VERSION} but PATH answers with: ${installed}" >&2
            exit 1
          fi
          uv sync --locked

      # SPLIT BY REF, AND THE JOB IS NOT SPLIT WITH IT. On `main` this expression is
      # `vars.AWS_IMAGE_RESOLVER_ROLE_ARN` and everything below is what it was; from a branch
      # it is the preview role, which carries the same two describes on the same repositories
      # for the reason `infra/iam/run-preview-role.yaml` gives beside them.
      #
      # A second resolve job was the other way to do this and was refused. GitHub Actions has
      # no YAML anchors, so a second job means a second copy of these steps -- and the copy
      # is the thing a branch dispatch would then be exercising, which defeats the point of
      # previewing at all: a change to this job would go untested by the very path built to
      # test it. One job, one credential expression, and the ref chooses the role.
      #
      # NO `environment:` KEY HERE, ON EITHER PATH, AND THAT IS DELIBERATE. Declaring one
      # would replace this job's ref subject with an environment subject and break `main`,
      # where the image resolver's trust is pinned to `:ref:refs/heads/main`. The preview
      # role therefore carries a second trust statement that accepts the ref subject from any
      # branch except `main`, which is where that statement's `StringNotEquals` comes from.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.AWS_IMAGE_RESOLVER_ROLE_ARN || vars.AWS_RUN_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Two describes. The role's maximum is an hour and this has no use for one, so it
          # asks for the shortest session STS issues.
          role-duration-seconds: 900
          # Defaults to false in v6, and every ECR error names the registry id, which is
          # the account. The tool never prints an error body either; this is the second of
          # the two, because one of them is a property of code in this repository and the
          # other is a property of the runner.
          mask-aws-account-id: true

      # The ECR repository name is not passed in. The tool reads it out of
      # config/repositories.yaml for the reason the deleted write_image_provenance.py did:
      # this role may describe every sbsandbox-intern-edullm-* repository, so a name from
      # the caller would be the caller choosing whose images a submission resolves against
      # while the manifest went on naming the repository the form declared.
      #
      # A commit with nothing published is not a failure here and does not fail this job.
      # It writes an empty answer, and the compile job refuses the submission with a message
      # that names the build workflow -- which is a refusal a submitter can act on, where a
      # red job in the middle of a credentialed step is not.
      - name: Read which image this commit published
        env:
          RESEARCH_REPOSITORY: ${{ inputs.repository }}
          COMMIT_SHA: ${{ needs.identify.outputs.commit_sha }}
          RESOLVE_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          resolve_status=0
          uv run --frozen python tools/resolve_published_image.py \
            --registry config/repositories.yaml \
            --repository "${RESEARCH_REPOSITORY}" \
            --commit-sha "${COMMIT_SHA}" \
            --aws-region "${RESOLVE_AWS_REGION}" \
            --policy config/policy.yaml \
            --output "${RUNNER_TEMP}/published-image.json" || resolve_status=$?
          # Two answers, separated, and the separation is the point. Exit 1 is a refusal on
          # the merits -- today only an unregistered repository -- and the tool has already
          # printed a sentence naming what to do about it, so this step must not bury that
          # under a message about the registry being unreachable. Exit 2 says the tool could
          # not find out, which is an outage and not a verdict on the submission.
          if [[ "${resolve_status}" -eq 1 ]]; then
            echo "The submission was refused before anything was compiled and no reviewer was asked. The reason is printed above." >&2
            exit 1
          fi
          if [[ "${resolve_status}" -ne 0 ]]; then
            echo "published_image_unresolved" >&2
            echo "The registry could not be asked which image this commit published, so nothing was compiled and no reviewer was asked. This is not a refusal on the merits. The reason token is printed above; the error body is deliberately withheld because it names the account." >&2
            exit 1
          fi

      # An artifact rather than a job output, and the reason is the job below. Compiling
      # holds no id-token permission by construction, so what crosses between the two has
      # to be a document rather than a credential -- and a document is also what lets a
      # reader of a finished run see exactly what the registry answered.
      - name: Upload what the registry answered
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: published-image
          path: ${{ runner.temp }}/published-image.json
          if-no-files-found: error
          retention-days: 30

  # Credential free by construction. There is no id-token permission and no environment
  # key here, so this job cannot request an OIDC token at all: a job that cannot mint a
  # token cannot leak one, which is a stronger claim than trusting it not to. It is also
  # what makes the classification below worth anything, because the decision that picks
  # which approval gate a submission faces is computed before this job can reach AWS.
  #
  # `needs: [resolve]` orders the two and transfers nothing. The job above holds the token
  # that reaches ECR; this one reads the file it left behind.
  compile:
    name: Compile the submission and classify it
    runs-on: ubuntu-latest
    needs: [identify, resolve]
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.compile.outputs.run_id }}
      approval_class: ${{ steps.compile.outputs.approval_class }}
      environment: ${{ steps.compile.outputs.environment }}
      manifest_sha256: ${{ steps.compile.outputs.manifest_sha256 }}
    steps:
      # github.sha, never the floating ref the dispatch was aimed at. The submit job
      # checks out the same commit and recomputes the manifest hash on the far side of
      # the approval gate; that recomputation is a real tripwire only because both sides
      # are pinned. Against a moving ref the two hashes could differ merely because the
      # branch advanced, and a tripwire that fires for an ordinary reason is one people
      # learn to route around.
      - name: Check out the platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # pipx installs the pin, but an earlier uv already on PATH would keep answering and
      # resolve the lockfile under a version nobody chose, so the pin is verified rather
      # than assumed.
      - name: Install the platform tooling
        env:
          UV_VERSION: "0.11.32"
        run: |
          set -euo pipefail
          pipx install "uv==${UV_VERSION}"
          installed="$(uv --version)"
          if [[ "${installed}" != "uv ${UV_VERSION}" && "${installed}" != "uv ${UV_VERSION} "* ]]; then
            echo "unexpected_uv_version" >&2
            echo "Expected uv ${UV_VERSION} but PATH answers with: ${installed}" >&2
            exit 1
          fi
          uv sync --locked

      # A file rather than a command line, because SubmissionInputs is strict about types
      # in a way a flat string cannot express: the attempt and fan-out bounds are whole
      # numbers, the runtime bound is base-ten text because a bound that went through
      # binary floating point is not the number the approver reads, and the command is an
      # ordered sequence. Every value arrives through the environment, so nothing a
      # submitter types is ever part of this script.
      - name: Assemble the submission form
        env:
          FORM_REPOSITORY: ${{ inputs.repository }}
          FORM_COMMIT_SHA: ${{ needs.identify.outputs.commit_sha }}
          FORM_IMAGE_DIGEST: ${{ inputs.image_digest }}
          FORM_WORKLOAD_PROFILE: ${{ inputs.workload_profile }}
          FORM_DATASET_RELEASE: ${{ inputs.dataset_release }}
          FORM_TEAM: ${{ inputs.team }}
          FORM_EXPERIMENT: ${{ inputs.experiment }}
          FORM_WANDB_PROJECT: ${{ inputs.wandb_project }}
          FORM_COMMAND: ${{ inputs.command }}
          FORM_COMPUTE_PROFILE: ${{ inputs.compute_profile }}
          FORM_MAXIMUM_RUNTIME_HOURS: ${{ inputs.maximum_runtime_hours }}
          FORM_MAXIMUM_ATTEMPTS: ${{ inputs.maximum_attempts }}
          FORM_FANOUT_SIZE: ${{ inputs.fanout_size }}
          FORM_FANOUT_INDEX_PARAMETER: ${{ inputs.fanout_index_parameter }}
        run: |
          set -euo pipefail
          uv run --frozen python - "${RUNNER_TEMP}/submission-form.json" <<'PY'
          import json
          import os
          import shlex
          import sys
          from pathlib import Path

          TEXT_FIELDS = (
              ("repository", "FORM_REPOSITORY"),
              ("commit_sha", "FORM_COMMIT_SHA"),
              ("image_digest", "FORM_IMAGE_DIGEST"),
              ("workload_profile", "FORM_WORKLOAD_PROFILE"),
              ("dataset_release", "FORM_DATASET_RELEASE"),
              ("team", "FORM_TEAM"),
              ("experiment", "FORM_EXPERIMENT"),
              ("wandb_project", "FORM_WANDB_PROJECT"),
              ("compute_profile", "FORM_COMPUTE_PROFILE"),
              ("maximum_runtime_hours", "FORM_MAXIMUM_RUNTIME_HOURS"),
              ("fanout_index_parameter", "FORM_FANOUT_INDEX_PARAMETER"),
          )
          WHOLE_FIELDS = (
              ("maximum_attempts", "FORM_MAXIMUM_ATTEMPTS"),
              ("fanout_size", "FORM_FANOUT_SIZE"),
          )

          form: dict[str, object] = {}
          # NO SENTINEL, BECAUSE NO DROPDOWN SPELLS ABSENCE ANY MORE. A `choice` input
          # cannot offer a blank option, so while compute_profile was an override it had to
          # spell "take the registered default" as the word `inherit`, and this loop
          # translated it back to nothing. The catalog no longer declares a machine for it
          # to fall back to, so the field is required and every option on it is a real
          # profile. A sentinel left in place would now default to a value that resolves to
          # nothing at all, which is the one thing worse than asking.
          for field, variable in TEXT_FIELDS:
              text = os.environ.get(variable, "").strip()
              if text:
                  form[field] = text
          for field, variable in WHOLE_FIELDS:
              text = os.environ.get(variable, "").strip()
              if not text:
                  continue
              try:
                  form[field] = int(text)
              except ValueError:
                  raise SystemExit(
                      f"{field} must be a whole number, and the form carried {text!r}"
                  ) from None
          # An empty command leaves the field out rather than writing an empty list, so
          # the refusal names a missing required field instead of an unusable one.
          command = shlex.split(os.environ.get("FORM_COMMAND", ""))
          if command:
              form["command"] = command

          Path(sys.argv[1]).write_text(
              json.dumps(form, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"The form declares {len(form)} of the fifteen fields.")
          PY

      - name: Download what the registry answered
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: published-image
          path: ${{ runner.temp }}/published-image

      - name: Compile the submission
        id: compile
        env:
          SUBMITTER: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RESEARCH_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          compile_status=0
          uv run --frozen python tools/compile_submission.py \
            --inputs "${RUNNER_TEMP}/submission-form.json" \
            --config-dir config \
            --published-images "${RUNNER_TEMP}/published-image/published-image.json" \
            --submitter "${SUBMITTER}" \
            --repository-url "${SERVER_URL}/${REPOSITORY_OWNER}/${RESEARCH_REPOSITORY}" \
            --output "${RUNNER_TEMP}/compiled-submission.json" \
            --summary "${RUNNER_TEMP}/approver-context.md" \
            --github-output "${GITHUB_OUTPUT}" || compile_status=$?
          # Exit 1 is a refusal on the merits, and it is the whole point of refusing here:
          # a submission naming an unregistered dataset would be denied by admission
          # whatever a reviewer said, and spending human attention on it first teaches
          # reviewers that approving is a formality. Exit 2 is a different thing and must
          # not read like a judgement.
          if [[ "${compile_status}" -eq 1 ]]; then
            echo "submission_refused" >&2
            echo "The form does not compile into a manifest policy can judge, so no reviewer was asked. The reason is printed above." >&2
            exit 1
          fi
          if [[ "${compile_status}" -ne 0 ]]; then
            echo "submission_form_unusable" >&2
            echo "The form or the reviewed configuration could not be read. This is not a refusal on the merits." >&2
            exit 1
          fi

      # THE GATE IS THE ONE CONTROL HERE THAT IS NOT A FILE, AND IT CAN BE DELETED WITHOUT A
      # COMMIT. Required reviewers on an environment are offered for public repositories on
      # every plan and for private ones only above Free. This organization is Free, so
      # converting this repository to private does not weaken the gate, it removes it: the
      # protection rule goes, the job below deploys straight through, and nothing turns red,
      # because a job whose environment carries no protection rule is a job that runs. The
      # daily audit reads the same thing at 05:00; this reads it at submission time, because
      # between those two the window is a working day.
      #
      # IT REFUSES ONLY ON A POSITIVE READING AND NEVER ON A FAILURE TO LOOK. A gate check
      # that turned a GitHub hiccup into a refused submission would cost more than the gate
      # being unread for one dispatch, so an unreachable endpoint, a non-200 or a body this
      # cannot parse all warn and carry on. What is refused is one thing: GitHub answering,
      # in full, that the environment this run is routed to has no required-reviewer rule.
      #
      # Skipped off `main` and skipped for the automatic class, because both are reviewer-less
      # by design -- a branch dispatch demotes to `run-approval-preview` and
      # `run-approval-automatic` carries a branch policy and nobody. The condition reads the
      # class this job computed rather than anything on the form.
      #
      # No credential and no permission beyond the `contents: read` this job already declares.
      # Verified anonymously against this repository on 2026-08-06: the endpoint answers HTTP
      # 200 with no session at all, precisely because the repository is public.
      - name: Check the gate this run is routed to still asks somebody
        if: github.ref == 'refs/heads/main' && steps.compile.outputs.approval_class != 'automatic'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REPOSITORY: ${{ github.repository }}
          GATE: ${{ steps.compile.outputs.environment }}
        run: |
          set -euo pipefail
          gate_file="${RUNNER_TEMP}/gate.json"
          if ! gh api "repos/${RUN_REPOSITORY}/environments/${GATE}" \
            --header "Accept: application/vnd.github+json" > "${gate_file}" 2>/dev/null; then
            echo "::warning::The ${GATE} gate could not be read, so whether it still asks a reviewer is unknown for this run. It is read again by the audit at 05:00."
            exit 0
          fi
          # `protection_rules` MUST BE PRESENT AND AN ARRAY FOR THE ANSWER TO COUNT. An
          # environment with nothing on it answers with the key and an empty list, which is
          # the reading that refuses. A body without the key at all is not an environment
          # response, and counting the rules in it would reach zero by the same arithmetic and
          # refuse a submission over a shape this step does not understand.
          reviewer_rules="$(jq -r 'if (.protection_rules | type) == "array" then ([.protection_rules[] | select(.type == "required_reviewers")] | length) else "" end' "${gate_file}" 2>/dev/null || true)"
          if [[ ! "${reviewer_rules}" =~ ^[0-9]+$ ]]; then
            echo "::warning::The ${GATE} gate answered something this step cannot read, so whether it still asks a reviewer is unknown for this run."
            exit 0
          fi
          if [[ "${reviewer_rules}" -eq 0 ]]; then
            echo "gate_asks_nobody" >&2
            echo "GitHub reports no required-reviewer rule on ${GATE}, so this run would deploy with nobody asked and no approval record. Nothing about this submission is wrong and it has not been refused on the merits." >&2
            echo "The usual cause is this repository having been converted to private: required reviewers on an environment need a plan above Free once a repository is not public, and the rule is removed rather than disabled. Check the visibility first, then MAINTAINING.md." >&2
            exit 1
          fi
          echo "The ${GATE} gate still asks a reviewer."

      # GitHub's approval notification carries none of this, so the reviewer has to open
      # the run. That is a limitation of the mechanism; what this can do is make the
      # summary complete enough that opening the run is sufficient.
      - name: Publish the approver context
        run: |
          set -euo pipefail
          cat "${RUNNER_TEMP}/approver-context.md" >> "${GITHUB_STEP_SUMMARY}"

      # The same markdown again, as an artifact, and only because GitHub offers no other
      # way to read it back. A step summary is rendered in the run page and exposed by no
      # REST endpoint, and the public page hides it behind sign-in -- so the one check
      # about what a reviewer was shown could be satisfied only by somebody describing it
      # from memory. Uploading it makes that check provable by the same evidence path as
      # everything else, and it costs a kilobyte.
      #
      # This is a copy of what the reviewer saw, not a re-render: both come from the one
      # file the compile step wrote, so the artifact cannot drift from the summary.
      - name: Upload the approver context
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: approver-context
          path: ${{ runner.temp }}/approver-context.md
          if-no-files-found: error
          retention-days: 30

      # The manifest crosses the approval gate as an artifact rather than as a job output.
      # Job outputs are strings assembled into the expression context and the manifest is
      # a document; carrying it as one is also what lets the submit job recompute a hash
      # over exactly the bytes this job hashed.
      - name: Upload the compiled submission
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: compiled-submission
          path: ${{ runner.temp }}/compiled-submission.json
          if-no-files-found: error
          retention-days: 30

  # THE ONE THING NOTHING ELSE CAN SUPPLY, WRITTEN AT THE MOMENT IT EXISTS. A workflow run
  # does not expose the inputs it was dispatched with, and `run-name` is evaluated before any
  # job runs, so there is no way to read a platform run id off the runs list. The CLI joins
  # them today by downloading each recent dispatch's compiled manifest, newest first, over a
  # bounded window -- which degrades exactly where it is needed most, because a run whose
  # artifacts have aged out is unjoinable and those are the runs people ask about.
  #
  # BEFORE THE APPROVAL GATE, AND THAT IS DELIBERATE. A submission refused at the gate, or
  # left parked at it, writes no intent record -- and the intent record is where every other
  # copy of this join lives. Those are precisely the runs a status query has nothing else to
  # go on for, so the index has to be written on the near side of the gate.
  #
  # NO id-token, SO THIS JOB CANNOT OBTAIN AN AWS IDENTITY. It is the only job in this file
  # holding a write into this repository, and the audit makes the same separation for the
  # same reason: a job that can reach the account and rewrite the record can publish a record
  # of something that did not happen.
  index-the-run:
    name: Index the run id against the workflow run that minted it
    runs-on: ubuntu-latest
    needs: [identify, compile]
    timeout-minutes: 10
    permissions:
      contents: write
    # ONE WRITER, BECAUSE THE PUBLISH IS A FORCE PUSH. The document is rewritten whole, so
    # two submissions merging into it at once would each read the branch before the other
    # wrote, and the loser would be a mapping nobody can reconstruct. Not cancel-in-progress:
    # a cancelled writer is a submission that never reaches the index at all.
    concurrency:
      group: run-index
      cancel-in-progress: false
    steps:
      - name: Check out the platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}

      - name: Install the platform tooling
        env:
          UV_VERSION: "0.11.32"
        run: |
          set -euo pipefail
          pipx install "uv==${UV_VERSION}"
          uv sync --locked

      # THE FETCH IS THE DANGEROUS STEP AND IT IS WHY THE INDEX IS MERGED BY A TOOL. The
      # document is cumulative and force-pushed, so a fetch that half-succeeded and a writer
      # that started fresh would together publish a one-entry index over every mapping the
      # branch holds. tools/publish_run_index.py refuses an existing file it cannot parse;
      # what this step has to get right is that an absent file means the branch is new rather
      # than that the fetch failed.
      - name: Read the index the branch already holds
        env:
          INDEX_BRANCH: machine/run-index
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "${INDEX_BRANCH}" > /dev/null 2>&1; then
            echo "no index branch yet, so this run is the first entry"
            exit 0
          fi
          git fetch origin "${INDEX_BRANCH}" --depth=1
          if ! git show "FETCH_HEAD:run-index.json" > run-index.json; then
            echo "run_index_branch_holds_no_index" >&2
            echo "${INDEX_BRANCH} exists and carries no run-index.json. This job is the only" >&2
            echo "thing that writes that branch and it always writes the file, so the branch" >&2
            echo "was made by hand or truncated. Publishing now would force-push a one-entry" >&2
            echo "index over whatever is there, and these mappings cannot be rebuilt." >&2
            exit 1
          fi
          echo "the index holds $(wc -c < run-index.json) bytes"

      - name: Add this run to the index
        env:
          RUN_ID: ${{ needs.compile.outputs.run_id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUBMITTER: ${{ github.actor }}
          RESEARCH_REPOSITORY: ${{ inputs.repository }}
          COMMIT_SHA: ${{ needs.identify.outputs.commit_sha }}
          TEAM: ${{ inputs.team }}
          COMPUTE_PROFILE: ${{ inputs.compute_profile }}
          APPROVAL_CLASS: ${{ needs.compile.outputs.approval_class }}
          EXPERIMENT: ${{ inputs.experiment }}
          FANOUT_SIZE: ${{ inputs.fanout_size }}
        run: |
          set -euo pipefail
          uv run --frozen python tools/publish_run_index.py --index run-index.json

      # FORCE-PUSHED, WHICH IS SAFE HERE AND WOULD NOT BE ON THE READING BRANCH. This
      # document is cumulative -- the step above merged into everything the branch held -- so
      # the tip carries every mapping and the history behind it is one commit per submission
      # saying nothing the tip does not. The readings on machine/substrate are the opposite:
      # each one is a different morning and last week is the only copy of last week, so that
      # branch is appended to and never force-pushed.
      - name: Publish the index
        env:
          INDEX_BRANCH: machine/run-index
          RUN_ID: ${{ needs.compile.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "${INDEX_BRANCH}-publish"
          git add --force run-index.json
          git commit -m "run index: ${RUN_ID}"
          git push --force origin "HEAD:${INDEX_BRANCH}"
        # RUN_ID in the message rather than the workflow run number, because the message is
        # the only place a person reading the branch history sees which submission a commit
        # was for.

  # THE MESSAGE THAT ASKS A LEAD TO RELEASE THIS, AND THE REASON ITS BODY IS SOMEWHERE ELSE.
  #
  # notifier_handler has been able to render an approval request since #337 and nothing sent
  # it one, so what a lead actually received was GitHub's own deployment notification, whose
  # title is the workflow run name and which carries no cost, no machine, no hours and no
  # cell count. This is the producer. It fires here, between the compile job that classified
  # the submission and the submit job that is parked at the gate, because that window is the
  # whole of the time the message is worth anything.
  #
  # A `uses:` JOB RATHER THAN STEPS, AND THAT IS THE NARROWING RATHER THAN A STYLE. This job
  # entry carries `id-token: write`, and a reader who stopped there would conclude that a
  # seventh principal has just been added to the two trust policies pinning job_workflow_ref
  # to this file. It has not. A job that calls a reusable workflow presents the *called*
  # file as its job_workflow_ref, so the token minted under this permission names
  # notify-approval-requested.yml and is refused by both the admission role and the image
  # resolver. And because a `uses:` job may not declare `steps:`, there is no shell in *this*
  # file that can request a token from this permission at all -- which is a stronger
  # statement than the compile job's, whose guarantee rests on the permission being absent.
  # tests/test_phase2_submit_run_workflow.py asserts both halves. The called file carries the
  # argument in full.
  #
  # WHAT THE CONDITION IS FOR, BOTH HALVES. `approval_class != automatic` because the
  # automatic gate carries no reviewers, so there is nobody to ask and a message asking
  # somebody would name a person who was never consulted -- the same reasoning, and the same
  # job output, as the "Read who released the gate" step below. `github.ref` because a
  # dispatch from a branch is routed to run-approval-preview, which also has no reviewers;
  # the role's trust pins refs/heads/main, so a branch dispatch would fail at the credential
  # step rather than skip, and a red job on the one path that exists to be tried before
  # merging is worse than a message nobody was owed.
  #
  # ONE MESSAGE PER ATTEMPT, WHICH IS NOT THE SAME AS ONE PER RUN AND IS THE RIGHT ONE. A
  # re-run of this workflow re-requests the approval, so a second message is correct; the
  # event id carries github.run_attempt so the two are distinguishable rather than mistaken
  # for a redelivery. A re-run of only the failed jobs leaves a job that succeeded alone, so
  # the ordinary repair of a later failure sends nothing.
  announce-the-gate:
    name: Ask a lead to release this submission
    needs: [compile]
    if: >-
      github.ref == 'refs/heads/main'
      && needs.compile.outputs.approval_class != 'automatic'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/notify-approval-requested.yml

  # This job exists in this file rather than in a file of its own, and it has to. The
  # admission role trust policy pins job_workflow_ref to this exact path with
  # StringEquals, so the same attempt made from another workflow would be refused because
  # the file is the wrong file -- a refusal that says nothing about the condition under
  # test. Here the claim differs from the submit job's in exactly one respect: this job
  # declares no `environment:`, so GitHub mints a ref-scoped subject
  # (repo:...:ref:refs/heads/main) rather than an environment-scoped one
  # (repo:...:environment:run-approval-lead). Same file, same repository, same branch,
  # differing only in the absence of the environment key, which isolates the environment
  # condition as the only variable.
  #
  # One limitation, stated rather than hidden. STS reports a refusal without saying which
  # condition failed, and on any ref other than refs/heads/main the job_workflow_ref
  # condition fails as well. On a branch this job therefore goes green for a reason it
  # cannot distinguish from the one it is testing; it is a real check only on main.
  deny-unapproved:
    name: Verify an unapproved job cannot assume the admission role
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout. This job holds an OIDC token aimed at a production role and has no
      # business reading code beside it.
      - name: Attempt the admission role without an approval
        env:
          ADMISSION_ROLE_ARN: ${{ vars.AWS_ADMISSION_ROLE_ARN }}
          PROBE_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          # A probe that fails for an unrelated reason proves nothing, so everything it
          # needs is checked before the attempt and each shortfall is reported as itself.
          # The ARN is never echoed on any path: it carries the account id.
          if [[ -z "${ADMISSION_ROLE_ARN}" ]]; then
            echo "admission_role_arn_unset" >&2
            exit 1
          fi
          if [[ ! "${ADMISSION_ROLE_ARN}" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "admission_role_arn_malformed" >&2
            exit 1
          fi
          if [[ -z "${PROBE_AWS_REGION}" ]]; then
            echo "aws_region_unset" >&2
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN-}" ]]; then
            echo "oidc_token_request_unavailable" >&2
            exit 1
          fi

          token_file="${RUNNER_TEMP}/deny-probe-token.json"
          token_status=0
          curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --output "${token_file}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" 2>/dev/null || token_status=$?
          if [[ "${token_status}" -ne 0 ]]; then
            echo "oidc_token_unobtainable" >&2
            exit 1
          fi
          web_identity_token="$(jq -r '.value // empty' "${token_file}")"
          if [[ -z "${web_identity_token}" ]]; then
            echo "oidc_token_unreadable" >&2
            exit 1
          fi

          # Credentials land on stdout when this succeeds, so stdout goes nowhere. The
          # refusal lands on stderr, and only the error code is ever read out of it.
          error_file="${RUNNER_TEMP}/deny-probe-error.txt"
          attempt_status=0
          aws sts assume-role-with-web-identity \
            --role-arn "${ADMISSION_ROLE_ARN}" \
            --role-session-name deny-unapproved-probe \
            --web-identity-token "${web_identity_token}" \
            --region "${PROBE_AWS_REGION}" \
            --output text > /dev/null 2> "${error_file}" || attempt_status=$?

          if [[ "${attempt_status}" -eq 0 ]]; then
            echo "admission_role_assumed_without_an_environment" >&2
            echo "A job that declared no environment was issued admission credentials. The trust policy no longer enumerates only the two approval environments in its sub condition." >&2
            exit 1
          fi
          if ! grep -q AssumeRoleWithWebIdentity "${error_file}"; then
            echo "deny_probe_inconclusive:sts_was_not_reached" >&2
            echo "The attempt failed before STS answered, so it establishes nothing about the environment condition." >&2
            exit 1
          fi
          error_code="$(sed -n 's/.*An error occurred (\([A-Za-z0-9]*\)).*/\1/p' "${error_file}")"
          error_code="${error_code%%$'\n'*}"
          if [[ "${error_code}" != "AccessDenied" ]]; then
            echo "deny_probe_inconclusive:${error_code:-no_sts_error_code}" >&2
            echo "STS answered, but not with a trust-policy refusal, so the attempt establishes nothing about the environment condition." >&2
            exit 1
          fi
          echo "The admission role refused a subject minted without an environment, which is what the enumerated sub condition requires."

  submit:
    name: Submit the approved manifest to admission
    runs-on: ubuntu-latest
    needs: [compile, deny-unapproved]
    timeout-minutes: 30
    # The gate is named by the compile job, never by the form. GitHub is equally happy to
    # resolve this key from an expression over the dispatch inputs, and that spelling
    # would let the submitter pick which reviewers they face -- an exception routed to
    # the lead gate by typing a name into a text box, which collapses the whole
    # two-environment design.
    # The name comes from `needs` because the job that computed it holds no credentials
    # and derives the answer from policy rather than from the submitter.
    #
    # ON A BRANCH THE GATE IS `run-approval-preview` INSTEAD, AND THE CONDITION IS THE REF
    # RATHER THAN ANYTHING THE SUBMITTER TYPED. Every role trusted to this file pins its
    # subject to `refs/heads/main`, so before this existed a dispatch from a branch died in
    # the resolve job at the credential step -- the submission path was the one path that
    # could not be tried until it was already merged. `github.ref` is not a dispatch input
    # and does not appear on the form; choosing it means pushing a branch, which is the
    # thing being previewed.
    #
    # This can only ever be a demotion, which is what makes it safe to decide here rather
    # than in the compile job. From `main` the expression is the classified gate and this
    # job behaves exactly as it did before. From a branch it is an environment with no
    # reviewers whose role may place a job on the cheapest CPU queue and nothing else --
    # so a submitter cannot reach a GPU or skip a lead by dispatching from a branch, they
    # can only reach less. infra/iam/run-preview-role.yaml carries the ceiling and the
    # argument for it.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && needs.compile.outputs.environment || 'run-approval-preview' }}
    permissions:
      contents: read
      id-token: write
      # For GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals, which is how this
      # job learns who released the gate. The documentation reads as though the endpoint
      # is reviewer-only. It is not: a token holding actions: read reaches it, verified
      # against this repository.
      actions: read
    steps:
      - name: Check out the platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the platform tooling
        env:
          UV_VERSION: "0.11.32"
        run: |
          set -euo pipefail
          pipx install "uv==${UV_VERSION}"
          installed="$(uv --version)"
          if [[ "${installed}" != "uv ${UV_VERSION}" && "${installed}" != "uv ${UV_VERSION} "* ]]; then
            echo "unexpected_uv_version" >&2
            echo "Expected uv ${UV_VERSION} but PATH answers with: ${installed}" >&2
            exit 1
          fi
          uv sync --locked

      - name: Download the compiled submission
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: compiled-submission
          path: ${{ runner.temp }}/compiled-submission

      # An environment gate releases a job; it does not tell the job who released it.
      # This endpoint does, and admission needs the answer, because authorization is
      # evaluated against the approver and a submission that names nobody is refused
      # there. Failing here instead is the kinder half of the same outcome: it costs the
      # approval either way, and this way the reason is a line in a log rather than a
      # lineage record that reads as though the approver was not permitted.
      #
      # SKIPPED FOR THE AUTOMATIC GATE, WHERE THERE IS NOBODY TO READ. run-approval-automatic
      # carries a branch policy and no reviewers, so GitHub releases the job without an
      # approval and this endpoint answers with an empty list. Left unconditional the step
      # would exit approver_login_unreadable and refuse exactly the cheap runs the automatic
      # class exists to let through, with a message about an unreadable approver rather than
      # about a policy that asked for none.
      #
      # The condition reads the class the credential-free compile job computed, which is the
      # same value that chose this job's `environment:` above. Reading `inputs.` here instead
      # would let a submitter claim the automatic path from the form.
      - name: Read who released the gate
        id: approval
        if: needs.compile.outputs.approval_class != 'automatic'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          approvals_file="${RUNNER_TEMP}/approvals.json"
          api_status=0
          gh api "repos/${RUN_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/approvals" \
            --header "Accept: application/vnd.github+json" \
            > "${approvals_file}" 2>/dev/null || api_status=$?
          if [[ "${api_status}" -ne 0 ]]; then
            echo "approvals_endpoint_unreadable" >&2
            exit 1
          fi
          approver="$(jq -r '[.[] | select(.state == "approved") | .user.login // empty] | last // empty' "${approvals_file}")"
          if [[ -z "${approver}" ]]; then
            echo "approver_login_unreadable" >&2
            echo "The approvals endpoint answered but named nobody who released this run, so the admission request cannot say who approved it." >&2
            exit 1
          fi
          # GitHubLogin, the shape the record this feeds is validated against. Checking it
          # here also keeps anything else out of GITHUB_OUTPUT.
          if [[ ! "${approver}" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "approver_login_unusable" >&2
            exit 1
          fi
          echo "approver=${approver}" >> "${GITHUB_OUTPUT}"
          echo "The gate was released by ${approver}."

      # The value that crossed the gate is the digest the reviewer was shown; the document
      # that crossed it is the artifact. Recomputing one from the other is a tripwire
      # rather than a formality only because both sides are pinned -- the dispatch inputs
      # are immutable for the life of the run and both checkouts name github.sha -- so the
      # two must agree by construction and a difference means something moved. Admission
      # recomputes it a third time inside AWS, because this runner is not trusted to
      # report its own result.
      - name: Recompute the manifest hash after approval
        env:
          APPROVED_SHA256: ${{ needs.compile.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          uv run --frozen python tools/verify_approved_manifest.py \
            --submission "${RUNNER_TEMP}/compiled-submission/compiled-submission.json" \
            --approved-sha256 "${APPROVED_SHA256}"

      # Read out of config/repositories.yaml rather than written down anywhere, and read
      # HERE rather than eleven steps further down, which is where it used to sit.
      #
      # It arrived in Phase 3 for the Batch denial probes, which carry no image probe and
      # never use the value -- the tool validates every argument before it attempts
      # anything, and a placeholder invented to satisfy a validator is the first step
      # towards a probe aimed at something that is not there. Phase 6 gives it a real
      # consumer: it is the repository ReadImageScan describes against, so it has to be in
      # hand before the admission request is built rather than after.
      #
      # Order is load-bearing in a way that would not announce itself. A `steps.` output
      # referenced before its step has run is the empty string, not an error, so leaving
      # this below the assembly would send `"ecr_repository": ""` and fail the describe on
      # a repository name nobody wrote. The `required()` guard in the assembly catches that,
      # and this ordering is why it never has to.
      - name: Resolve the registered image repository
        id: registry
        env:
          RESEARCH_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          uv run --frozen python - > "${RUNNER_TEMP}/ecr-repository.txt" <<'PY'
          import os
          from pathlib import Path

          from edullm_platform.build_tooling import load_registry

          registered = load_registry(Path("config/repositories.yaml")).repository_by_name(
              os.environ["RESEARCH_REPOSITORY"]
          )
          print(registered.ecr_repository)
          PY
          ecr_repository="$(cat "${RUNNER_TEMP}/ecr-repository.txt")"
          # An ECR repository name, and nothing that could carry a second line into
          # GITHUB_OUTPUT. The registry contract already constrains the field; this is the
          # same check the approver login gets, for the same reason.
          if [[ ! "${ecr_repository}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "registered_repository_unusable" >&2
            exit 1
          fi
          echo "ecr_repository=${ecr_repository}" >> "${GITHUB_OUTPUT}"

      - name: Assemble the admission request
        env:
          APPROVED_SHA256: ${{ needs.compile.outputs.manifest_sha256 }}
          APPROVAL_CLASS: ${{ needs.compile.outputs.approval_class }}
          APPROVER: ${{ steps.approval.outputs.approver }}
          ECR_REPOSITORY: ${{ steps.registry.outputs.ecr_repository }}
          RUN_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          uv run --frozen python - \
            "${RUNNER_TEMP}/compiled-submission/compiled-submission.json" \
            "${RUNNER_TEMP}/admission-request.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path


          def required(name: str) -> str:
              # The job-context workflow identity is documented as unavailable on GitHub
              # Enterprise Server, where it resolves to the empty string rather than
              # failing. Empty here would record a workflow run nobody can find.
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"{name} is empty, so the admission request cannot be assembled")
              return value


          source, destination = Path(sys.argv[1]), Path(sys.argv[2])
          document = json.loads(source.read_text(encoding="utf-8"))
          workflow_ref = required("WORKFLOW_REF")
          if "@" not in workflow_ref:
              raise SystemExit("job.workflow_ref must read owner/repo/path@ref")

          # NULL FOR THE AUTOMATIC CLASS, AND REFUSED RATHER THAN IGNORED FOR THE OTHER TWO.
          # A gate with reviewers must name the person who released it, because
          # evaluate_authorization decides against the approver. The automatic gate has no
          # reviewers, so the honest value is null: recording the submitter there would
          # manufacture a self-approval nobody performed, and recording a lead would name
          # somebody who was never asked. An approver arriving on an automatic run means the
          # step above ran when it should not have, which is a routing fault worth stopping
          # for rather than dropping quietly.
          approval_class = required("APPROVAL_CLASS")
          supplied_approver = os.environ.get("APPROVER", "").strip()
          if approval_class == "automatic":
              if supplied_approver:
                  raise SystemExit(
                      "an automatic submission carries an approver, so the gate that "
                      "released it was not the reviewer-less one policy chose"
                  )
              approver = None
          else:
              approver = required("APPROVER")

          request = {
              "run_id": document["run_id"],
              "submitter": document["submitter"],
              "approver": approver,
              "approving_environment": document["approving_environment"],
              # The digest the compile job published and the reviewer was shown, carried
              # across the gate through `needs` rather than read back out of the very
              # document admission is being asked to judge.
              "approved_manifest_sha256": required("APPROVED_SHA256"),
              "manifest": document["manifest"],
              # Where ReadImageScan looks, resolved from the registry by the step above.
              # A hint about which repository holds this digest, never an authority on it:
              # the validator re-derives the same name from manifest.repository against the
              # registry in its own zip and refuses the request if the two disagree. So a
              # request built by hand cannot aim the scan read at a cleaner repository.
              "ecr_repository": required("ECR_REPOSITORY"),
              # Beside the manifest rather than inside it. The manifest is hashed and the
              # digest is what the approver released, so a grouping key folded into it would
              # change the digest of every record written before the field existed.
              "experiment": document["experiment"],
              "workflow_run": {
                  "run_repository": required("RUN_REPOSITORY"),
                  "workflow_repository": required("WORKFLOW_REPOSITORY"),
                  "workflow_path": required("WORKFLOW_FILE_PATH"),
                  "workflow_ref": workflow_ref.split("@", 1)[1],
                  "run_id": int(required("WORKFLOW_RUN_ID")),
                  "run_attempt": int(required("WORKFLOW_RUN_ATTEMPT")),
              },
          }
          destination.write_text(
              json.dumps(request, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"The admission request names run {request['run_id']}.")
          PY

      - name: Configure AWS credentials
        id: credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          # The same ref condition that chose this job's `environment:` above, and it has to
          # be the same one: the environment decides which subject GitHub mints, and a role
          # whose trust names the other environment refuses it. Splitting the two conditions
          # would produce an AccessDenied at this step with nothing pointing at the cause,
          # which is the failure mode infra/README.md describes for every trust pin here.
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.AWS_ADMISSION_ROLE_ARN || vars.AWS_RUN_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # One StartExecution and a bounded poll. The role's maximum is an hour and this
          # job has no use for one, so it asks for the shortest session STS issues.
          role-duration-seconds: 900
          # Defaults to false in v6. Every ARN below is composed from the assumed
          # identity, so without this the account id reaches a world-readable log the
          # first time a call reports an error against one of them.
          mask-aws-account-id: true

      # Here, and nowhere else. The probes run under the real, environment-scoped
      # admission session and immediately before the one call that session is allowed to
      # make, which is the only moment where "this role can do nothing but start the
      # admission state machine" is a statement about the credentials actually in hand
      # rather than about a committed template. infra/iam/admission-role.yaml says the
      # grant is one StartExecution and two read-only execution actions, but the role is
      # created from a laptop and is not redeployed by CI, so a policy widened in the
      # console leaves every test in this repository green. Attempted from this session, a
      # role that has been widened stops a submission rather than being found out later.
      #
      # One probe is not inert, and it is the entry that matters most. s3:PutObject has no
      # dry run and must be aimed at the real lineage bucket, because a made-up name is
      # answered NoSuchBucket before anybody is authorized. It writes one empty object
      # under denial-probe/ -- never under intent/, decision/ or conflicts/, which are the
      # lineage record itself -- and sends --if-none-match '*', so it can create an object
      # once and can never overwrite one. If the role ever is permitted, that first object
      # exists. It can be deleted: the bucket enables Object Lock but sets no default
      # retention rule, so nothing holds the object beyond somebody noticing it. The cost
      # of proving the entry that makes a lineage record a statement by the platform
      # rather than by its caller is therefore one stray object and a cleanup, and it is
      # written here rather than only in the tool so the person reading this workflow
      # knows what they are accepting.
      - name: Attempt the actions the admission session must not have
        env:
          ADMISSION_ACCOUNT_ID: ${{ steps.credentials.outputs.aws-account-id }}
          ADMISSION_REGION: ${{ vars.AWS_REGION }}
          # The deployed name, as infra/lineage-bucket.yaml spells it. A bucket that is
          # not there is answered NoSuchBucket before authorization is reached, so a name
          # invented here would report an absent bucket as a refusal by this role.
          LINEAGE_BUCKET: sbsandbox-intern-edullm-lineage
        run: |
          set -euo pipefail
          # Composed from the assumed identity, exactly as the two calls below are, so no
          # account identifier is written down in this repository. The tool takes the ARN
          # whole and derives the probe targets by extending it.
          state_machine_arn="arn:aws:states:${ADMISSION_REGION}:${ADMISSION_ACCOUNT_ID}:stateMachine:sbsandbox-intern-edullm-admission"
          denials_status=0
          uv run --frozen python tools/verify_admission_denials.py \
            --region "${ADMISSION_REGION}" \
            --state-machine-arn "${state_machine_arn}" \
            --lineage-bucket "${LINEAGE_BUCKET}" \
            --output "${RUNNER_TEMP}/admission-denials.json" || denials_status=$?
          # Two different answers that must not read alike, the way the compile step
          # separates a refusal on the merits from a form it could not read. Exit 1 says
          # the matrix was not proved: something the admission role must not be able to do
          # was permitted, or a probe failed in a way that establishes nothing. That is a
          # security finding and never a warning. Exit 2 says the run could not be set up,
          # so nothing was attempted and nothing was learned about how wide the role is.
          # Both stop the submission, because a submission is the thing a widened role
          # would be used for.
          if [[ "${denials_status}" -eq 1 ]]; then
            echo "admission_denial_matrix_not_proved" >&2
            echo "The session in hand was not shown to be refused everything but starting the admission state machine, so this run must not submit. One line per action is printed above; read the deployed role against infra/iam/admission-role.yaml before re-running." >&2
            exit 1
          fi
          if [[ "${denials_status}" -ne 0 ]]; then
            echo "admission_denial_matrix_not_attempted" >&2
            echo "The probes could not be set up against the deployed admission state machine, so none of them was attempted. This is not a finding about how wide the role is." >&2
            exit 1
          fi

      # Phase 2 counterpart of Phase 1's publisher denial matrix, and it reaches the proof
      # bundle the same way: a refusal nobody kept a copy of is a claim rather than
      # evidence. Every field of the record was masked by the contract that holds it and
      # the whole document was scanned again before it was written, because an artifact is
      # the copy that gets kept. Deliberately no `if:` -- the tool writes the record only
      # when every action was refused, so a run that failed above has nothing to upload
      # and its one line per action is in the log instead.
      - name: Upload the admission denial matrix
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: admission-denials
          path: ${{ runner.temp }}/admission-denials.json
          if-no-files-found: error
          retention-days: 30

      # PHASE 3'S HALF OF THE SAME MATRIX, AND THE REASON IT IS A SECOND STEP.
      #
      # The step above proves what Phase 2 said the admission session must not be able to
      # do: write lineage, describe a state machine it does not own, stop an execution.
      # Phase 3 makes four more actions meaningful, because there is now a queue to submit
      # to, a job definition to register and jobs to describe -- and the whole architecture
      # rests on the GitHub-facing role gaining none of them. `batch:SubmitJob` was already
      # probed in Phase 1 against a queue that did not exist; the other three were not
      # probed at all, because until this phase they were hypothetical.
      #
      # Attempted from the real session, immediately before the one call it is allowed to
      # make, for the reason the Phase 2 step gives: infra/iam/admission-role.yaml is a
      # committed claim about a role created from a laptop, so a policy widened in the
      # console leaves every template test in this repository green.
      #
      # Every probe here is inert whether or not it is permitted. The submit and terminate
      # probes name a queue and a job id that do not exist, the describe returns nothing,
      # and the register probe would create a job definition under this project's own
      # denial-probe name. None of them can reach a real job. That is a deliberate
      # difference from the Phase 2 step above, whose s3:PutObject probe has to be aimed at
      # the real bucket and can leave one stray object behind.
      - name: Attempt the Batch actions the admission session must not have
        env:
          ADMISSION_ACCOUNT_ID: ${{ steps.credentials.outputs.aws-account-id }}
          ADMISSION_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ steps.registry.outputs.ecr_repository }}
        run: |
          set -euo pipefail
          state_machine_arn="arn:aws:states:${ADMISSION_REGION}:${ADMISSION_ACCOUNT_ID}:stateMachine:sbsandbox-intern-edullm-admission"
          denials_status=0
          uv run --frozen python tools/verify_batch_denials.py \
            --role admission \
            --region "${ADMISSION_REGION}" \
            --state-machine-arn "${state_machine_arn}" \
            --ecr-repository "${ECR_REPOSITORY}" \
            --output "${RUNNER_TEMP}/batch-denials.json" || denials_status=$?
          # The same two answers the step above separates, for the same reason. Exit 1 says
          # something the admission role must not be able to do was permitted, or a probe
          # answered in a way that establishes nothing: a security finding, never a warning.
          # Exit 2 says nothing was attempted, so nothing was learned about how wide the
          # role is. Both stop the submission.
          if [[ "${denials_status}" -eq 1 ]]; then
            echo "batch_denial_matrix_not_proved" >&2
            echo "The session in hand was not shown to be refused every Batch action Phase 3 makes meaningful, so this run must not submit. One line per action is printed above; read the deployed role against infra/iam/admission-role.yaml before re-running." >&2
            exit 1
          fi
          if [[ "${denials_status}" -ne 0 ]]; then
            echo "batch_denial_matrix_not_attempted" >&2
            echo "The Batch probes could not be set up, so none of them was attempted. This is not a finding about how wide the role is." >&2
            exit 1
          fi

      - name: Upload the Batch denial matrix
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: batch-denials
          path: ${{ runner.temp }}/batch-denials.json
          if-no-files-found: error
          retention-days: 30

      # NINE FAILURES WERE THIS AND EIGHT OF THEM WERE FILED AS SOMETHING ELSE.
      #
      # The tail of the log says `ProcessGroup is not registered`, which is a torch
      # distributed error, and the cause is twenty lines above it -- `CommError: user is not
      # logged in`, under a line saying a key is configured, so the key is present and
      # resolves to the wrong entity rather than being absent. Everybody who read the end of
      # the log filed a distributed training bug. They were logins, and each one cost a GPU
      # allocation, a run, and the afternoon of whoever went looking at torch.
      #
      # `tools/verify_wandb_credential.py` has answered this question every night since the
      # audit started asking it. What the answer had never been until this step existed is
      # on the path that spends money. A refused key made `audit.yml` red and stopped
      # nothing: the header of that file says there is no alerting infrastructure and a red
      # scheduled run is the whole signal, so a key W&B had already refused went on costing
      # a GPU allocation per dispatch for as long as nobody happened to look. Two seconds
      # and a refusal here is the whole change.
      #
      # WHY THIS READS A VERDICT AND DOES NOT READ THE KEY, WHICH IS THE DECISION.
      #
      # Three principals in this account hold `secretsmanager:GetSecretValue` on
      # `sbsandbox-intern-edullm-wandb-api-key-*`, read off the live account on 2026-08-02:
      # `…-batch-execution` and `…-batch-gpu-execution`, which are trusted to
      # `ecs-tasks.amazonaws.com` and put the value into a container at task start, and
      # `…-audit-reader`, which is trusted to `audit.yml@refs/heads/main` and exists to
      # ask W&B this exact question. No identity this file can obtain holds it.
      #
      # Both of the obvious ways to change that are worse than the gap they close. Adding
      # the grant to the admission role would mean a session that has crossed the approval
      # gate can read the credential every team's runs log through, and that role has one
      # documented property -- it starts the admission state machine and does nothing else
      # -- which the two denial matrices above prove from the live session on every single
      # dispatch. A fifth OIDC role trusted to this file would keep that
      # property and buy a second copy of the environment enumeration in
      # `infra/iam/admission-role.yaml`: `run-approval-automatic` exists now beside
      # `run-approval-lead` and `run-approval-admin`, and a role list that gained a fourth
      # environment on one side and not the other would fail silently and only for the
      # submissions routed to it. `src/edullm_platform/wandb_preflight.py` carries both
      # arguments in full.
      #
      # So the credential path for this preflight is that there is not one. The submit job
      # already holds `actions: read` for the approvals endpoint, and that is enough to read
      # what the audit published. This step adds no permission to any identity, in GitHub
      # or in AWS.
      #
      # WHAT THAT COSTS, SAID PLAINLY RATHER THAN LEFT TO BE FOUND OUT. The verdict is up to
      # a night old, so a key rewritten since the last check is not caught here. The value
      # changes only when a person writes it -- rotation is not enabled on the secret -- so
      # the remedy is a step in the rotation rather than a grant, and infra/README.md
      # carries it as one.
      #
      # WHERE THIS SITS IN THE SEQUENCE, WHICH IS THE PART WORTH ARGUING.
      #
      # Not in the compile job, where it would be cheapest to write. Compiling refuses a
      # submission naming an unregistered dataset, a commit that published no image, or a
      # command that contradicts its own profile, and it refuses all of those whatever W&B
      # says -- so a preflight ahead of that spends its lookups on every submission that was
      # going to be turned away anyway.
      #
      # Not after `Start the admission execution`, which is the other tempting place because
      # everything is settled by then. That call is the one line in this file that
      # provisions. The state machine registers a job definition for the run and submits it
      # to Batch inside the execution it starts, so a check after it is a check with an
      # instance already coming up and a queue entry already made.
      #
      # So it sits between the two denial matrices and the start. After the matrices rather
      # than before, because those are a statement about the credentials in hand and every
      # dispatch that is going to reach AWS should make it -- a bad key is a refusal about
      # this submission and must not be able to skip a security check on the session.
      # Immediately before the start, because that is the line it exists to stop.
      #
      # AN UNANSWERED QUESTION IS NOT A REFUSED SUBMISSION, AND THE DIFFERENCE IS THE WHOLE
      # SHAPE OF THIS STEP. Exit 1 is a verdict: W&B was asked and said no. Exit 2 is every
      # way the question can go unanswered -- no run has published a verdict yet, the newest
      # one predates the field this reads, the last check could not reach W&B, or the newest
      # acceptance is older than the tool treats as current. Only the first stops a run.
      #
      # That asymmetry is deliberate and is argued where the decision is made. A measured
      # refusal does not expire because a schedule slipped; the absence of a fresh
      # acceptance is not evidence of anything. And this file lands before the first audit
      # run that can publish anything at all, so a step that failed closed on a missing verdict
      # would take the platform down in order to add a check to it, which is the hazard
      # *Why IAM is laptop-only* in infra/README.md is about wearing different clothes.
      - name: Refuse a submission the W&B key would not authenticate
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/wandb-preflight.json"
          preflight_status=0
          uv run --frozen python tools/verify_wandb_preflight.py \
            --repository "${PREFLIGHT_REPOSITORY}" \
            --output "${report}" || preflight_status=$?
          if [[ "${preflight_status}" -eq 0 ]]; then
            echo "The last audit accepted the key every container on this platform is given."
            exit 0
          fi
          # The tool has already printed its answer, including the published report whole,
          # so nothing is restated here. That report carries a length, a four character
          # prefix, a truncated digest and the entity W&B named, and never the key.
          if [[ "${preflight_status}" -ne 1 ]]; then
            echo "wandb_preflight_not_attempted" >&2
            echo "No usable W&B credential verdict was found, so nothing was checked and this submission continues. This is not a verdict on the key." >&2
            echo "The verdict is published by the audit workflow, which is the only thing here holding secretsmanager:GetSecretValue on that secret. Dispatch it to produce one." >&2
            exit 0
          fi
          {
            echo "## This submission was not started"
            echo
            echo "The Weights and Biases key this platform injects into every container is one"
            echo "W&B refused when it was last asked, so no job was submitted and nothing was"
            echo "allocated. The looks_wrong list in this job log names the fault."
            echo
            echo "Nothing about your submission caused this and re-running it will not fix it."
            echo "The key is set from a laptop and from nowhere else, so repairing it is a"
            echo "person. Open a run problem issue and quote this workflow run."
            echo
            echo "If the key has just been repaired, dispatch the audit workflow to check it"
            echo "again. Until something does, this reads the last answer anybody measured."
            echo
            echo "Submitting anyway is what this step exists to stop. A container given a key"
            echo "W&B declines does not fail at the login. It trains, logs nowhere, and dies"
            echo "later with a torch distributed error that names nothing about credentials."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "wandb_credential_would_be_refused" >&2
          echo "The stored W&B key would not authenticate, so this run was not submitted." >&2
          exit 1

      # ExecutionAlreadyExists is a success here. That is counter-intuitive enough to be
      # worth writing down before somebody corrects it. Step Functions treats a
      # StartExecution carrying the same name and the same input as idempotent only while
      # the original execution is still running; once it has closed, the same name is
      # refused with a 400 ExecutionAlreadyExists for ninety days. Admission settles in
      # seconds, so a genuine re-run of this job never arrives inside the idempotent
      # window and always lands on the error -- and the only thing that error can mean is
      # that this run id was already admitted, which is what the re-run was asking for.
      # The execution is then polled like any other, so the re-run reports the decision
      # the first attempt reached rather than assuming it. Every other error is a failure.
      - name: Start the admission execution
        env:
          ADMISSION_ACCOUNT_ID: ${{ steps.credentials.outputs.aws-account-id }}
          ADMISSION_REGION: ${{ vars.AWS_REGION }}
          RUN_ID: ${{ needs.compile.outputs.run_id }}
        run: |
          set -euo pipefail
          state_machine_arn="arn:aws:states:${ADMISSION_REGION}:${ADMISSION_ACCOUNT_ID}:stateMachine:sbsandbox-intern-edullm-admission"
          request="$(cat "${RUNNER_TEMP}/admission-request.json")"
          error_file="${RUNNER_TEMP}/start-execution-error.txt"
          start_status=0
          aws stepfunctions start-execution \
            --state-machine-arn "${state_machine_arn}" \
            --name "${RUN_ID}" \
            --input "${request}" \
            --output text > /dev/null 2> "${error_file}" || start_status=$?
          if [[ "${start_status}" -eq 0 ]]; then
            echo "Admission execution started."
          elif grep -q ExecutionAlreadyExists "${error_file}"; then
            echo "An execution already carries this run id, so this manifest has already been admitted. Reading back the decision it reached."
          else
            # Never echoed: a StartExecution diagnostic names the state machine ARN.
            echo "start_execution_failed" >&2
            exit 1
          fi

      # StartExecution answers as soon as the execution is created, so without this the
      # job would report success for a submission admission was still judging, and a
      # rejected one would be indistinguishable from an accepted one.
      #
      # A STATUS IS NOT A REASON, AND THE STATUS IS ALL A SUBMITTER USED TO GET. This step
      # ended a refused submission with `admission_execution_FAILED` and nothing else, which
      # is the same line a state machine that crashed produces. The response already carries
      # two more fields and they are read out of the same call rather than a second one:
      # `error` separates the four ways this can end -- AdmissionRejected is the validator
      # refusing, AdmissionConflict is a lineage record that already existed,
      # BatchSubmissionFailed is Batch turning an admitted run away, and anything else is
      # the machine itself failing -- and `cause` says where the reasons were written down.
      #
      # WHAT THE CAUSE CARRIES, AND THE ONE CASE THAT CHANGED. Three of the four Fail states
      # in infra/admission-state-machine.yaml declare a static Cause naming the lineage
      # prefix to read, so for those this reports which refusal and where the reason code
      # was written, and the code itself is in the decision record.
      #
      # BatchSubmissionFailed is no longer one of them, and the reason is what a submitter
      # can actually reach. That refusal happens after the intent and decision records are
      # written, so the run reads as admitted and the job does not exist -- and the static
      # Cause answered it by naming a bucket prefix that no researcher has read access to,
      # which is a message whose only possible next step is asking somebody with
      # credentials. It cost exactly that on 2026-08-01: a submission was refused with
      # `Evaluate on exit condition contains restricted characters`, and finding that out
      # took an operator reading submission-failure/ by hand. The state now interpolates
      # what Batch said into the Cause, so the sentence a submitter reads is the sentence
      # the API returned.
      #
      # The cause is masked before it reaches anything, through the helpers every committed
      # capture already goes through. The static causes carry no account id, but an
      # unmodelled task failure puts raw AWS error text there and AWS error text routinely
      # names an ARN -- and while the credentials step masks the account id in this job's
      # log, a step summary is not log output and is not masked. Text that cannot be masked
      # safely is withheld rather than printed.
      - name: Wait for the admission decision
        env:
          ADMISSION_ACCOUNT_ID: ${{ steps.credentials.outputs.aws-account-id }}
          ADMISSION_REGION: ${{ vars.AWS_REGION }}
          RUN_ID: ${{ needs.compile.outputs.run_id }}
          MAXIMUM_POLL_ATTEMPTS: "60"
          POLL_INTERVAL_SECONDS: "5"
        run: |
          set -euo pipefail
          # Derivable rather than read back from StartExecution, because the already-exists
          # path above has no response to read one out of and still has to be polled.
          execution_arn="arn:aws:states:${ADMISSION_REGION}:${ADMISSION_ACCOUNT_ID}:execution:sbsandbox-intern-edullm-admission:${RUN_ID}"
          # Three fields and no more. The full response carries the execution ARN, the state
          # machine ARN and the submitted manifest, none of which this step has any use for
          # and two of which carry the account id.
          decision_file="${RUNNER_TEMP}/execution-decision.json"
          status="RUNNING"
          attempt=0
          while [[ "${attempt}" -lt "${MAXIMUM_POLL_ATTEMPTS}" ]]; do
            aws stepfunctions describe-execution \
              --execution-arn "${execution_arn}" \
              --query '{status: status, error: error, cause: cause}' \
              --output json > "${decision_file}"
            status="$(jq -r '.status // empty' "${decision_file}")"
            if [[ "${status}" != "RUNNING" ]]; then
              break
            fi
            attempt=$((attempt + 1))
            sleep "${POLL_INTERVAL_SECONDS}"
          done
          case "${status}" in
            SUCCEEDED)
              echo "Admission accepted this submission. The intent and decision records are in the lineage bucket."
              ;;
            RUNNING)
              echo "admission_execution_did_not_settle" >&2
              echo "The execution was still running after the poll bound. Nothing has been decided either way; read the execution history before re-running." >&2
              exit 1
              ;;
            *)
              refusal_file="${RUNNER_TEMP}/admission-refusal.md"
              uv run --frozen python - "${decision_file}" "${refusal_file}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from edullm_platform.evidence import (
              AWS_ACCOUNT_ID_PATTERN,
              redact_aws_account_ids,
              redact_content_digests,
          )

          # Never the text itself. redact_aws_account_ids refuses text carrying anything
          # that looks like another credential, because masking a digit run inside one
          # would break the shape that identifies it and launder a live secret.
          WITHHELD = "withheld: this text could not be masked, so it was not printed"


          def masked(text: str) -> str:
              if not text:
                  return "none"
              try:
                  candidate = redact_aws_account_ids(text)
              except ValueError:
                  return WITHHELD
              # The same second look every committed capture gets. Digests are removed
              # before the check because a sha256 digest routinely contains twelve
              # consecutive decimal characters and would otherwise read as an account id.
              if AWS_ACCOUNT_ID_PATTERN.search(redact_content_digests(candidate)):
                  return WITHHELD
              return candidate


          decision = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          report = [
              "## Admission did not accept this submission",
              "",
              f"Run id: `{os.environ['RUN_ID']}`",
              "",
              f"Execution status: `{decision.get('status') or 'unknown'}`",
              "",
              f"Error: `{masked(str(decision.get('error') or ''))}`",
              "",
              "Cause:",
              "",
              "```",
              masked(str(decision.get("cause") or "")),
              "```",
              "",
              "The reason code and its detail are in this run id's decision record, under",
              "`decision/` in the lineage bucket. Nothing was submitted to Batch: the state",
              "machine reaches Batch only through the accepted branch.",
              "",
          ]
          Path(sys.argv[2]).write_text("\n".join(report) + "\n", encoding="utf-8")
          PY
              # The same bytes twice, so the log and the summary cannot describe different
              # refusals, and neither is a re-render of the other.
              cat "${refusal_file}"
              cat "${refusal_file}" >> "${GITHUB_STEP_SUMMARY}"
              echo "admission_execution_${status}" >&2
              echo "Admission did not accept this submission. The decision and its reasons are recorded under decision/ in the lineage bucket." >&2
              exit 1
              ;;
          esac

      # WHERE THE RUN WENT, WRITTEN DOWN ONCE, BECAUSE OTHERWISE NOBODY IS TOLD. A submission
      # that succeeded printed a single line and left the submitter to discover from this
      # repository that the run id is also the execution name, the Batch job name and the S3
      # key -- which is true, and is the sort of thing only the person who built it knows.
      #
      # Everything here is derived rather than written down again. The queue and the log
      # group come from the execution target the manifest's compute profile resolves to, so
      # a new queue changes one configuration file rather than one file and this workflow.
      # The output prefix comes from contracts/results.py, which exists precisely because
      # three places once answered that question and two of them agreed; a fourth answer
      # spelled out here would be the defect it was written to close.
      #
      # THE W&B ENTRY IS NOT A LINK, AND THAT IS DELIBERATE. A run is named for its run id,
      # but W&B mints an id of its own for the URL, so the run URL is not derivable from
      # anything known here. Nor is the entity: it belongs to the API key the job definition
      # reads out of Secrets Manager, and no reviewed configuration in this repository names
      # it. What can be stated truthfully is the project and the name to search for, so that
      # is what is stated and no URL is invented.
      #
      # No `if:`. A step with no condition does not run after a failed one, which is exactly
      # the wanted behaviour: a refused submission gets the refusal block above instead.
      - name: Say where this run went
        env:
          RUN_ID: ${{ needs.compile.outputs.run_id }}
          STATE_MACHINE_NAME: sbsandbox-intern-edullm-admission
        run: |
          set -euo pipefail
          uv run --frozen python - \
            "${RUNNER_TEMP}/compiled-submission/compiled-submission.json" \
            "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from edullm_platform.config import load_yaml
          from edullm_platform.contracts.execution import ExecutionTargetCatalog
          from edullm_platform.contracts.manifest import RunManifest
          from edullm_platform.contracts.results import output_prefix

          run_id = os.environ["RUN_ID"]
          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          manifest = RunManifest.model_validate(document["manifest"])
          targets = load_yaml(
              Path("config/execution-targets.yaml"), ExecutionTargetCatalog
          )
          # Absent only if the deployed validator resolved this profile against a catalog
          # this checkout no longer holds, which is a release that has moved on rather than
          # a run that went nowhere. Said as unknown rather than guessed at.
          binding = targets.binding_for(manifest.compute_profile)
          unknown = "not resolvable from this checkout"
          queue = binding.job_queue if binding is not None else unknown
          log_group = binding.log_group if binding is not None else unknown

          rows = [
              ("Run id", run_id),
              ("Step Functions execution", f"{run_id} on {os.environ['STATE_MACHINE_NAME']}"),
              ("Batch job name", run_id),
              ("Batch job queue", queue),
              ("CloudWatch log group", log_group),
              ("S3 output prefix", output_prefix(team=manifest.team, run_id=run_id)),
              ("W&B project", manifest.wandb_project),
          ]
          report = [
              "## Your run",
              "",
              "| where to look | what to look for |",
              "| --- | --- |",
              *[f"| {label} | `{value}` |" for label, value in rows],
              "",
              (
                  "The run id is the execution name, the Batch job name and the last "
                  "segment of the output prefix, so any two of those disagreeing is visible."
              ),
              "",
              (
                  f"In Weights and Biases the run is **named** `{run_id}`. Search the "
                  "project for that name: the run URL uses an id W&B generates, and the "
                  "entity belongs to the platform API key rather than to anything this "
                  "repository declares, so neither is derivable here."
              ),
              "",
              (
                  "Admission accepted the submission and the state machine submitted it. "
                  "Reaching a queue is not the same as running: read the log group above "
                  "for what the container did."
              ),
              "",
              # WHAT A SUBMITTER HAS TO KNOW, PRINTED WHERE IT IS ABOUT TO MATTER RATHER
              # THAN ON A PAGE.
              #
              # These used to live in a README section, which put them where a reader had
              # already decided to go looking. Nobody looks before their first run, and each
              # of these is only discovered by being caught out by it: the person who cancels
              # and assumes the spend stopped, the person who resumes and finds the optimizer
              # cold, the person who reads `team` as an access control, the person whose job
              # sits in a queue and cannot tell waiting from dropped. Printed here they are
              # read once by everybody who submits, at the moment the wrong belief would
              # otherwise form.
              #
              # Held to this text by tests, because the value is entirely in it being here at
              # all -- see tests/test_pilot_limitations.py, Phase 5 criterion 11, and the
              # Phase 4 criterion 9 transfer, whose condition is the queue paragraph below.
              #
              # The heading carries no count. It had one, and the count went stale within the
              # day the fourth item arrived; a number here buys nothing and has to be
              # maintained by whoever adds or closes a limitation.
              "### What this does not do yet",
              "",
              (
                  "**Cancelling the workflow does not stop your job.** The two are in "
                  "different places, so the container goes on running and spending. Stop it "
                  "yourself from the `Look at a run, or stop it` workflow, which takes the "
                  "run id above and reports on it unless you tick stop. The runtime bound "
                  "above is what limits it otherwise."
              ),
              "",
              (
                  "**Our example training program saves weights only, so check yours does "
                  "better.** The demo this platform has run on GPUs writes the model and the "
                  "step and not the optimizer, so resuming it restarts the optimizer cold. "
                  "OLMo-core's own `Trainer` does save optimizer and schedule state and "
                  "resumes properly from a `save_folder` — if you use it, you get a real "
                  "resume. The warning is about our example, not about your code."
              ),
              "",
              (
                  "**`team` routes your approval; it does not grant you anything.** It "
                  "decides which lead is asked and which cost centre is charged. Any lead "
                  "may approve any run, and naming a team you are not on is a mis-routed "
                  "request rather than a refused one."
              ),
              "",
              (
                  "**Nobody is watching the queue for you.** A job that cannot get capacity "
                  "sits in `RUNNABLE` rather than failing, and no alarm notices, because "
                  "Batch publishes no metric for queue depth to threshold on. Your intent "
                  "and the decision to admit it were written before Batch was reached, so a "
                  "run that never places costs time and nothing else and still has a record "
                  "under the run id above. If it has not started within an hour, ask, and "
                  "quote the run id."
              ),
              "",
          ]
          # THE FOURTH WARNING, SHOWN TO THE RUNS IT APPLIES TO RATHER THAN TO EVERYBODY.
          #
          # No GPU run claiming a team other than `platform` has ever written a checkpoint
          # here. The permission is in place -- the GPU workload role reaches
          # teams/*/runs/* -- and the checkpoint machinery is proven, but only under team
          # `platform`, so this combination is untested rather than known broken.
          #
          # Conditional because the harm is: a checkpoint the role cannot write is the whole
          # output of a GPU run lost at the end of it, after the money is spent. That is
          # worth a sentence to the person about to be first, and is noise to the several
          # hundred runs it cannot happen to. Printing it to everybody is how a warning stops
          # being read.
          if manifest.checkpoint is not None and manifest.team != "platform":
              report.extend(
                  [
                      (
                          "**You may be the first to write a checkpoint on a GPU under a team "
                          f"other than `platform`.** Check that your checkpoint actually "
                          f"landed under the output prefix above before relying on the run. "
                          "The permission is in place and the combination has not been "
                          "exercised, so the failure mode to watch for is a run that trains "
                          "to completion and saves nothing."
                      ),
                      "",
                  ]
              )
          with Path(sys.argv[2]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(report) + "\n")
          print(f"Run {run_id} was submitted. The step summary says where to find it.")
          PY

      # WHAT CANCELLING THIS WORKFLOW DOES, AND THE THREE THINGS IT DOES NOT GUARANTEE.
      #
      # `if: cancelled()` is the only condition that runs after a cancellation; `always()`
      # would also run on a failure and `success()` never runs at all. It runs under the
      # credentials configured above, which is the point of it being in this job: by the
      # time somebody cancels, a Batch job may already be running with this run id on it,
      # and nothing else in the system will notice that the person who asked for it has
      # gone away.
      #
      # First, the grace period. GitHub sends SIGINT to the running step and then gives the
      # job a bounded window -- documented as up to five minutes and not configurable -- to
      # run its remaining `if: cancelled()` and `if: always()` steps before the runner is
      # killed outright. That is enough for a few API calls and it is a budget rather than a
      # promise: a step that needs longer is cut off mid-way, and a cancellation issued
      # while the runner is already being torn down, or while the job is still queued, may
      # never reach this step at all. So this is best-effort by construction, and a design
      # that depended on it running would be a design with a hole in it.
      #
      # Second: this step stops nothing itself, and says so rather than implying otherwise.
      # Stopping a running Batch job needs `batch:TerminateJob`, which the admission role
      # deliberately does not hold -- infra/iam/admission-role.yaml grants one
      # `states:StartExecution` and two read-only execution actions. Cancellation lives in
      # cancel-run.yml instead, on a role of its own that this job cannot obtain. So the
      # honest thing a cancelled workflow can do is leave a record naming what is still
      # running, beside the button that stops it.
      #
      # Third: a cancelled workflow is not a cancelled run. The admission execution may
      # already have accepted the submission and written its intent and decision records,
      # and those are immutable. Cancelling here removes nobody's approval and unwrites
      # nothing.
      #
      # The step must not fail the job. A cancelled job is already cancelled, and a red
      # cross beside it would report a defect where there is a person changing their mind.
      - name: Record that a cancelled workflow stopped no compute
        if: cancelled()
        env:
          RUN_ID: ${{ needs.compile.outputs.run_id }}
        run: |
          set -euo pipefail
          # A quoted heredoc rather than a run of echoes, so the shell substitutes nothing
          # into the prose. The run id is echoed separately, which is why it is the only
          # value this step interpolates.
          #
          # The way to stop a job is named by reference rather than spelled out here. A
          # literal `aws` line in a run body is indistinguishable, to anything reading this
          # workflow, from a call this job makes -- and this job holds no credential that
          # could make one.
          {
            echo "## This workflow run was cancelled"
            echo
            echo "Run id: \`${RUN_ID}\`"
            cat <<'NOTICE'

          Cancelling this workflow does not stop AWS compute. The admission role holds no
          `batch:TerminateJob`, deliberately, so if admission had already submitted this run
          then a Batch job carrying the run id above as its job name may still be running,
          and it will run to its own attempt timeout unless somebody stops it.

          To check whether one is running and stop it if it is, dispatch the workflow
          `Look at a run, or stop it` with the run id above. Left alone it only reports what
          the job is doing; tick stop and give a reason to end it. It assumes a role of its
          own, which is why no identity this job holds can do the same thing from here.

          Any intent and decision records admission already wrote are immutable and stay
          where they are. This cancellation removes no approval and unwrites nothing.
          NOTICE
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Cancelled. The step summary records what may still be running."
