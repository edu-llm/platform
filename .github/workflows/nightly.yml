name: Nightly (the checks that are not about one change)

# Four checks that answer a question about the repository, or about the account it runs
# on, rather than about a change, and that either cost too much or fail too unpredictably
# to sit on the pull-request path. Nothing here is continue-on-error, and that is the
# whole point of moving them: there is no alerting infrastructure, so a red scheduled run
# is the signal, and a job that cannot go red is not one.
#
# Why each is here rather than in ci.yml:
#
#   proof-bundles-reproduce — reproducing a recorded suite result runs the whole suite
#     inside the suite. It cost 120s of a 235s serial run and re-executed tests the pull
#     request had already run: every node id a generator selects is a test in this
#     repository, and `checks (python 3.12)` runs the whole repository on the same
#     commit. The half of the proof check that can catch something that check cannot —
#     a citation that no longer resolves, criteria that disagree with their module,
#     golden digests that no longer match the tree — is collection-only, costs about a
#     second, and stayed on the pull request. tests/proof_support.py makes the argument
#     in full.
#
#   contract-and-manifest-gate and branch-to-image-gate — they read captured AWS and
#     GitHub evidence that expires after 30 days, so they can legitimately go red for
#     reasons that have nothing to do with the change under review. As pull-request jobs
#     they had to be
#     continue-on-error for that reason, which made them unable to fail anything. Here,
#     an expiry lands as a red scheduled run on an ordinary morning, which is what the
#     comment in ci.yml wanted from them and never got. Both are also red whenever a
#     criterion of theirs is a recorded gap; that is a statement about the phase, and it
#     is a statement worth waking up to rather than one worth suppressing.
#
#   runs-that-saved-nothing — it asks a question about the account rather than about the
#     tree, so no commit could answer it and there is no pull request it belongs to. A
#     training run that took OLMo-core's /tmp default writes its checkpoints to local disk
#     on a machine that stops existing, exits zero, and is recorded as a success; nothing
#     in the lineage disagrees, because an empty checkpoints tuple already means "this run
#     was never expected to checkpoint". So the only thing that notices is a job that goes
#     and looks, and the only thing that makes looking worth doing is that it can fail.
#     On 2026-08-01 the report named six runs in that state, so the first scheduled runs
#     are red because the runs are, not because the job is broken.
#
#     It is also the one job here that holds an AWS credential, which is a property this
#     file did not have before and is worth naming rather than burying. The role lists two
#     buckets and reads the admission intents and can do nothing else in the account;
#     infra/iam/nightly-reader-role.yaml carries that argument in full.
#
# The contract rules the gates enforce are covered by the test suite in ci.yml, which is
# what blocks a merge. Nothing here is a required check and nothing here should become
# one: the two required contexts are `checks (python 3.12)` and `checks (python 3.13)`,
# pinned in branch protection.

on:
  schedule:
    # 05:00 UTC, so a failure is waiting rather than arriving mid-morning.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  proof-bundles-reproduce:
    name: proof bundles reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The whole suite, with the nested runs the pull-request path skips. Serial and
      # not -n4: the reproduction spawns pytest children of its own, and the point of
      # this job is the measurement rather than the minutes.
      - name: Tests, reproducing every recorded suite result
        env:
          EDULLM_REPRODUCE_PROOFS: "1"
        run: uv run --frozen pytest -q

  contract-and-manifest-gate:
    name: contract and manifest compilation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Reads committed records only. It needs no credentials and reaches no AWS API.
      # The filename is cited by proof/phase-0 as the command that reproduces its
      # verdict, so it is not renameable even though the job is.
      - name: Run the acceptance gate
        run: uv run --frozen python tools/validate_phase0.py

  branch-to-image-gate:
    name: branch to image gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Reads committed records only. It needs no credentials and reaches no AWS API.
      # The records of the one live publish run expire on 2026-08-25 and nothing renews
      # them; when they lapse this job goes red, which is the intended behaviour and the
      # reason it is here rather than on the pull-request path.
      - name: Run the acceptance gate
        run: uv run --frozen python tools/validate_phase1.py

  runs-that-saved-nothing:
    name: runs that promised a checkpoint and wrote none
    runs-on: ubuntu-latest
    # The only job in this file that reaches AWS, and the only one that needs a token to
    # do it. Declared here rather than at the top of the file so the other three keep the
    # contents-read they have always had.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # SAY WHICH STACK IS MISSING, RATHER THAN LETTING THE CREDENTIAL STEP SAY NOTHING.
      #
      # This job assumes sbsandbox-intern-edullm-nightly-reader, and that role is created
      # by infra/iam/nightly-reader-role.yaml, which is applied from a laptop -- the
      # deployer role holds no iam:CreateRole, deliberately, so no stack under infra/iam/
      # can be applied from CI. Until somebody with an administrative credential applies it
      # and sets AWS_NIGHTLY_READER_ROLE_ARN, every scheduled run of this job fails.
      #
      # configure-aws-credentials with an empty role-to-assume reports "Credentials could
      # not be loaded, please check your action inputs", which reads as a broken secret or
      # an expired federation and sends the reader to the OIDC configuration. The cause is
      # one stack that was never applied, and this says so.
      - name: Say if the nightly reader role was never deployed
        env:
          ROLE_ARN: ${{ vars.AWS_NIGHTLY_READER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "${ROLE_ARN}" ]]; then
            echo "nightly_reader_role_not_deployed" >&2
            echo "AWS_NIGHTLY_READER_ROLE_ARN is unset, so this job has no identity to assume." >&2
            echo "The role comes from infra/iam/nightly-reader-role.yaml, which is applied from a" >&2
            echo "laptop because the deployer role holds no iam:CreateRole. See 'The Phase 4 stacks'" >&2
            echo "in infra/README.md for the stack and the variable it needs." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_NIGHTLY_READER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The report reads a local intent/ tree rather than the bucket, because it is also
      # run from a laptop against a sync somebody already has. One prefix, and the role
      # can list no other.
      - name: Fetch the admission intents
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lineage/intent"
          aws s3 sync s3://sbsandbox-intern-edullm-lineage/intent/ "${RUNNER_TEMP}/lineage/intent/"

      # The tool exits 1 when it finds a run that promised a checkpoint and wrote none, and
      # 2 when it could not read its inputs. Both fail the job, and neither is swallowed:
      # pipefail is what makes the tee carry the exit code rather than replace it, so the
      # report reaches the step summary on the run that goes red as well as on the one that
      # does not.
      - name: Report the runs that saved nothing
        run: |
          set -euo pipefail
          uv run --frozen python tools/find_runs_that_saved_nothing.py \
            --lineage-root "${RUNNER_TEMP}/lineage" | tee -a "${GITHUB_STEP_SUMMARY}"
